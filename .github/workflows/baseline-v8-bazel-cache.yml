name: Seed the compiled V8 Bazel actions

# Upstream's Bazel build compiles V8 from source (upstream commit ab190cdfd) and hides that cost behind a BuildBuddy cache
# this repository does not have. This builds only the V8 targets into an empty Bazel disk cache and pushes it to GHCR,
# keyed on the Bazel module files and third_party/v8, so the Bazel lint and test jobs read the compiled actions instead.
# Rerun it when MODULE.bazel, MODULE.bazel.lock or third_party/v8 change.

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-v8-cache-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          cp restart-metadata/.github/cargo-cache-package "$evidence/cargo-cache-package"
          cp restart-metadata/.github/scripts/ghcr-cargo-target-cache.sh restart-metadata/.github/scripts/v8-bazel-cache.sh "$RUNNER_TEMP/"
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-v8-cache-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-v8-cache-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          for patch in "${patch_paths[@]}"; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reclaim unused hosted-image toolchains
        run: |
          for unused in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; do
            if [[ -d "$unused" ]]; then
              sudo rm -rf -- "$unused"
            fi
          done

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up upstream's Rust toolchain for workspace metadata
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}

      - name: Synchronize release workspace versions without dependency upgrades
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --manifest-path codex-rs/Cargo.toml > /dev/null
          git diff --stat

      - name: Prepare upstream's Bazel host and toolchain
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: Linux
          cache-scope: bazel-v8-seed

      - name: Set up the GHCR cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Install Linux sandbox build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Build the V8 targets into an empty disk cache
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v8-bazel-cache"
          .github/scripts/run-bazel-ci.sh --print-failed-action-summary -- \
            build --disk_cache="$RUNNER_TEMP/v8-bazel-cache" --config=argument-comment-lint --keep_going \
            --build_metadata="COMMIT_SHA=${GITHUB_SHA}" -- \
            //third_party/v8:rusty_v8_archive_for_target //third_party/v8:rusty_v8_binding_for_target @crates//:v8 \
            2>&1 | tee "$RUNNER_TEMP/baseline-v8-cache-evidence/bazel-v8-build.log"

      - name: Save the compiled V8 actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-v8-cache-evidence"
          du -sh "$RUNNER_TEMP/v8-bazel-cache" | tee "$evidence/v8-cache-size.log"
          bash "$RUNNER_TEMP/v8-bazel-cache.sh" save "$GITHUB_WORKSPACE" "$RUNNER_TEMP/v8-bazel-cache" \
            "ghcr.io/${GH_OWNER,,}/$(cat "$evidence/cargo-cache-package")" "$(cat "$evidence/upstream-ref")" \
            2>&1 | tee -a "$evidence/v8-cache-save.log"
