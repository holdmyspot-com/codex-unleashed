name: Focused macOS deep-home readiness stress

on:
  workflow_dispatch:
    inputs:
      patches:
        description: The complete ordered patch queue from patches/README.md at this workflow revision
        required: true
        type: string
      public_key:
        description: Public SSH key for the authenticated client that connects before the test
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: deep-home readiness - ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ matrix.target }}
      PATCHES: ${{ inputs.patches }}
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_LIB_BACKTRACE: '0'
      RUST_MIN_STACK: '8388608'
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate both native targets and the exact patch queue
        id: source
        run: |
          set -euo pipefail
          node -e 'const m=require("./.github/release-matrix.json"); const expected={"aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}; if (!m.some(x=>x.target===process.env.TARGET && x.runner===expected[process.env.TARGET])) throw Error("Target must use its existing native macOS runner");'
          read -r -a patch_paths <<< "$PATCHES"
          readme_paths=()
          while IFS= read -r path; do readme_paths+=("$path"); done < <(
            sed -nE 's/^[[:space:]]*[0-9]+\.[[:space:]]+\[[^]]+\]\(([^)]+\.patch)\).*/\1/p' patches/README.md
          )
          test "${#readme_paths[@]}" -gt 0
          test "${#patch_paths[@]}" -eq "${#readme_paths[@]}"
          for i in "${!readme_paths[@]}"; do
            test "${patch_paths[$i]}" = "${readme_paths[$i]}"
            test -f "patches/${patch_paths[$i]}"
          done
          printf '%s\n' "${patch_paths[@]}" > "$RUNNER_TEMP/patches.txt"
          grep -Fqx 'holdmyspot-com/codex-unleashed/flaky-tests/macos-arm64-daemon-timeouts.patch' "$RUNNER_TEMP/patches.txt"
          grep -Fqx 'holdmyspot-com/codex-unleashed/native-test-prerequisites/macos-arm64-deep-home-scheduling.patch' "$RUNNER_TEMP/patches.txt"
          printf 'commit=%s\n' "$(cat .github/upstream-commit)" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.source.outputs.commit }}
          path: upstream
          persist-credentials: false

      - name: Prepare upstream native test host
        uses: ./upstream/.github/actions/setup-ci

      - name: Own build and evidence storage through debug cleanup
        uses: ./.github/actions/focused-runtime-storage

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' upstream/codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up matching Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ env.TARGET }}

      - name: Install upstream's nextest version
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103

      - name: Verify pristine source and apply the complete queue
        id: patched
        run: |
          set -euo pipefail
          evidence="$FOCUSED_RUNTIME/evidence"
          printf '%s\n' "$TARGET" > "$evidence/target.txt"
          printf '%s\n' "$(git rev-parse HEAD)" > "$evidence/restart-commit.txt"
          printf '%s\n' "$(git -C upstream rev-parse HEAD)" > "$evidence/upstream-commit.txt"
          queue_count="$(wc -l < "$RUNNER_TEMP/patches.txt" | tr -d ' ')"
          test "$(git -C upstream rev-parse HEAD)" = "$(cat .github/upstream-commit)"
          test -z "$(git -C upstream status --porcelain)"
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' upstream/codex-rs/Cargo.toml
          if ! git -C upstream diff --quiet -- codex-rs/Cargo.toml; then
            git -C upstream -c user.name='CP9 test harness' -c user.email='cp9-test-harness@example.invalid' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          while IFS= read -r patch; do
            git -C upstream -c user.name='CP9 downstream patch' -c user.email='cp9-patches@example.invalid' \
              am --whitespace=nowarn "$GITHUB_WORKSPACE/patches/$patch"
          done < "$RUNNER_TEMP/patches.txt"
          cp "$RUNNER_TEMP/patches.txt" "$evidence/patches.txt"
          git -C upstream log -"$queue_count" --format='%H %s' > "$evidence/applied-patches.txt"
          test "$(wc -l < "$evidence/applied-patches.txt" | tr -d ' ')" = "$queue_count"
          grep -Fq 'test(=bootstrap_updater_is_ready_in_deep_codex_home)' upstream/codex-rs/.config/nextest.toml
          grep -Fq 'threads-required = "num-test-threads"' upstream/codex-rs/.config/nextest.toml
          grep -Fq 'slow-timeout = { period = "1m", terminate-after = 4 }' upstream/codex-rs/.config/nextest.toml
          shasum -a 256 "$RUNNER_TEMP/patches.txt" > "$evidence/patch-queue.sha256"

      - name: Open authenticated debug session
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.public_key }}

      - name: Wait for authenticated client readiness
        run: |
          set -euo pipefail
          deadline=$((SECONDS+600))
          until [[ -f "$FOCUSED_RUNTIME/client-ready" ]]; do
            if (( SECONDS >= deadline )); then
              printf 'The authenticated client did not publish readiness within ten minutes.\n' >&2
              exit 1
            fi
            sleep 2
          done

      - name: Build and verify exact ordinary test selection
        id: selection
        working-directory: upstream/codex-rs
        run: |
          set -euo pipefail
          evidence="$FOCUSED_RUNTIME/evidence"
          cargo nextest list --target "$TARGET" --cargo-profile ci-test -p codex-cli --test app_server_daemon \
            -E 'test(=bootstrap_updater_is_ready_in_deep_codex_home)' --message-format json \
            > "$evidence/test-list.json"
          selected_count="$(jq '[.["rust-suites"][] | select(."binary-name" == "app_server_daemon") | .testcases | to_entries[] | select(.key == "bootstrap_updater_is_ready_in_deep_codex_home") | select(.value.ignored == false) | select(.value["filter-match"].status == "matches")] | length' "$evidence/test-list.json")"
          printf '%s\n' "$selected_count" > "$evidence/selected-test-count.txt"
          test "$selected_count" = 1
          workers="$(sysctl -n hw.logicalcpu)"
          [[ "$workers" =~ ^[1-9][0-9]*$ ]]
          printf 'CPU_LOAD_WORKERS=%s\n' "$workers" >> "$GITHUB_ENV"
          jq -n --arg target "$TARGET" --arg test 'bootstrap_updater_is_ready_in_deep_codex_home' \
            --argjson selected_count "$selected_count" --argjson stress_count 3 --argjson retries 0 \
            --argjson cpu_load_workers "$workers" \
            '{target:$target,test:$test,selected_count:$selected_count,stress_count:$stress_count,retries:$retries,cpu_load_workers:$cpu_load_workers}' \
            > "$evidence/selection-inputs.json"

      - name: Stress only the exact readiness test three times under CPU load
        id: test
        if: steps.selection.outcome == 'success'
        working-directory: upstream/codex-rs
        run: |
          set -uo pipefail
          evidence="$FOCUSED_RUNTIME/evidence"
          workers="$CPU_LOAD_WORKERS"
          printf '%s\n' "$workers" > "$evidence/cpu-load-workers.txt"
          load_pids=()
          for _ in $(seq "$workers"); do yes > /dev/null & load_pids+=("$!"); done
          # shellcheck disable=SC2317 # Called from the EXIT trap below.
          stop_load() {
            local pid
            for pid in "${load_pids[@]}"; do kill "$pid" 2>/dev/null || true; done
            for pid in "${load_pids[@]}"; do wait "$pid" 2>/dev/null || true; done
            printf 'workers_started=%s\nworkers_stopped=%s\n' \
              "${#load_pids[@]}" "${#load_pids[@]}" > "$evidence/cpu-load-cleanup.txt"
          }
          trap stop_load EXIT
          cargo nextest run --target "$TARGET" --cargo-profile ci-test -p codex-cli --test app_server_daemon \
            --stress-count 3 --retries 0 --status-level all --final-status-level all \
            -E 'test(=bootstrap_updater_is_ready_in_deep_codex_home)' \
            2>&1 | tee "$evidence/test.log"
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > "$evidence/test-exit.txt"
          exit "$result"

      - name: Retain exact test evidence for three days
        if: always() && env.FOCUSED_RUNTIME != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: macos-${{ matrix.target }}-deep-home-readiness-${{ github.run_attempt }}
          path: ${{ env.FOCUSED_RUNTIME }}/evidence
          retention-days: 3
          if-no-files-found: error
