name: CP9 focused synthetic checks

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Public key for the authenticated verification client
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, windows-2025]
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Enable long Git paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: ./.github/actions/focused-runtime-storage

      - name: Connect before source replay and testing
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.public_key }}

      - name: Wait for authenticated client readiness
        run: |
          set -euo pipefail
          deadline=$((SECONDS+600))
          until [[ -f "$FOCUSED_RUNTIME/client-ready" ]]; do
            if (( SECONDS >= deadline )); then
              printf 'The authenticated client did not publish readiness.\n' >&2
              exit 1
            fi
            sleep 2
          done

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: 086ccc833bc9cf01024ad2dd6af7dbd421b6bf9a
          path: upstream
          persist-credentials: false

      - name: Prepare the macOS native test host
        if: runner.os == 'macOS'
        uses: ./upstream/.github/actions/setup-ci

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build release tooling
        env:
          TOOLING_ROOT: ${{ github.workspace }}
        run: bash .github/scripts/setup-tooling.sh

      - name: Reconstruct the exact focused source
        run: bash .github/scripts/prepare-focused-source.sh "$PWD" "$PWD/upstream"

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' upstream/codex-rs/rust-toolchain.toml)"
          test -n "$channel"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}

      - name: Run the two loopback integration tests
        working-directory: upstream/codex-rs
        run: |
          set -o pipefail
          bash ../../.github/scripts/run-focused-checks.sh 2>&1 | tee "$FOCUSED_RUNTIME/evidence/focused-tests.log"

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: cp9-focused-${{ matrix.runner }}
          path: ${{ env.FOCUSED_RUNTIME }}/evidence/focused-tests.log
