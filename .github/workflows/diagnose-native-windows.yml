name: Diagnose focused native regressions

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Focused native regression to investigate
        type: choice
        default: credentials
        options:
          - credentials
          - windows-test-timeouts
          - windows-tui-proxy-phases
          - windows-mouse-initialization-red
          - windows-mouse-initialization-green
          - windows-bazel-full-workload-phases
          - windows-lifecycle-source
          - windows-sandbox-fixtures
          - windows-conpty-ctrl-c
          - windows-conpty-fixture
          - windows-archive-extraction
          - windows-archived-failures
          - windows-arm-launch-inputs
          - windows-arm-mxc-policy
          - windows-arm-mxc-temp
          - windows-arm-mxc-volumes
          - arm-daemon-lifecycle
          - arm-daemon-hashing
          - macos-x64-original-timeouts
          - macos-x64-release-timeouts
          - macos-x64-release-shard-controls
          - macos-x64-daybreak-invocations
          - macos-x64-current-timeouts
          - macos-x64-current-shards
          - macos-tui-timeouts
          - macos-tui-integration-timeouts
          - macos-bazel-tui-timeouts
          - macos-bazel-dsym
          - macos-dsym-wrapper-preflight
          - compiler-profile
          - linker-profile
          - crate-local-profile
          - compiler-scheduler-baseline
          - compiler-scheduler-native
          - compiler-scheduler-macos
          - compiler-scheduler-tooling
          - compiler-scheduler-tooling-windows
          - compiler-scheduler-exit125
          - compiler-scheduler-pause-recovery
          - windows-arm-tooling-locks
          - native-voice-runtime
          - native-voice-runtime-windows-x64
          - native-voice-runtime-windows-arm64
          - native-platform-tests-except-windows-x64
          - linux-x64-native-and-remote
          - linux-docker-scope
          - linux-remote-fixtures
      direct-test-output:
        description: Diagnose native sandbox output through a retained direct libtest file.
        type: boolean
        default: false
      source-run:
        description: Workflow run supplying compiled binaries for an archived-test diagnostic.
        type: string
        required: false

permissions:
  contents: read

jobs:
  macos-x64-daybreak-invocations:
    if: inputs.focus == 'macos-x64-daybreak-invocations'
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_CI_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: '83086188ae0614bd882818ff1aa23f3194962012'
          expected-upstream-commit: '83086188ae0614bd882818ff1aa23f3194962012'

      - name: Authenticate and apply daybreak invocation timing
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/daybreak-invocations"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/project-commit.txt"
          git -C upstream rev-parse HEAD > "$evidence/upstream-commit.txt"
          git -C upstream diff --binary > "$evidence/prepared-source.diff"
          overlay="$GITHUB_WORKSPACE/.github/diagnostics/daybreak-invocation-timing.patch"
          printf '%s  %s\n' \
            29243fa0285db17daaff47f7ff158348a1052a059f27151389477cd4194e0e72 "$overlay" \
            9a2e9ae3a3aa2ac268e4e02751033aa66ac2f26cec4c411868002d7dcb830c73 upstream/codex-rs/exec/tests/suite/daybreak.rs \
            f411d7e8ea0a8b60a3cdd9a1e47223ad964e2d2fd5f80d0abe4d877b41851817 upstream/codex-rs/.config/nextest.toml \
            | shasum -a 256 --check | tee "$evidence/preimage-verification.txt"
          cp "$overlay" "$evidence/invocation-timing.patch"
          cp upstream/codex-rs/.config/nextest.toml "$evidence/nextest.toml"
          git -C upstream apply --check "$overlay"
          git -C upstream apply "$overlay"
          printf '%s  %s\n' \
            ec27c13845f41e3757f6207557b3e3e3265b80e341f6ac5d7d28d1e5ace2faad upstream/codex-rs/exec/tests/suite/daybreak.rs \
            | shasum -a 256 --check | tee "$evidence/postimage-verification.txt"
          git -C upstream diff --binary > "$evidence/instrumented-source.diff"
          cp upstream/codex-rs/exec/tests/suite/daybreak.rs "$evidence/instrumented-daybreak.rs"
          {
            printf 'run=%s attempt=%s job=%s runner=%s arch=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'cargo_profile=ci-test nextest_profile=default retries=0 test_threads=1 deadline_seconds=60\n'
            uname -a
            sw_vers
          } > "$evidence/run-identity.txt"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install target for the workspace Rust toolchain
        working-directory: upstream/codex-rs
        shell: bash
        run: rustup target add x86_64-apple-darwin

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-apple-darwin

      - name: Cache Cargo dependency downloads
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            upstream/codex-rs -> target
          shared-key: nextest-downloads-${{ runner.os }}-${{ runner.arch }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: true
          cache-on-failure: true

      - uses: ./.github/actions/build-nextest-native-sdk
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        with:
          target: x86_64-apple-darwin

      - uses: ./.github/actions/configure-nextest-native-sdk

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      - name: Build instrumented native exec tests with the compiler scheduler
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/daybreak-invocations"
          cp "$RUNNER_TEMP/nextest-native/sdk/sdk.json" "$evidence/native-sdk.json"
          cp "$RUNNER_TEMP/nextest-native/runtime/runtime.json" "$evidence/native-runtime.json"
          {
            rustc -Vv
            cargo -V
            cargo nextest --version
            printf 'PKG_CONFIG_PATH=%s\nCODEX_TEST_VOICE_RUNTIME=%s\nDYLD_FALLBACK_LIBRARY_PATH=%s\n' \
              "$PKG_CONFIG_PATH" "$CODEX_TEST_VOICE_RUNTIME" "${DYLD_FALLBACK_LIBRARY_PATH:-}"
          } > "$evidence/toolchain-runtime.txt"
          command=(bash "$GITHUB_WORKSPACE/.github/scripts/run-memory-scheduled-build.sh" \
            cargo nextest archive \
            --target x86_64-apple-darwin --cargo-profile ci-test \
            --config profile.ci-test.package.blake3.opt-level=3 \
            --features codex-v8-poc/sandbox --timings \
            --archive-file "$RUNNER_TEMP/daybreak-native.tar.zst")
          printf '%q ' "${command[@]}" > "$evidence/build-command.txt"
          printf '\n' >> "$evidence/build-command.txt"
          set +e
          "${command[@]}" 2>&1 | tee "$evidence/build.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$evidence/build.exit"
          if [[ "$status" -eq 0 ]]; then
            shasum -a 256 "$RUNNER_TEMP/daybreak-native.tar.zst" > "$evidence/native-archive.sha256"
          fi
          exit "$status"

      - name: Run exactly the daybreak case serially with the original deadline
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/daybreak-invocations"
          mkdir -p "$RUNNER_TEMP/daybreak-native-extracted"
          command=(cargo nextest run \
            --archive-file "$RUNNER_TEMP/daybreak-native.tar.zst" \
            --extract-to "$RUNNER_TEMP/daybreak-native-extracted" \
            --workspace-remap "$PWD" --config-file "$PWD/.config/nextest.toml" \
            --profile default --test-threads 1 --retries 0 --no-tests fail --no-fail-fast \
            --failure-output immediate-final --success-output immediate \
            -E 'package(codex-exec) & binary(=all) & test(=suite::daybreak::exec_resumes_and_forks_the_saved_daybreak_choice)')
          printf '%q ' "${command[@]}" > "$evidence/test-command.txt"
          printf '\n' >> "$evidence/test-command.txt"
          set +e
          "${command[@]}" 2>&1 | tee "$evidence/test.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$evidence/test.exit"
          exit "$status"

      - name: Retain raw invocation timing and native build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-x64-daybreak-invocations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/daybreak-invocations
            ${{ runner.temp }}/daybreak-native-extracted/**/nextest/default/junit.xml
            ${{ env.CARGO_TARGET_DIR }}/nextest/default/junit.xml
            ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          retention-days: 1
          if-no-files-found: error

      - name: Remove owned daybreak diagnostic outputs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/daybreak-invocations" "$RUNNER_TEMP/daybreak-native.tar.zst" \
            "$RUNNER_TEMP/daybreak-native-extracted" "$RUNNER_TEMP/nextest-native"

  windows-arm-mxc-volumes:
    if: inputs.focus == 'windows-arm-mxc-volumes'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Provision the same build volume as the sandbox regression
        shell: pwsh
        run: ./.github/scripts/setup-dev-drive.ps1
      - name: Inspect MXC filesystem enforcement prerequisites on both drives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $probes = @(
            @{ Program = 'fsutil.exe'; Arguments = @('fsinfo', 'volumeinfo', 'C:') },
            @{ Program = 'fsutil.exe'; Arguments = @('fsinfo', 'volumeinfo', 'D:') },
            @{ Program = 'fsutil.exe'; Arguments = @('devdrv', 'query', 'C:') },
            @{ Program = 'fsutil.exe'; Arguments = @('devdrv', 'query', 'D:') },
            @{ Program = 'fltmc.exe'; Arguments = @('instances', '-v', 'C:') },
            @{ Program = 'fltmc.exe'; Arguments = @('instances', '-v', 'D:') },
            @{ Program = 'sc.exe'; Arguments = @('query', 'bfs') }
          )
          foreach ($probe in $probes) {
            $arguments = $probe.Arguments
            Write-Output "::group::$($probe.Program) $($arguments -join ' ')"
            & $probe.Program @arguments
            Write-Output "Native query exit status: $LASTEXITCODE"
            Write-Output '::endgroup::'
          }

  compiler-scheduler-pause-recovery:
    if: inputs.focus == 'compiler-scheduler-pause-recovery'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 26.12.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Compare partial suspension recovery with its unmodified controller
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/.cat/work/temp/pause-baseline"
          evidence="$RUNNER_TEMP/compiler-scheduler-pause-recovery"
          mkdir -p "$evidence"
          git fetch --no-tags --depth=1 "https://github.com/$GH_REPO.git" \
            b88270828322a960a456ba313ef903f0287fb010
          git worktree add --detach "$baseline" FETCH_HEAD
          test_path=tooling/cli/src/test/java/com/holdmyspot/codexunleashed/tooling/ScheduleCompilersCommandTest.java
          fixture_path=tooling/cli/src/test/resources/native/deny-second-suspension.cc
          cp "$test_path" "$baseline/$test_path"
          mkdir -p "$baseline/$(dirname "$fixture_path")"
          cp "$fixture_path" "$baseline/$fixture_path"
          candidate_status=0
          for variant in baseline candidate; do
            checkout="$GITHUB_WORKSPACE"
            [[ "$variant" != baseline ]] || checkout="$baseline"
            status=0
            "$checkout/tooling/mvnw" -B -pl cli -am test \
              '-Dtest=ScheduleCompilersCommandTest#recoversDeniedWindowsSuspension+ownsNativeWrapperLifecycle+identifiesWindowsExit125' \
              -Dsurefire.failIfNoSpecifiedTests=false > "$evidence/$variant.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "$evidence/$variant.status"
            printf '%s comparison status: %s; retained reports require classification.\n' "$variant" "$status"
            [[ "$variant" != candidate ]] || candidate_status="$status"
          done
          exit "$candidate_status"
      - name: Retain native partial suspension evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-scheduler-pause-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compiler-scheduler-pause-recovery
            .cat/work/temp/pause-baseline/.cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
            .cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
          if-no-files-found: error
          retention-days: 1
      - name: Remove partial suspension comparison checkout
        if: always()
        shell: bash
        run: |
          if [[ -d "$GITHUB_WORKSPACE/.cat/work/temp/pause-baseline" ]]; then
            git worktree remove --force "$GITHUB_WORKSPACE/.cat/work/temp/pause-baseline"
          fi

  compiler-scheduler-exit125:
    if: inputs.focus == 'compiler-scheduler-exit125'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 26.12.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Record the original wrapper with the new regression tests
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/.cat/work/temp/wrapper-baseline"
          evidence="$RUNNER_TEMP/compiler-scheduler-exit125"
          mkdir -p "$evidence"
          git fetch --no-tags --depth=1 "https://github.com/$GH_REPO.git" \
            8ee096b053de8b0eaef8a7e5deae00a8bc3a06b8
          git worktree add --detach "$baseline" FETCH_HEAD
          test_path=tooling/cli/src/test/java/com/holdmyspot/codexunleashed/tooling/ScheduleCompilersCommandTest.java
          cp "$test_path" "$baseline/$test_path"
          status=0
          "$baseline/tooling/mvnw" -B -pl cli -am test \
            '-Dtest=ScheduleCompilersCommandTest#ownsNativeWrapperLifecycle+identifiesWindowsExit125' \
            -Dsurefire.failIfNoSpecifiedTests=false > "$evidence/baseline.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$evidence/baseline.status"
          printf 'Original wrapper comparison exit status: %s; retained log and test reports require classification.\n' "$status"
      - name: Verify candidate wrapper failure attribution and ordinary exits
        shell: bash
        run: |
          set -euo pipefail
          tooling/mvnw -B -pl cli -am test \
            '-Dtest=ScheduleCompilersCommandTest#ownsNativeWrapperLifecycle+identifiesWindowsExit125' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            2>&1 | tee "$RUNNER_TEMP/compiler-scheduler-exit125/candidate.log"
      - name: Retain native scheduler comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-scheduler-exit125-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compiler-scheduler-exit125
            .cat/work/temp/wrapper-baseline/.cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
            .cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
          if-no-files-found: error
          retention-days: 1
      - name: Remove original wrapper comparison checkout
        if: always()
        shell: bash
        run: |
          if [[ -d "$GITHUB_WORKSPACE/.cat/work/temp/wrapper-baseline" ]]; then
            git worktree remove --force "$GITHUB_WORKSPACE/.cat/work/temp/wrapper-baseline"
          fi

  macos-dsym-wrapper-preflight:
    if: inputs.focus == 'macos-dsym-wrapper-preflight'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Exercise the authenticated native wrapper without rebuilding Codex
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dsym-wrapper-preflight"
          mkdir "$evidence"
          exec > >(tee "$evidence/preflight.log") 2>&1
          test "$(uname -m)" = arm64
          gh run download 40020320537 --name macos-bazel-dsym-40020320537-1 \
            --dir "$evidence/input"
          native_wrapper="$evidence/input/argument-capture/raw/bazel-out/darwin_arm64-opt-exec-ST-fd45d9624a1f/bin/external/rules_rs++rules_rust+rules_rust/util/process_wrapper/process_wrapper"
          printf '%s  %s\n' aab7636cee589b0adb603a37c1ff3fb132d588205cccefa57ca4d196ab1257b4 \
            "$native_wrapper" | shasum -a 256 --check
          cp "$native_wrapper" "$evidence/process_wrapper"
          chmod +x "$evidence/process_wrapper"
          bash .github/scripts/diagnose-macos-bazel-dsym.sh --self-test-evidence \
            "$evidence" "$evidence/process_wrapper"
      - name: Retain native wrapper preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-dsym-wrapper-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dsym-wrapper-preflight/preflight.log
            ${{ runner.temp }}/dsym-wrapper-preflight/macos-dsym-self-test-*/
            ~/Library/Logs/DiagnosticReports/process_wrapper*.ips
            ~/Library/Logs/DiagnosticReports/env*.ips
            ~/Library/Logs/DiagnosticReports/sandbox-exec*.ips
          if-no-files-found: error
          retention-days: 1
      - name: Remove native wrapper preflight inputs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/dsym-wrapper-preflight/input"
          rm -f -- "$RUNNER_TEMP/dsym-wrapper-preflight/process_wrapper"
          rm -rf -- "$RUNNER_TEMP/dsym-wrapper-preflight"/macos-dsym-self-test-*

  linux-remote-fixtures:
    if: inputs.focus == 'linux-remote-fixtures'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_CI_TEST_DEBUG: "0"
      CODEX_TEST_REMOTE_ENV_CONTAINER_NAME: codex-fixture-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
      # Fixed regression inventory: the same 52 cases run in both environments.
      FIXTURE_CASES: |
        codex-core::all suite::cyber_exec_policy::saved_prefix_only_bypasses_guardian_for_general_models::test_case_2_general_unified_exec_keeps_saved_approval
        codex-core::all suite::exec_policy::deeply_nested_forced_rm_is_rejected_before_execution_when_approvals_are_disabled
        codex-core::all suite::mcp_startup_refresh_http_proxy::skill_mcp_dependency_oauth_uses_configured_http_client
        codex-core::all suite::network_approval::allowing_network_policy_amendment_persists_context_and_bypasses_prompt
        codex-core::all suite::network_approval::ambiguous_unattributed_network_request_is_not_assigned_to_active_calls
        codex-core::all suite::network_approval::background_network_approval_uses_current_review_settings_and_original_execution::test_case_1_same_turn
        codex-core::all suite::network_approval::denying_network_policy_amendment_persists_and_blocks_request
        codex-core::all suite::network_approval::escalated_owner_network_terminal_requires_stdin_approval::test_case_1_restricted_filesystem
        codex-core::all suite::network_approval::failed_network_policy_amendment_denies_request_and_does_not_approve_host
        codex-core::all suite::network_approval::guardian_network_approval_preserves_action_and_outcome_routing
        codex-core::all suite::network_approval::strict_auto_review_routes_network_approval_to_guardian_when_user_reviewer_is_selected
        codex-core::all suite::responses_system_proxy::regular_responses_turn_honors_respect_system_proxy
        codex-core::all suite::scenarios::incremental_tools::tool_removal_appends_a_standalone_notice_without_rewriting_history::test_case_2_catalog_messages
        codex-core::all suite::tool_lifecycle::command_lifecycle::command_start_receives_rewritten_command_and_executor_workdir::test_case_1_direct
        codex-core::all suite::tool_lifecycle::tool_start_receives_rewritten_payload_and_post_hook_history
        codex-core::all suite::unified_exec::unified_exec_short_lived_network_denial_emits_failed_end_event
        codex-queue-extension::queue_service rejected_queue_messages_are_consumed_without_retrying_or_blocking_followups
        codex-core::all suite::cyber_exec_policy::switching_models_suppresses_and_restores_saved_prefix_approvals
        codex-core::all suite::exec_policy::granular_complex_forced_rm_denial_explains_why_the_command_was_rejected
        codex-core::all suite::exec_policy::granular_complex_forced_rm_requests_approval_when_allowed
        codex-core::all suite::hooks_mcp::permission_request_hook_allows_mcp_tool_without_user_or_guardian_review
        codex-core::all suite::hooks_mcp::permission_request_hook_denies_mcp_tool_without_user_or_guardian_review
        codex-core::all suite::network_approval::approved_network_host_for_one_environment_still_prompts_in_another
        codex-core::all suite::network_approval::cancelled_guardian_network_review_fails_closed_without_rewriting_turn_state
        codex-core::all suite::network_approval::guardian_receives_exact_trigger_for_single_network_request
        codex-core::all suite::network_approval::guardian_receives_exact_triggers_for_concurrent_network_requests
        codex-core::all suite::network_approval::owner_network_policy_follows_the_selected_remote_command
        codex-core::all suite::network_approval::unattributed_network_request_uses_active_turn_environment_fallback::test_case_1_user_approval
        codex-core::all suite::network_approval::user_network_approval_once_session_and_denial_semantics
        codex-core::all suite::remote_env::apply_patch_intercepted_exec_command_routes_to_selected_remote_environment
        codex-core::all suite::scenarios::guardian_code_mode_messaging_request_history
        codex-core::all suite::scenarios::incremental_tools::tool_removal_appends_a_standalone_notice_without_rewriting_history::test_case_1_bundled
        codex-core::all suite::skills::user_turn_includes_skill_instructions
        codex-core::all suite::tool_lifecycle::command_lifecycle::command_start_receives_rewritten_command_and_executor_workdir::test_case_2_code_mode
        codex-core::all suite::cyber_exec_policy::cyber_model_user_approval_never_offers_a_reusable_prefix
        codex-core::all suite::network_approval::background_network_approval_uses_current_review_settings_and_original_execution::test_case_2_later_turn
        codex-core::all suite::network_approval::disconnected_network_request_explains_failure_to_model::test_case_2_connect
        codex-core::all suite::network_approval::remote_guardian_network_decisions_are_scoped_to_each_request_and_environment
        codex-core::all suite::remote_env::deferred_executor_guardian_uses_newly_ready_step_environment::test_case_2_mcp_elicitation_expects
        codex-core::all suite::remote_env::remote_exec_materializes_target_roots_before_sandbox_selection
        codex-core::all suite::tool_lifecycle::tool_start_is_not_called_when_pre_tool_hook_prevents_execution
        codex-core::all suite::unified_exec::managed_one_shot_command_is_terminated_when_the_turn_is_interrupted
        codex-queue-extension::queue_service explicitly_started_rejected_queue_messages_are_consumed
        codex-core::all suite::cyber_exec_policy::saved_prefix_only_bypasses_guardian_for_general_models::test_case_1_cyber_unified_exec_is_reviewed
        codex-core::all suite::hooks::permission_request_hook_allow_bypasses_strict_auto_review
        codex-core::all suite::hooks_plugin_policy_refresh::native_stop_hook_uses_plugin_policy_refreshed_during_turn
        codex-core::all suite::mcp_startup_refresh_http_proxy::local_mcp_startup_and_refresh_use_configured_http_client
        codex-core::all suite::network_approval::disconnected_network_request_explains_failure_to_model::test_case_1_plain_http
        codex-core::all suite::network_approval::escalated_owner_network_terminal_requires_stdin_approval::test_case_2_unrestricted_filesystem
        codex-core::all suite::network_approval::timed_out_guardian_network_review_uses_timeout_outcome_without_user_fallback
        codex-core::all suite::unified_exec::unified_exec_network_denial_emits_failed_background_end_event
        codex-core::all suite::unified_exec_stdin_approval::stdin_reviews_escalated_terminal_with_denied_reads_before_delivering_input
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: '83086188ae0614bd882818ff1aa23f3194962012'
          expected-upstream-commit: '83086188ae0614bd882818ff1aa23f3194962012'

      - name: Authenticate and apply the Linux fixture candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/linux-remote-fixtures"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C upstream rev-parse HEAD)" = 83086188ae0614bd882818ff1aa23f3194962012
          overlay="$GITHUB_WORKSPACE/.github/diagnostics/linux-remote-fixtures.patch"
          printf '%s  %s\n' 430cf830dc949d06b86c2ef55d78035b64e4bf747d5b555cf21e1b6a506f6cab "$overlay" |
            sha256sum --check | tee "$evidence/overlay-verification.txt"
          git -C upstream diff --binary > "$evidence/prepared-source.diff"
          git -C upstream apply --check "$overlay"
          git -C upstream apply "$overlay"
          git -C upstream diff --binary > "$evidence/instrumented-source.diff"
          cp "$overlay" "$evidence/fixture-overlay.patch"
          printf 'dispatch_head=%s\nupstream_commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_SHA" "$(git -C upstream rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence/provenance.txt"
          sha256sum "$overlay" "$evidence/instrumented-source.diff" >> "$evidence/provenance.txt"
          printf '%s\n' "$FIXTURE_CASES" > "$evidence/expected-tests.txt"
          jq -Rn '[inputs | capture("^(?<package>[^:]+)::(?<binary>[^ ]+) (?<test>.+)$") |
            [.package, .binary, .test]]' < "$evidence/expected-tests.txt" > "$evidence/expected-tests.json"
          jq -e 'length == 52 and (unique | length == 52)' "$evidence/expected-tests.json"
          filter=$(jq -r 'map("(package(=" + .[0] + ") & binary(=" + .[1] + ") & test(=" + .[2] + "))") | join(" | ")' \
            "$evidence/expected-tests.json")
          printf '%s\n' "$filter" > "$evidence/test-filter.txt"
          printf 'FIXTURE_FILTER=%s\n' "$filter" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcap-dev libasound2-dev libclang-dev bubblewrap zstd

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install target for the workspace Rust toolchain
        working-directory: upstream/codex-rs
        shell: bash
        run: rustup target add "x86_64-unknown-linux-gnu"

      - name: Configure rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependency downloads
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            upstream/codex-rs -> target
          shared-key: nextest-downloads-${{ runner.os }}-${{ runner.arch }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: true
          cache-on-failure: true

      - name: Build native test dependencies
        uses: ./.github/actions/build-nextest-native-sdk
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        with:
          target: x86_64-unknown-linux-gnu

      - uses: ./.github/actions/configure-nextest-native-sdk

      - name: Check native SDK version probes
        shell: bash
        run: |
          set -euo pipefail
          pkg_config="${PKG_CONFIG:-pkg-config}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            pkg_config="$(cygpath -u "$pkg_config")"
          fi
          for module in glib-2.0 gobject-2.0 gio-2.0 gmodule-no-export-2.0 \
            gstreamer-1.0 gstreamer-base-1.0 gstreamer-app-1.0 gstreamer-audio-1.0 \
            gstreamer-tag-1.0 libffi libpcre2-8 zlib; do
            test -f "$PKG_CONFIG_PATH/$module.pc"
          done
          "$pkg_config" --atleast-version=2.56 glib-2.0
          "$pkg_config" --atleast-version=1.28 gstreamer-1.0
          "$pkg_config" --modversion glib-2.0 gstreamer-1.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      - name: Build the shared fixture test archive and Linux sandbox helper
        id: build
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/linux-remote-fixtures"
          bash "$GITHUB_WORKSPACE/.github/scripts/run-memory-scheduled-build.sh" cargo nextest archive \
            --target x86_64-unknown-linux-gnu --cargo-profile ci-test \
            --config profile.ci-test.package.blake3.opt-level=3 \
            -p codex-core -p codex-queue-extension \
            -p codex-rmcp-client -p codex-code-mode-host -p codex-linux-sandbox \
            -p codex-v8-poc \
            --features codex-v8-poc/sandbox --timings \
            --archive-file "$evidence/tests.tar.zst"
          sha256sum "$evidence/tests.tar.zst" > "$evidence/archive.sha256"

      - name: Prepare the identical native and Docker test invocation
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/linux-remote-fixtures/run-tests.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          mode="$1"
          [[ "$mode" == native || "$mode" == docker ]]
          evidence="$RUNNER_TEMP/linux-remote-fixtures"
          mkdir -p "$evidence/$mode"
          cd "$GITHUB_WORKSPACE/upstream/codex-rs"
          sha256sum --check "$evidence/archive.sha256"
          # Nextest archives Cargo's non-test helpers in target/ and records their paths here.
          tar --zstd -xOf "$evidence/tests.tar.zst" target/nextest/binaries-metadata.json \
            > "$evidence/$mode/binaries-metadata.json"
          tar --zstd -tf "$evidence/tests.tar.zst" > "$evidence/$mode/archive-members.txt"
          jq -e --argjson required '["test_stdio_server", "codex-code-mode-host", "codex-linux-sandbox"]' '
            [."rust-build-meta"."non-test-binaries"[][] |
              select(.name as $name | $required | index($name))] as $helpers |
            if ($helpers | map(.name) | sort) == ($required | sort)
            then $helpers else error("required non-test helper missing or ambiguous in archive metadata") end
            ' "$evidence/$mode/binaries-metadata.json" > "$evidence/$mode/required-helpers.json"
          while IFS=$'\t' read -r name relative_path; do
            [[ "$relative_path" == "x86_64-unknown-linux-gnu/ci-test/$name" ]]
            grep -Fx -- "target/$relative_path" "$evidence/$mode/archive-members.txt"
          done < <(jq -r '.[] | [.name, .path] | @tsv' "$evidence/$mode/required-helpers.json")
          helper="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/ci-test/codex-linux-sandbox"
          test -x "$helper"
          export CARGO_BIN_EXE_codex_linux_sandbox="$helper"
          # Cargo's native helper binding also retains the historical hyphenated name.
          extraction="$RUNNER_TEMP/linux-remote-fixture-extracted/$mode"
          mkdir -p "$extraction"
          archive=(--archive-file "$evidence/tests.tar.zst" --workspace-remap "$PWD"
            --extract-to "$extraction" --extract-overwrite)
          env "CARGO_BIN_EXE_codex-linux-sandbox=$helper" cargo nextest list "${archive[@]}" \
            --profile default -E "$FIXTURE_FILTER" --message-format json > "$evidence/$mode/selected-tests.json"
          jq -e --slurpfile expected "$evidence/expected-tests.json" '
            [."rust-suites"[] | ."package-name" as $package | .testcases | to_entries[] |
              select(.value."filter-match".status == "matches" and .value.ignored == false) |
              [$package, .key]] | sort == ($expected[0] | map([.[0], .[2]]) | sort)
            ' "$evidence/$mode/selected-tests.json"
          rm -f -- "$PWD/target/nextest/default/junit.xml"
          set +e
          env "CARGO_BIN_EXE_codex-linux-sandbox=$helper" cargo nextest run "${archive[@]}" \
            --profile default -E "$FIXTURE_FILTER" --retries 0 --no-fail-fast \
            2>&1 | tee "$evidence/$mode/nextest.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          status=${statuses[0]}
          if (( status == 0 && statuses[1] != 0 )); then status=${statuses[1]}; fi
          printf '%s\n' "$status" > "$evidence/$mode/exit-status.txt"
          if [[ -f "$PWD/target/nextest/default/junit.xml" ]]; then
            cp "$PWD/target/nextest/default/junit.xml" "$evidence/$mode/junit.xml"
          else
            printf 'Missing nextest JUnit evidence for %s\n' "$mode" >&2
            exit 1
          fi
          exit "$status"
          SCRIPT
          bash -n "$RUNNER_TEMP/linux-remote-fixtures/run-tests.sh"

      - name: Run the 52 selected fixtures on the native host
        shell: bash
        run: bash "$RUNNER_TEMP/linux-remote-fixtures/run-tests.sh" native
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 0
          RUST_MIN_STACK: "8388608"
          NEXTEST_STATUS_LEVEL: leak

      - name: Set up the Docker remote test environment
        id: docker
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/run-memory-scheduled-build.sh" bash -euo pipefail -c '
          source "$GITHUB_WORKSPACE/upstream/scripts/test-remote-env.sh"
          {
            echo "CODEX_TEST_ENVIRONMENT=${CODEX_TEST_ENVIRONMENT}"
            echo "CODEX_TEST_REMOTE_ENV=${CODEX_TEST_REMOTE_ENV}"
            echo "CODEX_TEST_REMOTE_ENV_CONTAINER_NAME=${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME}"
            echo "CODEX_TEST_REMOTE_EXEC_SERVER_URL=${CODEX_TEST_REMOTE_EXEC_SERVER_URL}"
          } >> "$GITHUB_ENV"
          '

      - name: Run the same 52 selected fixtures with Docker execution
        if: ${{ !cancelled() && steps.docker.outcome == 'success' }}
        shell: bash
        run: bash "$RUNNER_TEMP/linux-remote-fixtures/run-tests.sh" docker
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 0
          RUST_MIN_STACK: "8388608"
          NEXTEST_STATUS_LEVEL: leak

      - name: Retain the Linux fixture diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-remote-fixtures
          path: |
            ${{ runner.temp }}/linux-remote-fixtures
            !${{ runner.temp }}/linux-remote-fixtures/tests.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: Tear down the Docker remote test environment
        if: always()
        shell: bash
        run: docker rm -f "$CODEX_TEST_REMOTE_ENV_CONTAINER_NAME"

      - name: Remove staged native dependencies and the test archive
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/nextest-native" "$RUNNER_TEMP/nextest-native.tar.gz"
          rm -f -- "$RUNNER_TEMP/linux-remote-fixtures/tests.tar.zst"
          rm -rf -- "$RUNNER_TEMP/linux-remote-fixture-extracted"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  linux-docker-scope:
    if: inputs.focus == 'linux-docker-scope'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Compare Docker access before and inside the build memory scope
        shell: bash
        run: |
          set -euo pipefail
          probe="$(cat <<'PROBE'
          set -uo pipefail
          id
          printf "Docker host: %s\nDocker context: %s\n" "${DOCKER_HOST:-unset}" "${DOCKER_CONTEXT:-unset}"
          docker context show
          stat -Lc "%a %u %g %n" /var/run/docker.sock
          docker info
          PROBE
          )"

          printf 'Direct runner context\n'
          set +e
          bash -c "$probe"
          direct_status=$?
          set -e
          printf 'Direct Docker probe status: %s\n' "$direct_status"

          fixture="$(mktemp -d "$RUNNER_TEMP/docker-scope-XXXXXX")"
          trap 'rm -rf -- "$fixture"' EXIT
          cat > "$fixture/scheduler-pass-through" <<'SCHEDULER'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$1" == schedule-compilers && "$2" == -- ]]
          shift 2
          exec "$@"
          SCHEDULER
          chmod +x "$fixture/scheduler-pass-through"

          printf 'Memory-scope context through the maintained wrapper with a pass-through scheduler fixture\n'
          set +e
          CODEX_UNLEASHED_TOOLING="$fixture/scheduler-pass-through" \
            bash .github/scripts/run-memory-scheduled-build.sh bash -c "$probe"
          scope_status=$?
          set -e
          printf 'Scoped Docker probe status: %s\n' "$scope_status"
          test "$direct_status" -eq 0
          exit "$scope_status"

  native-platform-tests:
    if: inputs.focus == 'native-platform-tests-except-windows-x64'
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_id: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact_id: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact_id: macos-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_id: windows-arm64
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    secrets: inherit
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      profile: ci-test
      artifact_id: ${{ matrix.artifact_id }}

  native-platform-tests-linux:
    if: inputs.focus == 'native-platform-tests-except-windows-x64' || inputs.focus == 'linux-x64-native-and-remote'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      target: x86_64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-x64

  native-platform-tests-linux-remote:
    needs: native-platform-tests-linux
    if: inputs.focus == 'native-platform-tests-except-windows-x64' || inputs.focus == 'linux-x64-native-and-remote'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      target: x86_64-unknown-linux-gnu
