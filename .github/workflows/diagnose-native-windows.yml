name: Diagnose focused native regressions

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Focused native regression to investigate
        type: choice
        default: credentials
        options:
          - credentials
          - windows-test-timeouts
          - windows-lifecycle-source
          - windows-conpty-ctrl-c
          - windows-conpty-fixture
          - windows-archive-extraction
          - windows-archived-failures
          - windows-arm-launch-inputs
          - windows-arm-mxc-policy
          - windows-arm-mxc-volumes
          - arm-daemon-lifecycle
          - arm-daemon-hashing
          - macos-x64-original-timeouts
          - macos-x64-current-timeouts
          - macos-x64-current-shards
          - macos-tui-timeouts
          - macos-tui-integration-timeouts
          - macos-bazel-tui-timeouts
          - macos-bazel-dsym
          - macos-dsym-wrapper-preflight
          - compiler-profile
          - linker-profile
          - crate-local-profile
          - compiler-scheduler-baseline
          - compiler-scheduler-native
          - compiler-scheduler-macos
          - compiler-scheduler-tooling
          - compiler-scheduler-tooling-windows
          - compiler-scheduler-exit125
          - compiler-scheduler-pause-recovery
          - windows-arm-tooling-locks
          - native-voice-runtime
          - native-voice-runtime-windows-x64
          - native-voice-runtime-windows-arm64
          - native-platform-tests-except-windows-x64
          - linux-docker-scope
      source-run:
        description: Workflow run supplying compiled binaries for an archived-test diagnostic.
        type: string
        required: false

permissions:
  contents: read

jobs:
  windows-arm-mxc-volumes:
    if: inputs.focus == 'windows-arm-mxc-volumes'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Inspect MXC filesystem enforcement prerequisites on both drives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $probes = @(
            @{ Program = 'fsutil.exe'; Arguments = @('fsinfo', 'volumeinfo', 'C:') },
            @{ Program = 'fsutil.exe'; Arguments = @('fsinfo', 'volumeinfo', 'D:') },
            @{ Program = 'fsutil.exe'; Arguments = @('devdrv', 'query', 'C:') },
            @{ Program = 'fsutil.exe'; Arguments = @('devdrv', 'query', 'D:') },
            @{ Program = 'fltmc.exe'; Arguments = @('instances', '-v', 'C:') },
            @{ Program = 'fltmc.exe'; Arguments = @('instances', '-v', 'D:') },
            @{ Program = 'sc.exe'; Arguments = @('query', 'bfs') }
          )
          foreach ($probe in $probes) {
            $arguments = $probe.Arguments
            Write-Output "::group::$($probe.Program) $($arguments -join ' ')"
            & $probe.Program @arguments
            Write-Output "Native query exit status: $LASTEXITCODE"
            Write-Output '::endgroup::'
          }

  compiler-scheduler-pause-recovery:
    if: inputs.focus == 'compiler-scheduler-pause-recovery'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 26.12.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Compare partial suspension recovery with its unmodified controller
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/.cat/work/temp/pause-baseline"
          evidence="$RUNNER_TEMP/compiler-scheduler-pause-recovery"
          mkdir -p "$evidence"
          git fetch --no-tags --depth=1 "https://github.com/$GH_REPO.git" \
            b88270828322a960a456ba313ef903f0287fb010
          git worktree add --detach "$baseline" FETCH_HEAD
          test_path=tooling/cli/src/test/java/com/holdmyspot/codexunleashed/tooling/ScheduleCompilersCommandTest.java
          fixture_path=tooling/cli/src/test/resources/native/deny-second-suspension.cc
          cp "$test_path" "$baseline/$test_path"
          mkdir -p "$baseline/$(dirname "$fixture_path")"
          cp "$fixture_path" "$baseline/$fixture_path"
          candidate_status=0
          for variant in baseline candidate; do
            checkout="$GITHUB_WORKSPACE"
            [[ "$variant" != baseline ]] || checkout="$baseline"
            status=0
            "$checkout/tooling/mvnw" -B -pl cli -am test \
              '-Dtest=ScheduleCompilersCommandTest#recoversDeniedWindowsSuspension+ownsNativeWrapperLifecycle+identifiesWindowsExit125' \
              -Dsurefire.failIfNoSpecifiedTests=false > "$evidence/$variant.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "$evidence/$variant.status"
            printf '%s comparison status: %s; retained reports require classification.\n' "$variant" "$status"
            [[ "$variant" != candidate ]] || candidate_status="$status"
          done
          exit "$candidate_status"
      - name: Retain native partial suspension evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-scheduler-pause-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compiler-scheduler-pause-recovery
            .cat/work/temp/pause-baseline/.cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
            .cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
          if-no-files-found: error
          retention-days: 1
      - name: Remove partial suspension comparison checkout
        if: always()
        shell: bash
        run: |
          if [[ -d "$GITHUB_WORKSPACE/.cat/work/temp/pause-baseline" ]]; then
            git worktree remove --force "$GITHUB_WORKSPACE/.cat/work/temp/pause-baseline"
          fi

  compiler-scheduler-exit125:
    if: inputs.focus == 'compiler-scheduler-exit125'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 26.12.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Record the original wrapper with the new regression tests
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/.cat/work/temp/wrapper-baseline"
          evidence="$RUNNER_TEMP/compiler-scheduler-exit125"
          mkdir -p "$evidence"
          git fetch --no-tags --depth=1 "https://github.com/$GH_REPO.git" \
            8ee096b053de8b0eaef8a7e5deae00a8bc3a06b8
          git worktree add --detach "$baseline" FETCH_HEAD
          test_path=tooling/cli/src/test/java/com/holdmyspot/codexunleashed/tooling/ScheduleCompilersCommandTest.java
          cp "$test_path" "$baseline/$test_path"
          status=0
          "$baseline/tooling/mvnw" -B -pl cli -am test \
            '-Dtest=ScheduleCompilersCommandTest#ownsNativeWrapperLifecycle+identifiesWindowsExit125' \
            -Dsurefire.failIfNoSpecifiedTests=false > "$evidence/baseline.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$evidence/baseline.status"
          printf 'Original wrapper comparison exit status: %s; retained log and test reports require classification.\n' "$status"
      - name: Verify candidate wrapper failure attribution and ordinary exits
        shell: bash
        run: |
          set -euo pipefail
          tooling/mvnw -B -pl cli -am test \
            '-Dtest=ScheduleCompilersCommandTest#ownsNativeWrapperLifecycle+identifiesWindowsExit125' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            2>&1 | tee "$RUNNER_TEMP/compiler-scheduler-exit125/candidate.log"
      - name: Retain native scheduler comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-scheduler-exit125-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compiler-scheduler-exit125
            .cat/work/temp/wrapper-baseline/.cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
            .cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
          if-no-files-found: error
          retention-days: 1
      - name: Remove original wrapper comparison checkout
        if: always()
        shell: bash
        run: |
          if [[ -d "$GITHUB_WORKSPACE/.cat/work/temp/wrapper-baseline" ]]; then
            git worktree remove --force "$GITHUB_WORKSPACE/.cat/work/temp/wrapper-baseline"
          fi

  macos-dsym-wrapper-preflight:
    if: inputs.focus == 'macos-dsym-wrapper-preflight'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Exercise the authenticated native wrapper without rebuilding Codex
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dsym-wrapper-preflight"
          mkdir "$evidence"
          exec > >(tee "$evidence/preflight.log") 2>&1
          test "$(uname -m)" = arm64
          gh run download 40020320537 --name macos-bazel-dsym-40020320537-1 \
            --dir "$evidence/input"
          native_wrapper="$evidence/input/argument-capture/raw/bazel-out/darwin_arm64-opt-exec-ST-fd45d9624a1f/bin/external/rules_rs++rules_rust+rules_rust/util/process_wrapper/process_wrapper"
          printf '%s  %s\n' aab7636cee589b0adb603a37c1ff3fb132d588205cccefa57ca4d196ab1257b4 \
            "$native_wrapper" | shasum -a 256 --check
          cp "$native_wrapper" "$evidence/process_wrapper"
          chmod +x "$evidence/process_wrapper"
          bash .github/scripts/diagnose-macos-bazel-dsym.sh --self-test-evidence \
            "$evidence" "$evidence/process_wrapper"
      - name: Retain native wrapper preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-dsym-wrapper-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dsym-wrapper-preflight/preflight.log
            ${{ runner.temp }}/dsym-wrapper-preflight/macos-dsym-self-test-*/
            ~/Library/Logs/DiagnosticReports/process_wrapper*.ips
            ~/Library/Logs/DiagnosticReports/env*.ips
            ~/Library/Logs/DiagnosticReports/sandbox-exec*.ips
          if-no-files-found: error
          retention-days: 1
      - name: Remove native wrapper preflight inputs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/dsym-wrapper-preflight/input"
          rm -f -- "$RUNNER_TEMP/dsym-wrapper-preflight/process_wrapper"
          rm -rf -- "$RUNNER_TEMP/dsym-wrapper-preflight"/macos-dsym-self-test-*

  linux-docker-scope:
    if: inputs.focus == 'linux-docker-scope'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Compare Docker access before and inside the build memory scope
        shell: bash
        run: |
          set -euo pipefail
          probe="$(cat <<'PROBE'
          set -uo pipefail
          id
          printf "Docker host: %s\nDocker context: %s\n" "${DOCKER_HOST:-unset}" "${DOCKER_CONTEXT:-unset}"
          docker context show
          stat -Lc "%a %u %g %n" /var/run/docker.sock
          docker info
          PROBE
          )"

          printf 'Direct runner context\n'
          set +e
          bash -c "$probe"
          direct_status=$?
          set -e
          printf 'Direct Docker probe status: %s\n' "$direct_status"

          fixture="$(mktemp -d "$RUNNER_TEMP/docker-scope-XXXXXX")"
          trap 'rm -rf -- "$fixture"' EXIT
          cat > "$fixture/scheduler-pass-through" <<'SCHEDULER'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$1" == schedule-compilers && "$2" == -- ]]
          shift 2
          exec "$@"
          SCHEDULER
          chmod +x "$fixture/scheduler-pass-through"

          printf 'Memory-scope context through the maintained wrapper with a pass-through scheduler fixture\n'
          set +e
          CODEX_UNLEASHED_TOOLING="$fixture/scheduler-pass-through" \
            bash .github/scripts/run-memory-scheduled-build.sh bash -c "$probe"
          scope_status=$?
          set -e
          printf 'Scoped Docker probe status: %s\n' "$scope_status"
          test "$direct_status" -eq 0
          exit "$scope_status"

  native-platform-tests:
    if: inputs.focus == 'native-platform-tests-except-windows-x64'
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_id: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact_id: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact_id: macos-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_id: windows-arm64
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    secrets: inherit
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      profile: ci-test
      artifact_id: ${{ matrix.artifact_id }}

  native-platform-tests-linux:
    if: inputs.focus == 'native-platform-tests-except-windows-x64'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      target: x86_64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-x64

  native-platform-tests-linux-remote:
    needs: native-platform-tests-linux
    if: inputs.focus == 'native-platform-tests-except-windows-x64'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      target: x86_64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-x64-remote
      reuse_archive: true
      archive_artifact_id: linux-x64
      remote_env: true

  native-voice-runtime-windows-x64:
    if: inputs.focus == 'native-voice-runtime-windows-x64'
    permissions:
      contents: read
    uses: ./.github/workflows/build-voice-runtime.yml
    secrets: inherit
    with:
      focus_target: x86_64-pc-windows-msvc

  native-voice-runtime-windows-arm64:
    if: inputs.focus == 'native-voice-runtime-windows-arm64'
    permissions:
      contents: read
    uses: ./.github/workflows/build-voice-runtime.yml
    secrets: inherit
    with:
      focus_target: aarch64-pc-windows-msvc

  native-voice-runtime:
    if: inputs.focus == 'native-voice-runtime'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    permissions:
      contents: read
    uses: ./.github/workflows/build-voice-runtime.yml
    secrets: inherit
    with:
      focus_target: ${{ matrix.target }}

  windows-arm-tooling-locks:
    if: inputs.focus == 'windows-arm-tooling-locks'
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '27'
          architecture: aarch64
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: aarch64-pc-windows-msvc
      - name: Exercise bundled runtime tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-arm-tooling-locks"
          set +e
          tooling/mvnw -q -pl distribution -am \
            -Dtest=DistributionMainTest,PackageCommandRuntimeTest,WindowsShardWorkflowTest,WindowsResourceUsersTest,BazelCallerTest \
            -Dsurefire.failIfNoSpecifiedTests=false verify \
            2>&1 | tee "$RUNNER_TEMP/windows-arm-tooling-locks/maven.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Inspect remaining runtime DLLs before cleanup
        if: failure() && steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          & .github/scripts/diagnose-windows-tooling-locks.ps1 `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-arm-tooling-locks')
      - name: Retain Windows ARM tooling failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm-tooling-locks
          path: |
            ${{ runner.temp }}/windows-arm-tooling-locks
            .cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
            .cat/work/temp/build-caches/maven/target/tooling-distribution/surefire-reports
          if-no-files-found: ignore
          retention-days: 1

  windows-archived-failures:
    if: inputs.focus == 'windows-archived-failures'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: ${{ matrix.runner }}
      artifact-id: windows-x64
      test-filter: '(package(codex-core) & test(subagent_stop_replaces_stop_and_skips_internal_subagents)) | (package(codex-utils-pty) & test(conpty_ctrl_c_interrupts_powershell_foreground_child)) | (package(codex-windows-sandbox) & (test(legacy_capture_cancellation_terminates_descendants_without_timeout) | test(legacy_capture_emits_output_and_preserves_descendant_after_normal_exit) | test(legacy_tty_job_terminates_and_preserves_descendants)))'

  windows-arm-launch-inputs:
    if: inputs.focus == 'windows-arm-launch-inputs'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: '40038389605'
      runner: windows-11-arm
      artifact-id: windows-arm64
      arm-launch-controls: true
      preserve-archive-policy: true
      test-filter: '(package(codex-exec-server) & binary(exec_process) & test(=remote_windows_sandbox_process_accepts_process_write::test_case_2_mxc_pipe)) | (package(codex-core) & binary(all) & test(=suite::unified_exec::exec_command_uses_installed_environment_shell_policy_with_explicit_overrides))'

  windows-archive-extraction:
    if: inputs.focus == 'windows-archive-extraction'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: windows-2022
      artifact-id: windows-x64
      test-filter: 'package(codex-ansi-escape)'

  arm-daemon-hashing:
    if: inputs.focus == 'arm-daemon-hashing'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Compare executable hashing with and without package optimization
        shell: bash
        run: |
          set -euo pipefail
          probe_dir=$(mktemp -d "$RUNNER_TEMP/daemon-hashing-XXXXXX")
          trap 'rm -rf -- "$probe_dir"' EXIT
          export TMPDIR="$probe_dir/tmp"
          export CARGO_HOME="$probe_dir/cargo-home"
          export CARGO_TARGET_DIR="$probe_dir/target"
          mkdir -p "$probe_dir/src" "$TMPDIR"
          cat > "$probe_dir/Cargo.toml" <<'MANIFEST'
          [package]
          name = "daemon-hash-benchmark"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          blake3 = "=1.8.2"
          [profile.optimized-hash]
          inherits = "dev"
          [profile.optimized-hash.package.blake3]
          opt-level = 3
          MANIFEST
          cat > "$probe_dir/src/main.rs" <<'SOURCE'
          use std::io::Read;
          fn main() -> std::io::Result<()> {
              let bytes = 1024_u64 * 1024 * 1024;
              let start = std::time::Instant::now();
              let mut hasher = blake3::Hasher::new();
              hasher.update_reader(std::io::repeat(37).take(bytes))?;
              println!("bytes={bytes} elapsed={:?} digest={}", start.elapsed(), hasher.finalize());
              Ok(())
          }
          SOURCE
          rustc --version
          uname -m
          cd "$probe_dir"
          cargo run
          cargo run --profile optimized-hash

  arm-daemon-lifecycle:
    if: inputs.focus == 'arm-daemon-lifecycle'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: ubuntu-24.04-arm
      artifact-id: linux-arm64
      test-filter: 'binary(app_server_daemon) & (test(=managed_daemon_restarts_from_deleted_working_directory) | test(=managed_starts_ensure_one_updater_and_recover_a_missing_one) | test(=restart_applies_saved_updater_preference))'

  macos-x64-current-shards:
    if: inputs.focus == 'macos-x64-current-shards'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '4']
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      preserve-archive-policy: true
      archive-shard: ${{ matrix.shard }}
      runner: macos-15-intel
      artifact-id: macos-x64
      test-filter: 'all()'

  macos-x64-current-timeouts:
    if: inputs.focus == 'macos-x64-current-timeouts'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      preserve-archive-policy: true
      runner: macos-15-intel
      artifact-id: macos-x64
      test-filter: '(package(codex-core) & test(=client::tool_metadata::tests::message_budget_removes_residual_values_and_markers_when_ordinary_input_fits)) | (package(codex-tui) & test(=bottom_pane::async_questions::tests::question_wrapped_options_and_other_share_the_text_indent))'

  macos-x64-original-timeouts:
    if: inputs.focus == 'macos-x64-original-timeouts'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      original-source-policy: true
      upstream-ref: 83086188ae0614bd882818ff1aa23f3194962012
      runner: macos-15-intel
      artifact-id: macos-x64
      test-filter: '(package(codex-core) & test(=client::tool_metadata::tests::message_budget_removes_residual_values_and_markers_when_ordinary_input_fits)) | (package(codex-core) & test(=shell_snapshot::tests::snapshot_discovers_and_restores_inherited_credential_aliases)) | (package(codex-tui) & test(=bottom_pane::async_questions::tests::question_wrapped_options_and_other_share_the_text_indent))'

  macos-tui-timeouts:
    if: inputs.focus == 'macos-tui-timeouts'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: macos-15-intel
      artifact-id: macos-x64
      test-filter: 'package(codex-tui) & (test(command_center_new_checkout_and_worktree_preserve_source_and_default_branch) | test(switching_back_replays_only_latest_compacted_conversation))'

  macos-tui-integration-timeouts:
    if: inputs.focus == 'macos-tui-integration-timeouts'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: macos-15-intel
      artifact-id: macos-x64
      test-filter: 'package(codex-tui) & (test(history_lookup_uses_server_provider_with_local_and_embedded_servers) | test(automatic_reconnect_restores_draft_and_routes_new_notifications))'

  macos-bazel-dsym:
    if: inputs.focus == 'macos-bazel-dsym'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream

      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-apple-darwin
          cache-scope: bazel-test

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up JDK 27 with allocation profiling tools
        id: profiling-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - name: Check dSYM diagnostic acceptance regressions
        shell: bash
        run: bash .github/scripts/diagnose-macos-bazel-dsym.sh --self-test "$RUNNER_TEMP"

      - name: Build Codex with hermetic native dSYM generation and verify its symbols
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BAZEL_PROFILING_JAVA_HOME: ${{ steps.profiling-jdk.outputs.path }}
        run: bash .github/scripts/diagnose-macos-bazel-dsym.sh "$GITHUB_WORKSPACE/upstream" "$RUNNER_TEMP/macos-bazel-dsym"

      - name: Flush and inspect the allocation recording before upload
        if: always() && steps.profiling-jdk.outcome == 'success'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bash .github/scripts/diagnose-macos-bazel-dsym.sh --finish-profile \
            "$GITHUB_WORKSPACE/upstream" "$RUNNER_TEMP/macos-bazel-dsym" \
            '${{ steps.profiling-jdk.outputs.path }}'

      - name: Retain native dSYM acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bazel-dsym-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-bazel-dsym
          if-no-files-found: warn
          retention-days: 1

      - name: Remove native dSYM evidence and build outputs after upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/macos-bazel-dsym"
          if [[ -n "${BAZEL_OUTPUT_BASE:-}" && -d "$BAZEL_OUTPUT_BASE" ]]; then
            cd "$GITHUB_WORKSPACE/upstream"
            bazel --output_base="$BAZEL_OUTPUT_BASE" shutdown
            chmod -R u+w "$BAZEL_OUTPUT_BASE"
            rm -rf -- "$BAZEL_OUTPUT_BASE"
          fi

  compiler-profile:
    if: inputs.focus == 'compiler-profile' || inputs.focus == 'linker-profile' || inputs.focus == 'crate-local-profile'
    permissions:
      actions: read
      attestations: write
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/profile-release-compiler.yml
    secrets: inherit
    with:
      upstream_tag: rust-v0.163.0
      focus_target: x86_64-unknown-linux-musl
      focus_bundle: primary
      build_only: true
      publish_npm: false
      ghcr_cache: true
      linker-lto: ${{ inputs.focus == 'linker-profile' }}
      crate-local-lto: ${{ inputs.focus == 'crate-local-profile' }}

  prepare-tooling:
    if: inputs.focus == 'credentials' || inputs.focus == 'windows-test-timeouts' || inputs.focus == 'macos-bazel-tui-timeouts' || inputs.focus == 'windows-lifecycle-source' || inputs.focus == 'windows-conpty-ctrl-c' || inputs.focus == 'windows-conpty-fixture' || inputs.focus == 'windows-arm-mxc-policy'
    uses: ./.github/workflows/prepare-tooling.yml
    with:
      runner: ${{ inputs.focus == 'macos-bazel-tui-timeouts' && 'macos-15-intel' || inputs.focus == 'windows-arm-mxc-policy' && 'windows-11-arm' || 'windows-2022' }}

  macos-bazel-tui-timeouts:
    if: inputs.focus == 'macos-bazel-tui-timeouts'
    needs: prepare-tooling
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-apple-darwin
          cache-scope: bazel-test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Reproduce terminal suites with the maintained Bazel runner
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs -- \
            test --test_tag_filters=-argument-comment-lint --test_verbose_timeout_warnings \
            --nocache_test_results "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" -- \
            //codex-rs/tui:tui-all-test //codex-rs/tui:tui-unit-tests

  windows-lifecycle-source:
    if: inputs.focus == 'windows-lifecycle-source'
    needs: prepare-tooling
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply lifecycle fixture and capture timing diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check ../.github/diagnostics/windows-lifecycle-fixtures.patch
          git -C upstream apply ../.github/diagnostics/windows-lifecycle-fixtures.patch
      - name: Rebuild and diagnose legacy Windows descendant lifecycles
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          program_files_windows="$(cygpath -w "${PROGRAMFILES:?PROGRAMFILES must identify the installed Windows program directory}")"
          powershell_windows="${program_files_windows}\PowerShell\7\pwsh.exe"
          powershell_unix="$(cygpath -u "$powershell_windows")"
          if [[ ! -f "$powershell_unix" ]]; then
            printf 'PowerShell 7 executable is missing: %s\n' "$powershell_windows" >&2
            exit 1
          fi
          printf 'Windows lifecycle PowerShell: %s\n' "$powershell_windows"
          mkdir -p "$RUNNER_TEMP/windows-lifecycle-source"
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            "--test_env=PROGRAMFILES=${program_files_windows}" \
            --nocache_test_results --test_output=all --test_arg=--nocapture \
            --test_arg=legacy_capture_cancellation_terminates_descendants_without_timeout \
            --test_arg=legacy_capture_emits_output_and_preserves_descendant_after_normal_exit \
            --test_arg=legacy_tty_job_terminates_and_preserves_descendants \
            -- //codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests \
            2>&1 | tee "$RUNNER_TEMP/windows-lifecycle-source/console.log"
          bash "${GITHUB_WORKSPACE}/.github/scripts/assert-windows-lifecycle-evidence.sh" \
            "$RUNNER_TEMP/windows-lifecycle-source/console.log"
      - name: Retain lifecycle source diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lifecycle-source-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/windows-lifecycle-source
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore
          retention-days: 1

  windows-conpty-ctrl-c:
    if: inputs.focus == 'windows-conpty-ctrl-c'
    needs: prepare-tooling
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply source-owned ConPTY input diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check ../.github/diagnostics/windows-conpty-ctrl-c.patch
          git -C upstream apply ../.github/diagnostics/windows-conpty-ctrl-c.patch
          git -C upstream apply --check ../.github/diagnostics/windows-conpty-ctrl-c-inheritance.patch
          git -C upstream apply ../.github/diagnostics/windows-conpty-ctrl-c-inheritance.patch
      - name: Compare inherited, enabled, ignored, and prompt-gated Ctrl-C handling
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-conpty-ctrl-c"
          mkdir -p "$evidence"
          cd upstream
          for mode in inherited enabled ignored enabled-prompt; do
            status=0
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
              -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
              --test_env=CODEX_CONPTY_CTRL_C_DIAGNOSTIC=1 \
              "--test_env=CODEX_CONPTY_CTRL_C_INHERITANCE=$mode" \
              --nocache_test_results --test_output=all --test_arg=--nocapture \
              --test_arg=--exact \
              --test_arg=tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child \
              -- //codex-rs/utils/pty:pty-unit-tests \
              2>&1 | tee "$evidence/$mode.log" || status=$?
            printf '%s\n' "$status" > "$evidence/$mode.status"
          done
          for mode in inherited enabled ignored enabled-prompt; do
            log="$evidence/$mode.log"
            grep -F "conpty_diagnostic inheritance_mode=$mode setup=ok" "$log"
            grep -F 'normalized_bytes=[03] write=Ok(()) flush=Ok(())' "$log"
            grep -F 'normalized_bytes=[63, 6d, 64, 2e, 65, 78, 65, 20, 2f, 44, 20, 2f, 43, 20, 76, 65, 72, 0d] write=Ok(()) flush=Ok(())' "$log"
            grep -F 'stage=after_ver_wait root_has_exited=false root_exit_code=None' "$log"
            grep -Ei 'stage=readiness .*image="(pwsh|powershell)\.exe" query_ok=true exit_code=259' "$log"
            grep -Ei 'stage=readiness .*image="ping\.exe" query_ok=true exit_code=259' "$log"
            grep -Ei 'stage=after_ver_wait .*image="ping\.exe" query_ok=true exit_code=' "$log"
          done
          test "$(cat "$evidence/enabled-prompt.status")" = 0
          grep -F 'test result: ok. 1 passed; 0 failed;' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt captured_initial_prompt="PS ' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt phase=prompt observed elapsed_ns=' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt phase=ver observed elapsed_ns=' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt io=read elapsed_ns=' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt io=write started_ns=' "$evidence/enabled-prompt.log"
          for mode in enabled enabled-prompt; do
            grep -Ei 'stage=after_ver_wait .*image="ping\.exe" query_ok=true exit_code=3221225786' "$evidence/$mode.log"
          done
          for mode in inherited ignored; do
            grep -Ei 'stage=after_ver_wait .*image="ping\.exe" query_ok=true exit_code=259' "$evidence/$mode.log"
          done
          for mode in inherited enabled ignored; do
            test "$(cat "$evidence/$mode.status")" != 0
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "$evidence/$mode.log"
            grep -E 'conpty_diagnostic resumption elapsed=.*result=Err\(timed out waiting for "Microsoft Windows"' "$evidence/$mode.log"
          done
          printf '%s\n' 'Prompt-gated enabled control passed; original three resumption controls still fail. Production repair remains unverified.'
      - name: Retain ConPTY control and process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-conpty-ctrl-c-windows-latest
          path: |
            ${{ runner.temp }}/windows-conpty-ctrl-c
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore
          retention-days: 1

  windows-conpty-fixture:
    if: inputs.focus == 'windows-conpty-fixture'
    needs: prepare-tooling
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify the standalone ConPTY fixture and full PTY suite
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-conpty-fixture"
          mkdir -p "$evidence"
          cd upstream
          for gate in exact suite; do
            test_args=()
            if [ "$gate" = exact ]; then
              test_args=(
                --test_arg=--exact
                --test_arg=tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child
              )
            fi
            status=0
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
              -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
              --nocache_test_results --test_output=all --test_arg=--nocapture \
              "${test_args[@]}" -- //codex-rs/utils/pty:pty-unit-tests \
              2>&1 | tee "$evidence/$gate.log" || status=$?
            printf '%s\n' "$status" > "$evidence/$gate.status"
          done
          for gate in exact suite; do
            test "$(cat "$evidence/$gate.status")" = 0
            grep -F 'test tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child ... ok' "$evidence/$gate.log"
          done
          grep -F 'test result: ok. 1 passed; 0 failed;' "$evidence/exact.log"
          for parser_test in \
            powershell_prompt_matches_only_after_interrupt \
            powershell_prompt_rejects_partial_wrong_path_and_stale_output \
            powershell_prompt_capture_requires_complete_single_line; do
            grep -F "test tests::windows_tests::$parser_test ... ok" "$evidence/suite.log"
          done
      - name: Retain standalone ConPTY fixture acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-conpty-fixture-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/windows-conpty-fixture
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore
          retention-days: 1

  regressions:
    if: inputs.focus == 'credentials' || inputs.focus == 'windows-test-timeouts'
    needs: prepare-tooling
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Windows voice build prerequisites
        if: inputs.focus == 'windows-test-timeouts'
        working-directory: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content .github/scripts/voice-cygwin-snapshot.json -Raw | ConvertFrom-Json).archive
          $directory = Join-Path $env:RUNNER_TEMP 'voice-cygwin-snapshot'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Join-Path $directory $pin.name
          gh release download $pin.tag --repo openai/codex --pattern $pin.name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the pinned Windows voice archive failed.' }
          & ./.github/scripts/setup-voice-windows.ps1 -Target x86_64-pc-windows-msvc -SnapshotArchive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Installing the pinned Windows voice prerequisites failed.' }
      - name: Repeat complete credential regression target
        if: inputs.focus == 'credentials'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --nocache_test_results --runs_per_test=5 --test_output=errors \
            -- //codex-rs/model-provider:model-provider-unit-tests

      - name: Diagnose native test timeout boundaries
        if: inputs.focus == 'windows-test-timeouts'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --nocache_test_results --runs_per_test=5 --test_timeout=300 --test_output=all \
            --test_arg=--nocapture \
            -- //codex-rs/http-client:custom_ca_probe-bin-unit-tests \
            //codex-rs/voice-host:voice-host-installed_client-test

  compiler-scheduler-baseline:
    if: inputs.focus == 'compiler-scheduler-baseline' || inputs.focus == 'compiler-scheduler-native'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      USE_BAZEL_VERSION: 9.3.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preserve the diagnostic patch independently of the verified driver
        shell: bash
        env:
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail
          mkdir -p .cat/work/temp/scheduler-diagnostics
          if [[ "$FOCUS" == compiler-scheduler-native ]]; then
            cp .github/diagnostics/compiler-scheduler-native.patch .cat/work/temp/scheduler-diagnostics/tests.patch
          else
            cp .github/diagnostics/compiler-scheduler-tests.patch .cat/work/temp/scheduler-diagnostics/tests.patch
          fi
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hermeticbuild/rules_rust
          ref: a20387a3b3e7baec859b53f3cb15b026fbc8a423
          path: scheduler-upstream
          persist-credentials: false
      - name: Use a short normalized Windows Bazel output path
        id: scheduler_bazel_paths
        shell: bash
        run: |
          printf 'base=%s/bs\n' "$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.30.0
          module-root: scheduler-upstream
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          output-base: ${{ steps.scheduler_bazel_paths.outputs.base }}
      - name: Apply standalone scheduler regression tests
        shell: bash
        run: |
          set -euo pipefail
          git -C scheduler-upstream apply ../.cat/work/temp/scheduler-diagnostics/tests.patch
      - name: Check native scheduler admission
        shell: bash
        env:
          USE_BAZEL_VERSION: 9.3.1
          FOCUS: ${{ inputs.focus }}
          BAZEL_OUTPUT_BASE: ${{ steps.scheduler_bazel_paths.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p .cat/work/temp/scheduler-diagnostics
          diagnostic="${GITHUB_WORKSPACE}/.cat/work/temp/scheduler-diagnostics/baseline.log"
          cd scheduler-upstream
          arguments=()
          if [[ "$FOCUS" == compiler-scheduler-baseline ]]; then
            arguments+=(--test_arg=configured_scheduler_must_be_available_before_compiler_starts --test_arg=--exact)
          fi
          output_base="$BAZEL_OUTPUT_BASE"
          set +e
          bazel --client_debug "--output_base=$output_base" \
            test //test/process_wrapper:compiler_scheduler_test \
            "${arguments[@]}" \
            --nocache_test_results --test_output=all --lockfile_mode=update \
            2>&1 | tee "$diagnostic"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "${diagnostic%.log}.status"
          if [[ -f "$output_base/server/jvm.out" ]]; then
            tail -c 65536 "$output_base/server/jvm.out" > "${diagnostic%.log}-jvm.log"
          else
            printf 'No JVM log at configured output base: %s\n' "$output_base" > "${diagnostic%.log}-jvm.log"
          fi
          if [[ "$FOCUS" == compiler-scheduler-native ]]; then
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            grep -F 'test result: ok. 5 passed;' "$diagnostic"
            grep -F 'test denied_partial_suspension_terminates_the_attempt_before_retry ... ok' "$diagnostic"
            printf 'Patched Windows admission, working-directory, pause/resume, retry and denied-suspension checks pass.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$status" != 3 ]]; then
            printf 'Expected a behavioral test failure (3), got %s.\n' "$status" >&2
            exit 1
          fi
          grep -F 'running 1 test' "$diagnostic"
          grep -F 'configured_scheduler_must_be_available_before_compiler_starts ... FAILED' "$diagnostic"
          grep -F 'left: Some(0)' "$diagnostic"
          grep -F 'right: Some(125)' "$diagnostic"
          printf 'Unpatched native Windows compiler runs without scheduler admission.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain focused baseline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-scheduler-windows-baseline
          path: .cat/work/temp/scheduler-diagnostics
          if-no-files-found: ignore
          retention-days: 1

  compiler-scheduler-macos:
    if: inputs.focus == 'compiler-scheduler-macos'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        variant: [baseline, native]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      USE_BAZEL_VERSION: 9.3.1
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hermeticbuild/rules_rust
          ref: a20387a3b3e7baec859b53f3cb15b026fbc8a423
          path: scheduler-upstream
          persist-credentials: false
      - name: Apply the selected standalone native regression
        shell: bash
        run: |
          set -euo pipefail
          patch=compiler-scheduler-tests.patch
          if [[ "$VARIANT" == native ]]; then patch=compiler-scheduler-native.patch; fi
          git -C scheduler-upstream apply "../.github/diagnostics/$patch"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.30.0
          module-root: scheduler-upstream
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          output-base: ${{ github.workspace }}/.cat/work/temp/build-caches/native-scheduler/bazel-output
      - name: Check native macOS compiler control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cat/work/temp/scheduler-diagnostics
          diagnostic="${GITHUB_WORKSPACE}/.cat/work/temp/scheduler-diagnostics/result.log"
          cd scheduler-upstream
          arguments=(test //test/process_wrapper:compiler_scheduler_test)
          if [[ "$VARIANT" == baseline ]]; then
            arguments+=(--test_arg=configured_scheduler_must_be_available_before_compiler_starts --test_arg=--exact)
          fi
          set +e
          bazel "${arguments[@]}" --copt=-Wall --copt=-Wextra --copt=-Werror \
            --nocache_test_results --test_output=all --lockfile_mode=update 2>&1 | tee "$diagnostic"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$VARIANT" == native ]]; then
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            grep -F 'test result: ok. 4 passed;' "$diagnostic"
          else
            if [[ "$status" != 3 ]]; then exit 1; fi
            grep -F 'running 1 test' "$diagnostic"
            grep -F 'left: Some(0)' "$diagnostic"
            grep -F 'right: Some(125)' "$diagnostic"
          fi
      - name: Retain focused macOS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-scheduler-${{ matrix.runner }}-${{ matrix.variant }}
          path: .cat/work/temp/scheduler-diagnostics
          if-no-files-found: ignore
          retention-days: 1

  compiler-scheduler-tooling:
    if: inputs.focus == 'compiler-scheduler-tooling' || inputs.focus == 'compiler-scheduler-tooling-windows'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.focus == 'compiler-scheduler-tooling-windows' && '["windows-2022"]' || '["ubuntu-latest", "macos-15", "macos-15-intel", "windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ runner.os == 'macOS' && runner.arch == 'X64' && 'zulu' || 'temurin' }}
          java-version: '27'
      - uses: ./.github/actions/setup-msvc-env
        if: runner.os == 'Windows'
        with:
          target: x86_64-pc-windows-msvc
      - name: Exercise public compiler scheduler commands
        shell: bash
        run: |
          set -euo pipefail
          tooling/mvnw -q -pl distribution -am package \
            -Dtest=BazelCommandTest,BazelCommandsTest,ScheduleCompilersCommandTest,CompilerSchedulerHostTest,CompilerSchedulerServerTest,PhysicalCompilerMemoryTest,CompilerSchedulerTest,PackageSourceBuildsTest,DistributionMainTest,BazelCallerTest \
            -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify and cache the complete tooling runtime
        uses: ./.github/actions/setup-tooling
      - name: Retain compiler scheduler test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-scheduler-tooling-${{ matrix.runner }}
          path: |
            .cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
            .cat/work/temp/build-caches/maven/target/tooling-distribution/surefire-reports
          if-no-files-found: ignore
          retention-days: 1

  windows-arm-mxc-policy:
    if: inputs.focus == 'windows-arm-mxc-policy'
    needs: prepare-tooling
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          upstream-ref: 83086188ae0614bd882818ff1aa23f3194962012
          expected-upstream-commit: 83086188ae0614bd882818ff1aa23f3194962012
      - uses: ./.github/actions/setup-ci
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: aarch64-pc-windows-msvc
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
          common-setup-complete: 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Authenticate native runtime and prepared source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-arm-mxc'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne 'Arm64') { throw "Expected native ARM64 Windows, found $architecture" }
          @("os_architecture=$architecture", "process_architecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)", "os_version=$([Environment]::OSVersion.Version)") |
            Set-Content (Join-Path $evidence 'runtime.txt')
      - name: Apply bounded MXC policy inventory overlay
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-arm-mxc"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C upstream rev-parse HEAD)" = 83086188ae0614bd882818ff1aa23f3194962012
          git -C upstream diff --binary > "$evidence/prepared-queue.diff"
          cp .github/diagnostics/windows-mxc-sdk-policy.patch upstream/patches/windows_mxc_sdk_policy.patch
          git -C upstream apply --check ../.github/diagnostics/windows-mxc-policy.patch
          git -C upstream apply ../.github/diagnostics/windows-mxc-policy.patch
          git -C upstream diff --binary > "$evidence/instrumented-source.diff"
          {
            printf 'dispatch_head=%s\nupstream_commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$GITHUB_SHA" "$(git -C upstream rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'mxc_sdk_commit=6cd3d58f05d3447e67109cfb75e042803b843ca4\n'
            sha256sum .github/diagnostics/windows-mxc-policy.patch .github/diagnostics/windows-mxc-sdk-policy.patch
            find patches -type f -name '*.patch' -print0 | sort -z | xargs -0 sha256sum
            sha256sum upstream/MODULE.bazel upstream/patches/BUILD.bazel upstream/patches/windows_mxc_sdk_policy.patch
            sha256sum upstream/codex-rs/mxc-sandbox/src/native.rs upstream/codex-rs/exec-server/tests/exec_process.rs
          } > "$evidence/provenance.txt"
      - name: Rebuild and execute the exact MXC pipe regression
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-arm-mxc"
          cd upstream
          status=0
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:local_windows_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            --nocache_test_results --test_output=all --test_arg=--nocapture --test_arg=--exact \
            --test_arg=remote_windows_sandbox_process_accepts_process_write::test_case_2_mxc_pipe \
            -- //codex-rs/exec-server:exec-server-exec_process-test \
            2>&1 | tee "$evidence/console.log" || status=$?
          printf '%s\n' "$status" > "$evidence/bazel.status"
          log=bazel-testlogs/codex-rs/exec-server/exec-server-exec_process-test/test.log
          if [[ -f "$log" ]]; then
            cp "$log" "$evidence/test.log"
          fi
          # The inventory is emitted inside the actual MXC child launch path;
          # neither libtest's success line nor a capability skip proves execution.
          proof_status=0
          for marker in 'category=readwrite count=' 'category=readonly count=' 'category=deny count=' 'runner_spawn begin' 'control=exact indices=' 'control=filesystem_empty indices='; do
            if ! grep -F "MXC policy diagnostic: $marker" "$evidence/console.log" > /dev/null; then
              printf 'Missing MXC body evidence: %s\n' "$marker" >&2
              proof_status=1
            fi
          done
          if ! grep -E 'MXC policy diagnostic: runner_spawn (failed|child_created)' "$evidence/console.log" > /dev/null; then
            printf 'Missing MXC launch outcome evidence\n' >&2
            proof_status=1
          fi
          # Ask the maintained launcher for the owning output base; authenticate
          # the patched source actually materialized by crate_universe.
          startup_args=()
          if [[ -n "${BAZEL_OUTPUT_USER_ROOT:-}" ]]; then
            startup_args+=("--output_user_root=${BAZEL_OUTPUT_USER_ROOT}")
          fi
          if "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-with-buildbuddy.sh" "${startup_args[@]}" info output_base \
            > "$evidence/output-base.txt" 2> "$evidence/output-base.stderr"; then
            output_base="$(tr -d '\r' < "$evidence/output-base.txt")"
            sdk_matches=0
            for sdk_source in "$output_base"/external/*/src/backends/appcontainer/common/src/base_container_runner.rs; do
              if [[ -f "$sdk_source" && "$(sha256sum "$sdk_source" | cut -d' ' -f1)" == '6a6eb18ef01fbbbe51835194899342a517c6c57bac290df433ed8aec17739bae' ]]; then
                sdk_matches=$((sdk_matches + 1))
                sha256sum "$sdk_source" >> "$evidence/applied-sdk-source.sha256"
                cp "$sdk_source" "$evidence/applied-sdk-source.rs"
              fi
            done
            if [[ "$sdk_matches" -ne 1 ]]; then
              printf 'Expected one authenticated patched SDK source, found %s\n' "$sdk_matches" >&2
              proof_status=1
            fi
          else
            printf 'Could not authenticate materialized SDK source\n' >&2
            proof_status=1
          fi
          printf '%s\n' "$proof_status" > "$evidence/body-proof.status"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          exit "$proof_status"
      - name: Authenticate the compiled native ARM test executable
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:GITHUB_WORKSPACE 'upstream/bazel-bin/codex-rs/exec-server/exec-server-exec_process-test.exe'
          $receipt = Join-Path $env:RUNNER_TEMP 'windows-arm-mxc/test-binary.txt'
          if (-not (Test-Path -LiteralPath $binary)) {
            'binary_absent=true' | Set-Content $receipt
            throw 'The native test executable was not produced.'
          }
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($binary))
          try {
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'Expected a Windows test executable.' }
            $reader.BaseStream.Position = 0x3C
            $offset = $reader.ReadUInt32()
            $reader.BaseStream.Position = $offset
            if ($reader.ReadUInt32() -ne 0x4550) { throw 'Missing PE signature.' }
            $machine = $reader.ReadUInt16()
          } finally {
            $reader.Dispose()
          }
          @("machine=0x$($machine.ToString('x4'))", "sha256=$((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash)") | Set-Content $receipt
          if ($machine -ne 0xAA64) { throw 'Expected a native ARM64 test executable.' }
      - name: Retain authenticated source and native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm-mxc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-arm-mxc
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: error
          retention-days: 1
