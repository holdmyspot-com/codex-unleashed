name: Diagnose native Windows source paths

on:
  workflow_dispatch:
    inputs:
      native_regressions:
        description: Run the native Bazel integration checks after the compiler probe.
        type: boolean
        default: false
  push:
    branches: [update/latest-stable-dependencies]
    paths: [.github/workflows/diagnose-native-windows.yml]

permissions:
  contents: read

jobs:
  prepare-tooling:
    if: inputs.native_regressions == true
    uses: ./.github/workflows/prepare-tooling.yml
    with:
      runner: windows-2022

  native-regressions:
    needs: prepare-tooling
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check native and cross-build command construction
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          bash .github/scripts/test-bazel-msvc-pathmap.sh
          bash .github/scripts/test-bazel-cross-host.sh
      - name: Check PowerShell junction creation outside Bazel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP ('junction-probe-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path (Join-Path $directory 'target') -Force | Out-Null
          try {
            $env:CODEX_TEST_LINK = Join-Path $directory 'junction'
            $env:CODEX_TEST_TARGET = Join-Path $directory 'target'
            $elapsed = Measure-Command {
              & powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = ''Stop''; New-Item -ItemType Junction -Path $env:CODEX_TEST_LINK -Target $env:CODEX_TEST_TARGET | Out-Null'
              if ($LASTEXITCODE -ne 0) { throw 'PowerShell junction probe failed' }
            }
            Write-Output ('PowerShell junction creation seconds: ' + $elapsed.TotalSeconds)
            & powershell.exe -NoProfile -NonInteractive -Command '[Console]::WriteLine($PSHOME); [Console]::WriteLine($env:PSModulePath)'
            if ($LASTEXITCODE -ne 0) { throw 'PowerShell module-path probe failed' }
          } finally {
            Remove-Item -LiteralPath $directory -Recurse -Force
          }
      - name: Trace PowerShell module loading in the socket test environment
        shell: pwsh
        run: |
          $source = @'

          #[cfg(windows)]
          #[test]
          fn diagnostic_powershell_modules() {
              for name in ["PSModulePath", "SystemRoot", "USERPROFILE", "LOCALAPPDATA", "TEMP"] {
                  eprintln!("PowerShell diagnostic environment {name}={:?}", std::env::var_os(name));
              }
              for (phase, script) in [
                  ("paths", "[Console]::WriteLine($PSHOME); [Console]::WriteLine($env:PSModulePath)"),
                  ("management", "Import-Module Microsoft.PowerShell.Management -ErrorAction Stop; [Console]::WriteLine('management imported')"),
                  ("security", "Import-Module Microsoft.PowerShell.Security -ErrorAction Stop; [Console]::WriteLine('security imported')"),
              ] {
                  eprintln!("PowerShell diagnostic starting {phase}");
                  let output = std::process::Command::new("powershell.exe")
                      .args(["-NoProfile", "-NonInteractive", "-Command", script])
                      .output().expect("PowerShell diagnostic child");
                  eprintln!("PowerShell diagnostic {phase}: status={} stdout={} stderr={}",
                      output.status, String::from_utf8_lossy(&output.stdout), String::from_utf8_lossy(&output.stderr));
                  assert!(output.status.success(), "PowerShell diagnostic phase {phase}");
              }
          }
          '@
          Add-Content -LiteralPath upstream/codex-rs/uds/src/lib_tests.rs -Value $source -Encoding utf8
      - name: Verify AWS-LC consumers and reproduce socket tests
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --nocache_test_results --test_output=errors --test_arg=--nocapture \
            -- //codex-rs/http-client:http-client-unit-tests //codex-rs/uds:uds-unit-tests
      - name: Inspect the AWS-LC compiler response file
        if: failure()
        shell: pwsh
        run: |
          $response = 'upstream/bazel-out/windows_x86_64_msvc-fastbuild/bin/external/aws-lc+/_objs/crypto/bcm.obj.params'
          if (Test-Path -LiteralPath $response) {
            Get-Content -LiteralPath $response
          } else {
            throw ('Compiler response file is unavailable: ' + $response)
          }

  source-paths:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Inspect native compiler source-path behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1' -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe -ErrorAction Stop | Out-Null

          $root = Join-Path $env:RUNNER_TEMP ('native-source-paths-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            Set-Location $root
            New-Item -ItemType Directory -Path include | Out-Null
            Set-Content include/probe.h 'static const char *included_path = __FILE__;' -Encoding ASCII
            Set-Content main.c @('#include <stdio.h>', '#include <probe.h>', 'int main(void) { puts(included_path); return 0; }') -Encoding ASCII
            & cl.exe /nologo /WX /std:c11 ('/I' + (Join-Path $root 'include')) main.c /Febaseline.exe /Fobaseline.obj
            if ($LASTEXITCODE -ne 0) { throw 'Baseline compilation failed' }
            $baseline = & ./baseline.exe
            if ($LASTEXITCODE -ne 0) { throw 'Baseline execution failed' }
            Write-Output ('Baseline included-file macro: ' + $baseline)

            $response = @('/nologo', '/WX', '/std:c11', '/experimental:deterministic',
              ('/pathmap:' + $root.Replace('\', '/') + '=.'),
              ('/I"' + (Join-Path $root 'include') + '"'), 'main.c', '/Femapped.exe', '/Fomapped.obj')
            $unmappedResponse = $response.Clone()
            $unmappedResponse[4] = '/pathmap:' + $root.Replace('\', '\\') + '=.'
            Set-Content unmapped.rsp $unmappedResponse -Encoding ASCII
            & cl.exe '@unmapped.rsp'
            if ($LASTEXITCODE -ne 0) { throw 'Doubled-backslash compilation failed' }
            $unmapped = & ./mapped.exe
            if ($LASTEXITCODE -ne 0) { throw 'Doubled-backslash execution failed' }
            Write-Output ('Doubled-backslash included-file macro: ' + $unmapped)
            if ($unmapped.Contains($root) -eq $false) { throw 'Doubled backslashes did not reproduce the path leak' }

            Set-Content mapped.rsp $response -Encoding ASCII
            & cl.exe '@mapped.rsp'
            if ($LASTEXITCODE -ne 0) { throw 'Mapped compilation failed' }
            $mapped = & ./mapped.exe
            if ($LASTEXITCODE -ne 0) { throw 'Mapped execution failed' }
            Write-Output ('Mapped included-file macro: ' + $mapped)
            if ($mapped.Contains($root)) { throw 'Path mapping retained the absolute compilation root' }
            if ($mapped.Contains('probe.h') -eq $false) { throw 'Path mapping lost the source filename' }
          } finally {
            Set-Location $env:RUNNER_TEMP
            Remove-Item -LiteralPath $root -Recurse -Force
          }
