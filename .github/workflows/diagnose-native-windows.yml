          if [[ "$status" == 0 ]]; then
            grep -Fq 'test app::tests::session_lifecycle_requests::startup_defaults_tests::fresh_startup_falls_back_only_for_unsupported_config_read ... ok' \
              "$evidence/native.log" || status=1
