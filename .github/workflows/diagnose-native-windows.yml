name: Diagnose focused native regressions

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Focused native regression to investigate
        type: choice
        default: credentials
        options:
          - credentials
          - windows-test-timeouts
          - windows-lifecycle-source
          - windows-archive-extraction
          - windows-archived-failures
          - arm-daemon-lifecycle
          - arm-daemon-hashing
          - macos-tui-timeouts
          - macos-tui-integration-timeouts
          - macos-bazel-tui-timeouts
          - macos-bazel-dsym
          - compiler-profile
          - linker-profile
          - crate-local-profile
          - compiler-scheduler-baseline
          - compiler-scheduler-native
          - compiler-scheduler-macos
          - compiler-scheduler-tooling
          - compiler-scheduler-tooling-windows
          - windows-arm-tooling-locks
          - native-voice-runtime
          - linux-docker-scope
      source-run:
        description: Workflow run supplying compiled binaries for an archived-test diagnostic.
        type: string
        required: false

permissions:
  contents: read

jobs:
  linux-docker-scope:
    if: inputs.focus == 'linux-docker-scope'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare Docker access before and inside the build memory scope
        shell: bash
        run: |
          set -euo pipefail
          probe="$(cat <<'PROBE'
          set -uo pipefail
          id
          printf "Docker host: %s\nDocker context: %s\n" "${DOCKER_HOST:-unset}" "${DOCKER_CONTEXT:-unset}"
          docker context show
          stat -Lc "%a %u %g %n" /var/run/docker.sock
          docker info
          PROBE
          )"

          printf 'Direct runner context\n'
          set +e
          bash -c "$probe"
          direct_status=$?
          set -e
          printf 'Direct Docker probe status: %s\n' "$direct_status"

          printf 'Memory-scope context with the maintained runner identity options\n'
          set +e
          sudo -n --preserve-env systemd-run --scope --quiet --collect \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=MemorySwapMax=0 --property=OOMPolicy=continue \
            -- env "PATH=$PATH" "HOME=$HOME" bash -c "$probe"
          scope_status=$?
          set -e
          printf 'Scoped Docker probe status: %s\n' "$scope_status"
          test "$direct_status" -eq 0
          exit "$scope_status"

  native-voice-runtime:
    if: inputs.focus == 'native-voice-runtime'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    permissions:
      contents: read
    uses: ./.github/workflows/build-voice-runtime.yml
    secrets: inherit
    with:
      focus_target: ${{ matrix.target }}

  windows-arm-tooling-locks:
    if: inputs.focus == 'windows-arm-tooling-locks'
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          architecture: x64
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: aarch64-pc-windows-msvc
      - name: Exercise bundled runtime tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-arm-tooling-locks"
          set +e
          tooling/mvnw -q -pl distribution -am \
            -Dtest=DistributionMainTest,PackageCommandRuntimeTest,WindowsShardWorkflowTest \
            -Dsurefire.failIfNoSpecifiedTests=false verify \
            2>&1 | tee "$RUNNER_TEMP/windows-arm-tooling-locks/maven.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Inspect remaining runtime DLLs before cleanup
        if: failure() && steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          & .github/scripts/diagnose-windows-tooling-locks.ps1 `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-arm-tooling-locks')
      - name: Retain Windows ARM tooling failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm-tooling-locks
          path: |
            ${{ runner.temp }}/windows-arm-tooling-locks
            .cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
            .cat/work/temp/build-caches/maven/target/tooling-distribution/surefire-reports
          if-no-files-found: ignore
          retention-days: 1

  windows-archived-failures:
    if: inputs.focus == 'windows-archived-failures'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: ${{ matrix.runner }}
      artifact-id: windows-x64
      test-filter: '(package(codex-core) & test(subagent_stop_replaces_stop_and_skips_internal_subagents)) | (package(codex-utils-pty) & test(conpty_ctrl_c_interrupts_powershell_foreground_child)) | (package(codex-windows-sandbox) & (test(legacy_capture_cancellation_terminates_descendants_without_timeout) | test(legacy_capture_emits_output_and_preserves_descendant_after_normal_exit) | test(legacy_tty_job_terminates_and_preserves_descendants)))'

  windows-archive-extraction:
    if: inputs.focus == 'windows-archive-extraction'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: windows-2022
      artifact-id: windows-x64
      test-filter: 'package(codex-ansi-escape)'

  arm-daemon-hashing:
    if: inputs.focus == 'arm-daemon-hashing'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Compare executable hashing with and without package optimization
        shell: bash
        run: |
          set -euo pipefail
          probe_dir=$(mktemp -d "$RUNNER_TEMP/daemon-hashing-XXXXXX")
          trap 'rm -rf -- "$probe_dir"' EXIT
          export TMPDIR="$probe_dir/tmp"
          export CARGO_HOME="$probe_dir/cargo-home"
          export CARGO_TARGET_DIR="$probe_dir/target"
          mkdir -p "$probe_dir/src" "$TMPDIR"
          cat > "$probe_dir/Cargo.toml" <<'MANIFEST'
          [package]
          name = "daemon-hash-benchmark"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          blake3 = "=1.8.2"
          [profile.optimized-hash]
          inherits = "dev"
          [profile.optimized-hash.package.blake3]
          opt-level = 3
          MANIFEST
          cat > "$probe_dir/src/main.rs" <<'SOURCE'
          use std::io::Read;
          fn main() -> std::io::Result<()> {
              let bytes = 1024_u64 * 1024 * 1024;
              let start = std::time::Instant::now();
              let mut hasher = blake3::Hasher::new();
              hasher.update_reader(std::io::repeat(37).take(bytes))?;
              println!("bytes={bytes} elapsed={:?} digest={}", start.elapsed(), hasher.finalize());
              Ok(())
          }
          SOURCE
          rustc --version
          uname -m
          cd "$probe_dir"
          cargo run
          cargo run --profile optimized-hash

  arm-daemon-lifecycle:
    if: inputs.focus == 'arm-daemon-lifecycle'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: ubuntu-24.04-arm
      artifact-id: linux-arm64
      test-filter: 'binary(app_server_daemon) & (test(=managed_daemon_restarts_from_deleted_working_directory) | test(=managed_starts_ensure_one_updater_and_recover_a_missing_one) | test(=restart_applies_saved_updater_preference))'

  macos-tui-timeouts:
    if: inputs.focus == 'macos-tui-timeouts'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: macos-15-intel
      artifact-id: macos-x64
      test-filter: 'package(codex-tui) & (test(command_center_new_checkout_and_worktree_preserve_source_and_default_branch) | test(switching_back_replays_only_latest_compacted_conversation))'

  macos-tui-integration-timeouts:
    if: inputs.focus == 'macos-tui-integration-timeouts'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/diagnose-archived-tests.yml
    with:
      source-run: ${{ inputs.source-run }}
      runner: macos-15-intel
      artifact-id: macos-x64
      test-filter: 'package(codex-tui) & (test(history_lookup_uses_server_provider_with_local_and_embedded_servers) | test(automatic_reconnect_restores_draft_and_routes_new_notifications))'

  macos-bazel-dsym:
    if: inputs.focus == 'macos-bazel-dsym'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream

      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-apple-darwin
          cache-scope: bazel-test

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check dSYM diagnostic acceptance regressions
        shell: bash
        run: bash .github/scripts/diagnose-macos-bazel-dsym.sh --self-test "$RUNNER_TEMP"

      - name: Build Codex with hermetic native dSYM generation and verify its symbols
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash .github/scripts/diagnose-macos-bazel-dsym.sh "$GITHUB_WORKSPACE/upstream" "$RUNNER_TEMP/macos-bazel-dsym"

      - name: Retain native dSYM acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bazel-dsym-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-bazel-dsym
          if-no-files-found: warn
          retention-days: 1

      - name: Remove native dSYM evidence and build outputs after upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/macos-bazel-dsym"
          if [[ -n "${BAZEL_OUTPUT_BASE:-}" && -d "$BAZEL_OUTPUT_BASE" ]]; then
            cd "$GITHUB_WORKSPACE/upstream"
            bazel --output_base="$BAZEL_OUTPUT_BASE" shutdown
            chmod -R u+w "$BAZEL_OUTPUT_BASE"
            rm -rf -- "$BAZEL_OUTPUT_BASE"
          fi

  compiler-profile:
    if: inputs.focus == 'compiler-profile' || inputs.focus == 'linker-profile' || inputs.focus == 'crate-local-profile'
    permissions:
      actions: read
      attestations: write
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/profile-release-compiler.yml
    secrets: inherit
    with:
      upstream_tag: rust-v0.163.0
      focus_target: x86_64-unknown-linux-musl
      focus_bundle: primary
      build_only: true
      publish_npm: false
      ghcr_cache: true
      linker-lto: ${{ inputs.focus == 'linker-profile' }}
      crate-local-lto: ${{ inputs.focus == 'crate-local-profile' }}

  prepare-tooling:
    if: inputs.focus == 'credentials' || inputs.focus == 'windows-test-timeouts' || inputs.focus == 'macos-bazel-tui-timeouts' || inputs.focus == 'windows-lifecycle-source'
    uses: ./.github/workflows/prepare-tooling.yml
    with:
      runner: ${{ inputs.focus == 'macos-bazel-tui-timeouts' && 'macos-15-intel' || 'windows-2022' }}

  macos-bazel-tui-timeouts:
    if: inputs.focus == 'macos-bazel-tui-timeouts'
    needs: prepare-tooling
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-apple-darwin
          cache-scope: bazel-test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Reproduce terminal suites with the maintained Bazel runner
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs -- \
            test --test_tag_filters=-argument-comment-lint --test_verbose_timeout_warnings \
            --nocache_test_results "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" -- \
            //codex-rs/tui:tui-all-test //codex-rs/tui:tui-unit-tests

  windows-lifecycle-source:
    if: inputs.focus == 'windows-lifecycle-source'
    needs: prepare-tooling
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply lifecycle fixture and capture timing diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check ../.github/diagnostics/windows-lifecycle-fixtures.patch
          git -C upstream apply ../.github/diagnostics/windows-lifecycle-fixtures.patch
      - name: Rebuild and diagnose legacy Windows descendant lifecycles
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          program_files_windows="$(cygpath -w "${PROGRAMFILES:?PROGRAMFILES must identify the installed Windows program directory}")"
          powershell_windows="${program_files_windows}\PowerShell\7\pwsh.exe"
          powershell_unix="$(cygpath -u "$powershell_windows")"
          if [[ ! -f "$powershell_unix" ]]; then
            printf 'PowerShell 7 executable is missing: %s\n' "$powershell_windows" >&2
            exit 1
          fi
          printf 'Windows lifecycle PowerShell: %s\n' "$powershell_windows"
          mkdir -p "$RUNNER_TEMP/windows-lifecycle-source"
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            "--test_env=PROGRAMFILES=${program_files_windows}" \
            --nocache_test_results --test_output=all --test_arg=--nocapture \
            --test_arg=legacy_capture_cancellation_terminates_descendants_without_timeout \
            --test_arg=legacy_capture_emits_output_and_preserves_descendant_after_normal_exit \
            --test_arg=legacy_tty_job_terminates_and_preserves_descendants \
            -- //codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests \
            2>&1 | tee "$RUNNER_TEMP/windows-lifecycle-source/console.log"
          bash "${GITHUB_WORKSPACE}/.github/scripts/assert-windows-lifecycle-evidence.sh" \
            "$RUNNER_TEMP/windows-lifecycle-source/console.log"
      - name: Retain lifecycle source diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lifecycle-source-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/windows-lifecycle-source
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore
          retention-days: 1

  regressions:
    if: inputs.focus == 'credentials' || inputs.focus == 'windows-test-timeouts'
    needs: prepare-tooling
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Windows voice build prerequisites
        if: inputs.focus == 'windows-test-timeouts'
        working-directory: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content .github/scripts/voice-cygwin-snapshot.json -Raw | ConvertFrom-Json).archive
          $directory = Join-Path $env:RUNNER_TEMP 'voice-cygwin-snapshot'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Join-Path $directory $pin.name
          gh release download $pin.tag --repo openai/codex --pattern $pin.name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the pinned Windows voice archive failed.' }
          & ./.github/scripts/setup-voice-windows.ps1 -Target x86_64-pc-windows-msvc -SnapshotArchive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Installing the pinned Windows voice prerequisites failed.' }
      - name: Repeat complete credential regression target
        if: inputs.focus == 'credentials'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --nocache_test_results --runs_per_test=5 --test_output=errors \
            -- //codex-rs/model-provider:model-provider-unit-tests

      - name: Diagnose native test timeout boundaries
        if: inputs.focus == 'windows-test-timeouts'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --nocache_test_results --runs_per_test=5 --test_timeout=300 --test_output=all \
            --test_arg=--nocapture \
            -- //codex-rs/http-client:custom_ca_probe-bin-unit-tests \
            //codex-rs/voice-host:voice-host-installed_client-test

  compiler-scheduler-baseline:
    if: inputs.focus == 'compiler-scheduler-baseline' || inputs.focus == 'compiler-scheduler-native'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preserve the diagnostic patch independently of the verified driver
        shell: bash
        env:
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail
          mkdir -p .cat/work/temp/scheduler-diagnostics
          if [[ "$FOCUS" == compiler-scheduler-native ]]; then
            cp .github/diagnostics/compiler-scheduler-native.patch .cat/work/temp/scheduler-diagnostics/tests.patch
          else
            cp .github/diagnostics/compiler-scheduler-tests.patch .cat/work/temp/scheduler-diagnostics/tests.patch
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This pin supplies the exact verified driver independently of diagnostic edits.
          ref: 2d04175e11d005db8bb2ba90e00ad6ea3b9dacb6
          clean: false
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
        with:
          require-cache: 'true'
      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hermeticbuild/rules_rust
          ref: a20387a3b3e7baec859b53f3cb15b026fbc8a423
          path: scheduler-upstream
          persist-credentials: false
      - name: Apply standalone scheduler regression tests
        shell: bash
        run: |
          set -euo pipefail
          git -C scheduler-upstream apply ../.cat/work/temp/scheduler-diagnostics/tests.patch
      - name: Check native scheduler admission
        shell: bash
        env:
          USE_BAZEL_VERSION: 9.3.1
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail
          mkdir -p .cat/work/temp/scheduler-diagnostics
          diagnostic="${GITHUB_WORKSPACE}/.cat/work/temp/scheduler-diagnostics/baseline.log"
          cd scheduler-upstream
          arguments=()
          if [[ "$FOCUS" == compiler-scheduler-baseline ]]; then
            arguments+=(--test_arg=configured_scheduler_must_be_available_before_compiler_starts --test_arg=--exact)
          fi
          set +e
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-with-buildbuddy.sh" \
            test //test/process_wrapper:compiler_scheduler_test \
            "${arguments[@]}" \
            --nocache_test_results --test_output=all --lockfile_mode=update \
            2>&1 | tee "$diagnostic"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$FOCUS" == compiler-scheduler-native ]]; then
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            grep -F 'test result: ok. 4 passed;' "$diagnostic"
            printf 'Patched Windows admission, working-directory, pause/resume and retry checks pass.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$status" != 3 ]]; then
            printf 'Expected a behavioral test failure (3), got %s.\n' "$status" >&2
            exit 1
          fi
          grep -F 'running 1 test' "$diagnostic"
          grep -F 'configured_scheduler_must_be_available_before_compiler_starts ... FAILED' "$diagnostic"
          grep -F 'left: Some(0)' "$diagnostic"
          grep -F 'right: Some(125)' "$diagnostic"
          printf 'Unpatched native Windows compiler runs without scheduler admission.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain focused baseline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-scheduler-windows-baseline
          path: .cat/work/temp/scheduler-diagnostics
          if-no-files-found: ignore
          retention-days: 1

  compiler-scheduler-macos:
    if: inputs.focus == 'compiler-scheduler-macos'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        variant: [baseline, native]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      USE_BAZEL_VERSION: 9.3.1
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hermeticbuild/rules_rust
          ref: a20387a3b3e7baec859b53f3cb15b026fbc8a423
          path: scheduler-upstream
          persist-credentials: false
      - name: Apply the selected standalone native regression
        shell: bash
        run: |
          set -euo pipefail
          patch=compiler-scheduler-tests.patch
          if [[ "$VARIANT" == native ]]; then patch=compiler-scheduler-native.patch; fi
          git -C scheduler-upstream apply "../.github/diagnostics/$patch"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.30.0
          module-root: scheduler-upstream
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          output-base: ${{ github.workspace }}/.cat/work/temp/build-caches/native-scheduler/bazel-output
      - name: Check native macOS compiler control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cat/work/temp/scheduler-diagnostics
          diagnostic="${GITHUB_WORKSPACE}/.cat/work/temp/scheduler-diagnostics/result.log"
          cd scheduler-upstream
          arguments=(test //test/process_wrapper:compiler_scheduler_test)
          if [[ "$VARIANT" == baseline ]]; then
            arguments+=(--test_arg=configured_scheduler_must_be_available_before_compiler_starts --test_arg=--exact)
          fi
          set +e
          bazel "${arguments[@]}" --copt=-Wall --copt=-Wextra --copt=-Werror \
            --nocache_test_results --test_output=all --lockfile_mode=update 2>&1 | tee "$diagnostic"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$VARIANT" == native ]]; then
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            grep -F 'test result: ok. 4 passed;' "$diagnostic"
          else
            if [[ "$status" != 3 ]]; then exit 1; fi
            grep -F 'running 1 test' "$diagnostic"
            grep -F 'left: Some(0)' "$diagnostic"
            grep -F 'right: Some(125)' "$diagnostic"
          fi
      - name: Retain focused macOS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-scheduler-${{ matrix.runner }}-${{ matrix.variant }}
          path: .cat/work/temp/scheduler-diagnostics
          if-no-files-found: ignore
          retention-days: 1

  compiler-scheduler-tooling:
    if: inputs.focus == 'compiler-scheduler-tooling' || inputs.focus == 'compiler-scheduler-tooling-windows'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.focus == 'compiler-scheduler-tooling-windows' && '["windows-2022"]' || '["ubuntu-latest", "macos-15", "macos-15-intel", "windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ runner.os == 'macOS' && runner.arch == 'X64' && 'zulu' || 'temurin' }}
          java-version: '27'
      - uses: ./.github/actions/setup-msvc-env
        if: runner.os == 'Windows'
        with:
          target: x86_64-pc-windows-msvc
      - name: Exercise public compiler scheduler commands
        shell: bash
        run: |
          set -euo pipefail
          tooling/mvnw -q -pl distribution -am package \
            -Dtest=BazelCommandTest,BazelCommandsTest,ScheduleCompilersCommandTest,CompilerSchedulerHostTest,CompilerSchedulerServerTest,PhysicalCompilerMemoryTest,CompilerSchedulerTest,PackageSourceBuildsTest,DistributionMainTest,BazelCallerTest \
            -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify and cache the complete tooling runtime
        uses: ./.github/actions/setup-tooling
      - name: Retain compiler scheduler test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-scheduler-tooling-${{ matrix.runner }}
          path: |
            .cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
            .cat/work/temp/build-caches/maven/target/tooling-distribution/surefire-reports
          if-no-files-found: ignore
          retention-days: 1
