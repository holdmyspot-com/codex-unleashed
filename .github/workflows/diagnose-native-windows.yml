          path: |
            ${{ runner.temp }}/windows-conpty-fixture
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore
          retention-days: 1

  regressions:
    if: inputs.focus == 'credentials' || inputs.focus == 'windows-test-timeouts'
    needs: prepare-tooling
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Windows voice build prerequisites
        if: inputs.focus == 'windows-test-timeouts'
        working-directory: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content .github/scripts/voice-cygwin-snapshot.json -Raw | ConvertFrom-Json).archive
          $directory = Join-Path $env:RUNNER_TEMP 'voice-cygwin-snapshot'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Join-Path $directory $pin.name
          gh release download $pin.tag --repo openai/codex --pattern $pin.name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the pinned Windows voice archive failed.' }
          & ./.github/scripts/setup-voice-windows.ps1 -Target x86_64-pc-windows-msvc -SnapshotArchive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Installing the pinned Windows voice prerequisites failed.' }
      - name: Repeat complete credential regression target
        if: inputs.focus == 'credentials'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --nocache_test_results --runs_per_test=5 --test_output=errors \
            -- //codex-rs/model-provider:model-provider-unit-tests

      - name: Diagnose native test timeout boundaries
        if: inputs.focus == 'windows-test-timeouts'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --nocache_test_results --runs_per_test=5 --test_timeout=300 --test_output=all \
            --test_arg=--nocapture \
            -- //codex-rs/http-client:custom_ca_probe-bin-unit-tests \
            //codex-rs/voice-host:voice-host-installed_client-test

  compiler-scheduler-baseline:
    if: inputs.focus == 'compiler-scheduler-baseline' || inputs.focus == 'compiler-scheduler-native'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      USE_BAZEL_VERSION: 9.3.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preserve the diagnostic patch independently of the verified driver
        shell: bash
        env:
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail
          mkdir -p .cat/work/temp/scheduler-diagnostics
          if [[ "$FOCUS" == compiler-scheduler-native ]]; then
            cp .github/diagnostics/compiler-scheduler-native.patch .cat/work/temp/scheduler-diagnostics/tests.patch
          else
            cp .github/diagnostics/compiler-scheduler-tests.patch .cat/work/temp/scheduler-diagnostics/tests.patch
          fi
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hermeticbuild/rules_rust
          ref: a20387a3b3e7baec859b53f3cb15b026fbc8a423
          path: scheduler-upstream
          persist-credentials: false
      - name: Use a short normalized Windows Bazel output path
        id: scheduler_bazel_paths
        shell: bash
        run: |
          printf 'base=%s/bs\n' "$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.30.0
          module-root: scheduler-upstream
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          output-base: ${{ steps.scheduler_bazel_paths.outputs.base }}
      - name: Apply standalone scheduler regression tests
        shell: bash
        run: |
          set -euo pipefail
          git -C scheduler-upstream apply ../.cat/work/temp/scheduler-diagnostics/tests.patch
      - name: Check native scheduler admission
        shell: bash
        env:
          USE_BAZEL_VERSION: 9.3.1
          FOCUS: ${{ inputs.focus }}
          BAZEL_OUTPUT_BASE: ${{ steps.scheduler_bazel_paths.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p .cat/work/temp/scheduler-diagnostics
          diagnostic="${GITHUB_WORKSPACE}/.cat/work/temp/scheduler-diagnostics/baseline.log"
          cd scheduler-upstream
          arguments=()
          if [[ "$FOCUS" == compiler-scheduler-baseline ]]; then
            arguments+=(--test_arg=configured_scheduler_must_be_available_before_compiler_starts --test_arg=--exact)
          fi
          output_base="$BAZEL_OUTPUT_BASE"
          set +e
          bazel --client_debug "--output_base=$output_base" \
            test //test/process_wrapper:compiler_scheduler_test \
            "${arguments[@]}" \
            --nocache_test_results --test_output=all --lockfile_mode=update \
            2>&1 | tee "$diagnostic"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "${diagnostic%.log}.status"
          if [[ -f "$output_base/server/jvm.out" ]]; then
            tail -c 65536 "$output_base/server/jvm.out" > "${diagnostic%.log}-jvm.log"
          else
            printf 'No JVM log at configured output base: %s\n' "$output_base" > "${diagnostic%.log}-jvm.log"
          fi
          if [[ "$FOCUS" == compiler-scheduler-native ]]; then
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            grep -F 'test result: ok. 5 passed;' "$diagnostic"
            grep -F 'test denied_partial_suspension_terminates_the_attempt_before_retry ... ok' "$diagnostic"
            printf 'Patched Windows admission, working-directory, pause/resume, retry and denied-suspension checks pass.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$status" != 3 ]]; then
            printf 'Expected a behavioral test failure (3), got %s.\n' "$status" >&2
            exit 1
          fi
          grep -F 'running 1 test' "$diagnostic"
          grep -F 'configured_scheduler_must_be_available_before_compiler_starts ... FAILED' "$diagnostic"
          grep -F 'left: Some(0)' "$diagnostic"
          grep -F 'right: Some(125)' "$diagnostic"
          printf 'Unpatched native Windows compiler runs without scheduler admission.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain focused baseline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-scheduler-windows-baseline
          path: .cat/work/temp/scheduler-diagnostics
          if-no-files-found: ignore
          retention-days: 1

  compiler-scheduler-macos:
    if: inputs.focus == 'compiler-scheduler-macos'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        variant: [baseline, native]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      USE_BAZEL_VERSION: 9.3.1
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hermeticbuild/rules_rust
          ref: a20387a3b3e7baec859b53f3cb15b026fbc8a423
          path: scheduler-upstream
          persist-credentials: false
      - name: Apply the selected standalone native regression
        shell: bash
        run: |
          set -euo pipefail
          patch=compiler-scheduler-tests.patch
          if [[ "$VARIANT" == native ]]; then patch=compiler-scheduler-native.patch; fi
          git -C scheduler-upstream apply "../.github/diagnostics/$patch"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.30.0
          module-root: scheduler-upstream
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          output-base: ${{ github.workspace }}/.cat/work/temp/build-caches/native-scheduler/bazel-output
      - name: Check native macOS compiler control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cat/work/temp/scheduler-diagnostics
          diagnostic="${GITHUB_WORKSPACE}/.cat/work/temp/scheduler-diagnostics/result.log"
          cd scheduler-upstream
          arguments=(test //test/process_wrapper:compiler_scheduler_test)
          if [[ "$VARIANT" == baseline ]]; then
            arguments+=(--test_arg=configured_scheduler_must_be_available_before_compiler_starts --test_arg=--exact)
          fi
          set +e
          bazel "${arguments[@]}" --copt=-Wall --copt=-Wextra --copt=-Werror \
            --nocache_test_results --test_output=all --lockfile_mode=update 2>&1 | tee "$diagnostic"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$VARIANT" == native ]]; then
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            grep -F 'test result: ok. 4 passed;' "$diagnostic"
          else
            if [[ "$status" != 3 ]]; then exit 1; fi
            grep -F 'running 1 test' "$diagnostic"
            grep -F 'left: Some(0)' "$diagnostic"
            grep -F 'right: Some(125)' "$diagnostic"
          fi
      - name: Retain focused macOS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-scheduler-${{ matrix.runner }}-${{ matrix.variant }}
          path: .cat/work/temp/scheduler-diagnostics
          if-no-files-found: ignore
          retention-days: 1

  compiler-scheduler-tooling:
    if: inputs.focus == 'compiler-scheduler-tooling' || inputs.focus == 'compiler-scheduler-tooling-windows'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.focus == 'compiler-scheduler-tooling-windows' && '["windows-2022"]' || '["ubuntu-latest", "macos-15", "macos-15-intel", "windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ runner.os == 'macOS' && runner.arch == 'X64' && 'zulu' || 'temurin' }}
          java-version: '27'
      - uses: ./.github/actions/setup-msvc-env
        if: runner.os == 'Windows'
        with:
          target: x86_64-pc-windows-msvc
      - name: Exercise public compiler scheduler commands
        shell: bash
        run: |
          set -euo pipefail
          tooling/mvnw -q -pl distribution -am package \
            -Dtest=BazelCommandTest,BazelCommandsTest,ScheduleCompilersCommandTest,CompilerSchedulerHostTest,CompilerSchedulerServerTest,PhysicalCompilerMemoryTest,CompilerSchedulerTest,PackageSourceBuildsTest,DistributionMainTest,BazelCallerTest \
            -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify and cache the complete tooling runtime
        uses: ./.github/actions/setup-tooling
      - name: Retain compiler scheduler test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-scheduler-tooling-${{ matrix.runner }}
          path: |
            .cat/work/temp/build-caches/maven/target/tooling-cli/surefire-reports
            .cat/work/temp/build-caches/maven/target/tooling-distribution/surefire-reports
          if-no-files-found: ignore
          retention-days: 1

  windows-arm-mxc-policy:
    if: inputs.focus == 'windows-arm-mxc-policy'
    needs: prepare-tooling
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          upstream-ref: 83086188ae0614bd882818ff1aa23f3194962012
          expected-upstream-commit: 83086188ae0614bd882818ff1aa23f3194962012
      - uses: ./.github/actions/setup-ci
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: aarch64-pc-windows-msvc
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
          common-setup-complete: 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Authenticate native runtime and prepared source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-arm-mxc'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne 'Arm64') { throw "Expected native ARM64 Windows, found $architecture" }
          @("os_architecture=$architecture", "process_architecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)", "os_version=$([Environment]::OSVersion.Version)") |
            Set-Content (Join-Path $evidence 'runtime.txt')
      - name: Apply bounded MXC policy inventory overlay
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-arm-mxc"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C upstream rev-parse HEAD)" = 83086188ae0614bd882818ff1aa23f3194962012
          git -C upstream diff --binary > "$evidence/prepared-queue.diff"
          cp .github/diagnostics/windows-mxc-sdk-policy.patch upstream/patches/windows_mxc_sdk_policy.patch
          git -C upstream apply --check ../.github/diagnostics/windows-mxc-policy.patch
          git -C upstream apply ../.github/diagnostics/windows-mxc-policy.patch
          git -C upstream diff --binary > "$evidence/instrumented-source.diff"
          {
            printf 'dispatch_head=%s\nupstream_commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$GITHUB_SHA" "$(git -C upstream rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'mxc_sdk_commit=6cd3d58f05d3447e67109cfb75e042803b843ca4\n'
            sha256sum .github/diagnostics/windows-mxc-policy.patch .github/diagnostics/windows-mxc-sdk-policy.patch
            find patches -type f -name '*.patch' -print0 | sort -z | xargs -0 sha256sum
            sha256sum upstream/MODULE.bazel upstream/patches/BUILD.bazel upstream/patches/windows_mxc_sdk_policy.patch
            sha256sum upstream/codex-rs/mxc-sandbox/src/native.rs upstream/codex-rs/exec-server/tests/exec_process.rs
          } > "$evidence/provenance.txt"
      - name: Rebuild and execute the exact MXC pipe regression
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-arm-mxc"
          cd upstream
          status=0
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:local_windows_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            --nocache_test_results --test_output=all --test_arg=--nocapture --test_arg=--exact \
            --test_arg=remote_windows_sandbox_process_accepts_process_write::test_case_2_mxc_pipe \
            -- //codex-rs/exec-server:exec-server-exec_process-test \
            2>&1 | tee "$evidence/console.log" || status=$?
          printf '%s\n' "$status" > "$evidence/bazel.status"
          log=bazel-testlogs/codex-rs/exec-server/exec-server-exec_process-test/test.log
          if [[ -f "$log" ]]; then
            cp "$log" "$evidence/test.log"
          fi
          # The inventory is emitted inside the actual MXC child launch path;
          # neither libtest's success line nor a capability skip proves execution.
          proof_status=0
          for marker in 'category=readwrite count=' 'category=readonly count=' 'category=deny count=' 'runner_spawn begin' 'control=exact indices=' 'control=filesystem_empty indices='; do
            if ! grep -F "MXC policy diagnostic: $marker" "$evidence/console.log" > /dev/null; then
              printf 'Missing MXC body evidence: %s\n' "$marker" >&2
              proof_status=1
            fi
          done
          if ! grep -E 'MXC policy diagnostic: runner_spawn (failed|child_created)' "$evidence/console.log" > /dev/null; then
            printf 'Missing MXC launch outcome evidence\n' >&2
            proof_status=1
          fi
          # Ask the maintained launcher for the owning output base; authenticate
          # the patched source actually materialized by crate_universe.
          startup_args=()
          if [[ -n "${BAZEL_OUTPUT_USER_ROOT:-}" ]]; then
            startup_args+=("--output_user_root=${BAZEL_OUTPUT_USER_ROOT}")
          fi
          if "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-with-buildbuddy.sh" "${startup_args[@]}" info output_base \
            > "$evidence/output-base.txt" 2> "$evidence/output-base.stderr"; then
            output_base="$(tr -d '\r' < "$evidence/output-base.txt")"
            sdk_matches=0
            for sdk_source in "$output_base"/external/*/src/backends/appcontainer/common/src/base_container_runner.rs; do
              if [[ -f "$sdk_source" && "$(sha256sum "$sdk_source" | cut -d' ' -f1)" == '6a6eb18ef01fbbbe51835194899342a517c6c57bac290df433ed8aec17739bae' ]]; then
                sdk_matches=$((sdk_matches + 1))
                sha256sum "$sdk_source" >> "$evidence/applied-sdk-source.sha256"
                cp "$sdk_source" "$evidence/applied-sdk-source.rs"
              fi
            done
            if [[ "$sdk_matches" -ne 1 ]]; then
              printf 'Expected one authenticated patched SDK source, found %s\n' "$sdk_matches" >&2
              proof_status=1
            fi
          else
            printf 'Could not authenticate materialized SDK source\n' >&2
            proof_status=1
          fi
          printf '%s\n' "$proof_status" > "$evidence/body-proof.status"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          exit "$proof_status"
      - name: Authenticate the compiled native ARM test executable
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:GITHUB_WORKSPACE 'upstream/bazel-bin/codex-rs/exec-server/exec-server-exec_process-test.exe'
          $receipt = Join-Path $env:RUNNER_TEMP 'windows-arm-mxc/test-binary.txt'
          if (-not (Test-Path -LiteralPath $binary)) {
            'binary_absent=true' | Set-Content $receipt
            throw 'The native test executable was not produced.'
          }
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($binary))
          try {
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'Expected a Windows test executable.' }
            $reader.BaseStream.Position = 0x3C
            $offset = $reader.ReadUInt32()
            $reader.BaseStream.Position = $offset
            if ($reader.ReadUInt32() -ne 0x4550) { throw 'Missing PE signature.' }
            $machine = $reader.ReadUInt16()
          } finally {
            $reader.Dispose()
          }
          @("machine=0x$($machine.ToString('x4'))", "sha256=$((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash)") | Set-Content $receipt
          if ($machine -ne 0xAA64) { throw 'Expected a native ARM64 test executable.' }
      - name: Retain authenticated source and native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm-mxc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-arm-mxc
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: error
          retention-days: 1

  windows-arm-mxc-temp:
    if: inputs.focus == 'windows-arm-mxc-temp'
    needs: prepare-tooling
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          upstream-ref: 83086188ae0614bd882818ff1aa23f3194962012
          expected-upstream-commit: 83086188ae0614bd882818ff1aa23f3194962012
      - uses: ./.github/actions/setup-ci
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: aarch64-pc-windows-msvc
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
          common-setup-complete: 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Authenticate native runtime and prepared source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-arm-mxc-temp'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne 'Arm64') { throw "Expected native ARM64 Windows, found $architecture" }
          @("os_architecture=$architecture", "process_architecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)", "os_version=$([Environment]::OSVersion.Version)") |
            Set-Content (Join-Path $evidence 'runtime.txt')
      - name: Apply bounded MXC TEMP boundary overlay
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-arm-mxc-temp"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C upstream rev-parse HEAD)" = 83086188ae0614bd882818ff1aa23f3194962012
          git -C upstream diff --binary > "$evidence/prepared-queue.diff"
          cp .github/diagnostics/windows-mxc-sdk-temp.patch upstream/patches/windows_mxc_sdk_temp.patch
          git -C upstream apply --check ../.github/diagnostics/windows-mxc-temp.patch
          git -C upstream apply ../.github/diagnostics/windows-mxc-temp.patch
          git -C upstream diff --binary > "$evidence/instrumented-source.diff"
          {
            printf 'dispatch_head=%s\nupstream_commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$GITHUB_SHA" "$(git -C upstream rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'mxc_sdk_commit=6cd3d58f05d3447e67109cfb75e042803b843ca4\n'
            sha256sum .github/diagnostics/windows-mxc-temp.patch .github/diagnostics/windows-mxc-sdk-temp.patch
            find patches -type f -name '*.patch' -print0 | sort -z | xargs -0 sha256sum
            sha256sum upstream/MODULE.bazel upstream/patches/BUILD.bazel upstream/patches/windows_mxc_sdk_temp.patch
            sha256sum upstream/codex-rs/exec-server/src/local_process.rs upstream/codex-rs/mxc-sandbox/src/windows.rs upstream/codex-rs/exec-server/tests/exec_process/windows_sandbox.rs
          } > "$evidence/provenance.txt"
      - name: Verify native Bazel output-base path lookup before compiling
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-arm-mxc-temp"
          probe="$evidence/path-probe"
          trap 'rm -rf -- "$probe"' EXIT
          mkdir -p "$probe/external/sdk/src/backends/appcontainer/common/src"
          printf 'owned path lookup probe\n' > "$probe/external/sdk/src/backends/appcontainer/common/src/base_container_runner.rs"
          for spelling in mixed windows; do
            case "$spelling" in
              mixed) native="$(cygpath -m "$probe")" ;;
              windows) native="$(cygpath -w "$probe")" ;;
            esac
            printf '%s\r\n' "$native" > "$evidence/path-probe-$spelling.txt"
            output_base_windows="$(tr -d '\r' < "$evidence/path-probe-$spelling.txt")"
            output_base="$(cygpath -u "$output_base_windows")"
            matches=0
            for sdk_source in "$output_base"/external/*/src/backends/appcontainer/common/src/base_container_runner.rs; do
              if [[ -f "$sdk_source" ]]; then
                cmp "$sdk_source" "$probe/external/sdk/src/backends/appcontainer/common/src/base_container_runner.rs"
                matches=$((matches + 1))
              fi
            done
            test "$matches" -eq 1
            printf 'spelling=%s matched=1\n' "$spelling" >> "$evidence/path-normalization.txt"
          done
          rm -rf -- "$probe"
          trap - EXIT
      - name: Rebuild and execute the unchanged MXC TEMP regression
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-arm-mxc-temp"
          cd upstream
          status=0
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:local_windows_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            --nocache_test_results --test_output=all --test_arg=--nocapture --test_arg=--exact \
            --test_arg=windows_sandbox::tmpdir_uses_command_environment_over_rpc::test_case_1_mxc \
            -- //codex-rs/exec-server:exec-server-exec_process-test \
            2>&1 | tee "$evidence/console.log" || status=$?
          printf '%s\n' "$status" > "$evidence/bazel.status"
          log=bazel-testlogs/codex-rs/exec-server/exec-server-exec_process-test/test.log
          if [[ -f "$log" ]]; then
            cp "$log" "$evidence/test.log"
          fi
          # Each marker is emitted by the selected regression or its real launch path.
          # The original TEMP and filesystem assertions still determine test status.
          proof_status=0
          for marker in 'stage=prepared temp=' 'stage=decoded temp=' 'stage=pre_create_process temp=' 'stage=policy key=TEMP ' 'stage=policy key=TMP ' 'stage=files '; do
            if ! grep -F "MXC TEMP diagnostic: $marker" "$evidence/console.log" > /dev/null; then
              printf 'Missing MXC TEMP boundary evidence: %s\n' "$marker" >&2
              proof_status=1
            fi
          done
          # Ask the maintained launcher for the owning output base; authenticate
          # the patched source actually materialized by crate_universe.
          startup_args=()
          if [[ -n "${BAZEL_OUTPUT_USER_ROOT:-}" ]]; then
            startup_args+=("--output_user_root=${BAZEL_OUTPUT_USER_ROOT}")
          fi
          if "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-with-buildbuddy.sh" "${startup_args[@]}" info output_base \
            > "$evidence/output-base.txt" 2> "$evidence/output-base.stderr"; then
            output_base_windows="$(tr -d '\r' < "$evidence/output-base.txt")"
            output_base="$(cygpath -u "$output_base_windows")"
            printf '%s\n' "$output_base" > "$evidence/output-base.unix.txt"
            sdk_matches=0
            for sdk_source in "$output_base"/external/*/src/backends/appcontainer/common/src/base_container_runner.rs; do
              if [[ -f "$sdk_source" && "$(sha256sum "$sdk_source" | cut -d' ' -f1)" == '4f45a91e8d41bd77e6c28470fac6cbe72d25c68b4096fcbd6e25ff092c1815d8' ]]; then
                sdk_environment="$(dirname "$sdk_source")/appcontainer_runner.rs"
                if [[ ! -f "$sdk_environment" || "$(sha256sum "$sdk_environment" | cut -d' ' -f1)" != '319263b3b20bb2c4db973c9f1ac1b52be408b4dae7953eea81e4a892be80dd3a' ]]; then
                  continue
                fi
                sha256sum "$sdk_environment" >> "$evidence/applied-sdk-source.sha256"
                cp "$sdk_environment" "$evidence/applied-sdk-environment.rs"
                sdk_matches=$((sdk_matches + 1))
                sha256sum "$sdk_source" >> "$evidence/applied-sdk-source.sha256"
                cp "$sdk_source" "$evidence/applied-sdk-source.rs"
              fi
            done
            if [[ "$sdk_matches" -ne 1 ]]; then
              printf 'Expected one authenticated patched SDK source, found %s\n' "$sdk_matches" >&2
              proof_status=1
            fi
          else
            printf 'Could not authenticate materialized SDK source\n' >&2
            proof_status=1
          fi
          printf '%s\n' "$proof_status" > "$evidence/body-proof.status"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          exit "$proof_status"
      - name: Authenticate the compiled native ARM test executable
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:GITHUB_WORKSPACE 'upstream/bazel-bin/codex-rs/exec-server/exec-server-exec_process-test.exe'
          $receipt = Join-Path $env:RUNNER_TEMP 'windows-arm-mxc-temp/test-binary.txt'
          if (-not (Test-Path -LiteralPath $binary)) {
            'binary_absent=true' | Set-Content $receipt
            throw 'The native test executable was not produced.'
          }
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($binary))
          try {
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'Expected a Windows test executable.' }
            $reader.BaseStream.Position = 0x3C
            $offset = $reader.ReadUInt32()
            $reader.BaseStream.Position = $offset
            if ($reader.ReadUInt32() -ne 0x4550) { throw 'Missing PE signature.' }
            $machine = $reader.ReadUInt16()
          } finally {
            $reader.Dispose()
          }
          @("machine=0x$($machine.ToString('x4'))", "sha256=$((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash)") | Set-Content $receipt
          if ($machine -ne 0xAA64) { throw 'Expected a native ARM64 test executable.' }
      - name: Retain authenticated source and native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm-mxc-temp-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-arm-mxc-temp
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: error
          retention-days: 1
