        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-apple-darwin
          cache-scope: bazel-test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Reproduce terminal suites with the maintained Bazel runner
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs -- \
            test --test_tag_filters=-argument-comment-lint --test_verbose_timeout_warnings \
            --nocache_test_results "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" -- \
            //codex-rs/tui:tui-all-test //codex-rs/tui:tui-unit-tests

  prepare-windows-sandbox-fixture-tooling:
    if: inputs.focus == 'windows-sandbox-fixtures'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    uses: ./.github/workflows/prepare-tooling.yml
    with:
      runner: ${{ matrix.runner }}

  windows-sandbox-fixtures:
    if: inputs.focus == 'windows-sandbox-fixtures'
    needs: prepare-windows-sandbox-fixture-tooling
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            rust-arch: x86_64
            os-arch: X64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust-arch: aarch64
            os-arch: Arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          upstream-ref: 83086188ae0614bd882818ff1aa23f3194962012
          expected-upstream-commit: 83086188ae0614bd882818ff1aa23f3194962012
      - uses: ./.github/actions/setup-ci
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-test-windows-native-main
          common-setup-complete: 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify the native host and required PowerShell installation
        shell: pwsh
        env:
          EXPECTED_OS_ARCH: ${{ matrix.os-arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-sandbox-fixtures'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne $env:EXPECTED_OS_ARCH) { throw "Unexpected native OS architecture: $architecture" }
          if (-not $env:SystemRoot -or -not (Test-Path -LiteralPath $env:SystemRoot -PathType Container)) { throw 'SystemRoot is missing' }
          $powershell = Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'
          if (-not (Test-Path -LiteralPath $powershell -PathType Leaf)) { throw 'PowerShell 7 is missing' }
          @("os_architecture=$architecture", "process_architecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)", "os_version=$([Environment]::OSVersion.Version)") |
            Set-Content (Join-Path $evidence 'runtime.txt')
      - name: Require fixture prerequisites and compiled architecture inside each test target
        shell: bash
        env:
          DIRECT_TEST_OUTPUT: ${{ inputs.direct-test-output }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-sandbox-fixtures"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C upstream rev-parse HEAD)" = 83086188ae0614bd882818ff1aa23f3194962012
          git -C upstream diff --binary > "$evidence/prepared-queue.diff"
          git -C upstream apply --check ../.github/diagnostics/windows-sandbox-fixture-acceptance.patch
          git -C upstream apply ../.github/diagnostics/windows-sandbox-fixture-acceptance.patch
          if [[ "$DIRECT_TEST_OUTPUT" == true ]]; then
            printf '%s  %s\n' \
              'b491b3762c6c03a2fd171bacd64d1a9a6e415aeccb1688863fc7c56722296a9f' '.github/diagnostics/windows-libtest-direct-output.patch' | sha256sum --check
            git -C upstream apply --check ../.github/diagnostics/windows-libtest-direct-output.patch
            git -C upstream apply ../.github/diagnostics/windows-libtest-direct-output.patch
            sha256sum .github/diagnostics/windows-libtest-direct-output.patch > "$evidence/direct-output-overlay.sha256"
          fi
          git -C upstream diff --binary > "$evidence/instrumented-source.diff"
          {
            printf 'dispatch_head=%s\nupstream_commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$GITHUB_SHA" "$(git -C upstream rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            sha256sum .github/diagnostics/windows-sandbox-fixture-acceptance.patch
            sha256sum patches/holdmyspot-com/codex-unleashed/issue-61/zzzz-009{2,3}-*.patch
            sha256sum upstream/codex-rs/core/tests/windows_sandbox.rs upstream/codex-rs/windows-sandbox-rs/src/unified_exec/tests.rs
          } > "$evidence/provenance.txt"
      - name: Run helper identity, elevated regression and legacy PowerShell gates
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          EXPECTED_RUST_ARCH: ${{ matrix.rust-arch }}
          DIRECT_TEST_OUTPUT: ${{ inputs.direct-test-output }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-sandbox-fixtures"
          program_files_windows="$(cygpath -w "${PROGRAMFILES:?PROGRAMFILES is required}")"
          system_root_windows="$(cygpath -w "${SYSTEMROOT:?SYSTEMROOT is required}")"
          cd upstream
          direct_output_args=()
          if [[ "$DIRECT_TEST_OUTPUT" == true ]]; then
            direct_output_args=(--test_sharding_strategy=disabled --test_env=CODEX_WINDOWS_DIRECT_LIBTEST_LOG=1)
          fi
          for gate in helpers elevated legacy; do
            test_args=()
            target=//codex-rs/core:core-windows_sandbox-test
            case "$gate" in
              helpers) test_args=(--test_arg=helper_staging_tests::) ;;
              elevated) test_args=(--test_arg=--exact --test_arg=windows_elevated_unified_exec_enforces_large_recursive_deny_reads) ;;
              legacy)
                target=//codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests
                test_args=(--test_arg=--exact)
                for name in \
                  legacy_non_tty_powershell_interrupt_terminates_process \
                  legacy_capture_emits_output_and_preserves_descendant_after_normal_exit \
                  legacy_capture_cancellation_terminates_descendants_without_timeout \
                  legacy_tty_job_terminates_and_preserves_descendants \
                  legacy_tty_powershell_emits_output_and_accepts_input; do
                  test_args+=("--test_arg=unified_exec::tests::$name")
                done
                ;;
            esac
            status=0
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
              -- test --config=ci-windows-msvc --platforms=//:local_windows_msvc \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
              "--test_env=ProgramFiles=${program_files_windows}" "--test_env=SystemRoot=${system_root_windows}" \
              "--test_env=CODEX_WINDOWS_FIXTURE_EXPECTED_ARCH=${EXPECTED_RUST_ARCH}" \
              --nocache_test_results --flaky_test_attempts=1 --test_output=all --test_arg=--show-output \
              --test_arg=--test-threads=1 --test_arg=--format=pretty --test_arg=--color=never \
              "${direct_output_args[@]}" "${test_args[@]}" -- "$target" 2>&1 | tee "$evidence/$gate.log" || status=$?
            printf '%s\n' "$status" > "$evidence/$gate.status"

            raw_evidence="$evidence/$gate-raw"
            mkdir -p "$raw_evidence"
            target_log_path="${target#//}"
            target_log_path="${target_log_path/:/\/}"
            for artifact in test.log test.xml; do
              source_artifact="bazel-testlogs/$target_log_path/$artifact"
              if [[ -f "$source_artifact" ]]; then
                cp -- "$source_artifact" "$raw_evidence/$artifact"
                sha256sum "$raw_evidence/$artifact" >> "$raw_evidence/sha256.txt"
              else
                printf 'Raw Bazel test artifact unavailable: %s\n' "$source_artifact" \
                  >> "$raw_evidence/missing.txt"
              fi
            done
            if [[ "$DIRECT_TEST_OUTPUT" == true ]]; then
              bash "${GITHUB_WORKSPACE}/.github/scripts/diagnose-windows-test-output.sh" capture "$gate" "$target_log_path" "$evidence"
            fi
          done
          if [[ "$DIRECT_TEST_OUTPUT" == true ]]; then
            bash "${GITHUB_WORKSPACE}/.github/scripts/diagnose-windows-test-output.sh" identity "$evidence"
          fi
          bash "${GITHUB_WORKSPACE}/.github/scripts/assert-windows-sandbox-fixture-evidence.sh" "$evidence" "$EXPECTED_RUST_ARCH"
      - name: Retain focused Windows sandbox fixture acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sandbox-fixtures-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/windows-sandbox-fixtures
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: error
          retention-days: 1

  windows-lifecycle-source:
    if: inputs.focus == 'windows-lifecycle-source'
    needs: prepare-tooling
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply lifecycle fixture and capture timing diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check ../.github/diagnostics/windows-lifecycle-fixtures.patch
          git -C upstream apply ../.github/diagnostics/windows-lifecycle-fixtures.patch
      - name: Rebuild and diagnose legacy Windows descendant lifecycles
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          program_files_windows="$(cygpath -w "${PROGRAMFILES:?PROGRAMFILES must identify the installed Windows program directory}")"
          powershell_windows="${program_files_windows}\PowerShell\7\pwsh.exe"
          powershell_unix="$(cygpath -u "$powershell_windows")"
          if [[ ! -f "$powershell_unix" ]]; then
            printf 'PowerShell 7 executable is missing: %s\n' "$powershell_windows" >&2
            exit 1
          fi
          printf 'Windows lifecycle PowerShell: %s\n' "$powershell_windows"
          mkdir -p "$RUNNER_TEMP/windows-lifecycle-source"
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            "--test_env=PROGRAMFILES=${program_files_windows}" \
            --nocache_test_results --test_output=all --test_arg=--nocapture \
            --test_arg=legacy_capture_cancellation_terminates_descendants_without_timeout \
            --test_arg=legacy_capture_emits_output_and_preserves_descendant_after_normal_exit \
            --test_arg=legacy_tty_job_terminates_and_preserves_descendants \
            -- //codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests \
            2>&1 | tee "$RUNNER_TEMP/windows-lifecycle-source/console.log"
          bash "${GITHUB_WORKSPACE}/.github/scripts/assert-windows-lifecycle-evidence.sh" \
            "$RUNNER_TEMP/windows-lifecycle-source/console.log"
      - name: Retain lifecycle source diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lifecycle-source-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/windows-lifecycle-source
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore
          retention-days: 1

  windows-conpty-ctrl-c:
    if: inputs.focus == 'windows-conpty-ctrl-c'
    needs: prepare-tooling
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply source-owned ConPTY input diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check ../.github/diagnostics/windows-conpty-ctrl-c.patch
          git -C upstream apply ../.github/diagnostics/windows-conpty-ctrl-c.patch
          git -C upstream apply --check ../.github/diagnostics/windows-conpty-ctrl-c-inheritance.patch
          git -C upstream apply ../.github/diagnostics/windows-conpty-ctrl-c-inheritance.patch
      - name: Compare inherited, enabled, ignored, and prompt-gated Ctrl-C handling
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-conpty-ctrl-c"
          mkdir -p "$evidence"
          cd upstream
          for mode in inherited enabled ignored enabled-prompt; do
            status=0
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
              -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --test_verbose_timeout_warnings "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
              --test_env=CODEX_CONPTY_CTRL_C_DIAGNOSTIC=1 \
              "--test_env=CODEX_CONPTY_CTRL_C_INHERITANCE=$mode" \
              --nocache_test_results --test_output=all --test_arg=--nocapture \
              --test_arg=--exact \
              --test_arg=tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child \
              -- //codex-rs/utils/pty:pty-unit-tests \
              2>&1 | tee "$evidence/$mode.log" || status=$?
            printf '%s\n' "$status" > "$evidence/$mode.status"
          done
          for mode in inherited enabled ignored enabled-prompt; do
            log="$evidence/$mode.log"
            grep -F "conpty_diagnostic inheritance_mode=$mode setup=ok" "$log"
            grep -F 'normalized_bytes=[03] write=Ok(()) flush=Ok(())' "$log"
            grep -F 'normalized_bytes=[63, 6d, 64, 2e, 65, 78, 65, 20, 2f, 44, 20, 2f, 43, 20, 76, 65, 72, 0d] write=Ok(()) flush=Ok(())' "$log"
            grep -F 'stage=after_ver_wait root_has_exited=false root_exit_code=None' "$log"
            grep -Ei 'stage=readiness .*image="(pwsh|powershell)\.exe" query_ok=true exit_code=259' "$log"
            grep -Ei 'stage=readiness .*image="ping\.exe" query_ok=true exit_code=259' "$log"
            grep -Ei 'stage=after_ver_wait .*image="ping\.exe" query_ok=true exit_code=' "$log"
          done
          test "$(cat "$evidence/enabled-prompt.status")" = 0
          grep -F 'test result: ok. 1 passed; 0 failed;' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt captured_initial_prompt="PS ' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt phase=prompt observed elapsed_ns=' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt phase=ver observed elapsed_ns=' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt io=read elapsed_ns=' "$evidence/enabled-prompt.log"
          grep -F 'conpty_prompt io=write started_ns=' "$evidence/enabled-prompt.log"
          for mode in enabled enabled-prompt; do
            grep -Ei 'stage=after_ver_wait .*image="ping\.exe" query_ok=true exit_code=3221225786' "$evidence/$mode.log"
          done
          for mode in inherited ignored; do
            grep -Ei 'stage=after_ver_wait .*image="ping\.exe" query_ok=true exit_code=259' "$evidence/$mode.log"
          done
          for mode in inherited enabled ignored; do
            test "$(cat "$evidence/$mode.status")" != 0
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "$evidence/$mode.log"
            grep -E 'conpty_diagnostic resumption elapsed=.*result=Err\(timed out waiting for "Microsoft Windows"' "$evidence/$mode.log"
          done
          printf '%s\n' 'Prompt-gated enabled control passed; original three resumption controls still fail. Production repair remains unverified.'
      - name: Retain ConPTY control and process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-conpty-ctrl-c-windows-latest
          path: |
            ${{ runner.temp }}/windows-conpty-ctrl-c
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore
          retention-days: 1

