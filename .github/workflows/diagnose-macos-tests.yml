name: Diagnose macOS test deadlines

on:
  workflow_dispatch:

concurrency:
  group: diagnose-macos-tests-${{ github.ref_name }}
  cancel-in-progress: true

env:
  BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: "1"

jobs:
  deadlines:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-apple-darwin
          cache-scope: bazel-test

      - name: Diagnose suites exceeding their short deadlines
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            --print-failed-test-logs \
            -- \
            test \
            --jobs=2 \
            --test_timeout=300 \
            --test_output=all \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            --build_metadata=TAG_job=diagnose-macos-test-deadlines \
            -- \
            //codex-rs/exec-server:exec-server-unit-tests \
            //codex-rs/exec:exec-all-test \
            //codex-rs/cli:cli-app_server_daemon-test

      - name: Upload diagnostic execution logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-macos-test-deadlines
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
