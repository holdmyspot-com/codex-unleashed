name: Stable upstream Bazel Clippy

# Runs upstream's maintained Bazel Clippy selection with fatal warnings on Linux GNU, macOS ARM64 and Windows gnullvm.
# Linux and macOS split it into two package shards. Each shard used to compile V8 from source, about three hours on a
# macOS runner, so a shared-v8 job compiles it once per platform first, or confirms that GHCR already holds it, and the
# shards of that platform read it from GHCR. A failed shared-v8 job does not stop its shards, which then compile what
# they cannot read. The job steps are in bazel-clippy-job.yml.

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""

permissions:
  contents: read

jobs:
  shared-v8-linux:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/bazel-clippy-job.yml
    with:
      patches: ${{ inputs.patches }}
      role: shared-v8
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu

  lint-linux:
    needs: shared-v8-linux
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2"]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/bazel-clippy-job.yml
    with:
      patches: ${{ inputs.patches }}
      role: lint
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      shard: ${{ matrix.shard }}

  shared-v8-macos:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/bazel-clippy-job.yml
    with:
      patches: ${{ inputs.patches }}
      role: shared-v8
      runner: macos-15
      target: aarch64-apple-darwin

  lint-macos:
    needs: shared-v8-macos
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2"]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/bazel-clippy-job.yml
    with:
      patches: ${{ inputs.patches }}
      role: lint
      runner: macos-15
      target: aarch64-apple-darwin
      shard: ${{ matrix.shard }}

  lint-windows:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/bazel-clippy-job.yml
    with:
      patches: ${{ inputs.patches }}
      role: lint
      runner: windows-2025
      target: x86_64-pc-windows-gnullvm
