name: Diagnose Windows cache-helper process lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1
      - name: Measure fixed command lifecycle stages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'helper-process-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $evidence 'restart-commit')
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          $jcmd = Join-Path $env:JAVA_HOME 'bin/jcmd.exe'
          $cmd = Join-Path $env:SystemRoot 'System32/cmd.exe'
          $git = (Get-Command git.exe -CommandType Application | Select-Object -First 1).Source
          $source = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/diagnostics/windows-process/ProcessLifecycleProbe.java'
          python .github/scripts/diagnostics/windows-process/launch_process_probe.py `
            --java $java --jcmd $jcmd --cmd $cmd --git $git `
            --source $source --owned-parent $evidence
          exit $LASTEXITCODE
      - name: Compare Git standard input in one maintained inventory test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'helper-process-evidence'
          $temporary = Join-Path $env:RUNNER_TEMP 'helper-inventory-temp'
          New-Item -ItemType Directory -Path $temporary | Out-Null
          $originalJavaOptions = $env:JAVA_TOOL_OPTIONS
          $originalRedirectInput = $env:GIT_REDIRECT_STDIN
          foreach ($case in @('baseline', 'closed-stdin', 'null-stdin')) {
            $caseEvidence = Join-Path $evidence $case
            $recordings = Join-Path $caseEvidence 'recordings'
            New-Item -ItemType Directory -Path $recordings | Out-Null
            $env:GIT_REDIRECT_STDIN = $originalRedirectInput
            switch ($case) {
              'closed-stdin' { $env:GIT_REDIRECT_STDIN = 'off' }
              'null-stdin' { $env:GIT_REDIRECT_STDIN = 'NUL' }
            }
            $env:JAVA_TOOL_OPTIONS = "$originalJavaOptions -XX:StartFlightRecording=filename=$recordings,settings=profile,dumponexit=true"
            $env:GIT_TRACE2_PERF = Join-Path $caseEvidence 'git-trace.perf'
            mvn -B -ntp -f tooling/cli/pom.xml `
              '-Dtest=SourceInputInventoryTest#inventoriesWithoutGitRepository' `
              "-Dtooling.build.directory=$env:RUNNER_TEMP/helper-inventory-build" `
              "-Dmaven.repo.local=$env:RUNNER_TEMP/helper-inventory-maven" `
              "-Djava.io.tmpdir=$temporary" test 2>&1 | Tee-Object (Join-Path $caseEvidence 'inventory-test.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Retain diagnostic evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helper-process-${{ matrix.runner }}
          path: ${{ runner.temp }}/helper-process-evidence
          retention-days: 1
      - name: Remove owned diagnostic storage
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'helper-process-evidence'
          if (Test-Path -LiteralPath $evidence) {
            Remove-Item -LiteralPath $evidence -Recurse -Force
          }
          $temporary = Join-Path $env:RUNNER_TEMP 'helper-inventory-temp'
          if (Test-Path -LiteralPath $temporary) {
            Remove-Item -LiteralPath $temporary -Recurse -Force
          }
