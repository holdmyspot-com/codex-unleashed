name: Detect upstream release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-release-detection
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
      needed: ${{ steps.detect.outputs.needed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: detect
        name: Compare release tags (no compilation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/detect-upstream-release.py

  request-build:
    needs: detect
    # Maintainer decision: opt into automatic publishing with AUTO_RELEASE=true.
    if: needs.detect.outputs.needed == 'true' && vars.AUTO_RELEASE == 'true'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Request the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          GH_REPO: ${{ github.repository }}
          BUILD_REF: ${{ github.ref_name }}
        run: gh workflow run build-release.yml --ref "$BUILD_REF" -f upstream_tag="$UPSTREAM_TAG"
