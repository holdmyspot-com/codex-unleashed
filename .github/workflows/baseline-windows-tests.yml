name: Stable upstream Windows tests

# Runs a selected Cargo test set or an upstream PowerShell test script on a native Windows runner against the pinned
# upstream with downstream patches applied. A red phase can first restore production files to their state before the
# patches under test and require the same selection to fail, so the patched pass proves the patches fix it.

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      package:
        description: Optional space-separated Cargo packages to test with nextest
        type: string
        default: ""
      filter:
        description: Optional nextest expression; requires package
        type: string
        default: ""
      script:
        description: Optional upstream-relative PowerShell test script to run instead of a Cargo selection
        type: string
        default: ""
      red_restore:
        description: Space-separated upstream paths to withhold for a red phase that must fail before the patched run
        type: string
        default: ""
      red_patch_count:
        description: Number of trailing patches under test; the red phase restores red_restore paths to their state before them
        type: string
        default: "1"
      stress_count:
        description: Optional repeat count; requires a package other than --workspace and runs each selected test this many times under CPU load, with no retries
        type: string
        default: ""
      archive_run_id:
        description: Optional earlier run whose test archive to reuse instead of building one; its patches and upstream commit must match
        type: string
        default: ""
      target:
        description: Native Windows target from the existing free release matrix
        type: choice
        default: x86_64-pc-windows-msvc
        options: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]

  workflow_call:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      upstream_commit:
        description: Optional upstream commit to test instead of .github/upstream-commit
        type: string
        default: ""
      package:
        description: Space-separated Cargo packages to test with nextest, or --workspace for every package
        type: string
        default: ""
      target:
        description: Native Windows target
        type: string
        default: x86_64-pc-windows-msvc

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ (inputs.target == 'aarch64-pc-windows-msvc' && 'windows-11-arm') || 'windows-2025' }}
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      TARGET: ${{ inputs.target }}
      ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
      CARGO_CACHE_PARTS: '1'
      TEST_PACKAGE: ${{ inputs.package }}
      TEST_FILTER: ${{ inputs.filter }}
      TEST_SCRIPT: ${{ inputs.script }}
      RED_RESTORE: ${{ inputs.red_restore }}
      RED_PATCH_COUNT: ${{ inputs.red_patch_count }}
      STRESS_COUNT: ${{ inputs.stress_count }}
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_MIN_STACK: '8388608'
      GIT_REDIRECT_STDIN: NUL
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Own build state, evidence and temporary directories
        if: inputs.package != ''
        uses: ./.github/actions/focused-runtime-storage

      - name: Validate the selection and read the pinned upstream commit
        id: source
        env:
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          if [[ -n "$TEST_PACKAGE" && -n "$TEST_SCRIPT" ]] || [[ -z "$TEST_PACKAGE" && -z "$TEST_SCRIPT" ]]; then
            printf 'Select exactly one of package or script.\n' >&2
            exit 1
          fi
          if [[ -n "$TEST_FILTER" && -z "$TEST_PACKAGE" ]]; then
            printf 'filter requires package.\n' >&2
            exit 1
          fi
          if ! [[ "$RED_PATCH_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            printf 'red_patch_count must be a positive integer, not %s.\n' "$RED_PATCH_COUNT" >&2
            exit 1
          fi
          if [[ -n "$STRESS_COUNT" ]] && { ! [[ "$STRESS_COUNT" =~ ^[1-9][0-9]*$ ]] || [[ -z "$TEST_PACKAGE" || "$TEST_PACKAGE" == --workspace ]]; }; then
            printf 'stress_count must be a positive integer and requires a package other than --workspace, not %s.\n' "$STRESS_COUNT" >&2
            exit 1
          fi
          printf 'commit=%s\n' "${UPSTREAM_COMMIT:-$(cat .github/upstream-commit)}" >> "$GITHUB_OUTPUT"

      - name: Retrieve pristine selected upstream
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.source.outputs.commit }}
          path: upstream
          persist-credentials: false

      - name: Apply the selected downstream patches
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          # Upstream's CI tests main, whose workspace version is 0.0.0; a stable tag's release commit changes only that
          # version. Test the same source, so version strings in snapshots and fixtures match what upstream tested.
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' upstream/codex-rs/Cargo.toml
          if ! git -C upstream diff --quiet -- codex-rs/Cargo.toml; then
            git -C upstream -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          for patch in "${patch_paths[@]}"; do
            sha256sum "$patch"
            git -C upstream -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$GITHUB_WORKSPACE/$patch"
          done
          if [[ -n "$RED_RESTORE" ]] && (( ${#patch_paths[@]} < RED_PATCH_COUNT )); then
            printf 'red_patch_count %s exceeds the %s applied patches.\n' "$RED_PATCH_COUNT" "${#patch_paths[@]}" >&2
            exit 1
          fi

      - name: Read upstream's pinned Rust toolchain
        if: inputs.package != ''
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' upstream/codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up matching Rust
        if: inputs.package != ''
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ env.TARGET }}

      - name: Install upstream's nextest version
        if: inputs.package != ''
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103

      - name: Expose the matching MSVC environment
        if: inputs.package != ''
        uses: ./upstream/.github/actions/setup-msvc-env
        with:
          target: ${{ env.TARGET }}

      # The next three steps reproduce upstream's setup-ci effects for Windows. The composite action itself resolves
      # ./.github/scripts relative to the workspace root, which here holds the restart checkout rather than upstream.
      - name: Configure a Dev Drive for the build and temporary directories
        if: inputs.package != ''
        id: dev-drive
        continue-on-error: true
        shell: pwsh
        run: |
          # Upstream's script provisions a fixed 64 GB Dev Drive where the runner has no D: volume, and the hosted ARM64
          # runner filled it linking the workspace's test binaries. The VHD is dynamic, so size it from the free space
          # on C: instead; the script itself is otherwise run unchanged.
          $freeGb = [math]::Floor((Get-PSDrive C).Free / 1GB)
          $sizeGb = [math]::Min([math]::Max($freeGb - 12, 64), 240)
          Write-Output "C: has $freeGb GB free; a provisioned Dev Drive will be $sizeGb GB."
          $script = Join-Path $env:RUNNER_TEMP 'setup-dev-drive-sized.ps1'
          $text = Get-Content -Raw ./upstream/.github/scripts/setup-dev-drive.ps1
          if ($text -notmatch '\$SizeBytes = 64GB') { throw 'upstream setup-dev-drive.ps1 no longer sets a 64GB size' }
          Set-Content -Path $script -Value ($text -replace '\$SizeBytes = 64GB', "`$SizeBytes = ${sizeGb}GB")
          & $script

      - name: Point Cargo's target directory and the temporary directory at the Dev Drive
        if: inputs.package != '' && steps.dev-drive.outcome == 'success'
        run: |
          set -euo pipefail
          build_root="$CI_BUILD_ROOT"
          mkdir -p "$build_root/cargo-target" "$build_root/tmp"
          {
            printf 'CARGO_TARGET_DIR=%s\n' "$build_root/cargo-target"
            printf 'TEMP=%s\n' "$build_root/tmp"
            printf 'TMP=%s\n' "$build_root/tmp"
            printf 'TMPDIR=%s\n' "$build_root/tmp"
          } >> "$GITHUB_ENV"

      # As upstream's rust-ci-full-nextest-platform.yml: debug symbols for hundreds of test binaries exhaust the disk.
      - name: Build the test profile without debug information
        if: inputs.package != ''
        run: printf 'CARGO_PROFILE_CI_TEST_DEBUG=0\n' >> "$GITHUB_ENV"

      - name: Warn when no Dev Drive is available
        if: inputs.package != '' && steps.dev-drive.outcome != 'success'
        run: printf '::warning::Dev Drive setup failed on this runner; building and testing on the default volume.\n'

      - name: Configure curl retries for DotSlash
        if: inputs.package != ''
        run: mkdir -p "$RUNNER_TEMP/dotslash-curl" && echo retry-all-errors > "$RUNNER_TEMP/dotslash-curl/.curlrc"

      - name: Install DotSlash
        if: inputs.package != ''
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
        env:
          CURL_HOME: ${{ runner.temp }}/dotslash-curl

      # Some integration tests spawn DotSlash from a stable system path rather than the action-local PATH entry.
      - name: Make DotSlash available at a stable system path
        if: inputs.package != ''
        shell: pwsh
        run: Copy-Item (Get-Command dotslash).Source -Destination "$env:LOCALAPPDATA\Microsoft\WindowsApps\dotslash.exe"

      - name: Preserve the accepted x86-64 SQLite build configuration
        if: inputs.package != '' && inputs.target == 'x86_64-pc-windows-msvc'
        run: echo 'LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC' >> "$GITHUB_ENV"

      - name: Prepare verified V8 and bundled freshness tooling
        if: inputs.package != ''
        uses: ./.github/actions/focused-runtime-cache-setup

      - name: Set up the compiled-state cache transport
        if: inputs.package != ''
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1
          url: https://github.com/oras-project/oras/releases/download/v1.3.1/oras_1.3.1_windows_amd64.zip
          checksum: 8cf69e46f966e592ad36261c05b8f59c02125743b7261c03f6badc3919b40cb0

      - name: Authenticate private GHCR access
        if: inputs.package != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
          printf 'CARGO_CACHE_REPOSITORY=ghcr.io/%s/%s\n' "$owner" "$(cat .github/cargo-cache-package)" >> "$GITHUB_ENV"

      - name: Restore compiled dependencies and test outputs
        id: cache
        if: inputs.package != ''
        uses: ./.github/actions/test-compiled-cache-restore
        with:
          patches: ${{ inputs.patches }}
          workflow: .github/workflows/baseline-windows-tests.yml
          command-line: cargo nextest archive --target ${{ inputs.target }} --cargo-profile ci-test ${{ inputs.package }}

      - name: Download the earlier test archive
        if: inputs.package != '' && inputs.archive_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nextest-archive-${{ inputs.target }}
          path: ${{ runner.temp }}/nextest-archive
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ github.token }}

      - name: Export the archived sandbox helper paths
        if: inputs.package != '' && inputs.archive_run_id != ''
        run: |
          set -euo pipefail
          {
            printf 'CARGO_BIN_EXE_codex_windows_sandbox_setup=%s\n' "$(cygpath -w "$RUNNER_TEMP/nextest-archive/codex-windows-sandbox-setup.exe")"
            printf 'CARGO_BIN_EXE_codex_command_runner=%s\n' "$(cygpath -w "$RUNNER_TEMP/nextest-archive/codex-command-runner.exe")"
          } >> "$GITHUB_ENV"

      - name: Build the Windows sandbox helper binaries and export their paths
        if: inputs.package != '' && inputs.archive_run_id == ''
        run: |
          set -euo pipefail
          cd upstream/codex-rs
          cargo build --target "$TARGET" --profile ci-test -p codex-windows-sandbox \
            --bin codex-windows-sandbox-setup --bin codex-command-runner
          target_dir="${CARGO_TARGET_DIR:-$PWD/target}/$TARGET/ci-test"
          # Keep copies beside the test archive so a rerun can reuse both.
          mkdir -p "$RUNNER_TEMP/nextest-archive"
          cp "$target_dir/codex-windows-sandbox-setup.exe" "$target_dir/codex-command-runner.exe" "$RUNNER_TEMP/nextest-archive/"
          {
            printf 'CARGO_BIN_EXE_codex_windows_sandbox_setup=%s\n' "$(cygpath -w "$target_dir/codex-windows-sandbox-setup.exe")"
            printf 'CARGO_BIN_EXE_codex_command_runner=%s\n' "$(cygpath -w "$target_dir/codex-command-runner.exe")"
          } >> "$GITHUB_ENV"

      - name: Write the selected test command
        run: |
          set -euo pipefail
          # Keep passing tests' output in the JUnit report, where the skip check reads it.
          printf '%s\n' '[profile.default.junit]' 'store-success-output = true' 'store-failure-output = true' \
            > "$RUNNER_TEMP/nextest-keep-output.toml"
          {
            printf '#!/usr/bin/env bash\nset -euo pipefail\n'
            if [[ -n "$TEST_SCRIPT" ]]; then
              printf 'cd "%s/upstream"\n' "$GITHUB_WORKSPACE"
              printf 'pwsh -NoProfile -NonInteractive -File %q\n' "$TEST_SCRIPT"
            else
              printf 'cd "%s/upstream/codex-rs"\n' "$GITHUB_WORKSPACE"
              printf 'archive=${1:?archive path}\n'
              build_args=(cargo nextest archive --target "$TARGET" --cargo-profile ci-test)
              run_args=(cargo nextest run --archive-file ARCHIVE_WINDOWS --workspace-remap "$(cygpath -w "$GITHUB_WORKSPACE/upstream/codex-rs")"
                --test-threads 8 --no-fail-fast
                --tool-config-file "keep-output:$(cygpath -w "$RUNNER_TEMP/nextest-keep-output.toml")")
              if [[ "$TEST_PACKAGE" == --workspace ]]; then
                # voice-host links GStreamer through pkg-config, which hosted Windows runners cannot provide; the
                # native voice runtime is covered by the Bazel and release builds.
                build_args+=(--workspace --exclude codex-voice-host)
              else
                read -r -a packages <<< "$TEST_PACKAGE"
                for package in "${packages[@]}"; do build_args+=(-p "$package"); done
              fi
              if [[ -n "$TEST_FILTER" ]]; then run_args+=(-E "$TEST_FILTER"); fi
              printf 'archive_windows=$(cygpath -w "$archive")\n'
              # Build the tests once into an archive; a rerun that supplies the archive skips the build.
              printf 'if [[ ! -f "$archive" ]]; then\n  mkdir -p "$(dirname "$archive")"\n  '
              printf '%q ' "${build_args[@]}"
              printf -- '--archive-file "$archive_windows"\nfi\n'
              if [[ -n "$STRESS_COUNT" ]]; then
                run_args+=(--stress-count "$STRESS_COUNT" --retries 0)
                # Load every CPU only while the tests run, not while the archive builds.
                printf 'for _ in $(seq "$(nproc)"); do yes > /dev/null & done\n'
                printf "trap 'kill \$(jobs -p) 2>/dev/null || true' EXIT\n"
              fi
              printf '%q ' "${run_args[@]}" | sed 's/ARCHIVE_WINDOWS/"$archive_windows"/'
              printf '\n'
            fi
          } > "$RUNNER_TEMP/selected-test.sh"
          cat "$RUNNER_TEMP/selected-test.sh"

      - name: Require the selection to fail without the production changes
        if: inputs.red_restore != ''
        run: |
          set -euo pipefail
          read -r -a red_paths <<< "$RED_RESTORE"
          git -C upstream checkout "HEAD~$RED_PATCH_COUNT" -- "${red_paths[@]}"
          set +e
          # The red phase compiles different sources, so it builds its own archive.
          bash "$RUNNER_TEMP/selected-test.sh" "$RUNNER_TEMP/red-archive/tests.tar.zst"
          result=$?
          set -e
          git -C upstream checkout HEAD -- "${red_paths[@]}"
          rm -rf "$RUNNER_TEMP/red-archive"
          if (( result == 0 )); then
            printf 'The selection passed with the production changes withheld, so it does not prove the patches.\n' >&2
            exit 1
          fi
          printf 'The selection failed with exit %s without the production changes.\n' "$result"

      - name: Run the selection with the patches applied
        id: tests
        run: |
          set -euo pipefail
          git -C upstream diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'
          set +e
          bash "$RUNNER_TEMP/selected-test.sh" "$RUNNER_TEMP/nextest-archive/tests.tar.zst"
          status=$?
          set -e
          # Nextest exits 100 when tests failed. A whole-workspace run is judged by the comparison with the unpatched
          # baseline below (an unpatched run records that baseline), so those failures alone do not fail this step.
          # Any other failure, such as a full disk or a build error, does.
          if [[ "$status" == 100 && "$TEST_PACKAGE" == --workspace && -z "$TEST_FILTER" ]]; then
            printf 'Nextest reported failing tests; the baseline comparison decides the outcome.\n'
            exit 0
          fi
          exit "$status"

      - name: Keep the test archive for reruns
        if: ${{ !cancelled() && inputs.package != '' && inputs.archive_run_id == '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: nextest-archive-${{ inputs.target }}
          path: ${{ runner.temp }}/nextest-archive
          retention-days: 3
          if-no-files-found: ignore

      - name: Save compiled dependencies and test outputs
        if: ${{ always() && inputs.package != '' && inputs.archive_run_id == '' && steps.cache.outcome == 'success' }}
        uses: ./.github/actions/test-compiled-cache-save
        with:
          tag: ${{ steps.cache.outputs.tag }}
          seed-tag: ${{ steps.cache.outputs.seed-tag }}
          build-succeeded: ${{ hashFiles(format('{0}/nextest-archive/tests.tar.zst', runner.temp)) != '' }}

      - name: Fail on tests that skipped themselves for missing setup
        if: ${{ !cancelled() }}
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          reports=()
          # An archive run stores its reports under the extraction directory, wherever nextest placed it.
          while IFS= read -r report; do reports+=("$report"); done < <(
            find "$(cygpath -u "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/upstream/codex-rs/target}")" "$GITHUB_WORKSPACE/upstream/codex-rs/target" "$(cygpath -u "$RUNNER_TEMP")" \
              -path '*/nextest/*' -name junit.xml 2>/dev/null | sort -u)
          printf 'Found %s nextest report(s).\n' "${#reports[@]}"
          if (( ${#reports[@]} == 0 )); then
            # A build that failed before nextest ran leaves nothing to check; a passing test step with no reports would be a vacuous check.
            if [[ "$TESTS_OUTCOME" == success ]]; then printf '::error::The tests passed but wrote no nextest report.\n'; exit 1; fi
            printf 'The test step ended %s before any report was written; nothing to check.\n' "$TESTS_OUTCOME"
            exit 0
          fi
          python .github/scripts/check-test-skips.py --platform windows "${reports[@]}"

      - name: Compare the failures with the committed unpatched baseline
        if: ${{ !cancelled() && inputs.package == '--workspace' && inputs.filter == '' }}
        env:
          UPSTREAM_COMMIT: ${{ steps.source.outputs.commit }}
          PATCHES: ${{ inputs.patches }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          platform="windows-${TARGET%%-*}"
          reports=()
          # An archive run stores its reports under the extraction directory, wherever nextest placed it.
          while IFS= read -r report; do reports+=("$report"); done < <(
            find "$(cygpath -u "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/upstream/codex-rs/target}")" "$GITHUB_WORKSPACE/upstream/codex-rs/target" "$(cygpath -u "$RUNNER_TEMP")" \
              -path '*/nextest/*' -name junit.xml 2>/dev/null | sort -u)
          printf 'Found %s nextest report(s).\n' "${#reports[@]}"
          if (( ${#reports[@]} == 0 )); then
            # A build that failed before nextest ran leaves nothing to check; a passing test step with no reports would be a vacuous check.
            if [[ "$TESTS_OUTCOME" == success ]]; then printf '::error::The tests passed but wrote no nextest report.\n'; exit 1; fi
            printf 'The test step ended %s before any report was written; nothing to check.\n' "$TESTS_OUTCOME"
            exit 0
          fi
          if [[ -z "${PATCHES// }" ]]; then
            # An unpatched run is the source of a baseline: write it for committing under docs/test-baselines.
            mkdir -p "$RUNNER_TEMP/baseline"
            python .github/scripts/compare-test-baseline.py --platform "$platform" --upstream-commit "$UPSTREAM_COMMIT" \
              --write-baseline --output "$RUNNER_TEMP/baseline/$platform.json" "${reports[@]}"
          else
            python .github/scripts/compare-test-baseline.py --platform "$platform" --upstream-commit "$UPSTREAM_COMMIT" \
              --baseline-dir docs/test-baselines "${reports[@]}"
          fi

      - name: Upload the unpatched baseline
        if: ${{ !cancelled() && inputs.package == '--workspace' && inputs.filter == '' && inputs.patches == '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: test-baseline-windows-${{ inputs.target }}
          path: ${{ runner.temp }}/baseline
          retention-days: 3
          if-no-files-found: ignore
