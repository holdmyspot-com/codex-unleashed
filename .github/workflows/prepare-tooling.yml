name: Prepare verified tooling

on:
  workflow_call:
    inputs:
      runner:
        description: Native host whose verified runtime subsequent jobs reuse.
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-tooling
