name: rust-release

on:
  push:
    tags:
      - "rust-v*.*.*"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional upstream tag override. Defaults to the pushed rust-v* tag."
        required: false
        type: string
      build_number:
        description: "Optional vendor build number. Defaults to the workflow run number."
        required: false
        type: string
      ghcr_cache:
        description: "Use the public GHCR Cargo target overflow cache. Disable only for cache diagnostics."
        required: false
        default: true
        type: boolean
      publish_npm:
        description: "Publish the npm packages associated with the release."
        required: false
        default: true
        type: boolean

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag || '' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_UPSTREAM_TAG}" ]]; then
            upstream_tag="${INPUT_UPSTREAM_TAG}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^rust-v[0-9] ]]; then
            upstream_tag="${GITHUB_REF_NAME%%+*}"
          else
            echo "Could not resolve upstream tag." >&2
            exit 1
          fi
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    uses: ./.github/workflows/build-release.yml
    with:
      upstream_tag: ${{ needs.resolve.outputs.upstream_tag }}
      build_number: ${{ inputs.build_number || '' }}
      ghcr_cache: ${{ inputs.ghcr_cache || false }}
      publish_npm: ${{ github.event_name == 'push' || inputs.publish_npm }}
    secrets: inherit
