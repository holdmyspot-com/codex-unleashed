name: Focused upstream Linux runtime

on:
  push:
    branches: [main.new]
    paths: [.github/workflows/baseline-linux-focused-runtime.yml]
  workflow_dispatch:
    inputs:
      public_key:
        description: Public SSH key for the client that connects before testing
        required: true
        type: string
      target:
        description: Native GNU Linux runtime target on a free hosted runner
        type: choice
        default: aarch64-unknown-linux-gnu
        options: [aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ (inputs.target == 'aarch64-unknown-linux-gnu' && 'ubuntu-24.04-arm') || 'ubuntu-24.04' }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.target }}
      cancel-in-progress: false
      queue: max
    env:
      TARGET: ${{ inputs.target }}
      CODEX_CI_TARGET: ${{ inputs.target }}
      CODEX_CI_PROFILE: ci-test
      CARGO_INCREMENTAL: '0'
      CARGO_CACHE_PARTS: '1'
      RUST_BACKTRACE: '1'
      RUST_LIB_BACKTRACE: '0'
      RUST_MIN_STACK: '8388608'
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Read exact source and runner selection
        id: source
        run: |
          set -euo pipefail
          case "$TARGET" in
            aarch64-unknown-linux-gnu) printf 'CARGO_BUILD_JOBS=1\n' >> "$GITHUB_ENV" ;;
            x86_64-unknown-linux-gnu) ;;
            *) printf 'Unsupported native Linux target: %s\n' "$TARGET" >&2; exit 1 ;;
          esac
          printf 'commit=%s\n' "$(cat .github/upstream-commit)" >> "$GITHUB_OUTPUT"

      - name: Retrieve pristine selected upstream
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.source.outputs.commit }}
          path: upstream
          persist-credentials: false

      - name: Prepare upstream's native test host
        uses: ./upstream/.github/actions/setup-ci

      - name: Own build state through later remote-session cleanup
        uses: ./.github/actions/focused-runtime-storage

      - name: Match upstream's daemon-test hashing optimization
        run: |
          set -euo pipefail
          test ! -e "$CARGO_HOME/config.toml"
          printf '[profile.ci-test.package.blake3]\nopt-level = 3\n' > "$CARGO_HOME/config.toml"

      - name: Set up matching Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          targets: ${{ env.TARGET }}

      - name: Install upstream's nextest version
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          prefix-key: upstream-${{ steps.source.outputs.commit }}-downloads-v1
          workspaces: upstream/codex-rs -> ${{ env.CARGO_TARGET_DIR }}
          cache-targets: false
          cache-bin: false
          add-rust-environment-hash-key: false
          shared-key: ${{ env.TARGET }}

      - name: Set up existing private cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Authenticate private GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
          printf 'CARGO_CACHE_REPOSITORY=ghcr.io/%s/%s\n' "$owner" "$(cat .github/cargo-cache-package)" >> "$GITHUB_ENV"

      - name: Connect before the changed remote commands
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.public_key }}

      - name: Wait for authenticated client readiness
        run: |
          set -euo pipefail
          deadline=$((SECONDS+600))
          until [[ -f "$FOCUSED_RUNTIME/client-ready" ]]; do
            if (( SECONDS >= deadline )); then
              printf 'The authenticated client did not publish readiness within ten minutes.\n' >&2
              exit 1
            fi
            sleep 2
          done

      - name: Install native Linux test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap bison flex strace
          {
            uname -a
            nproc
            free -h
            df -h / "$FOCUSED_RUNTIME"
            cmake --version
          } > "$FOCUSED_RUNTIME/evidence/platform.txt"

      - name: Prepare verified V8 and bundled freshness tooling
        uses: ./.github/actions/focused-runtime-cache-setup

      - name: Identify profile-specific compiled state
        id: cache
        run: |
          set -euo pipefail
          evidence="$FOCUSED_RUNTIME/evidence"
          cp .github/upstream-commit "$evidence/upstream-commit"
          cp upstream/codex-rs/Cargo.lock "$evidence/upstream-Cargo.lock"
          git -C upstream diff --exit-code HEAD
          test -z "$(git -C upstream status --porcelain)"
          shasum -a 256 .github/workflows/baseline-linux-focused-runtime.yml > "$evidence/wrappers.txt"
          shasum -a 256 .github/scripts/ghcr-cargo-target-cache.sh .github/scripts/cargo-cache-parts.py .github/scripts/verify-cargo-lock.py > "$evidence/helpers-transport-only.txt"
          cp "$evidence/helpers-transport-only.txt" "$evidence/helpers.txt"
          git ls-files -z -- tooling/cli/pom.xml tooling/cli/src/main tooling/cli/src/build .github/actions/focused-runtime-cache-setup | LC_ALL=C sort -z | xargs -0 shasum -a 256 >> "$evidence/helpers.txt"
          {
            rustc -vV
            cargo --version
            cargo nextest --version
            printf 'profile=ci-test\ntarget=%s\n' "$TARGET"
            printf 'scope=required native CLI/app-server runtime tests; retained client controls incremental execution\n'
            printf '%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}"
            env | LC_ALL=C sort | grep -E '^(RUSTFLAGS|RUSTDOCFLAGS|RUSTC|RUSTC_WRAPPER|CARGO_INCREMENTAL|CARGO_PROFILE_[A-Z0-9_]+|CARGO_BUILD_RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|CC|CXX|AR|CFLAGS|CXXFLAGS|SDKROOT|MACOSX_DEPLOYMENT_TARGET)='
            shasum -a 256 upstream/codex-rs/Cargo.lock upstream/codex-rs/rust-toolchain.toml upstream/codex-rs/Cargo.toml
            printf '\n'
            cat "$CARGO_HOME/config.toml"
          } > "$evidence/compiler.txt"
          python3 .github/scripts/cargo-cache-keys.py "$TARGET" "$evidence/upstream-commit" "$evidence/wrappers.txt" "$evidence/helpers.txt" "$evidence/compiler.txt" | tee "$evidence/keys.txt" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/cargo-cache-keys.py "$TARGET" "$evidence/upstream-commit" "$evidence/wrappers.txt" "$evidence/helpers-transport-only.txt" "$evidence/compiler.txt" | sed -n 's/^seed_tag=/legacy_seed_tag=/p' >> "$GITHUB_OUTPUT"

      - name: Restore verified or partial compiled state
        id: restore
        env:
          CACHE_TAG: ${{ steps.cache.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache.outputs.seed_tag }}
          LEGACY_CACHE_SEED_TAG: ${{ steps.cache.outputs.legacy_seed_tag }}
        run: |
          set -euo pipefail
          for tag in "$CACHE_TAG" "$CACHE_SEED_TAG" "$LEGACY_CACHE_SEED_TAG"; do
            for operation in pull pull-partial; do
              set +e
              bash .github/scripts/ghcr-cargo-target-cache.sh "$operation" "$CARGO_CACHE_REPOSITORY" "$tag" "$CARGO_TARGET_DIR" "$(cat .github/upstream-ref)" 2>&1 | tee -a "$FOCUSED_RUNTIME/evidence/restore.log"
              result=${PIPESTATUS[0]}
              set -e
              case "$result" in
                0) exit 0 ;;
                3) ;;
                *) exit "$result" ;;
              esac
            done
          done
          printf 'No profile-compatible state exists; this focused build starts cold.\n'

      - name: Prepare restored test-profile inputs
        id: prepare
        run: |
          set -euo pipefail
          bash "$CODEX_SOURCE_CACHE_TOOL" clean-cached-release-binaries --profile ci-test \
            "$CODEX_REPO_ROOT/codex-rs" "$TARGET" codex codex-app-server 2>&1 | tee "$FOCUSED_RUNTIME/evidence/cache-prepare.log"

      - name: Await the retained client's runtime result
        id: test
        run: |
          set -euo pipefail
          printf 'Source %s before starting the retained runtime controller.\n' "$FOCUSED_RUNTIME/evidence/runtime-environment.sh"
          printf '%s\n' "$TARGET" > "$FOCUSED_RUNTIME/evidence/environment-ready"
          report_progress() {
            printf '\nNative runtime progress at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/' /proc/meminfo
            printf 'Load: '
            cat /proc/loadavg
            df -h "$FOCUSED_RUNTIME"
            for metric in /proc/pressure/memory /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              printf '%s: ' "$metric"
              if [[ -r "$metric" ]]; then cat "$metric"; else printf 'unavailable\n'; fi
            done
            ps -eo pid,ppid,comm,rss,pcpu --sort=-rss | sed -n '1,9p'
            if [[ -d "$FOCUSED_RUNTIME/evidence/native-runtime" ]]; then
              find "$FOCUSED_RUNTIME/evidence/native-runtime" -maxdepth 2 -type f -name '*-exit' -print -exec cat {} \;
              for build_log in "$FOCUSED_RUNTIME"/evidence/native-runtime/*/build.log; do
                if [[ -f "$build_log" ]]; then printf '%s\n' "$build_log"; tail -n 2 "$build_log"; fi
              done
            fi
            if sudo -n journalctl -k --since '-90 seconds' --priority warning --no-pager -n 5; then
              :
            else
              printf 'Kernel warning diagnostics unavailable.\n'
            fi
          }

          deadline=$((SECONDS+17400))
          next_progress=0
          until [[ -f "$FOCUSED_RUNTIME/evidence/runtime-controller-exit" ]]; do
            if (( SECONDS >= next_progress )); then
              if report_progress | tee "$FOCUSED_RUNTIME/evidence/runtime-progress.txt"; then :; else printf 'Runtime progress sampling failed; controller outcome remains authoritative.\n'; fi
              next_progress=$((SECONDS+60))
            fi
            if (( SECONDS >= deadline )); then
              printf 'The retained runtime controller did not finish within its available execution window.\n' >&2
              exit 124
            fi
            sleep 10
          done
          result="$(cat "$FOCUSED_RUNTIME/evidence/runtime-controller-exit")"
          case "$result" in
            0 | 1 | 2 | 3 | 4 | 100 | 101 | 102 | 103 | 104 | 105 | 106 | 107 | 108 | 109 | 110 | 124) exit "$result" ;;
            *) printf 'Invalid runtime controller exit receipt: %s\n' "$result" >&2; exit 1 ;;
          esac

      - name: Verify source and dependency identity
        id: guard
        if: always() && steps.restore.outcome == 'success'
        run: |
          set -euo pipefail
          evidence="$FOCUSED_RUNTIME/evidence"
          test "$(git -C upstream rev-parse HEAD)" = "$(cat .github/upstream-commit)"
          git -C upstream diff --binary > "$evidence/source.diff"
          git -C upstream diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'
          git -C upstream status --porcelain=v1 --untracked-files=all > "$evidence/source-status.txt"
          test -z "$(git -C upstream ls-files --others --exclude-standard)"
          (cd upstream/codex-rs && cargo metadata --no-deps --format-version 1) > "$evidence/workspace.json"
          python3 .github/scripts/verify-cargo-lock.py "$evidence/upstream-Cargo.lock" upstream/codex-rs/Cargo.lock "$evidence/workspace.json" | tee "$evidence/dependencies.json"

      - name: Record successful test-profile inputs
        id: record
        if: steps.test.outcome == 'success' && steps.guard.outcome == 'success' && steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          bash "$CODEX_SOURCE_CACHE_TOOL" clean-cached-release-binaries --record-source-inputs --profile ci-test \
            "$CODEX_REPO_ROOT/codex-rs" "$TARGET" 2>&1 | tee "$FOCUSED_RUNTIME/evidence/cache-record.log"

      - name: Save compiled outputs without changing the test result
        id: save
        if: always() && steps.guard.outcome == 'success' && steps.prepare.outcome == 'success'
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
          CACHE_TAG: ${{ steps.cache.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache.outputs.seed_tag }}
          CARGO_CACHE_STAGE: final
        run: |
          set -euo pipefail
          operation=push-partial
          if [[ "$TEST_OUTCOME" == success && "$RECORD_OUTCOME" == success ]]; then operation=push; fi
          bash .github/scripts/ghcr-cargo-target-cache.sh "$operation" "$CARGO_CACHE_REPOSITORY" "$CACHE_TAG" "$CARGO_TARGET_DIR" "$(cat .github/upstream-ref)" "$CACHE_SEED_TAG" 2>&1 | tee "$FOCUSED_RUNTIME/evidence/save.log"

      - name: Publish test and cache outcomes to the live client
        if: always() && env.FOCUSED_RUNTIME != ''
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
        run: |
          node - <<'JS'
          const fs=require('node:fs'), path=require('node:path');
          const output=path.join(process.env.FOCUSED_RUNTIME,'evidence','runtime-outcome.json');
          fs.writeFileSync(`${output}.pending`, JSON.stringify({test:process.env.TEST_OUTCOME,prepare:process.env.PREPARE_OUTCOME,
            record:process.env.RECORD_OUTCOME,
            guard:process.env.GUARD_OUTCOME,save:process.env.SAVE_OUTCOME})+'\n');
          fs.renameSync(`${output}.pending`,output);
          JS

      - name: Retain focused evidence for one day
        if: always() && env.FOCUSED_RUNTIME != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: linux-${{ inputs.target }}-runtime-${{ github.run_attempt }}
          path: ${{ env.FOCUSED_RUNTIME }}/evidence
          retention-days: 1
          if-no-files-found: error
