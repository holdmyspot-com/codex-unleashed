name: rust-ci

on:
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to .github/upstream-ref."
        required: false
        type: string

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  changed:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      codex: ${{ steps.detect.outputs.codex }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed patch-layer paths
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha='${{ github.event.pull_request.base.sha }}'
            head_sha='${{ github.event.pull_request.head.sha }}'
            mapfile -t files < <(git diff --name-only --no-renames "$base_sha" "$head_sha")
          else
            files=("patches/force" "scripts/force" ".github/force")
          fi

          codex=false
          workflows=false
          for f in "${files[@]}"; do
            [[ $f == patches/* || $f == scripts/* ]] && codex=true
            [[ $f == .github/* ]] && workflows=true
          done

          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

  general:
    name: Format / etc
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    uses: ./.github/workflows/buildbuddy-ci.yml
    with:
      task: format
      upstream_ref: ${{ inputs.upstream_ref }}
    secrets: inherit

  cargo_shear:
    name: cargo shear
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    uses: ./.github/workflows/buildbuddy-ci.yml
    with:
      task: cargo-shear
      upstream_ref: ${{ inputs.upstream_ref }}
    secrets: inherit

  darwin_linker:
    name: Large Darwin unwind section (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref }}
      - name: Check large-section linking and panic unwinding
        working-directory: upstream
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/darwin-linker/target
          TMPDIR: ${{ runner.temp }}/darwin-linker/temp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR"
          bash tools/build-warnings/check-darwin-linker.sh
      - name: Remove linker probe outputs
        if: always()
        shell: bash
        run: rm -rf -- "${{ runner.temp }}/darwin-linker"

  results:
    name: rust-ci results
    needs:
      - changed
      - general
      - cargo_shear
      - darwin_linker
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${NEEDS_CHANGED_OUTPUTS_CODEX}" != 'true' && "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" != 'true' ]]; then
            echo 'No relevant changes -> rust-ci not required.'
            exit 0
          fi

          [[ '${{ needs.general.result }}' == 'success' ]] || { echo 'general failed'; exit 1; }
          [[ '${{ needs.cargo_shear.result }}' == 'success' ]] || { echo 'cargo_shear failed'; exit 1; }
          [[ '${{ needs.darwin_linker.result }}' == 'success' ]] || { echo 'darwin_linker failed'; exit 1; }
        env:
          NEEDS_CHANGED_OUTPUTS_CODEX: ${{ needs.changed.outputs.codex }}
          NEEDS_CHANGED_OUTPUTS_WORKFLOWS: ${{ needs.changed.outputs.workflows }}
