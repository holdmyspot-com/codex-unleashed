name: tooling-windows-diagnostic

# Temporary native distribution reproduction; the complete tooling-ci matrix remains the acceptance gate.
on:
  push:
    branches: [verify/jdk27-maven-migration]
    paths:
      - tooling/**
      - .github/workflows/tooling-windows-diagnostic.yml

permissions:
  contents: read

jobs:
  launcher:
    name: Focused Windows distribution verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify distribution workflow boundaries
        shell: bash
        run: tooling/mvnw -pl distribution -am '-Dtest=com.holdmyspot.codexunleashed.distribution.*Test' -Dsurefire.failIfNoSpecifiedTests=false verify
