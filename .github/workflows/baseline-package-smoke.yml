name: Stable upstream package smoke test

# Builds one target's package archive from the pinned upstream, with the selected downstream patches applied (none by
# default), and runs upstream's package smoke tests. It is the package job of the automatic release, narrowed to one
# target so a smoke-test failure can be compared with and without the patches. Nothing is published or uploaded.

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order; empty tests pristine upstream
        type: string
        default: ""
      target:
        description: Package target
        type: choice
        default: aarch64-pc-windows-msvc
        options: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]

permissions:
  contents: read

jobs:
  package:
    name: Package smoke - ${{ inputs.target }}
    runs-on: ${{ (inputs.target == 'aarch64-pc-windows-msvc' && 'windows-11-arm') || (inputs.target == 'x86_64-pc-windows-msvc' && 'windows-2025') || (inputs.target == 'aarch64-unknown-linux-musl' && 'ubuntu-24.04-arm') || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      TARGET: ${{ inputs.target }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Read the pinned upstream commit and version
        id: source
        run: |
          set -euo pipefail
          printf 'commit=%s\n' "$(cat restart-metadata/.github/upstream-commit)" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(sed 's/^rust-v//' restart-metadata/.github/upstream-ref)" >> "$GITHUB_OUTPUT"

      - name: Keep the patch queue outside the upstream checkout
        run: |
          set -euo pipefail
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          mkdir -p "$RUNNER_TEMP/package-smoke-tools/test-baselines"
          cp restart-metadata/.github/scripts/compare-test-baseline.py restart-metadata/.github/scripts/package-smoke-baseline.sh \
            "$RUNNER_TEMP/package-smoke-tools/"
          if [[ -d restart-metadata/docs/test-baselines ]]; then
            cp -R restart-metadata/docs/test-baselines/. "$RUNNER_TEMP/package-smoke-tools/test-baselines/"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false

      - name: Apply the patch queue
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          read -r -a patch_paths <<< "$PATCHES"
          for patch in "${patch_paths[@]}"; do
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ inputs.target }}

      - name: Install upstream's Zig prerequisite
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0

      - name: Install upstream's musl build inputs
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bash .github/scripts/install-musl-build-tools.sh
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_$TARGET"
          printf '%s=1\n' "${target_no_jitter//-/_}" >> "$GITHUB_ENV"

      - name: Verify and configure upstream V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ inputs.target }}

      - name: Expose the matching MSVC environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ inputs.target }}

      - name: Select platform build settings
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo 'GIT_REDIRECT_STDIN=NUL' >> "$GITHUB_ENV"
          fi
          if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
            echo 'LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC' >> "$GITHUB_ENV"
          fi

      # Upstream builds these packages on a larger repository-owned runner (`<repo>-linux-arm64`) with Cargo's default
      # job count and no swap. The hosted ubuntu-24.04-arm runner has 4 CPUs and 16 GB; four concurrent rustc and
      # thin-LTO processes exhausted its memory and the runner was lost mid-build ("shutdown signal", exit 143) in
      # package dry run 42860267858 and smoke run 42940948378, both while compiling codex-exec. The release-build
      # workflow measured the same limit on this runner type: three Cargo jobs finish fastest, four run out of memory.
      # The release profile (LTO, codegen units, optimization level) is unchanged. Swap absorbs the link-time peaks.
      - name: Fit the build into the hosted Linux runner's memory
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          free -h
          swapon --show || true
          df -h / /mnt 2>/dev/null || df -h /
          swapfile=/mnt/codex-build-swap
          if [[ ! -d /mnt ]] || [[ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -lt 20 ]]; then swapfile=/codex-build-swap; fi
          sudo fallocate -l 12G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
          echo 'CARGO_BUILD_JOBS=3' >> "$GITHUB_ENV"
          # A background sampler writes memory use to a file; the last step prints it, so an out-of-memory run leaves evidence.
          nohup setsid bash -c 'while true; do date -u +%H:%M:%S; free -m | sed -n "1,3p"; ps -eo rss,comm --sort=-rss | sed -n "1,4p"; sleep 20; done' \
            > "$RUNNER_TEMP/memory-samples.log" 2>&1 < /dev/null &

      - name: Build and smoke-test upstream's package archives
        id: package
        continue-on-error: true
        uses: ./.github/actions/build-codex-packages
        with:
          target: ${{ inputs.target }}
          package-version: ${{ steps.source.outputs.version }}+smoke
          build-mode: release

      # Upstream's action builds the archives and runs its smoke tests in one step, so a smoke-test failure fails the step.
      # The step is allowed to fail; the next step then fails the job unless every failure is already in the baseline.
      # Failed builds still fail the job: that step requires every archive.
      - name: Judge the smoke-test failures against the unpatched baseline
        if: steps.package.outcome == 'failure'
        env:
          TARGET: ${{ inputs.target }}
          UPSTREAM_COMMIT: ${{ steps.source.outputs.commit }}
          PACKAGE_SMOKE_TOOLS: ${{ runner.temp }}/package-smoke-tools
          PACKAGE_SMOKE_EVIDENCE: ${{ runner.temp }}/package-smoke-evidence
          PYTHONPATH: ${{ github.workspace }}/sdk/python/src${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/sdk/python/tests
        run: bash "$PACKAGE_SMOKE_TOOLS/package-smoke-baseline.sh" "${{ inputs.patches == '' && 'record' || 'compare' }}"

      - name: Retain the recorded failures
        if: always() && inputs.patches == ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: package-smoke-baseline-${{ inputs.target }}
          path: ${{ runner.temp }}/package-smoke-evidence
          retention-days: 3
          if-no-files-found: ignore

      - name: Show the memory samples
        if: always() && runner.os == 'Linux'
        run: tail -n 120 "$RUNNER_TEMP/memory-samples.log" || true
