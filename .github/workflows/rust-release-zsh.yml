name: rust-release-zsh

on:
  push:
    tags:
      - "codex-zsh-v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to publish, for example codex-zsh-v0.1.0."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}::${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - id: release_tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_RELEASE_TAG}" ]]; then
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
          elif [[ "${REF_NAME}" =~ ^codex-zsh-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_TAG="${REF_NAME}"
          else
            RELEASE_TAG="codex-zsh-v0.0.0"
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^codex-zsh-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${RELEASE_TAG} does not match codex-zsh-vX.Y.Z." >&2
            exit 1
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  linux-x86:
    name: Build zsh (Linux) - x86_64-unknown-linux-musl
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-buildbuddy
        id: remote
        with:
          task: zsh-release
          target: x86_64-unknown-linux-musl
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: actions/upload-artifact@v6
        with:
          name: codex-zsh-x86_64-unknown-linux-musl
          path: ${{ steps.remote.outputs.artifact-directory }}/zsh/*
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Build zsh (Linux) - ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_name: codex-zsh-aarch64-unknown-linux-musl.tar.gz
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require RAM-only builds
        shell: bash
        run: bash .github/scripts/disable-ci-swap.sh

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf bison build-essential ca-certificates gettext git libncursesw5-dev

      - name: Build zsh artifact
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/build-zsh-release-artifact.sh "dist/zsh/${{ matrix.target }}/${{ matrix.archive_name }}"

      - uses: actions/upload-artifact@v6
        with:
          name: codex-zsh-${{ matrix.target }}
          path: dist/zsh/${{ matrix.target }}/*
          retention-days: 1

  darwin:
    name: Build zsh (macOS) - ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: x86_64-apple-darwin
            archive_name: codex-zsh-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive_name: codex-zsh-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v autoconf >/dev/null 2>&1; then
            brew install autoconf
          fi

      - name: Build zsh artifact
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/build-zsh-release-artifact.sh "dist/zsh/${{ matrix.target }}/${{ matrix.archive_name }}"

      - uses: actions/upload-artifact@v6
        with:
          name: codex-zsh-${{ matrix.target }}
          path: dist/zsh/${{ matrix.target }}/*
          retention-days: 1

  publish-release:
    needs:
      - metadata
      - linux
      - linux-x86
      - darwin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tooling

      - name: Download staged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --paginate --jq '.artifacts[].name')"
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            "$CODEX_UNLEASHED_TOOLING" download-workflow-artifact \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$name" "dist/$name"
          done <<< "$names"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: ${{ needs.metadata.outputs.release_tag }}
          files: dist/**
          prerelease: true
