name: Automatic upstream release

# Publishes this fork's release for the newest stable upstream openai/codex release (rust-vX.Y.Z, not a draft or
# prerelease), CP9 in plan.md. The pipeline is: detect, check that the patch queue applies, run every gate against the
# pinned upstream commit with the queue applied, and only for a live run build the packages, publish the release,
# verify the one-line installers on six fresh runners and then mark it latest.
#
# A dispatch with dry_run=true (the default) stops after the gates and publishes nothing: no tag, release, draft or
# release asset. It builds no packages unless package_dry_run is set, which builds the selected targets' package archives
# and installers into 3-day workflow artifacts. The opt-in package_cargo_cache pilot reuses verified Cargo dependencies
# for a one-target Linux x64 package dry run. skip_gates (dry runs only) skips the gate workflows so the package
# build can be rehearsed alone on cheaper runners. Enabling the schedule below is the owner's step at acceptance.
#
# Gate coverage: Linux, Windows and macOS tests (the macOS one is the Bazel suite), lints on three platforms and the
# six-target release build.

on:
  # schedule:
  #   - cron: "17 */3 * * *"  # Owner step: uncomment to enable unattended releases. Scheduled runs are live.
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Optional stable upstream tag to release, such as rust-v0.167.0; empty selects the newest stable release
        type: string
        default: ""
      dry_run:
        description: Detect, apply the patch queue and run every gate, but publish nothing
        type: boolean
        default: true
      package_dry_run:
        description: In a dry run, also build the package archives and installers (uploaded as workflow artifacts only)
        type: boolean
        default: false
      package_targets:
        description: Optional space-separated targets for a dry-run package build, such as x86_64-unknown-linux-musl; empty builds all six
        type: string
        default: ""
      skip_gates:
        description: Dry runs only; skip the gate workflows, for rehearsing the package build alone
        type: boolean
        default: false
      package_cargo_cache:
        description: Try the exact compiled Cargo cache during a package dry run for Linux x64 or one native macOS target
        type: boolean
        default: false
      package_cache_key_only:
        description: Prepare the package cache key and upload its digests without running the release Cargo build
        type: boolean
        default: false
      voice_cache_phase:
        description: Run the isolated native sealed voice cache pilot
        type: choice
        options: [none, cold, warm]
        default: none
      voice_cache_source:
        description: Approved cold producer run ID and manifest SHA-256 separated by a colon
        type: string
        default: ""
      package_public_key:
        description: Optional SSH public key for dry-run package workers; connect to each selected worker before packaging
        type: string
        default: ""

# One run at a time per release and mode. The one-target cache pilot can run alongside a full dry run.
# The publish job adds a per-version group and re-checks the fork's
# releases, because the version a scheduled run resolves is unknown until detection has run.
# Recover publication, installation or promotion by rerunning failed jobs (or the publish job) in the same run.
# This reuses the verified package artifacts for three days. A full rerun restores the original identity, but rebuilds
# packages and is not artifact-reusing recovery. A fresh dispatch performs normal release selection.
concurrency:
  group: >-
    upstream-auto-release-${{ inputs.upstream_tag || 'latest' }}-${{
      (github.event_name == 'schedule' || !inputs.dry_run) && 'live' ||
      (inputs.package_dry_run && inputs.package_cargo_cache && inputs.package_cache_key_only &&
        endsWith(inputs.package_targets, '-apple-darwin')) && format('macos-package-cache-key-{0}', github.run_id) ||
      (inputs.package_dry_run && inputs.package_cargo_cache && inputs.package_cache_key_only) && 'package-cache-key' ||
      (inputs.package_dry_run && inputs.package_cargo_cache) && 'package-cache-pilot' ||
      'dry'
    }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: Release helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Verify Java release helper behavior
        run: |
          set -euo pipefail
          tooling_test_root="$RUNNER_TEMP/release-helper-tests"
          mkdir -p "$tooling_test_root/build" "$tooling_test_root/tmp"
          export TMPDIR="$tooling_test_root/tmp" TMP="$tooling_test_root/tmp" TEMP="$tooling_test_root/tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$tooling_test_root/tmp"
          bash .github/scripts/maven-retry.sh "$tooling_test_root/maven" -q -f tooling/cli/pom.xml \
            "-Dtooling.build.directory=$tooling_test_root/build" \
            -Dtest=UpstreamAutoReleaseTest,PackageLicenseTest,PackageIdentityTest,ReleaseManifestTest,ReleaseManifestNativeInputsTest,MainTest,BlobSizeCommandTest,BlobSizePolicyTest test

      - name: Verify release helper behavior
        run: |
          set -euo pipefail
          node --test .github/scripts/test-codex-version-banner.mjs .github/scripts/test-verify-local-npm.mjs .github/scripts/test-release-publication.mjs

  detect:
    name: Detect the upstream release
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      action: ${{ steps.detect.outputs.action }}
      reason: ${{ steps.detect.outputs.reason }}
      version: ${{ steps.detect.outputs.version }}
      build: ${{ steps.detect.outputs.build }}
      tag: ${{ steps.detect.outputs.tag }}
      release_name: ${{ steps.detect.outputs.release_name }}
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
      upstream_commit: ${{ steps.commit.outputs.upstream_commit }}
      patches: ${{ steps.commit.outputs.patches }}
      live: ${{ steps.mode.outputs.live }}
      package_matrix: ${{ steps.mode.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling

      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_GATES: ${{ inputs.skip_gates }}
          PACKAGE_TARGETS: ${{ inputs.package_targets }}
          PACKAGE_DRY_RUN: ${{ inputs.package_dry_run }}
          PACKAGE_CARGO_CACHE: ${{ inputs.package_cargo_cache }}
          PACKAGE_CACHE_KEY_ONLY: ${{ inputs.package_cache_key_only }}
          PACKAGE_DEBUG_KEY: ${{ inputs.package_public_key }}
          VOICE_CACHE_PHASE: ${{ inputs.voice_cache_phase }}
          VOICE_CACHE_SOURCE: ${{ inputs.voice_cache_source }}
        run: |
          set -euo pipefail
          live=false
          if [[ "$EVENT" == schedule || "$DRY_RUN" == false ]]; then
            live=true
          fi
          if [[ "$live" == true && "$SKIP_GATES" == true ]]; then
            printf '::error::skip_gates is allowed only with dry_run=true\n'
            exit 1
          fi
          if [[ "$PACKAGE_CARGO_CACHE" == true && ( "$live" == true || "$PACKAGE_DRY_RUN" != true ||
            ( "$PACKAGE_TARGETS" != x86_64-unknown-linux-musl && "$PACKAGE_TARGETS" != aarch64-apple-darwin &&
              "$PACKAGE_TARGETS" != x86_64-apple-darwin ) ) ]]; then
            printf '::error::package_cargo_cache requires a package dry run for exactly one supported Linux x64 or native macOS target\n'
            exit 1
          fi
          if [[ "$PACKAGE_CARGO_CACHE" == true && "$PACKAGE_TARGETS" == *-apple-darwin &&
            ( "$PACKAGE_CACHE_KEY_ONLY" != true || -z "$PACKAGE_DEBUG_KEY" ) ]]; then
            printf '::error::The macOS package cache preflight requires key-only mode and an authenticated debug key\n'
            exit 1
          fi
          if [[ "$PACKAGE_CACHE_KEY_ONLY" == true && ( "$PACKAGE_CARGO_CACHE" != true || "$SKIP_GATES" != true ) ]]; then
            printf '::error::package_cache_key_only requires package_cargo_cache=true and skip_gates=true\n'
            exit 1
          fi
          if [[ -n "$VOICE_CACHE_PHASE" && "$VOICE_CACHE_PHASE" != none ]]; then
            if [[ "$live" == true || "$PACKAGE_DRY_RUN" != true || "$PACKAGE_CARGO_CACHE" != true ||
                "$PACKAGE_CACHE_KEY_ONLY" != true || "$SKIP_GATES" != true || -z "$PACKAGE_DEBUG_KEY" ||
                ( "$PACKAGE_TARGETS" != aarch64-apple-darwin && "$PACKAGE_TARGETS" != x86_64-apple-darwin ) ||
                "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
              printf '::error::The voice cache pilot requires a fresh authenticated native macOS key-only dry run\n'
              exit 1
            fi
            case "$VOICE_CACHE_PHASE" in
              cold) test -z "$VOICE_CACHE_SOURCE" ;;
              warm) [[ "$VOICE_CACHE_SOURCE" =~ ^[1-9][0-9]*:[0-9a-f]{64}$ ]] ;;
              *) exit 1 ;;
            esac
          fi
          all='[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"},
            {"runner":"macos-15","target":"aarch64-apple-darwin"},
            {"runner":"macos-15-intel","target":"x86_64-apple-darwin"},
            {"runner":"windows-2025","target":"x86_64-pc-windows-msvc"},
            {"runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]'
          # Only a dry run may narrow the targets; a live release always builds all six.
          if [[ "$live" == false && -n "$PACKAGE_TARGETS" ]]; then
            matrix="$(jq -c --arg targets "$PACKAGE_TARGETS" '($targets | split(" ") | map(select(. != ""))) as $wanted
              | map(select(.target as $t | $wanted | index($t)))' <<< "$all")"
            test "$(jq 'length' <<< "$matrix")" = "$(jq -n --arg targets "$PACKAGE_TARGETS" '$targets | split(" ") | map(select(. != "")) | length')"
          else
            matrix="$(jq -c . <<< "$all")"
          fi
          printf 'live=%s\npackage_matrix=%s\n' "$live" "$matrix" >> "$GITHUB_OUTPUT"

      - name: Restore the immutable selection from this run
        if: github.run_attempt != '1'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-identity
          path: ${{ runner.temp }}/release-identity

      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            bash "$CODEX_TOOLING" upstream-auto-release restore-identity \
              --identity "$RUNNER_TEMP/release-identity/identity.json" --run-id "$GITHUB_RUN_ID" \
              --fork-commit "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          work="$RUNNER_TEMP/detect"
          mkdir -p "$work"
          # GitHub's API answers an occasional 504, so every read retries.
          gh_api() {
            local attempt
            for attempt in 1 2 3 4 5; do
              gh api "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          # The newest releases (alphas included) cover the recent history; /latest names the newest stable one.
          {
            for page in 1 2 3 4 5; do
              gh_api "repos/openai/codex/releases?per_page=30&page=$page"
            done
            gh_api repos/openai/codex/releases/latest | jq -c '[.]'
            if [[ -n "$REQUESTED_TAG" ]]; then
              tag="$REQUESTED_TAG"
              [[ "$tag" == rust-v* ]] || tag="rust-v$tag"
              gh_api "repos/openai/codex/releases/tags/$tag" | jq -c '[.]'
            fi
          } | jq -s 'add' > "$work/upstream.json"
          gh_api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -s 'add' > "$work/fork.json"
          bash "$CODEX_TOOLING" upstream-auto-release detect --upstream-releases "$work/upstream.json" \
            --fork-releases "$work/fork.json" --requested-tag "$REQUESTED_TAG" | tee "$RUNNER_TEMP/detection-output" -a "$GITHUB_OUTPUT"

      - id: commit
        if: steps.detect.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.detect.outputs.upstream_tag }}
          RETAINED_COMMIT: ${{ steps.detect.outputs.upstream_commit }}
        run: |
          # GitHub's API answers an occasional 504, so every read retries.
          gh_api() {
            local attempt
            for attempt in 1 2 3 4 5; do
              gh api "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            commit="$(gh_api "repos/openai/codex/commits/$UPSTREAM_TAG" --jq .sha)"
          else
            commit="$RETAINED_COMMIT"
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'upstream_commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'patches=%s\n' "$(bash "$CODEX_TOOLING" upstream-auto-release patches --readme patches/README.md)" >> "$GITHUB_OUTPUT"

      - name: Save this run's immutable release selection
        if: github.run_attempt == '1'
        env:
          UPSTREAM_COMMIT: ${{ steps.commit.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-identity"
          bash "$CODEX_TOOLING" upstream-auto-release save-identity \
            --identity "$RUNNER_TEMP/release-identity/identity.json" --run-id "$GITHUB_RUN_ID" \
            --fork-commit "$GITHUB_SHA" --upstream-commit "$UPSTREAM_COMMIT" \
            --decision-output "$RUNNER_TEMP/detection-output"

      - name: Retain the selection for same-run retries
        if: github.run_attempt == '1'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-identity
          path: ${{ runner.temp }}/release-identity/identity.json
          retention-days: 3
          if-no-files-found: error

      - name: Summarize the decision
        env:
          ACTION: ${{ steps.detect.outputs.action }}
          REASON: ${{ steps.detect.outputs.reason }}
          TAG: ${{ steps.detect.outputs.tag }}
          UPSTREAM_TAG: ${{ steps.detect.outputs.upstream_tag }}
          COMMIT: ${{ steps.commit.outputs.upstream_commit }}
          LIVE: ${{ steps.mode.outputs.live }}
        run: |
          {
            printf "## Detection\n\n- Decision: **%s**: %s\n- Upstream release: \`%s\`\n" "$ACTION" "$REASON" "$UPSTREAM_TAG"
            if [[ "$ACTION" == release ]]; then
              printf -- "- Upstream commit: \`%s\`\n- Fork release tag: \`%s\`\n- Publishing: %s\n" "$COMMIT" "$TAG" \
                "$([[ "$LIVE" == true ]] && echo live || echo 'dry run, nothing is published')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  patch-check:
    name: Apply the patch queue
    needs: detect
    if: needs.detect.outputs.action == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ needs.detect.outputs.upstream_commit }}
          path: upstream
          persist-credentials: false

      - name: Apply each patch with git am
        env:
          PATCHES: ${{ needs.detect.outputs.patches }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          read -r -a patch_paths <<< "$PATCHES"
          index=0
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          for patch in "${patch_paths[@]}"; do
            index=$((index + 1))
            if ! git -C upstream -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$GITHUB_WORKSPACE/$patch"; then
              git -C upstream am --abort || true
              bash "$CODEX_TOOLING" upstream-auto-release summary --upstream-tag "$UPSTREAM_TAG" \
                --failing "patch $index of ${#patch_paths[@]} does not apply: \`$patch\`" --log-url "$LOG_URL" >> "$GITHUB_STEP_SUMMARY"
              printf '::error::Patch %s (%s) does not apply to %s\n' "$index" "$patch" "$UPSTREAM_TAG"
              exit 1
            fi
          done
          printf 'Applied %s patches to %s.\n' "${#patch_paths[@]}" "$UPSTREAM_TAG"

  platform-lints:
    name: Platform lints
    needs: [detect, patch-check]
    if: ${{ !inputs.skip_gates }}
    uses: ./.github/workflows/baseline-platform-lints.yml
    permissions:
      contents: read
      packages: write
    with:
      patches: ${{ needs.detect.outputs.patches }}
      upstream_commit: ${{ needs.detect.outputs.upstream_commit }}

  macos-lints:
    name: macOS lints
    needs: [detect, patch-check]
    if: ${{ !inputs.skip_gates }}
    uses: ./.github/workflows/baseline-macos-lints.yml
    permissions:
      contents: read
      packages: write
    with:
      patches: ${{ needs.detect.outputs.patches }}
      upstream_commit: ${{ needs.detect.outputs.upstream_commit }}

  windows-lints:
    name: Windows lints
    needs: [detect, patch-check]
    if: ${{ !inputs.skip_gates }}
    uses: ./.github/workflows/baseline-windows-lints.yml
    permissions:
      contents: read
      packages: write
    with:
      patches: ${{ needs.detect.outputs.patches }}
      upstream_commit: ${{ needs.detect.outputs.upstream_commit }}

  linux-tests:
    name: Linux tests
    needs: [detect, patch-check]
    if: ${{ !inputs.skip_gates }}
    # The called workflow's job requests these permissions; the caller must grant them.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/baseline-linux-tests.yml
    with:
      patches: ${{ needs.detect.outputs.patches }}
      upstream_commit: ${{ needs.detect.outputs.upstream_commit }}

  windows-tests:
    name: Windows tests - ${{ matrix.target }}
    needs: [detect, patch-check]
    if: ${{ !inputs.skip_gates }}
    # The called workflow restores and saves compiled state in GHCR and downloads earlier archives.
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    uses: ./.github/workflows/baseline-windows-tests.yml
    with:
      patches: ${{ needs.detect.outputs.patches }}
      upstream_commit: ${{ needs.detect.outputs.upstream_commit }}
      package: --workspace
      target: ${{ matrix.target }}

  macos-nextest:
    name: macOS nextest
    needs: [detect, patch-check]
    if: ${{ !inputs.skip_gates }}
    # The called workflow restores and saves compiled state in GHCR and downloads earlier archives.
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/baseline-macos-tests.yml
    with:
      patches: ${{ needs.detect.outputs.patches }}
      upstream_commit: ${{ needs.detect.outputs.upstream_commit }}
      package: --workspace

  macos-tests:
    name: macOS Bazel tests
    needs: [detect, patch-check]
    if: ${{ !inputs.skip_gates }}
    # The called workflow's jobs request these permissions; the caller must grant them.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/baseline-macos-bazel-tests.yml
    with:
      patches: ${{ needs.detect.outputs.patches }}
      upstream_commit: ${{ needs.detect.outputs.upstream_commit }}

  release-builds:
    name: Six-target release build and smoke checks
    needs: [detect, patch-check]
    if: ${{ !inputs.skip_gates }}
    # The called workflow's jobs request these permissions; the caller must grant them.
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/baseline-release-builds.yml
    with:
      patches: ${{ needs.detect.outputs.patches }}
      upstream_commit: ${{ needs.detect.outputs.upstream_commit }}
      cache: true
      prune: false

  report:
    name: Gate report
    needs: [detect, patch-check, platform-lints, macos-lints, windows-lints, linux-tests, windows-tests, macos-nextest, macos-tests, release-builds]
    if: ${{ !cancelled() && needs.detect.outputs.action == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.report.outputs.passed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling

      - id: report
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIP_GATES: ${{ inputs.skip_gates }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # skip_gates (dry runs only, enforced in detect) deliberately skips the gate workflows.
          failing="$(jq -r --arg skip "$SKIP_GATES" 'to_entries | map(select(.key != "detect" and .value.result != "success"
            and (($skip == "true" and .value.result == "skipped") | not)) | "\(.key) (\(.value.result))") | join(", ")' <<< "$NEEDS")"
          if [[ -n "$failing" ]]; then
            bash "$CODEX_TOOLING" upstream-auto-release summary --upstream-tag "$UPSTREAM_TAG" \
              --failing "gate $failing" --log-url "$LOG_URL" >> "$GITHUB_STEP_SUMMARY"
            printf 'passed=false\n' >> "$GITHUB_OUTPUT"
            printf '::error::Gates did not pass for %s: %s\n' "$UPSTREAM_TAG" "$failing"
            exit 1
          fi
          printf 'passed=true\n' >> "$GITHUB_OUTPUT"
          printf "## Gates passed\n\nEvery gate passed for \`%s\`.\n" "$UPSTREAM_TAG" >> "$GITHUB_STEP_SUMMARY"

  # Everything below runs only for a live run (dry_run=false, or a scheduled run) whose gates all passed.

  package:
    name: Package - ${{ matrix.target }}
    needs: [detect, report]
    # A live run builds the packages to publish; a dry run builds them only when package_dry_run asks, and uploads them as
    # workflow artifacts without publishing.
    # Without a status function, `if` implies success(), which also requires every gate behind `report` to have
    # succeeded; skip_gates skips them, so the gate verdict is read from `report` instead.
    if: ${{ !cancelled() && needs.report.result == 'success' && needs.report.outputs.passed == 'true' && (needs.detect.outputs.live == 'true' || inputs.package_dry_run == true) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      packages: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.package_matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      CODEX_UNLEASHED_BUILD_NUMBER: ${{ needs.detect.outputs.build }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple') && 'packed' || 'off' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false
      - name: Select the maintained tooling JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build the tooling runtime
        env:
          TOOLING_ROOT: restart-metadata
        run: bash restart-metadata/.github/scripts/setup-tooling.sh

      - name: Preserve voice release metadata before upstream checkout
        run: |
          set -euo pipefail
          voice_metadata="$RUNNER_TEMP/voice-release-metadata"
          mkdir -p "$voice_metadata"
          cp restart-metadata/.github/scripts/setup-baseline-windows-voice.ps1 \
            restart-metadata/.github/scripts/verify-voice-installer.mjs \
            restart-metadata/.github/scripts/codex-version-banner.mjs "$voice_metadata/"

      - name: Keep the patch queue outside the upstream checkout
        run: |
          set -euo pipefail
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          mkdir -p "$RUNNER_TEMP/package-smoke-tools/test-baselines"
          cp restart-metadata/.github/scripts/package-smoke-baseline.sh \
            restart-metadata/.github/scripts/fit-linux-build-memory.sh "$RUNNER_TEMP/package-smoke-tools/"
          if [[ -d restart-metadata/docs/test-baselines ]]; then
            cp -R restart-metadata/docs/test-baselines/. "$RUNNER_TEMP/package-smoke-tools/test-baselines/"
          fi
          mkdir -p "$RUNNER_TEMP/package-legal-metadata/docs"
          cp restart-metadata/LICENSE.md "$RUNNER_TEMP/package-legal-metadata/"
          cp restart-metadata/docs/LICENSE.html restart-metadata/docs/terms.html restart-metadata/docs/privacy.html \
            "$RUNNER_TEMP/package-legal-metadata/docs/"
          cp -R restart-metadata/licenses "$RUNNER_TEMP/package-legal-metadata/"

      - name: Retain pinned release verification metadata
        run: |
          set -euo pipefail
          git clone --no-hardlinks restart-metadata "$RUNNER_TEMP/manifest-patch-repo"
          test "$(git -C "$RUNNER_TEMP/manifest-patch-repo" rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ needs.detect.outputs.upstream_commit }}
          persist-credentials: false

      - name: Verify the pinned upstream release tag
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          test "$(git rev-parse "$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_COMMIT"

      - name: Apply the patch queue
        env:
          PATCHES: ${{ needs.detect.outputs.patches }}
        run: |
          set -euo pipefail
          read -r -a patch_paths <<< "$PATCHES"
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          for patch in "${patch_paths[@]}"; do
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done

      - name: Prepare retained package worker
        if: needs.detect.outputs.live != 'true' && inputs.package_public_key != ''
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/manifest-patch-repo/.github"
          evidence="$RUNNER_TEMP/package-debug-evidence"
          mkdir "$evidence"
          bash "$metadata/scripts/release-debug-session.sh" prepare \
            "$metadata/actions/debug-failed-runner" "$GITHUB_WORKSPACE" "$evidence"

      - name: Open authenticated package worker
        id: package-debug
        if: needs.detect.outputs.live != 'true' && inputs.package_public_key != ''
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.package_public_key }}
          idle-timeout-minutes: '10'

      - name: Wait for connected package client
        if: steps.package-debug.outcome == 'success'
        shell: bash
        run: |
          bash "$RUNNER_TEMP/manifest-patch-repo/.github/scripts/release-debug-session.sh" \
            wait-for-client "$RUNNER_TEMP/package-debug-evidence"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Verify the package source version
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          BUILD: ${{ needs.detect.outputs.build }}
        run: |
          set -euo pipefail
          bash "$CODEX_TOOLING" package-identity source \
            --source-root "$GITHUB_WORKSPACE" --version "$VERSION" --build "$BUILD"

      # Upstream's release commit stamps the tag version into codex-rs/Cargo.toml but leaves the lockfile at 0.0.0. Cargo
      # would rewrite the lockfile during the build and dirty the checkout the release records, so the alignment is committed.
      - name: Commit the lockfile's workspace package versions aligned with the release version
        run: bash "$CODEX_TOOLING" align-workspace-lock --source-root "$GITHUB_WORKSPACE"

      - name: Set the reproducible package cache build epoch
        if: inputs.package_cargo_cache
        run: |
          set -euo pipefail
          # OpenSSL records the build time in libcrypto.a. Use the patched source's
          # commit time for the pilot so identical native inputs produce the same key.
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install upstream's Zig prerequisite
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0

      - name: Stage the verified Zig distribution for the package cache
        id: package-cache-zig
        if: inputs.package_cargo_cache && runner.os == 'Linux'
        continue-on-error: ${{ !inputs.package_cache_key_only }}
        run: bash "$RUNNER_TEMP/manifest-patch-repo/.github/scripts/package-cargo-cache.sh" stage-zig

      - name: Install upstream's musl build inputs
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bash .github/scripts/install-musl-build-tools.sh
          if [[ -n "${CODEX_PACKAGE_CACHE_ZIG:-}" ]]; then
            # Finish the package action's Linux package installation before keying.
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils make pkg-config libcap-dev
          fi
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_$TARGET"
          printf '%s=1\n' "${target_no_jitter//-/_}" >> "$GITHUB_ENV"

      - name: Verify and configure upstream V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Prepare the upstream Bazel host for the selected target
        id: voice-bazel-host
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: release-voice-${{ matrix.target }}

      - name: Expose the matching MSVC environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Install the selected Windows voice build prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VOICE_METADATA: ${{ runner.temp }}/voice-release-metadata
          VOICE_EVIDENCE: ${{ runner.temp }}/voice-windows-evidence-${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VOICE_METADATA/setup-baseline-windows-voice.ps1" `
            -EvidenceDirectory $env:VOICE_EVIDENCE -Target $env:TARGET

      - name: Recompute the selected Windows Bazel path
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: ./.github/scripts/compute-bazel-windows-path.ps1 -Target $env:TARGET

      - name: Fit the build into the hosted Linux runner's memory
        if: runner.os == 'Linux'
        run: bash "$RUNNER_TEMP/package-smoke-tools/fit-linux-build-memory.sh"

      - name: Select platform build settings
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo 'GIT_REDIRECT_STDIN=NUL' >> "$GITHUB_ENV"
          fi
          if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
            echo 'LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC' >> "$GITHUB_ENV"
          fi
          # A voice helper identity query that fails keeps its stdout and stderr here; the evidence upload collects them.
          echo "CODEX_VOICE_DIAGNOSTICS_DIR=$RUNNER_TEMP/voice-helper-identity-$TARGET" >> "$GITHUB_ENV"

      - name: Prepare the private Linux voice build mount
        if: inputs.package_cargo_cache && matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo install -d -o root -g root -m 0755 /var/lib/codex-voice-build
          scratch="$(mktemp -d "$RUNNER_TEMP/voice-native.XXXXXXXX")"
          touch "$scratch/mount-ready"
          echo "CODEX_VOICE_SANDBOX_SCRATCH=$scratch" >> "$GITHUB_ENV"

      - name: Verify the exact sealed voice cache producer
        if: inputs.voice_cache_phase == 'warm'
        id: voice-cache-producer
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_CACHE_SOURCE: ${{ inputs.voice_cache_source }}
        run: |
          set -euo pipefail
          IFS=: read -r producer digest <<< "$VOICE_CACHE_SOURCE"
          test "$producer" != "$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$producer" | jq -e \
            --arg producer "$producer" --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" \
            --arg repository "$GITHUB_REPOSITORY" '(.id | tostring) == $producer and
            .head_repository.full_name == $repository and .head_sha == $sha and .head_branch == $branch and
            .path == ".github/workflows/upstream-auto-release.yml" and .event == "workflow_dispatch" and
            .status == "completed" and .conclusion == "success" and .run_attempt == 1' >/dev/null
          printf 'run_id=%s\nmanifest_sha256=%s\n' "$producer" "$digest" >> "$GITHUB_OUTPUT"

      - name: Download the sealed voice cache bundle from its producer run
        if: inputs.voice_cache_phase == 'warm'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-voice-cache-${{ matrix.target }}
          path: ${{ runner.temp }}/sealed-voice-cache
          run-id: ${{ steps.voice-cache-producer.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Prepare and verify the sealed voice runtime for this patched source
        id: voice-build
        env:
          SOURCE_ROOT: ${{ github.workspace }}
          VOICE_METADATA: ${{ runner.temp }}/voice-release-metadata
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_BUILD: ${{ needs.detect.outputs.build }}
          VOICE_CACHE_PHASE: ${{ inputs.voice_cache_phase }}
          VOICE_CACHE_PRODUCER: ${{ steps.voice-cache-producer.outputs.run_id }}
          VOICE_CACHE_MANIFEST_SHA256: ${{ steps.voice-cache-producer.outputs.manifest_sha256 }}
          VOICE_WINDOWS_SYSTEM_ROOT: ${{ env.VOICE_WINDOWS_SYSTEM_ROOT }}
          VOICE_WINDOWS_HOST_ARCH: ${{ env.VOICE_WINDOWS_HOST_ARCH }}
        run: |
          set -euo pipefail
          physical_source="$(cd "$SOURCE_ROOT" && pwd -P)"
          test -z "$(git -C "$physical_source" status --porcelain --untracked-files=no)"
          build_commit="$(git -C "$physical_source" rev-parse HEAD)"
          [[ "$build_commit" =~ ^[0-9a-f]{40}$ ]]
          result_parent="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          result_dir="$result_parent/voice-build-$TARGET"
          test ! -e "$result_dir"
          if [[ "$RUNNER_OS" == Windows ]]; then
            test -n "$VOICE_WINDOWS_SYSTEM_ROOT"
            test -n "$VOICE_WINDOWS_HOST_ARCH"
            export SystemRoot="$VOICE_WINDOWS_SYSTEM_ROOT"
            export PROCESSOR_ARCHITECTURE="$VOICE_WINDOWS_HOST_ARCH"
          fi
          if [[ "$VOICE_CACHE_PHASE" != warm ]]; then
            bash .github/scripts/codex-voice-runtime.sh build \
              --upstream-root "$physical_source" --target "$TARGET" --build-commit "$build_commit" \
              --result-dir "$result_dir"
          fi
          if [[ "$VOICE_CACHE_PHASE" == cold || "$VOICE_CACHE_PHASE" == warm ]]; then
            python3 "$RUNNER_TEMP/manifest-patch-repo/.github/scripts/macos-sealed-voice-cache.py" \
              "$VOICE_CACHE_PHASE" --target "$TARGET" --version "$RELEASE_VERSION+$RELEASE_BUILD" \
              --result "$result_dir" --cache "$result_parent/sealed-voice-cache" \
              --evidence "$result_parent/sealed-voice-cache-evidence" \
              --producer-run "$VOICE_CACHE_PRODUCER" --manifest-sha256 "$VOICE_CACHE_MANIFEST_SHA256"
          fi
          test "$(git -C "$physical_source" rev-parse HEAD)" = "$build_commit"
          test -z "$(git -C "$physical_source" status --porcelain --untracked-files=no)"
          release_dir="$result_dir/release"
          test -d "$release_dir"
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          test -f "$result_dir/verification/packaged-runtime-test-bin$suffix"
          test -f "$result_dir/verification/installed-package-runtime-test-bin$suffix"
          verification_artifact="$RUNNER_TEMP/voice-verification-$TARGET"
          mkdir "$verification_artifact"
          cp "$result_dir/verification/packaged-runtime-test-bin$suffix" \
            "$result_dir/verification/installed-package-runtime-test-bin$suffix" "$verification_artifact/"
          (cd "$verification_artifact" && sha256sum packaged-runtime-test-bin"$suffix" \
            installed-package-runtime-test-bin"$suffix" > SHA256SUMS)
          printf '%s\n' "$TARGET" > "$verification_artifact/target"
          printf '%s\n' "$build_commit" > "$verification_artifact/source-commit"
          printf 'result_dir=%s\nrelease_dir=%s\nbuild_commit=%s\nverification_artifact=%s\ntooling_launcher=%s\n' \
            "$result_dir" "$release_dir" "$build_commit" "$verification_artifact" "$CODEX_TOOLING" >> "$GITHUB_OUTPUT"

      - name: Retain the independently verified sealed voice cache bundle
        if: inputs.voice_cache_phase == 'cold'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: sealed-voice-cache-${{ matrix.target }}
          path: ${{ runner.temp }}/sealed-voice-cache
          retention-days: 3
          if-no-files-found: error

      - name: Retain cold or restored native voice verification evidence
        if: contains(fromJSON('["cold","warm"]'), inputs.voice_cache_phase)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: sealed-voice-cache-evidence
          path: ${{ runner.temp }}/sealed-voice-cache-evidence
          retention-days: 3
          if-no-files-found: error

      - name: Prepare the package Cargo cache transport
        id: package-cache-transport
        if: inputs.package_cargo_cache && !inputs.package_cache_key_only && (runner.os == 'macOS' || steps.package-cache-zig.outcome == 'success')
        continue-on-error: true
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Identify the exact package Cargo cache inputs
        id: package-cache-inputs
        if: inputs.package_cache_key_only || steps.package-cache-transport.outcome == 'success'
        continue-on-error: ${{ !inputs.package_cache_key_only }}
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.upstream_commit }}
          VERSION: ${{ needs.detect.outputs.version }}
          PATCHES: ${{ needs.detect.outputs.patches }}
          VOICE_RELEASE_DIR: ${{ steps.voice-build.outputs.release_dir }}
          VOICE_BUILD_COMMIT: ${{ steps.voice-build.outputs.build_commit }}
        run: |
          set -euo pipefail
          scripts="$RUNNER_TEMP/manifest-patch-repo/.github/scripts"
          if [[ "$RUNNER_OS" == macOS ]]; then
            bash "$scripts/macos-package-cargo-cache.sh" inputs
          else
            bash "$scripts/package-cargo-cache.sh" inputs
          fi

      - name: Retain the package cache key receipt
        if: steps.package-cache-inputs.outcome == 'success'
        continue-on-error: ${{ !inputs.package_cache_key_only }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: package-cargo-cache-key-${{ matrix.target }}
          path: ${{ runner.temp }}/package-cargo-cache-key.txt
          retention-days: 3
          if-no-files-found: error

      - name: Restore the exact package Cargo cache
        id: package-cache-restore
        timeout-minutes: 20
        if: ${{ !inputs.package_cache_key_only && steps.package-cache-inputs.outputs.tag != '' }}
        continue-on-error: true
        env:
          CACHE_TAG: ${{ steps.package-cache-inputs.outputs.tag }}
          GHCR_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          scripts="$RUNNER_TEMP/manifest-patch-repo/.github/scripts"
          if [[ "$RUNNER_OS" == macOS ]]; then
            bash "$scripts/macos-package-cargo-cache.sh" restore
          else
            bash "$scripts/package-cargo-cache.sh" restore
          fi

      - name: Build and smoke-test upstream's package archives
        id: package
        if: ${{ !inputs.package_cache_key_only }}
        uses: ./.github/actions/build-codex-packages
        with:
          target: ${{ matrix.target }}
          package-version: ${{ needs.detect.outputs.version }}+${{ needs.detect.outputs.build }}
          build-mode: release
          prepared-musl-zig: ${{ env.CODEX_PACKAGE_CACHE_ZIG }}
          voice-release-dir: ${{ steps.voice-build.outputs.release_dir }}
          voice-build-commit: ${{ steps.voice-build.outputs.build_commit }}
          tooling-launcher: ${{ steps.voice-build.outputs.tooling_launcher }}

      # A package build or smoke-test failure fails the job. Rerun only to collect diagnostic baseline evidence.
      - name: Collect diagnostic smoke-test baseline evidence
        if: failure() && steps.package.outcome == 'failure'
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.upstream_commit }}
          PACKAGE_SMOKE_TOOLS: ${{ runner.temp }}/package-smoke-tools
          PACKAGE_SMOKE_EVIDENCE: ${{ runner.temp }}/package-smoke-evidence
          PYTHONPATH: ${{ github.workspace }}/sdk/python/src${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/sdk/python/tests
        run: bash "$PACKAGE_SMOKE_TOOLS/package-smoke-baseline.sh" compare

      - name: Include supplied legal documents in final package archives
        if: steps.package.outcome == 'success'
        run: |
          set -euo pipefail
          bash "$CODEX_TOOLING" package-license finalize \
            --metadata-root "$RUNNER_TEMP/package-legal-metadata" \
            --upstream-root "$GITHUB_WORKSPACE" --package-root "$RUNNER_TEMP" \
            --archive-root "$GITHUB_WORKSPACE/dist/$TARGET" --target "$TARGET"

      - name: Verify both finalized voice archives and the installed package
        if: steps.package.outcome == 'success'
        id: voice-final-verification
        env:
          SOURCE_ROOT: ${{ github.workspace }}
          VOICE_RESULT: ${{ steps.voice-build.outputs.result_dir }}
          VOICE_BUILD_COMMIT: ${{ steps.voice-build.outputs.build_commit }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}+${{ needs.detect.outputs.build }}
          VOICE_METADATA: ${{ runner.temp }}/voice-release-metadata
        run: |
          set -euo pipefail
          physical_source="$(cd "$SOURCE_ROOT" && pwd -P)"
          test "$(git -C "$physical_source" rev-parse HEAD)" = "$VOICE_BUILD_COMMIT"
          test -z "$(git -C "$physical_source" status --porcelain --untracked-files=no)"
          native_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          gzip_package="$native_temp/final primary gzip package $TARGET"
          zstd_package="$native_temp/final primary zstd package $TARGET"
          installed_package=''
          installer_assets=''
          resolver_scratch=''
          cleanup_voice_packages() {
            for owned_path in "$gzip_package" "$zstd_package" "$installed_package" "$installer_assets" "$resolver_scratch"; do
              if [[ -n "$owned_path" && -e "$owned_path" ]]; then rm -rf -- "$owned_path"; fi
            done
          }
          trap cleanup_voice_packages EXIT
          mkdir "$gzip_package" "$zstd_package"
          tar -xzf - -C "$gzip_package" < "$GITHUB_WORKSPACE/dist/$TARGET/codex-package-$TARGET.tar.gz"
          resolver_scratch="$(mktemp -d "$native_temp/voice-zstd-argv-$TARGET.XXXXXX")"
          resolver_json="$resolver_scratch/argv.json"
          resolver_nul="$resolver_scratch/argv.nul"
          bash "$CODEX_TOOLING" resolve-zstd --upstream-root "$physical_source" > "$resolver_json"
          node -e 'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(a)||a.length===0||a.some(x=>typeof x!=="string"||x.includes("\0")))process.exit(2);fs.writeFileSync(process.argv[2],Buffer.from(a.join("\0")+"\0"))' \
            "$resolver_json" "$resolver_nul"
          zstd_argv=()
          while IFS= read -r -d '' arg; do zstd_argv+=("$arg"); done < "$resolver_nul"
          test "${#zstd_argv[@]}" -gt 0
          "${zstd_argv[@]}" -d -c "$GITHUB_WORKSPACE/dist/$TARGET/codex-package-$TARGET.tar.zst" | \
            tar -xf - -C "$zstd_package"
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          for package in "$gzip_package" "$zstd_package"; do
            evidence="$native_temp/voice-archive-evidence-$(basename "$package")"
            bash "$CODEX_TOOLING" voice-runtime verify --package-dir "$package" \
              --upstream-root "$physical_source" --target "$TARGET" --build-commit "$VOICE_BUILD_COMMIT" \
              --package-version "$PACKAGE_VERSION" \
              --test-binary "$VOICE_RESULT/verification/packaged-runtime-test-bin$suffix" \
              --installed-test-binary "$VOICE_RESULT/verification/installed-package-runtime-test-bin$suffix" \
              --evidence-dir "$evidence"
          done
          installer_assets="$native_temp/installer-fixture-assets-$TARGET"
          mkdir "$installer_assets"
          primary_archive="$GITHUB_WORKSPACE/dist/$TARGET/codex-package-$TARGET.tar.gz"
          cp "$primary_archive" "$installer_assets/"
          # GNU sha256sum on Windows writes binary-mode entries ("<digest> *<name>"). The release's SHA256SUMS uses
          # text-mode entries, which the installer expects, so write that form on every platform.
          primary_digest=$(sha256sum < "$primary_archive" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$primary_digest" "$(basename "$primary_archive")" > "$installer_assets/SHA256SUMS"
          installed_package="$native_temp/installed voice package $TARGET"
          installer_evidence="$native_temp/voice-installer-evidence-$TARGET"
          node "$VOICE_METADATA/verify-voice-installer.mjs" --upstream-root "$physical_source" \
            --assets "$installer_assets" --target "$TARGET" --package-version "$PACKAGE_VERSION" \
            --scratch-root "$native_temp" --installed-package-output "$installed_package" \
            --evidence-dir "$installer_evidence"
          bash "$CODEX_TOOLING" voice-runtime verify --package-dir "$installed_package" \
            --upstream-root "$physical_source" --target "$TARGET" --build-commit "$VOICE_BUILD_COMMIT" \
            --package-version "$PACKAGE_VERSION" \
            --test-binary "$VOICE_RESULT/verification/packaged-runtime-test-bin$suffix" \
            --installed-test-binary "$VOICE_RESULT/verification/installed-package-runtime-test-bin$suffix" \
            --evidence-dir "$native_temp/voice-installed-evidence-$TARGET"
          test "$(git -C "$physical_source" rev-parse HEAD)" = "$VOICE_BUILD_COMMIT"
          test -z "$(git -C "$physical_source" status --porcelain --untracked-files=no)"
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

      - name: Retain verification-only voice test binaries and evidence
        if: always() && !inputs.package_cache_key_only
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: voice-verification-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.voice-build.outputs.verification_artifact }}
            ${{ runner.temp }}/voice-build-${{ matrix.target }}/evidence
            ${{ runner.temp }}/voice-archive-evidence-*
            ${{ runner.temp }}/voice-installer-evidence-${{ matrix.target }}
            ${{ runner.temp }}/voice-installed-evidence-${{ matrix.target }}
            ${{ runner.temp }}/voice-helper-identity-${{ matrix.target }}
          retention-days: 3
          if-no-files-found: warn

      - name: Record completed native package inputs
        if: steps.package.outcome == 'success'
        run: |
          set -euo pipefail
          native_options=(
            --build-result "$CODEX_PACKAGE_BUILD_RESULT"
            --archive-result "$CODEX_PACKAGE_ARCHIVE_RESULT"
            --target "$TARGET" --package-root "$RUNNER_TEMP"
            --output "$RUNNER_TEMP/native-inputs.json"
            --runner-arch "$RUNNER_ARCH"
            --configured-v8-archive "$RUSTY_V8_ARCHIVE"
          )
          if [[ ${ImageOS+x} ]]; then native_options+=(--image-os "$ImageOS"); fi
          if [[ ${ImageVersion+x} ]]; then native_options+=(--image-version "$ImageVersion"); fi
          bash "$CODEX_TOOLING" release-native-inputs "${native_options[@]}"

      - name: Collect the release assets
        if: steps.package.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          cp "dist/$TARGET/codex-package-$TARGET.tar.gz" "$RUNNER_TEMP/assets/"
          cp "dist/$TARGET/codex-app-server-package-$TARGET.tar.gz" "$RUNNER_TEMP/assets/"
          # Debug symbols (dSYM, PDB or debuginfo) that the package action strips from the binaries, so crashes in
          # released binaries can be symbolicated.
          cp "symbols-dist/$TARGET/codex-symbols-$TARGET.tar.gz" "$RUNNER_TEMP/assets/"
          if [[ "$TARGET" == x86_64-unknown-linux-musl ]]; then
            # The installers come from the patched tree, which routes them to this repository's releases.
            cp scripts/install/install.sh scripts/install/install.ps1 "$RUNNER_TEMP/assets/"
          fi

      - name: Verify the final archived CLI identity
        if: steps.package.outcome == 'success'
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          BUILD: ${{ needs.detect.outputs.build }}
        run: |
          set -euo pipefail
          native_temp="$(cd "$RUNNER_TEMP" && pwd)"
          proof_package="$(mktemp -d "$native_temp/package-identity.XXXXXX")"
          trap 'rm -rf -- "$proof_package"' EXIT
          tar -xzf - -C "$proof_package" < "$native_temp/assets/codex-package-$TARGET.tar.gz"
          bash "$CODEX_TOOLING" package-identity binary \
            --package-dir "$proof_package" --version "$VERSION" --build "$BUILD" \
            --output "$RUNNER_TEMP/assets/codex-version-$TARGET.txt"

      - name: Record package receipt and source identity
        if: steps.package.outcome == 'success'
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          BUILD: ${{ needs.detect.outputs.build }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          # The manifest tool rejects any untracked file. The package build writes four directories into the checkout that
          # upstream's .gitignore does not cover: symbols-dist/ and dist/ (package actions), .cargo-home/ (upstream's
          # build-cargo-package-binaries action hard-codes it as the Linux Cargo home) and .zig-cache/ (zig cc, which
          # writes it under the working directory of whichever compile runs, so it is excluded at any depth). Every other
          # path it writes is already ignored upstream (codex-rs/target, bazel-*, __pycache__, .venv). Excluding exactly
          # these directories keeps the tool's clean check strict for source files.
          printf '/dist/\n/symbols-dist/\n/.cargo-home/\n.zig-cache/\n' >> "$(git rev-parse --git-path info/exclude)"
          git status --porcelain --untracked-files=normal
          bash "$CODEX_TOOLING" release-manifest receipt \
            --source "$GITHUB_WORKSPACE" --patch-repo "$RUNNER_TEMP/manifest-patch-repo" \
            --target "$TARGET" --version "$VERSION+$BUILD" --build-number "$BUILD" \
            --upstream-tag "$UPSTREAM_TAG" --upstream-commit "$UPSTREAM_COMMIT" --fork-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --assets "$RUNNER_TEMP/assets" --output "$RUNNER_TEMP/assets/package-receipt-$TARGET.json" \
            --native-inputs "$RUNNER_TEMP/native-inputs.json"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: steps.package.outcome == 'success'
        with:
          name: assets-${{ matrix.target }}
          path: ${{ runner.temp }}/assets/*
          retention-days: 3
          if-no-files-found: error

      - name: Save verified package Cargo dependencies
        timeout-minutes: 20
        if: steps.package.outcome == 'success' && steps.package-cache-inputs.outputs.tag != '' && steps.package-cache-restore.outputs.result != 'hit'
        continue-on-error: true
        env:
          CACHE_TAG: ${{ steps.package-cache-inputs.outputs.tag }}
          GHCR_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          scripts="$RUNNER_TEMP/manifest-patch-repo/.github/scripts"
          if [[ "$RUNNER_OS" == macOS ]]; then
            bash "$scripts/macos-package-cargo-cache.sh" save
          else
            bash "$scripts/package-cargo-cache.sh" save
          fi

      - name: Wait for the macOS package debug client to exit
        if: always() && runner.os == 'macOS' && inputs.package_cache_key_only && steps.package-debug.outcome == 'success'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/package-debug-evidence"
          until [[ -f "$evidence/client-released" && ! -L "$evidence/client-released" ]]; do
            sleep 2
          done

      - name: Remove the tooling runtime
        # The macOS key-only worker retains its files through Upterm post cleanup.
        if: always() && !(runner.os == 'macOS' && inputs.package_cache_key_only)
        run: rm -rf -- "$RUNNER_TEMP/codex-tooling"

  publish:
    name: Publish the release
    needs: [detect, package]
    if: needs.detect.outputs.live == 'true' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One publisher per upstream version. A rerun of this job reuses the artifacts the package jobs built.
    concurrency:
      group: upstream-auto-release-publish-${{ needs.detect.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      action: ${{ steps.recheck.outputs.action }}
      tag: ${{ steps.recheck.outputs.tag }}
      build: ${{ needs.detect.outputs.build }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling

      - name: Gather the built assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: assets-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: Write checksums and notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          BUILD: ${{ needs.detect.outputs.build }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          packages=("$assets"/codex-package-*.tar.gz)
          test "${#packages[@]}" = 6 -a -f "${packages[0]}"
          symbols=("$assets"/codex-symbols-*.tar.gz)
          test "${#symbols[@]}" = 6 -a -f "${symbols[0]}"
          test -f "$assets/install.sh" -a -f "$assets/install.ps1"
          bash "$CODEX_TOOLING" release-manifest assemble \
            --receipts "$assets" --assets "$assets" --output "$assets/release-manifest.json"
          bash "$CODEX_TOOLING" upstream-auto-release notes --version "$VERSION" --build "$BUILD" \
            --upstream-tag "$UPSTREAM_TAG" --upstream-commit "$UPSTREAM_COMMIT" --fork-commit "$GITHUB_SHA" \
            --readme patches/README.md --changelog CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Reconcile the original publication request
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/recheck"
          mkdir -p "$work"
          # GitHub's API answers an occasional 504, so every read retries.
          gh_api() {
            local attempt
            for attempt in 1 2 3 4 5; do
              gh api "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          gh_api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -s 'add' > "$work/fork.json"
          resolved_upstream="$(gh_api "repos/openai/codex/commits/$UPSTREAM_TAG" --jq .sha)"
          if [[ "$resolved_upstream" != "$UPSTREAM_COMMIT" ]]; then
            printf '::error::Upstream tag %s targets %s; the built identity requires %s\n' \
              "$UPSTREAM_TAG" "$resolved_upstream" "$UPSTREAM_COMMIT"
            exit 1
          fi
          git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "refs/tags/$TAG" "refs/tags/$TAG^{}" > "$work/tag-refs"
          tag_commit="$(awk '$2 ~ /\^\{\}$/ {peeled=$1; next} {direct=$1} END {print peeled ? peeled : direct}' "$work/tag-refs")"
          bash "$CODEX_TOOLING" upstream-auto-release publication --fork-releases "$work/fork.json" \
            --tag "$TAG" --fork-commit "$GITHUB_SHA" --upstream-tag "$UPSTREAM_TAG" \
            --upstream-commit "$UPSTREAM_COMMIT" --tag-commit "$tag_commit" --assets-directory "$RUNNER_TEMP/assets" \
            --notes "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.recheck.outputs.phase == 'create' || steps.recheck.outputs.phase == 'upload'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*

      # Publish only the original request. A retry of a published request proceeds directly to installation.
      - name: Publish the release as a prerelease
        if: steps.recheck.outputs.phase == 'create' || steps.recheck.outputs.phase == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          NAME: ${{ needs.detect.outputs.release_name }}
          PHASE: ${{ steps.recheck.outputs.phase }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          if [[ "$PHASE" == create ]]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Codex Unleashed $NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          LC_ALL=C
          for asset in "$assets"/*; do
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$asset" --clobber
          done
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease \
            --notes-file "$RUNNER_TEMP/notes.md"

  verify-install:
    name: Installer and npm consumer - ${{ matrix.target }}
    needs: [detect, publish, verify-release]
    if: needs.publish.outputs.action == 'release'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {runner: macos-15, target: aarch64-apple-darwin}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc}
    env:
      RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download
      TAG_URL: rust-v${{ needs.detect.outputs.version }}%2B${{ needs.publish.outputs.build }}
      CODEX_RELEASE: ${{ needs.detect.outputs.version }}+${{ needs.publish.outputs.build }}
      CODEX_NON_INTERACTIVE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Obtain the independently verified CLI archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-cli-archives
          path: ${{ runner.temp }}/npm-release-archives

      - name: Install with the one-line command on Linux or macOS
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          export CODEX_INSTALL_DIR="$RUNNER_TEMP/codex-bin"
          curl -fsSL "$RELEASE_BASE/$TAG_URL/install.sh" | bash
          "$CODEX_INSTALL_DIR/codex" --version | tee "$RUNNER_TEMP/version.txt"
          node .github/scripts/codex-version-banner.mjs "$CODEX_RELEASE" < "$RUNNER_TEMP/version.txt"

      - name: Install with the one-line command on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy ByPass -c "irm $env:RELEASE_BASE/$env:TAG_URL/install.ps1 | iex"
          if ($LASTEXITCODE -ne 0) { throw "Installer failed with exit code $LASTEXITCODE" }
          $codex = Get-ChildItem -Path "$env:LOCALAPPDATA", "$HOME\.codex" -Recurse -Filter codex.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $codex) { throw 'codex.exe was not installed' }
          $version = & $codex.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI --version failed with exit code $LASTEXITCODE" }
          Write-Output $version
          ($version -join "`n") | node .github/scripts/codex-version-banner.mjs $env:CODEX_RELEASE
          if ($LASTEXITCODE -ne 0) { throw "Unexpected version: $version" }

      - name: Install the exact npm release from an isolated local registry
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          native_temp="$PWD"
          scratch="$(mktemp -d "$native_temp/npm-consumer.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir "$scratch/tools" "$scratch/cache" "$scratch/tmp" "$scratch/packages"
          cd "$GITHUB_WORKSPACE"
          cp .github/npm-verification/package.json .github/npm-verification/package-lock.json "$scratch/tools/"
          export TMPDIR="$scratch/tmp"
          if npm ci --prefix "$scratch/tools" --cache "$scratch/cache" --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org; then
            :
          else
            npm ci --prefix "$scratch/tools" --cache "$scratch/cache" --ignore-scripts --no-audit --no-fund \
              --registry=https://registry.npmmirror.com
          fi

          archive_root="$native_temp/npm-release-archives"
          while IFS= read -r target; do
            mkdir "$scratch/packages/$target"
            tar -xzf - -C "$scratch/packages/$target" < "$archive_root/codex-package-$target.tar.gz"
          done < <(node -e 'for (const entry of JSON.parse(require("node:fs").readFileSync(".github/release-matrix.json", "utf8"))) console.log(entry.target)')
          node .github/scripts/verify-local-npm.mjs \
            --package-root "$scratch/packages" --tools "$scratch/tools" \
            --npm-cli "$scratch/tools/node_modules/npm/bin/npm-cli.js" \
            --scratch-root "$scratch" --evidence-dir "$RUNNER_TEMP/npm-evidence"

      - name: Retain native npm consumer evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: npm-consumer-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/npm-evidence
            ${{ runner.temp }}/npm-release-archives/release-manifest.json
            ${{ runner.temp }}/npm-release-archives/SHA256SUMS
          retention-days: 3
          if-no-files-found: warn

      - name: Remove the downloaded npm inputs
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/npm-release-archives" "$RUNNER_TEMP/npm-evidence"

  verify-release:
    name: Independently verify published assets and source
    needs: [detect, publish]
    if: needs.publish.outputs.action == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling

      - name: Download and authenticate the published manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/verified-assets"
          gh release download "$TAG" -R holdmyspot-com/codex-unleashed --dir "$RUNNER_TEMP/verified-assets"
          gh attestation verify "$RUNNER_TEMP/verified-assets/release-manifest.json" \
            --repo holdmyspot-com/codex-unleashed \
            --signer-workflow holdmyspot-com/codex-unleashed/.github/workflows/upstream-auto-release.yml

      - name: Reconstruct the recorded source and verify every release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/verified-assets/release-manifest.json"
          fork_commit="$(jq -er '.fork_commit | select(test("^[0-9a-f]{40}$"))' "$manifest")"
          upstream_commit="$(jq -er '.upstream.commit | select(test("^[0-9a-f]{40}$"))' "$manifest")"
          upstream_tag="$(jq -er '.upstream.tag | select(test("^rust-v[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$manifest")"
          patch_repo="$RUNNER_TEMP/verified-fork"
          source="$RUNNER_TEMP/verified-source"
          git clone --filter=blob:none --no-checkout https://github.com/holdmyspot-com/codex-unleashed.git "$patch_repo"
          git -C "$patch_repo" fetch --depth=1 origin "$fork_commit"
          git -C "$patch_repo" checkout --detach FETCH_HEAD
          git clone --filter=blob:none --no-checkout https://github.com/openai/codex.git "$source"
          git -C "$source" fetch --depth=1 origin "refs/tags/$upstream_tag:refs/tags/$upstream_tag"
          git -C "$source" checkout --detach "$upstream_commit"
          read -r -a patch_paths <<< "$(bash "$CODEX_TOOLING" upstream-auto-release patches --readme "$patch_repo/patches/README.md")"
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git -C "$source" rev-parse --absolute-git-dir)/info/attributes"
          for patch in "${patch_paths[@]}"; do
            git -C "$source" -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$patch_repo/$patch"
          done
          # The release committed the lockfile's workspace package versions after replaying the queue, and its recorded
          # commit and tree include that commit. A queue that already aligned the lockfile gets no extra commit.
          bash "$CODEX_TOOLING" align-workspace-lock --source-root "$source"
          bash scripts/verify-release.sh "$RUNNER_TEMP/verified-assets" --patch-repo "$patch_repo" \
            --upstream-source "$source" --verify-attestations

      - name: Hand off verified CLI archives to native npm consumers
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: verified-cli-archives
          path: |
            ${{ runner.temp }}/verified-assets/codex-package-*.tar.gz
            ${{ runner.temp }}/verified-assets/release-manifest.json
            ${{ runner.temp }}/verified-assets/SHA256SUMS
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Remove independent verification inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/verified-assets" "$RUNNER_TEMP/verified-fork" "$RUNNER_TEMP/verified-source"

  mark-latest:
    name: Mark the release latest
    needs: [detect, publish, verify-install, verify-release]
    if: needs.publish.outputs.action == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest
          printf "## Published\n\nRelease \`%s\` is installed on six targets and marked latest.\n" "$TAG" >> "$GITHUB_STEP_SUMMARY"
