name: CP9 Windows linker control
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Public key for the authenticated diagnostic worker
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Windows x64 linker control
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare debug evidence
        run: mkdir "$RUNNER_TEMP/package-debug-evidence"
      - name: Open authenticated Windows worker
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.public_key }}
          idle-timeout-minutes: '10'
      - name: Wait for authenticated Windows client
        run: bash .github/scripts/release-debug-session.sh wait-for-client "$RUNNER_TEMP/package-debug-evidence"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc
      - id: link
        name: Replay the exact Rust LLD with a fixed input
        run: python .github/scripts/cp9-windows-link-control.py "$RUNNER_TEMP/link-control"
      - name: Publish linker control evidence
        if: always() && steps.link.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-x64-link-control
          path: ${{ runner.temp }}/link-control/evidence/
          if-no-files-found: error
