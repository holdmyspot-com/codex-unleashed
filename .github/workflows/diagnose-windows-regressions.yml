name: Diagnose focused Windows regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-tooling:
    uses: ./.github/workflows/prepare-tooling.yml
    with:
      runner: windows-2022

  regressions:
    needs: prepare-tooling
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Trace credential export coordination
        shell: pwsh
        run: |
          $path = 'upstream/codex-rs/model-provider/src/provider.rs'
          $text = Get-Content -LiteralPath $path -Raw
          $replacements = @(
            @('let first_refresh = first_export.recover_from_unauthorized();', 'let coordination_started = std::time::Instant::now(); eprintln!("export coordination: refresh starts"); let first_refresh = first_export.recover_from_unauthorized();'),
            @('assert_eq!(read_counter(), "111");', 'eprintln!("export coordination: export marker observed after {:?}", coordination_started.elapsed()); assert_eq!(read_counter(), "111");'),
            @('std::fs::write(&export_gate, []).expect("export gate should open");', 'eprintln!("export coordination: opening gate after {:?}", coordination_started.elapsed()); std::fs::write(&export_gate, []).expect("export gate should open");'),
            @('let (first_result, second_result) = tokio::join!(first_refresh, second_refresh);', 'let (first_result, second_result) = tokio::join!(first_refresh, second_refresh); eprintln!("export coordination: refresh finished after {:?}: {:?} {:?}", coordination_started.elapsed(), first_result, second_result);')
          )
          foreach ($replacement in $replacements) {
            if (-not $text.Contains($replacement[0])) { throw ('Missing diagnostic boundary: ' + $replacement[0]) }
            $text = $text.Replace($replacement[0], $replacement[1])
          }
          Set-Content -LiteralPath $path -Value $text -Encoding utf8
      - name: Repeat complete regression targets
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary --print-failed-test-logs --windows-msvc-host-platform \
            -- test --config=ci-windows-msvc --platforms=//:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --nocache_test_results --runs_per_test=5 --test_output=errors \
            -- //codex-rs/uds:uds-unit-tests //codex-rs/model-provider:model-provider-unit-tests
