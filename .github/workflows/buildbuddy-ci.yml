name: BuildBuddy CI
run-name: BuildBuddy ${{ inputs.task || 'probe' }} (${{ inputs.target || 'x86_64-unknown-linux-gnu' }})
on:
  workflow_call:
    inputs:
      task:
        required: true
        type: string
      target:
        default: x86_64-unknown-linux-gnu
        type: string
      upstream_ref:
        default: ''
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      task:
        description: Linux CI task
        required: true
        default: probe
        type: string
      target:
        description: Rust target triple
        default: x86_64-unknown-linux-gnu
        type: string
      upstream_ref:
        description: Optional upstream revision
        default: ''
        type: string
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Annotate locations with typos
        if: inputs.task == 'codespell'
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/codespell-matcher.json"
      - uses: ./.github/actions/run-buildbuddy
        id: remote
        with:
          task: ${{ inputs.task || 'probe' }}
          target: ${{ inputs.target || 'x86_64-unknown-linux-gnu' }}
          upstream-ref: ${{ inputs.upstream_ref }}
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Upload remote diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildbuddy-${{ inputs.task }}-${{ inputs.target || 'x86_64-unknown-linux-gnu' }}
          path: ${{ runner.temp }}/buildbuddy-artifacts
          retention-days: 1
          if-no-files-found: ignore
