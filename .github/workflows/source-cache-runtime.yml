name: Cargo cache helper runtime

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target to verify, or all for the complete native matrix
        type: string
        default: all
      partial-cache:
        description: Test private GHCR partial-state round trip (select x86_64-unknown-linux-musl)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: matrix
        env:
          SELECTED_TARGET: ${{ inputs.target || 'all' }}
          PARTIAL_CACHE_ENABLED: ${{ inputs.partial-cache }}
        run: |
          if [[ "$PARTIAL_CACHE_ENABLED" == true && "$SELECTED_TARGET" != x86_64-unknown-linux-musl ]]; then
            printf 'The private partial-cache diagnostic requires target=x86_64-unknown-linux-musl.\n' >&2
            exit 2
          fi
          value="$(jq -ce --arg target "$SELECTED_TARGET" '
            (if $target == "all" then . else map(select(.target == $target)) end)
            | if length == 0 then error("Unknown release target") else {include: .} end
          ' .github/release-matrix.json)"
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

  verify:
    needs: select
    name: Helper - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Prepare owned build and evidence directories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-cache-evidence" "$RUNNER_TEMP/source-cache-temp"
          git rev-parse HEAD > "$RUNNER_TEMP/source-cache-evidence/restart-commit"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/source-cache-temp" >> "$GITHUB_ENV"

      - name: Set up the helper's native JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Set up the fixture's native Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: 1.99.1

      - name: Build and verify the bundled cache helper
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-cache-evidence"
          java -version 2> "$evidence/java-version.txt"
          mvn -version > "$evidence/maven-version.txt"
          mvn -B -ntp -f tooling/cli/pom.xml -Pruntime \
            "-Dtooling.build.directory=$RUNNER_TEMP/source-cache-build" \
            "-Dmaven.repo.local=$RUNNER_TEMP/source-cache-maven" \
            "-Djava.io.tmpdir=$TMPDIR" verify 2>&1 | tee "$evidence/verify.log"

      - name: Set up private partial-cache transport
        if: inputs.partial-cache
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Authenticate private partial-cache transport
        if: inputs.partial-cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Exercise the packaged launcher and Cargo freshness behavior
        env:
          PARTIAL_CACHE_ENABLED: ${{ inputs.partial-cache }}
        run: |
          set -euo pipefail
          bash_path="$(command -v bash)"
          if command -v cygpath >/dev/null 2>&1; then
            bash_path="$(cygpath -m "$bash_path")"
          fi
          fixture_args=("$RUNNER_TEMP/source-cache-build/runtime" "$RUNNER_TEMP/source-cache-evidence/fixture" "$bash_path")
          if [[ "$PARTIAL_CACHE_ENABLED" == true ]]; then
            fixture_args+=(--cache-transport "$GITHUB_WORKSPACE/.github/scripts/ghcr-cargo-target-cache.sh" --cache-repository "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cargo-cache")
          fi
          python3 .github/scripts/test-source-cache-runtime.py "${fixture_args[@]}"

      - name: Retain private cache version metadata for isolation and retention review
        if: inputs.partial-cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-cache-evidence"
          gh api --paginate "orgs/${GITHUB_REPOSITORY_OWNER,,}/packages/container/cargo-cache/versions" \
            --jq '.[] | {id, name, tags: .metadata.container.tags}' \
            > "$evidence/private-cache-versions.jsonl"

      - name: Verify repository source remains unchanged
        if: always()
        run: |
          set -euo pipefail
          git diff --binary > "$RUNNER_TEMP/source-cache-evidence/source.diff"
          test -z "$(git status --porcelain)"

      - name: Retain native runtime evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-cache-runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/source-cache-evidence
          retention-days: 1
