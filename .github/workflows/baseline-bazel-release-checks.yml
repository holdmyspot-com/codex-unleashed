name: Stable upstream Bazel release checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-gnullvm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Select the maintained tooling JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build the tooling runtime
        shell: bash
        env:
          TOOLING_ROOT: restart-metadata
        run: bash restart-metadata/.github/scripts/setup-tooling.sh

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-release-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/scripts/setup-baseline-windows-voice.ps1 "$RUNNER_TEMP/setup-baseline-windows-voice.ps1"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          cp restart-metadata/.github/scripts/buildbuddy-cache.sh "$RUNNER_TEMP/"
          cp restart-metadata/.github/scripts/fit-linux-build-memory.sh "$RUNNER_TEMP/"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-release-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Prepare upstream's Bazel host and toolchain
        uses: ./.github/actions/prepare-bazel-ci
        with:
          cache-scope: baseline-release-checks
          target: ${{ matrix.target }}

      - name: Reclaim inactive Xcode versions and verify selected native tools
        if: runner.os == 'macOS'
        run: |
          bash "$CODEX_TOOLING" reclaim-baseline-macos-xcodes \
            --evidence-directory "$RUNNER_TEMP/baseline-bazel-release-evidence"

      - name: Set up Python for upstream's Windows voice prerequisites
        if: runner.os == 'Windows'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Prepare upstream's native Windows voice tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/setup-baseline-windows-voice.ps1" -EvidenceDirectory "$env:RUNNER_TEMP/baseline-bazel-release-evidence/voice-tools"

      - name: Record the native host and capacity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          evidence="$RUNNER_TEMP/baseline-bazel-release-evidence"
          {
            uname -a
            printf 'runner_os=%s\ntarget=%s\n' "$RUNNER_OS" "$TARGET"
            df -k "$CI_BUILD_ROOT/" "$RUNNER_TEMP"
            bazel --version
          } | tee "$evidence/host.txt"
          test "$(cat .bazelversion)" = 9.2.0

      - name: Reclaim unused hosted-image toolchains on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-release-evidence"
          df -k / "$RUNNER_TEMP" > "$evidence/disk-before.txt"
          for unused in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; do
            if [[ -d "$unused" ]]; then
              sudo du -sk "$unused" | tee -a "$evidence/reclaimed-toolchains.txt"
              sudo rm -rf -- "$unused"
            fi
          done
          df -k / "$RUNNER_TEMP" > "$evidence/disk-after.txt"
          # Retries from a mirror outside ubuntu.com when the image's Ubuntu servers fail.
          sudo bash "$CODEX_TOOLING" apt-install-with-fallback build-essential pkg-config libcap-dev libasound2-dev bubblewrap bison flex

      - name: Resolve upstream's compatibility releases on Linux
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_exec_server_releases.py > "$RUNNER_TEMP/baseline-bazel-release-evidence/compat-releases.json"

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up upstream's Rust toolchain for workspace metadata
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Synchronize release workspace versions without dependency upgrades
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-release-evidence"
          cargo metadata --format-version 1 --filter-platform "$TARGET" \
            --manifest-path codex-rs/Cargo.toml > "$RUNNER_TEMP/baseline-cargo-metadata.json"
          bash "$CODEX_TOOLING" verify-workspace-lock-versions "$GITHUB_WORKSPACE"
          git diff --check
          git diff -- codex-rs/Cargo.lock > "$evidence/workspace-version-lock.diff"
          git diff --binary > "$evidence/source-before.diff"

      - name: Retain prepared macOS host evidence before compilation
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-bazel-release-host-${{ matrix.target }}
          path: ${{ runner.temp }}/baseline-bazel-release-evidence
          retention-days: 3
          if-no-files-found: error

      # Remote cache only, and only for a trusted run (see buildbuddy-cache.sh). The key reaches this step and the finish
      # step, never the Bazel wrapper; without it Bazel keeps using the GHCR disk caches.
      - name: Configure the BuildBuddy remote cache
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash "$RUNNER_TEMP/buildbuddy-cache.sh" configure "$GITHUB_WORKSPACE"

      # The Linux job lost its hosted runner ("lost communication with the server") in run 45292051191 while compiling
      # exec-server test binaries with up to seven actions running on the 16 GB runner, as the Linux Bazel test shards
      # and release builds did. Reuse the release builds' swap file and memory sampler.
      - name: Fit the build into the hosted Linux runner's memory
        if: runner.os == 'Linux'
        run: bash "$RUNNER_TEMP/fit-linux-build-memory.sh"

      - name: Compile the maintained release selection with debug assertions disabled
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-release-evidence"
          export CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR="$evidence/execution-logs"
          mkdir -p "$CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR"
          if [[ "$RUNNER_OS" == Linux ]]; then
            export CODEX_COMPAT_RELEASES
            CODEX_COMPAT_RELEASES="$(cat "$evidence/compat-releases.json")"
          fi
          wrapper_args=(--print-failed-action-summary)
          if [[ "$RUNNER_OS" == Windows ]]; then
            wrapper_args+=(--windows-cross-compile)
          fi
          build_args=(
            --disk_cache=
            --compilation_mode=fastbuild
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )
          if [[ "$RUNNER_OS" == Windows ]]; then
            build_args+=(--workspace_status_command=./scripts/workspace-status.cmd --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1)
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            build_args+=(
              "--extra_toolchains=//third_party/voice:windows_pkg_config_toolchain,//third_party/voice:windows_cmake_toolchain"
              # Bazel's local Windows C++ toolchain defaults _WIN32_WINNT to 0x0601 (Windows 7) while V8's build defines
              # 0x0A00 (Windows 10), so every V8 compile warned that the macro was redefined. Rust's MSVC targets need
              # Windows 10, and the release packages are built with Cargo, so this changes only the Bazel jobs.
              # rules_cc passes the value to cl.exe as the whole flag, so it must include /D_WIN32_WINNT=.
              --repo_env=BAZEL_WIN32_WINNT=/D_WIN32_WINNT=0x0A00
              --inject_repository="voice_windows_tools=$VOICE_WINDOWS_BAZEL_REPOSITORY"
              --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools
              --action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT"
              --host_action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT"
              --action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH"
              --host_action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH"
            )
          fi
          bash scripts/list-bazel-release-targets.sh > "$evidence/release-targets.txt"
          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done < "$evidence/release-targets.txt"
          (
            while true; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              df -k "$CI_BUILD_ROOT/" "$RUNNER_TEMP"
              if du -k -d 3 "$CI_BUILD_ROOT/" | sort -nr | sed -n '1,30p'; then
                :
              else
                printf 'directory_sample_exit=%s\n' "$?"
              fi
              sleep 60
            done
          ) >> "$evidence/disk-usage.log" 2>&1 &
          disk_monitor=$!
          trap 'kill "$disk_monitor" 2>/dev/null || true; wait "$disk_monitor" || true' EXIT
          set +e
          .github/scripts/run-bazel-ci.sh "${wrapper_args[@]}" -- \
            build "${build_args[@]}" --build_metadata="COMMIT_SHA=$(cat "$evidence/upstream-commit")" -- \
            "${targets[@]}" 2>&1 | tee "$evidence/bazel-release.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" > "$evidence/bazel-release.receipt"
          git diff --binary > "$evidence/source-after.diff"
          cmp "$evidence/source-before.diff" "$evidence/source-after.diff"
          exit "$result"

      - name: Verify the maintained Linux bundled executable target
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-release-evidence"
          export CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR="$evidence/execution-logs"
          export CODEX_COMPAT_RELEASES
          CODEX_COMPAT_RELEASES="$(cat "$evidence/compat-releases.json")"
          set +e
          .github/scripts/run-bazel-ci.sh --remote-download-toplevel --print-failed-action-summary -- \
            build --disk_cache= --build_metadata="COMMIT_SHA=$(cat "$evidence/upstream-commit")" -- \
            //codex-rs/bwrap:bwrap 2>&1 | tee "$evidence/bazel-bwrap.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" > "$evidence/bazel-bwrap.receipt"
          git diff --binary > "$evidence/source-after-bwrap.diff"
          cmp "$evidence/source-before.diff" "$evidence/source-after-bwrap.diff"
          exit "$result"

      - name: Verify upstream source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.inputs.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Keep the BuildBuddy key out of the retained evidence
        if: always()
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash "$RUNNER_TEMP/buildbuddy-cache.sh" finish "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-bazel-release-evidence"

      - name: Keep the memory samples with the evidence
        if: always() && runner.os == 'Linux'
        run: cp "$RUNNER_TEMP/memory-samples.log" "$RUNNER_TEMP/baseline-bazel-release-evidence/" 2>/dev/null || true

      - name: Retain build evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-bazel-release-checks-${{ matrix.target }}
          path: ${{ runner.temp }}/baseline-bazel-release-evidence
          retention-days: 3
          if-no-files-found: warn

      - name: Remove the job-owned tooling runtime
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/codex-tooling"
