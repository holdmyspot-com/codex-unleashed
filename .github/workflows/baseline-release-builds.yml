name: Stable upstream release builds
run-name: ${{ inputs.session_id && format('Release builds - {0} - {1}', inputs.target, inputs.session_id) || 'Stable upstream release builds' }}

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Optional SSH public key; connect and create RUNNER_TEMP/baseline-evidence/client-ready before release commands
        type: string
        default: ''
      session_id:
        description: Optional client correlation identifier for this retained worker run
        type: string
        default: ''
      scheduler:
        description: Opt in to the installed scheduler; requires accepted native prerequisites for every selected target
        type: boolean
        default: false
      cache:
        description: Use GHCR compiled outputs and Actions downloads for verified release targets
        type: boolean
        default: false
      require_cache_hit:
        description: Requires cache=true; fail before compilation if all compiled-cache lookups miss
        type: boolean
        default: false
      fail_after_build:
        description: Deliberately fail after compilation to verify partial-cache recovery; retry with false
        type: boolean
        default: false
      verify_cli_units:
        description: Run CLI library and codex binary unit tests in the release profile
        type: boolean
        default: false
      verify_invalidation:
        description: Linux x86-64 cached run only; verify a changed CLI commit input and unchanged-input reuse
        type: boolean
        default: false
      trace_signals:
        description: Linux diagnostic only; stream runner signals, memory samples and journal during compilation
        type: boolean
        default: false
      target:
        description: Release target to run (all preserves the complete selected matrix)
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: matrix
        env:
          CACHE_ENABLED: ${{ inputs.cache }}
          CACHE_HIT_REQUIRED: ${{ inputs.require_cache_hit }}
          SELECTED_TARGET: ${{ inputs.target }}
          VERIFY_INVALIDATION: ${{ inputs.verify_invalidation }}
          TRACE_SIGNALS: ${{ inputs.trace_signals }}
          SCHEDULER_ENABLED: ${{ inputs.scheduler }}
        run: |
          if [[ "$CACHE_HIT_REQUIRED" == true && "$CACHE_ENABLED" == false ]]; then
            printf 'require_cache_hit=true requires cache=true.\n' >&2
            exit 1
          fi
          if [[ "$TRACE_SIGNALS" == true ]]; then
            case "$SELECTED_TARGET" in
              aarch64-unknown-linux-musl | x86_64-unknown-linux-musl) ;;
              *) printf 'Signal tracing requires one Linux release target.\n' >&2; exit 1 ;;
            esac
          fi
          if [[ "$VERIFY_INVALIDATION" == true ]]; then
            if [[ "$CACHE_ENABLED" != true || "$SELECTED_TARGET" != x86_64-unknown-linux-musl ]]; then
              printf 'Invalidation verification requires cache=true and target=x86_64-unknown-linux-musl.\n' >&2
              exit 1
            fi
          fi
          value="$(jq -ce --argjson cache "$CACHE_ENABLED" --arg target "$SELECTED_TARGET" '
            (if $cache then map(select(."baseline-verified" == true)) else . end)
            | (if $target == "all" then . else map(select(.target == $target)) end)
            | if length == 0 then error("Selected target is not enabled for this build mode") else {include: .} end
          ' .github/release-matrix.json)"
          if [[ "$SCHEDULER_ENABLED" == true ]]; then
            jq -e --argjson matrix "$value" '
              . as $readiness | all($matrix.include[];
                $readiness.targets[.target].cargoNativeReady == true)
            ' .github/scheduler-release-prerequisites.json >/dev/null || {
              printf 'Scheduler native prerequisites remain unmet for at least one selected target.\n' >&2
              exit 1
            }
          fi
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    name: Baseline - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.target }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ matrix.split-debug-info }}
      TARGET: ${{ matrix.target }}
      BINARY_SUFFIX: ${{ matrix.binary-suffix }}
      CARGO_CACHE_PARTS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          cargo_home="$RUNNER_TEMP/baseline-cargo-home"
          cargo_target_dir="$RUNNER_TEMP/baseline-target"
          if [[ '${{ inputs.scheduler }}' == true ]]; then cargo_target_dir="$GITHUB_WORKSPACE/codex-rs/target"; fi
          mkdir -p "$evidence" "$cargo_home" "$cargo_target_dir"
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\n' "$cargo_home" "$cargo_target_dir" >> "$GITHUB_ENV"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
          package="$(cat restart-metadata/.github/cargo-cache-package)"
          printf 'CARGO_CACHE_REPOSITORY=ghcr.io/%s/%s\n' "$owner" "$package" >> "$GITHUB_ENV"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          cp restart-metadata/.github/scripts/ghcr-cargo-target-cache.sh "$RUNNER_TEMP/ghcr-cargo-target-cache.sh"
          cp restart-metadata/.github/scripts/checkpoint-upstream-release.sh "$RUNNER_TEMP/checkpoint-upstream-release.sh"
          chmod +x "$RUNNER_TEMP/checkpoint-upstream-release.sh"
          cp restart-metadata/.github/scripts/test-build-upstream-release.py "$RUNNER_TEMP/test-build-upstream-release.py"
          cp restart-metadata/.github/scripts/verify-codex-cache-invalidation.py "$RUNNER_TEMP/verify-codex-cache-invalidation.py"
          cp restart-metadata/.github/scripts/test-ghcr-cargo-target-cache.sh "$RUNNER_TEMP/test-ghcr-cargo-target-cache.sh"
          cp restart-metadata/.github/scripts/build-upstream-release.sh "$RUNNER_TEMP/build-upstream-release.sh"
          cp restart-metadata/.github/scripts/provision-release-scheduler.sh "$RUNNER_TEMP/provision-release-scheduler.sh"
          if [[ -n "$DEBUG_PUBLIC_KEY" ]]; then
            cp -R restart-metadata/.github/actions/debug-failed-runner "$RUNNER_TEMP/release-debug-action"
          fi
          if [[ '${{ inputs.scheduler }}' == true ]]; then
            cp -R restart-metadata/.github/scripts/release-scheduler-native "$RUNNER_TEMP/release-scheduler-native"
            for script in provision-release-scheduler.sh release-scheduler-cargo.sh; do
              cp "restart-metadata/.github/scripts/$script" "$RUNNER_TEMP/$script"
              chmod +x "$RUNNER_TEMP/$script"
            done
          fi
          cp restart-metadata/.github/scripts/probe-runner-signals.py "$RUNNER_TEMP/probe-runner-signals.py"
          sha256sum restart-metadata/.github/scripts/build-upstream-release.sh > "$evidence/build-command-inputs.sha256"
          sha256sum restart-metadata/.github/workflows/baseline-release-builds.yml \
            restart-metadata/.github/scripts/{ghcr-cargo-target-cache,checkpoint-upstream-release}.sh \
            restart-metadata/tooling/cli/src/main/java/com/holdmyspot/codexunleashed/tooling/{Main,CargoCacheKeys,CargoCacheParts,VerifyCargoLock}.java \
            > "$evidence/cache-wrapper-inputs.sha256"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"
        env:
          DEBUG_PUBLIC_KEY: ${{ inputs.public_key }}

      - name: Preserve the cache helper before upstream checkout
        run: |
          set -euo pipefail
          cp -R restart-metadata/tooling/cli "$RUNNER_TEMP/source-cache-helper"
          mkdir -p "$RUNNER_TEMP/source-cache-temp"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/source-cache-temp" >> "$GITHUB_ENV"
          (
            cd restart-metadata
            git ls-files -z -- tooling/cli/pom.xml tooling/cli/src/main tooling/cli/src/build \
              | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/baseline-evidence/cache-helper-inputs.sha256"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"
          git show HEAD:codex-rs/Cargo.lock > "$evidence/upstream-Cargo.lock"

      - name: Prepare retained release worker
        if: inputs.public_key != ''
        run: |
          bash "$RUNNER_TEMP/provision-release-scheduler.sh" prepare-debug-session \
            "$RUNNER_TEMP/release-debug-action" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-evidence"

      - name: Open authenticated release worker
        if: inputs.public_key != ''
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.public_key }}

      - name: Wait for connected release client
        if: inputs.public_key != ''
        run: bash "$RUNNER_TEMP/provision-release-scheduler.sh" wait-for-client "$RUNNER_TEMP/baseline-evidence"

      - name: Record Linux runner capacity
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          {
            uname -a
            lscpu
            free -h
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          } | tee "$RUNNER_TEMP/baseline-evidence/runner-capacity.log"

      - name: Record macOS runner capacity
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          {
            sw_vers
            sysctl hw.model hw.logicalcpu hw.physicalcpu hw.memsize
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          } | tee "$RUNNER_TEMP/baseline-evidence/runner-capacity.log"

      - name: Record Windows runner capacity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & {
            Get-CimInstance Win32_ComputerSystem | Format-List Manufacturer, Model, NumberOfLogicalProcessors, TotalPhysicalMemory
            Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          } | Out-String | Tee-Object -FilePath "$env:RUNNER_TEMP/baseline-evidence/runner-capacity.log"

      - name: Install Linux bwrap prerequisites
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

      - name: Set up the upstream Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependency downloads
        if: inputs.cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          prefix-key: upstream-${{ steps.inputs.outputs.commit }}-downloads-v1
          workspaces: codex-rs -> ${{ env.CARGO_TARGET_DIR }}
          cache-targets: false
          cache-bin: false
          add-rust-environment-hash-key: false
          shared-key: ${{ matrix.target }}

      - name: Install upstream's Zig prerequisite
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: ${{ inputs.cache }}

      - name: Exclude generated Zig cache from checkout source inventory
        if: runner.os == 'Linux'
        run: printf '\n/.zig-cache/\n' >> "$(git rev-parse --git-path info/exclude)"

      - name: Install upstream's musl build inputs
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-musl-build-tools.sh

      - name: Select upstream's musl entropy configuration
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_$TARGET"
          target_no_jitter="${target_no_jitter//-/_}"
          printf '%s=1\n' "$target_no_jitter" >> "$GITHUB_ENV"

      - name: Verify and configure upstream V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Expose the matching MSVC environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Select upstream's Windows SQLite configuration
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: echo 'LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC' >> "$GITHUB_ENV"

      - name: Select noninteractive Git input on Windows
        if: runner.os == 'Windows'
        run: echo 'GIT_REDIRECT_STDIN=NUL' >> "$GITHUB_ENV"

      - name: Set up the cache helper's native JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build and verify the bundled cache helper
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          java -version 2> "$evidence/cache-helper-java-version.txt"
          mvn -version > "$evidence/cache-helper-maven-version.txt"
          mvn -B -ntp -e -f "$RUNNER_TEMP/source-cache-helper/pom.xml" -Pruntime \
            "-Dtooling.build.directory=$RUNNER_TEMP/source-cache-build" \
            "-Dmaven.repo.local=$RUNNER_TEMP/source-cache-maven" \
            "-Djava.io.tmpdir=$TMPDIR" verify 2>&1 | tee "$evidence/cache-helper-build.log"
          printf 'CODEX_SOURCE_CACHE_TOOL=%s\n' "$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling" >> "$GITHUB_ENV"

      - name: Provision the job-exclusive scheduler installation
        if: inputs.scheduler
        env:
          RELEASE_SCHEDULER_HEADROOM_BYTES: "1073741824"
          RELEASE_SCHEDULER_MAX_JOBS: "2"
          RELEASE_SCHEDULER_CONTROL_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/release-native"
          bash "$RUNNER_TEMP/provision-release-scheduler.sh" prepare-native \
            "$RUNNER_TEMP/source-cache-build/runtime" "$native" "$RUNNER_TEMP/release-scheduler-native" \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/scheduler-native-setup.log"
          toolchain="$(rustc --print sysroot)"
          if [[ "$RUNNER_OS" == Windows ]]; then toolchain="$(cygpath -u "$toolchain")"; fi
          frida_name=frida
          if [[ "$RUNNER_OS" == Windows ]]; then frida_name=frida.dll; fi
          dependencies=("$native/$frida_name")
          if [[ "$RUNNER_OS" == Linux ]]; then dependencies+=("$native/libcgroup.so"); fi
          bash "$RUNNER_TEMP/provision-release-scheduler.sh" install \
            "$RUNNER_TEMP/source-cache-build/runtime" "$toolchain" "${dependencies[@]}"
          printf 'RELEASE_CARGO_COMMAND=%s/release-scheduler-cargo.sh\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RELEASE_SCHEDULER_HEADROOM_BYTES=%s\nRELEASE_SCHEDULER_MAX_JOBS=%s\nRELEASE_SCHEDULER_CONTROL_TIMEOUT_MS=%s\n' \
            "$RELEASE_SCHEDULER_HEADROOM_BYTES" "$RELEASE_SCHEDULER_MAX_JOBS" "$RELEASE_SCHEDULER_CONTROL_TIMEOUT_MS" >> "$GITHUB_ENV"

      - name: Select the declared Node version for cache transport checks
        if: inputs.cache
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Set up the GHCR cache transport
        if: inputs.cache
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1
          # ORAS 1.3.1 publishes no Windows ARM64 asset; select its Windows amd64 asset explicitly.
          url: ${{ runner.os == 'Windows' && 'https://github.com/oras-project/oras/releases/download/v1.3.1/oras_1.3.1_windows_amd64.zip' || '' }}
          checksum: ${{ runner.os == 'Windows' && '8cf69e46f966e592ad36261c05b8f59c02125743b7261c03f6badc3919b40cb0' || '' }}

      - name: Verify native cache archive transport
        if: inputs.cache
        run: |
          set -euo pipefail
          CODEX_TEST_ORAS="$(command -v oras)" TMPDIR="$RUNNER_TEMP" bash "$RUNNER_TEMP/test-ghcr-cargo-target-cache.sh" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/cache-transport-test.log"
          python3 "$RUNNER_TEMP/test-build-upstream-release.py" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/build-stage-test.log"

      - name: Log in to the GHCR cache
        if: inputs.cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Identify exact and compatible compiled-cache inputs
        id: cache_inputs
        if: inputs.cache
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          {
            rustc -vV
            cargo --version
            cat "$evidence/build-command-inputs.sha256"
            printf '%s\n' "$TARGET" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}"
            env | LC_ALL=C sort | grep -E '^(RUSTC|RUSTC_WRAPPER|RUSTFLAGS|RUSTDOCFLAGS|RUSTY_V8_[A-Z_]+|CARGO_INCREMENTAL|CARGO_BUILD_TARGET|CARGO_BUILD_RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|CARGO_PROFILE_RELEASE_[A-Z_]+|CARGO_TARGET_[A-Z0-9_]+_LINKER|CC(_[A-Za-z0-9_]+)?|CXX(_[A-Za-z0-9_]+)?|AR(_[A-Za-z0-9_]+)?|TARGET_CC|TARGET_CXX|CFLAGS(_[A-Za-z0-9_]+)?|CXXFLAGS(_[A-Za-z0-9_]+)?|CMAKE_[A-Z_]+|([A-Z0-9_]+_)?OPENSSL_[A-Z_]+|AWS_LC_SYS_NO_JITTER_ENTROPY[A-Za-z0-9_]*|LIBSQLITE3_FLAGS|PKG_CONFIG_[A-Za-z0-9_]+)='
            sha256sum codex-rs/Cargo.lock codex-rs/rust-toolchain.toml
          } > "$evidence/compiler-cache-inputs.txt"
          cat "$evidence/upstream-commit" "$evidence/cache-wrapper-inputs.sha256" "$evidence/cache-helper-inputs.sha256" "$evidence/compiler-cache-inputs.txt" > "$evidence/compiled-cache-inputs.txt"
          bash "$CODEX_SOURCE_CACHE_TOOL" cargo-cache-keys "$TARGET" \
            "$evidence/upstream-commit" "$evidence/cache-wrapper-inputs.sha256" \
            "$evidence/cache-helper-inputs.sha256" "$evidence/compiler-cache-inputs.txt" \
            | tee "$evidence/cache-keys.txt" >> "$GITHUB_OUTPUT"

      - name: Restore compiled Cargo outputs from GHCR
        if: inputs.cache
        env:
          CACHE_TAG: ${{ steps.cache_inputs.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache_inputs.outputs.seed_tag }}
          CACHE_HIT_REQUIRED: ${{ inputs.require_cache_hit }}
        run: |
          set -euo pipefail
          set +e
          bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull "${CARGO_CACHE_REPOSITORY}" "$CACHE_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/compiled-cache-restore.log"
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" == 3 ]]; then
            printf 'Verified cache absent; trying unverified partial build state.\n'
            set +e
            bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull-partial "${CARGO_CACHE_REPOSITORY}" "$CACHE_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/partial-cache-restore.log"
            result=${PIPESTATUS[0]}
            set -e
          fi
          if [[ "$result" == 3 ]]; then
            printf 'Exact state absent; trying compatible state. Cargo and all acceptance checks still run.\n'
            set +e
            bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull "${CARGO_CACHE_REPOSITORY}" "$CACHE_SEED_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/compatible-cache-restore.log"
            result=${PIPESTATUS[0]}
            set -e
          fi
          if [[ "$result" == 3 ]]; then
            set +e
            bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull-partial "${CARGO_CACHE_REPOSITORY}" "$CACHE_SEED_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/compatible-partial-cache-restore.log"
            result=${PIPESTATUS[0]}
            set -e
          fi
          case "$result" in
            0) ;;
            3)
              if [[ "$CACHE_HIT_REQUIRED" == true ]]; then
                printf 'All compiled-cache lookups missed; require_cache_hit=true prevents a cold build.\n' >&2
                exit 1
              fi
              ;;
            *) exit "$result" ;;
          esac

      - name: Prepare content-checked cached source freshness
        id: cache_prepare
        if: inputs.cache
        working-directory: codex-rs
        run: |
          set -euo pipefail
          binaries=(codex codex-code-mode-host codex-responses-api-proxy codex-app-server)
          case "$TARGET" in
            *-linux-musl) binaries+=(bwrap) ;;
            *-windows-msvc)
              binaries+=(codex-windows-sandbox-setup codex-windows-sandbox-service codex-command-runner)
              ;;
          esac
          bash "$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling" \
            clean-cached-release-binaries "$GITHUB_WORKSPACE/codex-rs" "$TARGET" "${binaries[@]}" \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/source-cache-prepare.log"

      - name: Build the upstream release binaries with default features
        id: release_build
        working-directory: codex-rs
        env:
          CACHE_TAG: ${{ steps.cache_inputs.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache_inputs.outputs.seed_tag }}
          CACHE_ENABLED: ${{ inputs.cache }}
          TRACE_SIGNALS: ${{ inputs.trace_signals }}
          VERIFY_CLI_UNITS: ${{ inputs.verify_cli_units }}
        run: |
          if [[ "$CACHE_ENABLED" == true ]]; then
            export RELEASE_CHECKPOINT_COMMAND="$RUNNER_TEMP/checkpoint-upstream-release.sh"
          fi
          case "$TARGET" in
            aarch64-unknown-linux-musl | x86_64-unknown-linux-musl)
              export CARGO_BUILD_JOBS=2
              printf 'Limiting Linux Cargo compilation to two concurrent jobs after observed memory pressure.\n'
              ;;
          esac
          printf 'cargo_build_jobs=%s\n' "${CARGO_BUILD_JOBS:-default}" \
            | tee "$RUNNER_TEMP/baseline-evidence/cargo-concurrency.log"
          release_command=(bash "$RUNNER_TEMP/build-upstream-release.sh")
          if [[ "$VERIFY_CLI_UNITS" == true ]]; then
            cat > "$RUNNER_TEMP/build-and-check-upstream-release.sh" <<'SCRIPT'
          source "$RUNNER_TEMP/build-upstream-release.sh"
          compile test --locked --release --target "$TARGET" -p codex-cli --lib --bin codex -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/cli-unit-tests.log"
          SCRIPT
            release_command=(bash "$RUNNER_TEMP/build-and-check-upstream-release.sh")
          fi

          if [[ "$TRACE_SIGNALS" == true ]]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bpftrace
            cd "$RUNNER_TEMP/baseline-evidence"
            python3 "$RUNNER_TEMP/probe-runner-signals.py" \
              env --chdir="$GITHUB_WORKSPACE/codex-rs" "${release_command[@]}"
          else
            "${release_command[@]}"
          fi

      - name: Controlled failure for partial-cache verification
        if: inputs.fail_after_build
        run: |
          printf 'Deliberate post-compilation failure: fail_after_build=true. Retry this revision with fail_after_build=false.\n' \
            | tee "$RUNNER_TEMP/baseline-evidence/controlled-failure.log"
          exit 1

      - name: Smoke-test both native executable variants
        run: |
          set -euo pipefail
          output="$CARGO_TARGET_DIR/$TARGET/release"
          "$output/codex$BINARY_SUFFIX" --version | tee "$RUNNER_TEMP/baseline-evidence/codex-version.log"
          "$output/codex-app-server$BINARY_SUFFIX" --version | tee "$RUNNER_TEMP/baseline-evidence/app-server-version.log"

      - name: Verify upstream source and tests remain unmodified
        id: source_guard
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.inputs.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Verify dependency identity before accepting build outputs
        id: dependency_guard
        if: success() || (failure() && inputs.cache && steps.cache_prepare.outcome == 'success' && steps.source_guard.outcome == 'success')
        working-directory: codex-rs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          cargo metadata --no-deps --format-version 1 > "$evidence/workspace-metadata.json"
          bash "$CODEX_SOURCE_CACHE_TOOL" verify-cargo-lock \
            "$evidence/upstream-Cargo.lock" Cargo.lock "$evidence/workspace-metadata.json" \
            | tee "$evidence/lock-verification.json"

      - name: Record verified source inputs for cached build outputs
        if: success() && inputs.cache
        working-directory: codex-rs
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling" \
            clean-cached-release-binaries --record-source-inputs "$GITHUB_WORKSPACE/codex-rs" "$TARGET" \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/source-cache-record.log"

      - name: Save verified compiled Cargo outputs to GHCR
        if: success() && inputs.cache
        env:
          CARGO_CACHE_STAGE: final
          CACHE_TAG: ${{ steps.cache_inputs.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache_inputs.outputs.seed_tag }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" push "${CARGO_CACHE_REPOSITORY}" "$CACHE_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" "$CACHE_SEED_TAG" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/compiled-cache-save.log"

      - name: Save unverified partial compilation state for retry
        if: failure() && inputs.cache && steps.cache_prepare.outcome == 'success' && steps.source_guard.outcome == 'success' && steps.dependency_guard.outcome == 'success'
        env:
          CARGO_CACHE_STAGE: final
          CACHE_TAG: ${{ steps.cache_inputs.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache_inputs.outputs.seed_tag }}
        run: |
          set -euo pipefail
          printf 'Saving unverified compilation state after completed preparation and source/dependency verification; this run remains failed.\n'
          bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" push-partial "${CARGO_CACHE_REPOSITORY}" "$CACHE_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" "$CACHE_SEED_TAG" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/partial-cache-save.log"

      - name: Verify changed CLI input without publishing diagnostic outputs
        if: success() && inputs.verify_invalidation
        working-directory: codex-rs
        run: python3 "$RUNNER_TEMP/verify-codex-cache-invalidation.py"

      - name: Preserve cache input comparison evidence
        if: always() && inputs.cache
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          snapshots="$CARGO_TARGET_DIR/.codex-source-inputs"
          if [[ -d "$snapshots" ]]; then
            cp -R "$snapshots" "$evidence/source-input-state"
          fi
          git status --porcelain=v1 --untracked-files=all > "$evidence/final-source-status.txt"
          git ls-files --others --exclude-standard -z |
            while IFS= read -r -d '' source_path; do
              if [[ -f "$source_path" ]]; then
                sha256sum -- "$source_path"
              fi
            done > "$evidence/final-untracked-source-digests.txt"

      - name: Release only closed scheduler authority
        # A failed authenticated worker retains its installation for correction.
        # The connected owner may run this same cleanup after its final consumer;
        # otherwise terminal hosted-worker disposal follows the debug action post wait.
        if: always() && inputs.scheduler && env.RELEASE_SCHEDULER_ROOT != '' && (inputs.public_key == '' || success())
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/provision-release-scheduler.sh" cleanup "$RELEASE_SCHEDULER_ROOT" \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/scheduler-cleanup.log"

      - name: Retain baseline evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/baseline-evidence
            ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings
          retention-days: 1
          if-no-files-found: warn
