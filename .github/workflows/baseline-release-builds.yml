name: Stable upstream release builds
run-name: ${{ inputs.session_id && format('Release builds - {0} - {1}', inputs.target, inputs.session_id) || inputs.continuation > 0 && format('Release builds - {0} - {1} - continuation {2}', inputs.target, inputs.bundle, inputs.continuation) || 'Stable upstream release builds' }}

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Optional SSH public key; connect and create RUNNER_TEMP/baseline-evidence/client-ready before release commands
        type: string
        default: ''
      session_id:
        description: Optional client correlation identifier for this retained worker run
        type: string
        default: ''
      cache:
        description: Use GHCR compiled outputs and Actions downloads for verified release targets
        type: boolean
        default: false
      require_cache_hit:
        description: Requires cache=true; fail before compilation if all compiled-cache lookups miss
        type: boolean
        default: false
      prune:
        description: After a cached build, delete obsolete caches; false only plans the deletions
        type: boolean
        default: true
      fail_after_build:
        description: Deliberately fail after compilation to verify partial-cache recovery; retry with false
        type: boolean
        default: false
      verify_cli_units:
        description: Run CLI library and codex binary unit tests in the release profile
        type: boolean
        default: false
      verify_invalidation:
        description: Linux x86-64 cached run only; verify a changed CLI commit input and unchanged-input reuse
        type: boolean
        default: false
      trace_signals:
        description: Linux diagnostic only; stream runner signals, memory samples and journal during compilation
        type: boolean
        default: false
      quiet_stop_minutes:
        description: Stop a build whose evidence logs stay quiet and whose processes use no CPU this many minutes, after process reports
        type: number
        default: 75
      packages:
        description: Optional whitespace-separated Cargo packages; build only these, cache the partial state and fail before release checks
        type: string
        default: ''
      patches:
        description: Optional space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ''
      target:
        description: Release target to run (all preserves the complete selected matrix)
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
      bundle:
        description: Release bundle to build (all builds the primary and app-server bundles on separate runners)
        type: choice
        default: all
        options:
          - all
          - primary
          - app-server
      continuation:
        description: Automatic only; how many earlier runs this one continues after they reached the build time limit
        type: number
        default: 0

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: matrix
        env:
          CACHE_ENABLED: ${{ inputs.cache }}
          CACHE_HIT_REQUIRED: ${{ inputs.require_cache_hit }}
          SELECTED_TARGET: ${{ inputs.target }}
          VERIFY_INVALIDATION: ${{ inputs.verify_invalidation }}
          TRACE_SIGNALS: ${{ inputs.trace_signals }}
          QUIET_STOP_MINUTES: ${{ inputs.quiet_stop_minutes }}
          SELECTED_PACKAGES: ${{ inputs.packages }}
          VERIFY_CLI_UNITS: ${{ inputs.verify_cli_units }}
          SELECTED_BUNDLE: ${{ inputs.bundle }}
          CONTINUATION: ${{ inputs.continuation }}
        run: |
          if ! [[ "$CONTINUATION" =~ ^[0-9]+$ ]]; then
            printf 'continuation must be a whole number.\n' >&2
            exit 1
          fi
          if [[ -n "$SELECTED_PACKAGES" && "$SELECTED_BUNDLE" == app-server ]]; then
            printf 'A package selection builds as the primary bundle.\n' >&2
            exit 1
          fi
          if ! [[ "$QUIET_STOP_MINUTES" =~ ^[1-9][0-9]*$ ]] || (( QUIET_STOP_MINUTES > 300 )); then
            printf 'quiet_stop_minutes must be a whole number from 1 to 300.\n' >&2
            exit 1
          fi
          if [[ "$CACHE_HIT_REQUIRED" == true && "$CACHE_ENABLED" == false ]]; then
            printf 'require_cache_hit=true requires cache=true.\n' >&2
            exit 1
          fi
          if [[ "$TRACE_SIGNALS" == true ]]; then
            case "$SELECTED_TARGET" in
              aarch64-unknown-linux-musl | x86_64-unknown-linux-musl) ;;
              *) printf 'Signal tracing requires one Linux release target.\n' >&2; exit 1 ;;
            esac
          fi
          if [[ "$VERIFY_INVALIDATION" == true ]]; then
            if [[ "$CACHE_ENABLED" != true || "$SELECTED_TARGET" != x86_64-unknown-linux-musl ]]; then
              printf 'Invalidation verification requires cache=true and target=x86_64-unknown-linux-musl.\n' >&2
              exit 1
            fi
          fi
          if [[ "$VERIFY_CLI_UNITS" == true && "$SELECTED_TARGET" == x86_64-apple-darwin ]]; then
            printf 'verify_cli_units runs target tests, which the cross-compiling x86_64-apple-darwin build cannot run.\n' >&2
            exit 1
          fi
          # Each target builds upstream's two release bundles on separate machines: "primary" (every binary except
          # codex-app-server) and "app-server". A package selection builds once, as the primary bundle. An entry with a
          # build-runner compiles there and runs its native smoke tests on its runner in the smoke job.
          value="$(jq -ce --argjson cache "$CACHE_ENABLED" --arg target "$SELECTED_TARGET" --arg packages "$SELECTED_PACKAGES" \
            --arg bundle "$SELECTED_BUNDLE" '
            (if $cache then map(select(."baseline-verified" == true)) else . end)
            | (if $target == "all" then . else map(select(.target == $target)) end)
            | if length == 0 then error("Selected target is not enabled for this build mode") else . end
            | [.[] | . as $entry
                | (if $packages != "" then ["primary"] elif $bundle == "all" then ["primary", "app-server"] else [$bundle] end)[]
                | $entry + {bundle: ., "build-runner": ($entry."build-runner" // $entry.runner),
                  "smoke-separately": ($entry."build-runner" != null)}]
            | {include: .}
          ' .github/release-matrix.json)"
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"
          smoke="$(jq -cr '[.include[] | select(."smoke-separately")] | if length == 0 then "" else {include: .} end' <<< "$value")"
          printf 'smoke=%s\n' "$smoke" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    name: Baseline - ${{ matrix.target }} - ${{ matrix.bundle }}
    runs-on: ${{ matrix.build-runner }}
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.target }}-${{ matrix.bundle }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ matrix.split-debug-info }}
      TARGET: ${{ matrix.target }}
      BINARY_SUFFIX: ${{ matrix.binary-suffix }}
      RELEASE_BUNDLE: ${{ matrix.bundle }}
      RELEASE_BUILD_LIMIT_MINUTES: "320"
      CARGO_CACHE_PARTS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          cargo_home="$RUNNER_TEMP/baseline-cargo-home"
          cargo_target_dir="$RUNNER_TEMP/baseline-target"
          mkdir -p "$evidence" "$cargo_home" "$cargo_target_dir"
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\n' "$cargo_home" "$cargo_target_dir" >> "$GITHUB_ENV"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
          package="$(cat restart-metadata/.github/cargo-cache-package)"
          printf 'CARGO_CACHE_REPOSITORY=ghcr.io/%s/%s\n' "$owner" "$package" >> "$GITHUB_ENV"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          cp restart-metadata/.github/scripts/ghcr-cargo-target-cache.sh "$RUNNER_TEMP/ghcr-cargo-target-cache.sh"
          cp restart-metadata/.github/scripts/checkpoint-upstream-release.sh "$RUNNER_TEMP/checkpoint-upstream-release.sh"
          chmod +x "$RUNNER_TEMP/checkpoint-upstream-release.sh"
          cp restart-metadata/.github/scripts/test-build-upstream-release.py "$RUNNER_TEMP/test-build-upstream-release.py"
          cp restart-metadata/.github/scripts/verify-codex-cache-invalidation.py "$RUNNER_TEMP/verify-codex-cache-invalidation.py"
          cp restart-metadata/.github/scripts/test-ghcr-cargo-target-cache.sh "$RUNNER_TEMP/test-ghcr-cargo-target-cache.sh"
          cp restart-metadata/.github/scripts/test-codex-tooling-launch.py "$RUNNER_TEMP/test-codex-tooling-launch.py"
          cp restart-metadata/.github/scripts/build-upstream-release.sh "$RUNNER_TEMP/build-upstream-release.sh"
          cp restart-metadata/.github/scripts/fail-on-cargo-warnings.sh "$RUNNER_TEMP/fail-on-cargo-warnings.sh"
          cp restart-metadata/.github/scripts/release-debug-session.sh "$RUNNER_TEMP/release-debug-session.sh"
          if [[ -n "$DEBUG_PUBLIC_KEY" ]]; then
            cp -R restart-metadata/.github/actions/debug-failed-runner "$RUNNER_TEMP/release-debug-action"
          fi
          cp restart-metadata/.github/scripts/probe-runner-signals.py "$RUNNER_TEMP/probe-runner-signals.py"
          cp restart-metadata/.github/scripts/watch-quiet-build.py "$RUNNER_TEMP/watch-quiet-build.py"
          sha256sum restart-metadata/.github/scripts/build-upstream-release.sh > "$evidence/build-command-inputs.sha256"
          sha256sum restart-metadata/.github/workflows/baseline-release-builds.yml \
            restart-metadata/.github/scripts/{ghcr-cargo-target-cache,checkpoint-upstream-release}.sh \
            restart-metadata/tooling/cli/src/main/java/com/holdmyspot/codexunleashed/tooling/{Main,CargoCacheKeys,CargoCacheParts,VerifyCargoLock}.java \
            > "$evidence/cache-wrapper-inputs.sha256"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"
        env:
          DEBUG_PUBLIC_KEY: ${{ inputs.public_key }}

      - name: Preserve the cache helper before upstream checkout
        run: |
          set -euo pipefail
          cp -R restart-metadata/tooling/cli "$RUNNER_TEMP/source-cache-helper"
          mkdir -p "$RUNNER_TEMP/source-cache-temp"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/source-cache-temp" >> "$GITHUB_ENV"
          (
            cd restart-metadata
            git ls-files -z -- tooling/cli/pom.xml tooling/cli/src/main tooling/cli/src/build \
              | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/baseline-evidence/cache-helper-inputs.sha256"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"
          git show HEAD:codex-rs/Cargo.lock > "$evidence/upstream-Cargo.lock"

      - name: Apply the selected downstream patches
        id: source
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          # The exact cache tag hashes this record; an empty record keeps the pristine tag.
          : > "$evidence/applied-patches.txt"
          read -r -a patch_paths <<< "$DOWNSTREAM_PATCHES"
          # The guarded expansion keeps an empty list valid under set -u in macOS's Bash 3.2.
          for patch in ${patch_paths[@]+"${patch_paths[@]}"}; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          # Later guards compare the build against the commit and lockfile it compiles, with or without patches.
          git show HEAD:codex-rs/Cargo.lock > "$evidence/source-Cargo.lock"
          git rev-parse HEAD > "$evidence/source-commit"
          printf 'commit=%s\n' "$(cat "$evidence/source-commit")" >> "$GITHUB_OUTPUT"

      - name: Prepare retained release worker
        if: inputs.public_key != ''
        run: |
          bash "$RUNNER_TEMP/release-debug-session.sh" prepare \
            "$RUNNER_TEMP/release-debug-action" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-evidence"

      - name: Open authenticated release worker
        if: inputs.public_key != ''
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.public_key }}

      - name: Wait for connected release client
        if: inputs.public_key != ''
        run: bash "$RUNNER_TEMP/release-debug-session.sh" wait-for-client "$RUNNER_TEMP/baseline-evidence"

      - name: Record Linux runner capacity
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          {
            uname -a
            lscpu
            free -h
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          } | tee "$RUNNER_TEMP/baseline-evidence/runner-capacity.log"

      - name: Record macOS runner capacity
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          {
            sw_vers
            sysctl hw.model hw.logicalcpu hw.physicalcpu hw.memsize
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          } | tee "$RUNNER_TEMP/baseline-evidence/runner-capacity.log"

      - name: Record Windows runner capacity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & {
            Get-CimInstance Win32_ComputerSystem | Format-List Manufacturer, Model, NumberOfLogicalProcessors, TotalPhysicalMemory
            Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          } | Out-String | Tee-Object -FilePath "$env:RUNNER_TEMP/baseline-evidence/runner-capacity.log"

      - name: Install Linux bwrap prerequisites
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up the upstream Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependency downloads
        if: inputs.cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          prefix-key: upstream-${{ steps.inputs.outputs.commit }}-downloads-v1
          workspaces: codex-rs -> ${{ env.CARGO_TARGET_DIR }}
          cache-targets: false
          cache-bin: false
          add-rust-environment-hash-key: false
          shared-key: ${{ matrix.target }}

      - name: Install upstream's Zig prerequisite
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: ${{ inputs.cache }}

      - name: Exclude generated Zig cache from checkout source inventory
        if: runner.os == 'Linux'
        run: printf '\n/.zig-cache/\n' >> "$(git rev-parse --git-path info/exclude)"

      - name: Install upstream's musl build inputs
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-musl-build-tools.sh

      - name: Select upstream's musl entropy configuration
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_$TARGET"
          target_no_jitter="${target_no_jitter//-/_}"
          printf '%s=1\n' "$target_no_jitter" >> "$GITHUB_ENV"

      - name: Verify and configure upstream V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Expose the matching MSVC environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Select upstream's Windows SQLite configuration
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: echo 'LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC' >> "$GITHUB_ENV"

      - name: Select noninteractive Git input on Windows
        if: runner.os == 'Windows'
        run: echo 'GIT_REDIRECT_STDIN=NUL' >> "$GITHUB_ENV"

      # Every macOS binary requires macOS 14 (owner decision 2026-11-09): upstream's prebuilt V8 archive is built for
      # 14.0, and the linker's warning about linking it into an older minimum is fatal under the workspace lints. Rust
      # and the C and C++ build scripts all read this minimum. The macOS lint workflow uses the same value.
      - name: Build every macOS binary for macOS 14
        if: runner.os == 'macOS'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"

      - name: Set up the cache helper's native JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build and verify the bundled cache helper
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          java -version 2> "$evidence/cache-helper-java-version.txt"
          mvn -version > "$evidence/cache-helper-maven-version.txt"
          mvn -B -ntp -e -f "$RUNNER_TEMP/source-cache-helper/pom.xml" -Pruntime \
            "-Dtooling.build.directory=$RUNNER_TEMP/source-cache-build" \
            "-Dmaven.repo.local=$RUNNER_TEMP/source-cache-maven" \
            "-Djava.io.tmpdir=$TMPDIR" verify 2>&1 | tee "$evidence/cache-helper-build.log"
          printf 'CODEX_SOURCE_CACHE_TOOL=%s\n' "$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling" >> "$GITHUB_ENV"

      - name: Select the declared Node version for cache transport checks
        if: inputs.cache
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Set up the GHCR cache transport
        if: inputs.cache
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1
          # ORAS 1.3.1 publishes no Windows ARM64 asset; select its Windows amd64 asset explicitly.
          url: ${{ runner.os == 'Windows' && 'https://github.com/oras-project/oras/releases/download/v1.3.1/oras_1.3.1_windows_amd64.zip' || '' }}
          checksum: ${{ runner.os == 'Windows' && '8cf69e46f966e592ad36261c05b8f59c02125743b7261c03f6badc3919b40cb0' || '' }}

      - name: Verify native cache archive transport
        if: inputs.cache
        run: |
          set -euo pipefail
          CODEX_TEST_ORAS="$(command -v oras)" TMPDIR="$RUNNER_TEMP" bash "$RUNNER_TEMP/test-ghcr-cargo-target-cache.sh" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/cache-transport-test.log"
          python3 "$RUNNER_TEMP/test-build-upstream-release.py" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/build-stage-test.log"
          python3 "$RUNNER_TEMP/test-codex-tooling-launch.py" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/codex-tooling-launch-test.log"

      - name: Log in to the GHCR cache
        if: inputs.cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Identify exact and compatible compiled-cache inputs
        id: cache_inputs
        if: inputs.cache
        run: |
          set -euo pipefail
          run_codex_tooling() {
            # Linux packages a native launcher; other runners package a Bash launcher.
            if [[ "$RUNNER_OS" == Linux ]]; then
              "${CODEX_SOURCE_CACHE_TOOL:-$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling}" "$@"
            else
              bash "${CODEX_SOURCE_CACHE_TOOL:-$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling}" "$@"
            fi
          }
          evidence="$RUNNER_TEMP/baseline-evidence"
          {
            rustc -vV
            cargo --version
            cat "$evidence/build-command-inputs.sha256"
            printf '%s\n' "$TARGET" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}"
            env | LC_ALL=C sort | grep -E '^(RUSTC|RUSTC_WRAPPER|RUSTFLAGS|RUSTDOCFLAGS|RUSTY_V8_[A-Z_]+|CARGO_INCREMENTAL|CARGO_BUILD_TARGET|CARGO_BUILD_RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|CARGO_PROFILE_RELEASE_[A-Z_]+|CARGO_TARGET_[A-Z0-9_]+_LINKER|CC(_[A-Za-z0-9_]+)?|CXX(_[A-Za-z0-9_]+)?|AR(_[A-Za-z0-9_]+)?|TARGET_CC|TARGET_CXX|CFLAGS(_[A-Za-z0-9_]+)?|CXXFLAGS(_[A-Za-z0-9_]+)?|CMAKE_[A-Z_]+|([A-Z0-9_]+_)?OPENSSL_[A-Z_]+|AWS_LC_SYS_NO_JITTER_ENTROPY[A-Za-z0-9_]*|LIBSQLITE3_FLAGS|MACOSX_DEPLOYMENT_TARGET|PKG_CONFIG_[A-Za-z0-9_]+)='
            sha256sum codex-rs/Cargo.lock codex-rs/rust-toolchain.toml
          } > "$evidence/compiler-cache-inputs.txt"
          cat "$evidence/upstream-commit" "$evidence/cache-wrapper-inputs.sha256" "$evidence/cache-helper-inputs.sha256" "$evidence/compiler-cache-inputs.txt" "$evidence/applied-patches.txt" > "$evidence/compiled-cache-inputs.txt"
          # Each bundle keeps its own cache line; the primary line keeps the bare target name and the app-server line
          # adds "-app", short enough for the registry's 128-character tags. The app-server bundle falls back to the
          # primary bundle's compatible state, which already holds every library it links.
          cache_target="$TARGET"
          if [[ "$RELEASE_BUNDLE" == app-server ]]; then
            cache_target="$TARGET-app"
          fi
          run_codex_tooling cargo-cache-keys "$cache_target" \
            "$evidence/upstream-commit" "$evidence/cache-wrapper-inputs.sha256" \
            "$evidence/cache-helper-inputs.sha256" "$evidence/compiler-cache-inputs.txt" \
            "$evidence/applied-patches.txt" \
            | tee "$evidence/cache-keys.txt" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_BUNDLE" != primary ]]; then
            run_codex_tooling cargo-cache-keys "$TARGET" \
              "$evidence/upstream-commit" "$evidence/cache-wrapper-inputs.sha256" \
              "$evidence/cache-helper-inputs.sha256" "$evidence/compiler-cache-inputs.txt" \
              "$evidence/applied-patches.txt" \
              | sed -n 's/^seed_tag=/primary_seed_tag=/p' | tee -a "$evidence/cache-keys.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore compiled Cargo outputs from GHCR
        if: inputs.cache
        env:
          CACHE_TAG: ${{ steps.cache_inputs.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache_inputs.outputs.seed_tag }}
          PRIMARY_SEED_TAG: ${{ steps.cache_inputs.outputs.primary_seed_tag }}
          CACHE_HIT_REQUIRED: ${{ inputs.require_cache_hit }}
        run: |
          set -euo pipefail
          set +e
          bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull "${CARGO_CACHE_REPOSITORY}" "$CACHE_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/compiled-cache-restore.log"
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" == 3 ]]; then
            printf 'Verified cache absent; trying unverified partial build state.\n'
            set +e
            bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull-partial "${CARGO_CACHE_REPOSITORY}" "$CACHE_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/partial-cache-restore.log"
            result=${PIPESTATUS[0]}
            set -e
          fi
          if [[ "$result" == 3 ]]; then
            printf 'Exact state absent; trying compatible state. Cargo and all acceptance checks still run.\n'
            set +e
            bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull "${CARGO_CACHE_REPOSITORY}" "$CACHE_SEED_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/compatible-cache-restore.log"
            result=${PIPESTATUS[0]}
            set -e
          fi
          if [[ "$result" == 3 ]]; then
            set +e
            bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull-partial "${CARGO_CACHE_REPOSITORY}" "$CACHE_SEED_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/compatible-partial-cache-restore.log"
            result=${PIPESTATUS[0]}
            set -e
          fi
          if [[ "$result" == 3 && -n "$PRIMARY_SEED_TAG" ]]; then
            printf 'This bundle has no compatible state; trying the primary bundle'"'"'s compatible state.\n'
            set +e
            bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull "${CARGO_CACHE_REPOSITORY}" "$PRIMARY_SEED_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/primary-compatible-cache-restore.log"
            result=${PIPESTATUS[0]}
            set -e
          fi
          case "$result" in
            0) ;;
            3)
              if [[ "$CACHE_HIT_REQUIRED" == true ]]; then
                printf 'All compiled-cache lookups missed; require_cache_hit=true prevents a cold build.\n' >&2
                exit 1
              fi
              ;;
            *) exit "$result" ;;
          esac

      - name: Prepare content-checked cached source freshness
        id: cache_prepare
        if: inputs.cache
        working-directory: codex-rs
        run: |
          set -euo pipefail
          run_codex_tooling() {
            # Linux packages a native launcher; other runners package a Bash launcher.
            if [[ "$RUNNER_OS" == Linux ]]; then
              "${CODEX_SOURCE_CACHE_TOOL:-$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling}" "$@"
            else
              bash "${CODEX_SOURCE_CACHE_TOOL:-$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling}" "$@"
            fi
          }
          if [[ "$RELEASE_BUNDLE" == app-server ]]; then
            binaries=(codex-app-server)
          else
            binaries=(codex codex-code-mode-host codex-responses-api-proxy)
            case "$TARGET" in
              *-linux-musl) binaries+=(bwrap) ;;
              *-windows-msvc)
                binaries+=(codex-windows-sandbox-setup codex-windows-sandbox-service codex-command-runner)
                ;;
            esac
          fi
          run_codex_tooling \
            clean-cached-release-binaries "$GITHUB_WORKSPACE/codex-rs" "$TARGET" "${binaries[@]}" \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/source-cache-prepare.log"

      - name: Build the upstream release binaries with default features
        id: release_build
        working-directory: codex-rs
        # End before the 360-minute job limit, so the build fails instead of being cancelled and its partial state is saved.
        # Keep RELEASE_BUILD_LIMIT_MINUTES equal to this limit.
        timeout-minutes: 320
        env:
          CACHE_TAG: ${{ steps.cache_inputs.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache_inputs.outputs.seed_tag }}
          CACHE_ENABLED: ${{ inputs.cache }}
          TRACE_SIGNALS: ${{ inputs.trace_signals }}
          VERIFY_CLI_UNITS: ${{ inputs.verify_cli_units && matrix.bundle == 'primary' }}
          SELECTED_PACKAGES: ${{ inputs.packages }}
          QUIET_STOP_MINUTES: ${{ inputs.quiet_stop_minutes }}
        run: |
          date +%s > "$RUNNER_TEMP/release-build-started"
          if [[ -n "$SELECTED_PACKAGES" ]]; then
            export RELEASE_PACKAGES="$SELECTED_PACKAGES"
          fi
          if [[ "$CACHE_ENABLED" == true ]]; then
            export RELEASE_CHECKPOINT_COMMAND="$RUNNER_TEMP/checkpoint-upstream-release.sh"
          fi
          # Cold rebuilds of the heaviest libraries, with swap on, set these limits. Both Linux targets
          # finished fastest with three jobs and ran out of memory with four; ARM Linux took 982 s with two
          # and 719 s with three. ARM macOS (three CPUs, 7 GB) took 2,842 s with two jobs and 6,007 s with
          # three. Windows and Intel macOS were fastest at Cargo's default of one job per CPU. The x86-64 macOS
          # target cross-compiles on the same ARM macOS runner, so it takes the ARM limit.
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:*)
              export CARGO_BUILD_JOBS=3
              printf 'Limiting Linux Cargo compilation to three concurrent jobs, the fastest measured count.\n'
              ;;
            macOS:ARM64)
              export CARGO_BUILD_JOBS=2
              printf 'Limiting ARM macOS Cargo compilation to two concurrent jobs, the fastest measured count.\n'
              ;;
          esac
          printf 'cargo_build_jobs=%s\n' "${CARGO_BUILD_JOBS:-default}" \
            | tee "$RUNNER_TEMP/baseline-evidence/cargo-concurrency.log"
          release_command=(bash "$RUNNER_TEMP/build-upstream-release.sh")
          if [[ "$VERIFY_CLI_UNITS" == true ]]; then
            cat > "$RUNNER_TEMP/build-and-check-upstream-release.sh" <<'SCRIPT'
          source "$RUNNER_TEMP/build-upstream-release.sh"
          compile test --locked --release --target "$TARGET" -p codex-cli --lib --bin codex -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/cli-unit-tests.log"
          SCRIPT
            release_command=(bash "$RUNNER_TEMP/build-and-check-upstream-release.sh")
          fi
          # A build whose evidence logs stay quiet while its processes use no CPU gets process reports naming what each
          # process waits on, then is stopped well before the step timeout. CPU use counts as progress because the
          # final link of codex on Intel macOS ran more than 75 minutes without output.
          # A diagnostic run can stop sooner; it reports every 15 minutes, or at half the stop period when that is shorter.
          # The watcher is a native Windows program there, so it is given Git Bash's Windows path rather than a name
          # that Windows' own search could resolve to another bash.
          if [[ "$RUNNER_OS" == Windows ]]; then
            release_command[0]="$(cygpath -w "$(command -v bash)")"
          fi
          quiet_stop=$(( QUIET_STOP_MINUTES * 60 ))
          quiet_report=$(( quiet_stop / 2 < 900 ? quiet_stop / 2 : 900 ))
          release_command=(python3 -I "$RUNNER_TEMP/watch-quiet-build.py" --watch "$RUNNER_TEMP/baseline-evidence"
            --report "$RUNNER_TEMP/baseline-evidence/quiet-build-report.log"
            --first-report "$quiet_report" --interval "$quiet_report" --stop-after "$quiet_stop" -- "${release_command[@]}")

          if [[ "$TRACE_SIGNALS" == true ]]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bpftrace
            cd "$RUNNER_TEMP/baseline-evidence"
            python3 "$RUNNER_TEMP/probe-runner-signals.py" \
              env --chdir="$GITHUB_WORKSPACE/codex-rs" "${release_command[@]}"
          else
            "${release_command[@]}"
          fi

      - name: Stop a package-selection run before release checks
        # Its output is a partial build: the failure saves it as retry state and never publishes it as a release.
        if: inputs.packages != ''
        run: |
          printf 'Package-selection run: built only the selected packages; saving partial state and stopping.\n' \
            | tee "$RUNNER_TEMP/baseline-evidence/package-selection.log"
          exit 1

      - name: Controlled failure for partial-cache verification
        if: inputs.fail_after_build
        run: |
          printf 'Deliberate post-compilation failure: fail_after_build=true. Retry this revision with fail_after_build=false.\n' \
            | tee "$RUNNER_TEMP/baseline-evidence/controlled-failure.log"
          exit 1

      - name: Fail on warnings in the Cargo build logs
        # Rustc warnings already fail compilation; this catches build-script cargo:warning lines and Cargo's own.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/baseline-evidence"
          logs=(cargo-build-*.log)
          if [[ -f bwrap-build.log ]]; then
            logs+=(bwrap-build.log)
          fi
          bash "$RUNNER_TEMP/fail-on-cargo-warnings.sh" "${logs[@]}"

      - name: Smoke-test the bundle's native executable
        if: ${{ !matrix.smoke-separately }}
        run: |
          set -euo pipefail
          output="$CARGO_TARGET_DIR/$TARGET/release"
          if [[ "$RELEASE_BUNDLE" == app-server ]]; then
            "$output/codex-app-server$BINARY_SUFFIX" --version | tee "$RUNNER_TEMP/baseline-evidence/app-server-version.log"
          else
            "$output/codex$BINARY_SUFFIX" --version | tee "$RUNNER_TEMP/baseline-evidence/codex-version.log"
          fi

      - name: Hand the cross-compiled executable to its native smoke test
        if: matrix.smoke-separately
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: smoke-${{ matrix.target }}-${{ matrix.bundle }}
          path: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/${{ matrix.bundle == 'app-server' && 'codex-app-server' || 'codex' }}${{ matrix.binary-suffix }}
          retention-days: 1
          if-no-files-found: error

      - name: Verify upstream source and tests remain unmodified
        id: source_guard
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Verify dependency identity before accepting build outputs
        id: dependency_guard
        if: success() || (failure() && inputs.cache && steps.cache_prepare.outcome == 'success' && steps.source_guard.outcome == 'success')
        working-directory: codex-rs
        run: |
          set -euo pipefail
          run_codex_tooling() {
            # Linux packages a native launcher; other runners package a Bash launcher.
            if [[ "$RUNNER_OS" == Linux ]]; then
              "${CODEX_SOURCE_CACHE_TOOL:-$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling}" "$@"
            else
              bash "${CODEX_SOURCE_CACHE_TOOL:-$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling}" "$@"
            fi
          }
          evidence="$RUNNER_TEMP/baseline-evidence"
          cargo metadata --no-deps --format-version 1 > "$evidence/workspace-metadata.json"
          run_codex_tooling verify-cargo-lock \
            "$evidence/source-Cargo.lock" Cargo.lock "$evidence/workspace-metadata.json" \
            | tee "$evidence/lock-verification.json"

      - name: Record verified source inputs for cached build outputs
        if: success() && inputs.cache
        working-directory: codex-rs
        run: |
          set -euo pipefail
          run_codex_tooling() {
            # Linux packages a native launcher; other runners package a Bash launcher.
            if [[ "$RUNNER_OS" == Linux ]]; then
              "${CODEX_SOURCE_CACHE_TOOL:-$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling}" "$@"
            else
              bash "${CODEX_SOURCE_CACHE_TOOL:-$RUNNER_TEMP/source-cache-build/runtime/bin/codex-tooling}" "$@"
            fi
          }
          run_codex_tooling \
            clean-cached-release-binaries --record-source-inputs "$GITHUB_WORKSPACE/codex-rs" "$TARGET" \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/source-cache-record.log"

      - name: Save verified compiled Cargo outputs to GHCR
        if: success() && inputs.cache
        env:
          CARGO_CACHE_STAGE: final
          CACHE_TAG: ${{ steps.cache_inputs.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache_inputs.outputs.seed_tag }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" push "${CARGO_CACHE_REPOSITORY}" "$CACHE_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" ${CACHE_SEED_TAG:+"$CACHE_SEED_TAG"} 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/compiled-cache-save.log"

      - name: Save unverified partial compilation state for retry
        id: partial_save
        if: failure() && inputs.cache && steps.cache_prepare.outcome == 'success' && steps.source_guard.outcome == 'success' && steps.dependency_guard.outcome == 'success'
        env:
          CARGO_CACHE_STAGE: final
          CACHE_TAG: ${{ steps.cache_inputs.outputs.tag }}
          CACHE_SEED_TAG: ${{ steps.cache_inputs.outputs.seed_tag }}
        run: |
          set -euo pipefail
          printf 'Saving unverified compilation state after completed preparation and source/dependency verification; this run remains failed.\n'
          bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" push-partial "${CARGO_CACHE_REPOSITORY}" "$CACHE_TAG" "$CARGO_TARGET_DIR" "$(cat "$RUNNER_TEMP/baseline-evidence/upstream-ref")" ${CACHE_SEED_TAG:+"$CACHE_SEED_TAG"} 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/partial-cache-save.log"

      - name: Request a continuation of a build stopped by its time limit
        id: continuation
        # Only a release build that ran until its limit and whose partial state was saved continues; any other failure
        # stays failed. The continue job dispatches the next run.
        if: failure() && steps.partial_save.outcome == 'success' && steps.release_build.outcome == 'failure' && inputs.packages == ''
        run: |
          set -euo pipefail
          started="$(cat "$RUNNER_TEMP/release-build-started")"
          elapsed=$(( $(date +%s) - started ))
          if (( elapsed < (RELEASE_BUILD_LIMIT_MINUTES - 2) * 60 )); then
            printf 'The release build failed after %s s, before its time limit; no continuation.\n' "$elapsed"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/continuation"
          jq -cn --arg target "$TARGET" --arg bundle "$RELEASE_BUNDLE" '{target: $target, bundle: $bundle}' \
            > "$RUNNER_TEMP/continuation/$TARGET-$RELEASE_BUNDLE.json"
          printf 'The release build reached its %s-minute limit after %s s; requesting a continuation.\n' \
            "$RELEASE_BUILD_LIMIT_MINUTES" "$elapsed" | tee "$RUNNER_TEMP/baseline-evidence/continuation.log"
          printf 'requested=true\n' >> "$GITHUB_OUTPUT"

      - name: Hand the continuation request to the continue job
        if: failure() && steps.continuation.outputs.requested == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: continue-${{ matrix.target }}-${{ matrix.bundle }}
          path: ${{ runner.temp }}/continuation
          retention-days: 1
          if-no-files-found: error

      - name: Verify changed CLI input without publishing diagnostic outputs
        if: success() && inputs.verify_invalidation && matrix.bundle == 'primary'
        working-directory: codex-rs
        run: python3 "$RUNNER_TEMP/verify-codex-cache-invalidation.py"

      - name: Preserve cache input comparison evidence
        if: always() && inputs.cache
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          snapshots="$CARGO_TARGET_DIR/.codex-source-inputs"
          if [[ -d "$snapshots" ]]; then
            cp -R "$snapshots" "$evidence/source-input-state"
          fi
          git status --porcelain=v1 --untracked-files=all > "$evidence/final-source-status.txt"
          git ls-files --others --exclude-standard -z |
            while IFS= read -r -d '' source_path; do
              if [[ -f "$source_path" ]]; then
                sha256sum -- "$source_path"
              fi
            done > "$evidence/final-untracked-source-digests.txt"

      - name: Keep the faulting thread of each Java crash report
        # A JVM fatal error writes hs_err_pid*.log into its working directory. Only its leading comment and the
        # faulting thread's frames are kept: the rest holds the command line, environment variables and memory near
        # registers, which stay out of the artifact.
        if: failure()
        run: |
          set -euo pipefail
          shopt -s nullglob
          for report in "$GITHUB_WORKSPACE"/codex-rs/hs_err_pid*.log "$GITHUB_WORKSPACE"/hs_err_pid*.log; do
            awk '/^#/ && !seen { print; next } { seen = 1 } /T H R E A D/ { frames = 1 } /^Registers:/ { frames = 0 }
              frames' "$report" > "$RUNNER_TEMP/baseline-evidence/$(basename "$report" .log)-thread.log"
          done

      - name: Retain baseline evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-${{ matrix.target }}-${{ matrix.bundle }}
          path: |
            ${{ runner.temp }}/baseline-evidence
            ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings
          retention-days: 1
          if-no-files-found: warn

  smoke:
    # Runs each cross-compiled executable on its native runner. The build job's source, dependency and cache checks
    # already passed, but its compiled cache is published before this job: smoke failure fails the run, not the cache.
    needs: [select, build]
    # Another target's failure does not skip this target's smoke test; a missing executable fails its download.
    if: ${{ !cancelled() && needs.select.outputs.smoke != '' }}
    name: Smoke - ${{ matrix.target }} - ${{ matrix.bundle }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.smoke) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve the cross-compiled executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: smoke-${{ matrix.target }}-${{ matrix.bundle }}
          path: ${{ runner.temp }}/smoke

      - name: Smoke-test the executable on its native platform
        env:
          BINARY: ${{ matrix.bundle == 'app-server' && 'codex-app-server' || 'codex' }}${{ matrix.binary-suffix }}
        run: |
          set -euo pipefail
          executable="$RUNNER_TEMP/smoke/$BINARY"
          chmod +x "$executable"
          {
            uname -m
            file "$executable"
            "$executable" --version
          } | tee "$RUNNER_TEMP/smoke/version.log"

  continue:
    # Dispatches one cached run per bundle that reached its build time limit. Each continuation restores the saved
    # partial state, so a cold build that needs more than one job's time finishes over several runs. Two continuations
    # bound the chain; a build that still has not finished needs investigation.
    needs: [select, build]
    if: ${{ !cancelled() && needs.build.result == 'failure' && inputs.cache && inputs.packages == '' && inputs.continuation < 2 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Collect the continuation requests
        id: requests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: continue-*
          path: ${{ runner.temp }}/continuation
          merge-multiple: true

      - name: Dispatch the continuations
        if: steps.requests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION: ${{ inputs.continuation }}
          PATCHES: ${{ inputs.patches }}
          PRUNE: ${{ inputs.prune }}
          QUIET_STOP_MINUTES: ${{ inputs.quiet_stop_minutes }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          next=$((CONTINUATION + 1))
          for request in "$RUNNER_TEMP"/continuation/*.json; do
            target="$(jq -r .target "$request")"
            bundle="$(jq -r .bundle "$request")"
            printf 'Continuing %s %s as continuation %s.\n' "$target" "$bundle" "$next"
            gh workflow run baseline-release-builds.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f cache=true -f require_cache_hit=true -f target="$target" -f bundle="$bundle" -f continuation="$next" \
              -f patches="$PATCHES" -f prune="$PRUNE" -f quiet_stop_minutes="$QUIET_STOP_MINUTES"
          done

  prune-caches:
    # Runs after every cached build, including a failed one, so caches it superseded do not wait for the schedule.
    needs: build
    if: always() && inputs.cache
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/cache-retention.yml
    with:
      dry_run: ${{ !inputs.prune }}
