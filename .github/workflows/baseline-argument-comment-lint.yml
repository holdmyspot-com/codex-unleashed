name: Stable upstream argument-comment lint

# Mirrors upstream's separate argument-comment lint jobs (rust-ci-full.yml): the
# lint package tests and the Bazel-based lint of codex-rs. Upstream's Bazel test
# suites exclude the argument-comment-lint tag because these jobs cover it.

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CARGO_DYLINT_VERSION: 6.1.0
      DYLINT_LINK_VERSION: 6.1.0
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-argument-lint-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Preserve the compiled-cache tooling
        run: bash restart-metadata/.github/scripts/lint-compiled-cache.sh preserve restart-metadata .github/workflows/baseline-argument-comment-lint.yml

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-argument-lint-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-argument-lint-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          # Upstream's CI tests main, whose workspace version is 0.0.0; a stable tag's release commit changes only that
          # version. Test the same source, so version strings in snapshots and fixtures match what upstream tested.
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' codex-rs/Cargo.toml
          if ! git diff --quiet -- codex-rs/Cargo.toml; then
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          for patch in "${patch_paths[@]}"; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Install nightly argument-comment-lint toolchain
        run: |
          nightly="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' tools/argument-comment-lint/rust-toolchain)"
          test -n "$nightly"
          rustup toolchain install "$nightly" \
            --profile minimal \
            --component llvm-tools-preview \
            --component rustc-dev \
            --component rust-src \
            --no-self-update
          rustup default "$nightly"
      - name: Select the cache helper's native JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Set up the GHCR cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      # Two cache lines keep the dylint tools' build separate from the lint package's tests. Both hold compiled
      # outputs only; Cargo and the tests still run in full. The test line is restored after `cargo update` so its key
      # covers the lockfile Cargo actually builds with.
      - name: Restore compiled dependencies from GHCR
        id: lint_cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-argument-lint-evidence"
          cache="$RUNNER_TEMP/lint-cache/lint-compiled-cache.sh"
          LINT_CACHE_INPUT_FILES=tools/argument-comment-lint/rust-toolchain bash "$cache" restore "$evidence" \
            argument-lint-install "$RUNNER_TEMP/dylint-install-target" \
            "cargo install --locked cargo-dylint $CARGO_DYLINT_VERSION dylint-link $DYLINT_LINK_VERSION"

      - name: Install cargo-dylint tooling
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dylint-install-target
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Move the Dylint crates past the rust-clippy default-branch rename
        # Dylint 6.1.0 clones rust-clippy and resolves its `master` branch, which
        # rust-lang renamed to `main`, so the pinned lockfile cannot build the UI
        # fixtures. Dylint 6.3.x resolves `main`. This changes only the CI checkout.
        working-directory: tools/argument-comment-lint
        run: |
          set -euo pipefail
          cargo update dylint_testing dylint_linting
          cargo tree --locked -i dylint_internal | head -3
          git diff --stat -- Cargo.lock
      - name: Restore compiled lint package dependencies from GHCR
        id: lint_cache_test
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LINT_CACHE_INPUT_FILES='tools/argument-comment-lint/Cargo.lock tools/argument-comment-lint/rust-toolchain' \
            bash "$RUNNER_TEMP/lint-cache/lint-compiled-cache.sh" restore "$RUNNER_TEMP/baseline-argument-lint-evidence" \
            argument-lint-test tools/argument-comment-lint/target 'cargo test in tools/argument-comment-lint'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "8388608" # 8 MiB

      - name: Save compiled dependencies to GHCR
        if: always() && steps.lint_cache.conclusion == 'success'
        env:
          LINT_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-argument-lint-evidence"
          cache="$RUNNER_TEMP/lint-cache/lint-compiled-cache.sh"
          bash "$cache" save "$evidence" argument-lint-install "$RUNNER_TEMP/dylint-install-target"
          if [[ "${{ steps.lint_cache_test.conclusion }}" == success ]]; then
            bash "$cache" save "$evidence" argument-lint-test tools/argument-comment-lint/target
          fi

  bazel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-argument-lint-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          cp restart-metadata/.github/cargo-cache-package "$evidence/cargo-cache-package"
          cp restart-metadata/.github/scripts/ghcr-cargo-target-cache.sh restart-metadata/.github/scripts/v8-bazel-cache.sh "$RUNNER_TEMP/"
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-argument-lint-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-argument-lint-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          # Upstream's CI tests main, whose workspace version is 0.0.0; a stable tag's release commit changes only that
          # version. Test the same source, so version strings in snapshots and fixtures match what upstream tested.
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' codex-rs/Cargo.toml
          if ! git diff --quiet -- codex-rs/Cargo.toml; then
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          for patch in "${patch_paths[@]}"; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reclaim unused hosted-image toolchains
        run: |
          for unused in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; do
            if [[ -d "$unused" ]]; then
              sudo rm -rf -- "$unused"
            fi
          done

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up upstream's Rust toolchain for workspace metadata
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}

      - name: Synchronize release workspace versions without dependency upgrades
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --manifest-path codex-rs/Cargo.toml > /dev/null
          git diff --stat

      # Upstream builds V8 from source in Bazel and relies on its BuildBuddy cache. The compiled V8 actions are kept in
      # GHCR by baseline-v8-bazel-cache.yml and read here without being written back.
      - name: Set up the GHCR cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Restore the compiled V8 actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-argument-lint-evidence"
          bash "$RUNNER_TEMP/v8-bazel-cache.sh" restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/v8-bazel-cache" \
            "ghcr.io/${GH_OWNER,,}/$(cat "$evidence/cargo-cache-package")" "$(cat "$evidence/upstream-ref")" \
            2>&1 | tee "$evidence/v8-cache-restore.log"

      - name: Run upstream's Bazel argument-comment lint on codex-rs
        uses: ./.github/actions/run-argument-comment-lint
        with:
          target: Linux

      - name: Verify the patched source remains unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'
