name: Windows launcher probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve release base
        id: base
        shell: pwsh
        run: |
          $ref = (Get-Content .github/upstream-ref -Raw).Trim()
          "ref=$ref" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: openai/codex
          ref: ${{ steps.base.outputs.ref }}
          path: upstream
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: workspace_root_test_launcher.bat.tpl
      - name: Compare native CMD launcher encodings
        shell: pwsh
        run: |
          ./.github/scripts/test-workspace-root-test-launcher.ps1 `
            -TemplatePath upstream/workspace_root_test_launcher.bat.tpl `
            -WorkDirectory $env:RUNNER_TEMP `
            -ReportPath "$env:RUNNER_TEMP/windows-launcher-probe.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-launcher-probe
          path: ${{ runner.temp }}/windows-launcher-probe.json
          retention-days: 1
          if-no-files-found: ignore
