name: Bazel

on:
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to .github/upstream-ref."
        required: false
        type: string

env:
  BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: "1"

concurrency:
  group: bazel-bridge-probe-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  voice-probe:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream

      - name: Add native Meson function detection regression
        shell: bash
        run: |
          set -euo pipefail
          cp -R .github/diagnostics/native-meson upstream/third_party/voice/function-probe
          python3 - <<'PY'
          from pathlib import Path
          root = Path('upstream/third_party/voice')
          build = root / 'BUILD.bazel'
          text = build.read_text()
          needle = '    name = "native_recipe",\n    srcs = [\n'
          assert text.count(needle) == 1
          files = ''.join(f'        "function-probe/{name}",\n' for name in ('meson.build', 'main.cc', 'probe.c', 'probe.h'))
          build.write_text(text.replace(needle, needle + files))
          recipe = root / 'build_native.py'
          text = recipe.read_text()
          needle = '        self.cmake(\n            "zlib",'
          assert text.count(needle) == 1
          probe = '        self.prefix.joinpath("lib").mkdir(parents=True, exist_ok=True)\n        self.prefix.joinpath("include").mkdir(parents=True, exist_ok=True)\n        self.sources["function-probe"] = Path(__file__).resolve().parent / "function-probe"\n        self.meson("function-probe", [])\n'
          recipe.write_text(text.replace(needle, probe + needle))
          PY

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-apple-darwin
          cache-scope: bazel-clippy

      - name: Apply the verified linker correction and GLib probe repair
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/glib-printf/prepare_sources.py upstream/third_party/voice/prepare_sources.py
          cp .github/diagnostics/glib-printf/printf_test.c upstream/tools/build-warnings/glib/printf_test.c
          python3 - <<'PYCODE'
          from pathlib import Path
          recipe = Path('upstream/third_party/voice/build_native.py')
          text = recipe.read_text()
          needle = '        meson_flags = {name: list(flags) for name, flags in self.flags.items()}\n'
          assert text.count(needle) == 1
          correction = '        if self.args.target.endswith("apple-darwin"):\n            meson_flags["LDFLAGS"].append("-fuse-ld=/usr/bin/ld")\n'
          recipe.write_text(text.replace(needle, needle + correction))
          PYCODE

      - name: Verify function detection and complete native prefix
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            -- \
            test \
            --jobs=2 \
            --config=clippy \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            --build_metadata=TAG_job=clippy \
            -- \
            //third_party/voice:native_prefix_macos_aarch64 \
            //tools/build-warnings/glib:printf_test

      - name: Preserve native action output
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          destination="$RUNNER_TEMP/bazel-execution-logs/action-output"
          mkdir -p "$destination"
          for log in "$BAZEL_OUTPUT_BASE"/execroot/_main/bazel-out/_tmp/actions/{stdout,stderr}-*; do
            if [[ -s "$log" ]]; then
              cp "$log" "$destination/"
            fi
          done

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-native-voice-probe
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test:
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # Upstream disabled these ARM Bazel tests after recurring linker
          # failures in the hosted ARM environment. Keep the supported
          # multi-platform matrix aligned with upstream while retaining both
          # macOS targets below.
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    name: Bazel test on ${{ matrix.os }} for ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          # The local Codex patch stack is based on this upstream revision.
          # Advance it only when the product patches have been rebased.
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-test

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GitHub script test dependencies
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: python3 -m pip install --disable-pip-version-check packaging

      - name: Install Linux sandbox build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Check rusty_v8 MODULE.bazel checksums
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          "$CODEX_UNLEASHED_TOOLING" rusty-v8-bazel . check-module-bazel
          "$CODEX_UNLEASHED_TOOLING" rusty-v8-bazel . check-consumer-selectors
          just test-github-scripts

      - name: Verify cross-platform MSVC runtime analysis
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          cd upstream
          ../.github/scripts/run-bazel-ci.sh -- build --nobuild -- @llvm//runtimes/msvc:msvc_include

      - name: Check MODULE.bazel.lock is up to date
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          ./scripts/check-module-bazel-lock.sh

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_targets=(
            //...
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )
          bazel_resource_args=()
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            bazel_resource_args+=(--jobs=2)
          fi
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            --print-failed-test-logs \
            -- \
            test \
            "${bazel_resource_args[@]}" \
            --test_tag_filters=-argument-comment-lint \
            --test_verbose_timeout_warnings \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-test-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Save Bazel repository cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows-shard:
    if: ${{ github.ref == 'refs/heads/main' }}
    # Cross-compile every test target, but execute the tests in the native
    # Windows job below. The hosted runner cannot reliably execute the
    # cross-compiled batch launchers generated by the upstream Bazel rules.
    # Include native Java tooling verification and repository preparation in
    # the same budget as the other full Bazel checks.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    runs-on: windows-2022
    name: Bazel build on windows-2022 for x86_64-pc-windows-gnullvm shard ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-test-windows-shard

      - name: Test BuildBuddy Bazel wrapper
        if: matrix.shard == 1
        shell: pwsh
        run: python upstream/.github/scripts/test_run_bazel_with_buildbuddy.py

      - name: bazel test shard
        env:
          BAZEL_TEST_SHARD: ${{ matrix.shard }}
          BAZEL_TEST_SHARD_COUNT: 4
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_test_query='tests(//...) except tests(//third_party/v8:all) except attr(tags, "manual", tests(//...))'
          targets_file="$(mktemp)"
          selected_file="$(mktemp)"
          trap 'rm -f "$targets_file" "$selected_file"' EXIT
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-query-ci.sh" --output=label -- "${bazel_test_query}" |
            LC_ALL=C sort > "$targets_file"
          "$CODEX_UNLEASHED_TOOLING" select-windows-bazel-targets \
            --shard "$BAZEL_TEST_SHARD" \
            --shard-count "$BAZEL_TEST_SHARD_COUNT" \
            --durations "${GITHUB_WORKSPACE}/.github/scripts/windows_bazel_test_durations.tsv" \
            < "$targets_file" > "$selected_file"
          mapfile -t selected_targets < "$selected_file"
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-cross-compile \
            -- \
            build \
            --skip_incompatible_explicit_targets \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            "--build_metadata=TAG_windows_test_shard=${BAZEL_TEST_SHARD}" \
            -- \
            "${selected_targets[@]}"

      - name: Execute Windows GNU stack assembly callback
        if: matrix.shard == 1
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          # Compile on Linux RBE workers, then execute the self-contained
          # callback probe directly on Windows without a Rust batch launcher.
          : "${BUILDBUDDY_API_KEY:?Windows GNU callback verification requires RBE}"
          stack_bazel_args=(
            --config=ci-windows-cross
            --host_platform=//:rbe
            --shell_executable=/bin/bash
            --noremote_local_fallback
            --action_env=PATH=/usr/bin:/bin
            --host_action_env=PATH=/usr/bin:/bin
            --jobs=2
            --remote_download_outputs=toplevel
          )
          "$CODEX_UNLEASHED_TOOLING" run-bazel-with-buildbuddy build \
            "${stack_bazel_args[@]}" -- @v8//:codex_windows_stack_assembly_test
          test_binary="$("$CODEX_UNLEASHED_TOOLING" run-bazel-with-buildbuddy cquery \
            "${stack_bazel_args[@]}" --output=files -- @v8//:codex_windows_stack_assembly_test)"
          test_binary="${test_binary//$'\r'/}"
          test -f "$test_binary"
          "$test_binary"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-test-x86_64-pc-windows-gnullvm-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Save Bazel repository cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test-windows-shard
    runs-on: ubuntu-latest
    name: Bazel build on windows-2022 for x86_64-pc-windows-gnullvm
    steps:
      - name: Confirm Windows Bazel test shards passed
        shell: bash
        run: |
          if [[ "${{ needs.test-windows-shard.result }}" != "success" ]]; then
            echo "Windows Bazel test shards finished with result: ${{ needs.test-windows-shard.result }}" >&2
            exit 1
          fi

  test-windows-native-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 90
    runs-on: windows-2022
    name: Bazel test on windows-2022 for x86_64-pc-windows-msvc (native main)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Windows voice build inputs
        id: restore_voice
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/voice-cygwin-snapshot
          key: voice-cygwin-${{ hashFiles('upstream/.github/scripts/voice-cygwin-snapshot.json') }}

      - name: Install verified Windows voice build tools
        id: voice_tools
        shell: pwsh
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content .github/scripts/voice-cygwin-snapshot.json -Raw | ConvertFrom-Json).archive
          $directory = Join-Path $env:RUNNER_TEMP 'voice-cygwin-snapshot'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Join-Path $directory $pin.name
          if (-not (Test-Path -LiteralPath $archive)) {
            gh release download $pin.tag --repo openai/codex --pattern $pin.name --dir $directory
            if ($LASTEXITCODE -ne 0) { throw 'Downloading the pinned Windows voice archive failed.' }
          }
          & ./.github/scripts/setup-voice-windows.ps1 -Target x86_64-pc-windows-msvc -SnapshotArchive $archive

      - name: Save Windows voice build inputs
        if: always() && !cancelled() && steps.voice_tools.outcome == 'success' && steps.restore_voice.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/voice-cygwin-snapshot
          key: voice-cygwin-${{ hashFiles('upstream/.github/scripts/voice-cygwin-snapshot.json') }}

      - name: Check Windows Bazel PATH stability
        shell: pwsh
        run: ./.github/scripts/test-compute-bazel-windows-path.ps1 -WorkDirectory '${{ runner.temp }}/windows-path-check'

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_targets=(
            //...
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )
          bazel_test_args=(
            test
            --config=ci-windows-msvc
            --platforms=//:windows_x86_64_msvc
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}"
            --build_metadata=TAG_windows_native_main=true
          )
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-test-windows-native-x86_64-pc-windows-gnullvm
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Save Bazel repository cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  clippy:
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnullvm
    runs-on: ${{ matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-clippy

      - name: bazel build --config=clippy lint targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_clippy_args=(
            --config=clippy
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}"
            --build_metadata=TAG_job=clippy
          )
          bazel_wrapper_args=()
          bazel_target_list_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bazel_wrapper_args+=(--windows-cross-compile)
            bazel_target_list_args+=(--windows-cross-compile)
            bazel_clippy_args+=(--skip_incompatible_explicit_targets)
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bazel_target_lines="$(./scripts/list-bazel-clippy-targets.sh --windows-cross-compile)"
          else
            bazel_target_lines="$(./scripts/list-bazel-clippy-targets.sh)"
          fi
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"
          bazel_resource_args=()
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            bazel_resource_args+=(--jobs=2)
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary \
              --windows-cross-compile \
              -- \
              build \
              "${bazel_resource_args[@]}" \
              "${bazel_clippy_args[@]}" \
              -- \
              "${bazel_targets[@]}"
          else
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary \
              -- \
              build \
              "${bazel_resource_args[@]}" \
              "${bazel_clippy_args[@]}" \
              -- \
              "${bazel_targets[@]}"
          fi

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-clippy-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Save Bazel repository cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  verify-release-build:
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnullvm
    runs-on: ${{ matrix.os }}
    name: Verify release build on ${{ matrix.os }} for ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-verify-release

      - name: Verify release build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_build_args=(
            --compilation_mode=fastbuild
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}"
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )
          bazel_wrapper_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bazel_wrapper_args+=(--windows-cross-compile)
          fi
          bazel_target_lines="$(bash ./scripts/list-bazel-release-targets.sh)"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"
          bazel_resource_args=()
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            bazel_resource_args+=(--jobs=2)
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary \
              --windows-cross-compile \
              -- \
              build \
              "${bazel_resource_args[@]}" \
              "${bazel_build_args[@]}" \
              -- \
              "${bazel_targets[@]}"
          else
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary \
              -- \
              build \
              "${bazel_resource_args[@]}" \
              "${bazel_build_args[@]}" \
              -- \
              "${bazel_targets[@]}"
          fi

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-verify-release-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Save Bazel repository cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
