name: Isolated Windows skill warmup comparison

on:
  workflow_dispatch:

env:
  BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: "1"

concurrency:
  group: isolated-warmup-baseline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-baseline:
    if: github.ref_name == 'ci/isolated-warmup-windows'
    runs-on: windows-2025
    timeout-minutes: 180
    name: Windows core unit suite with only skill warmup patch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Retain the single patch before checking out upstream
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:patches/holdmyspot-com/codex-unleashed/issue-34776/background-session-skill-warmup.patch > "${RUNNER_TEMP}/background-session-skill-warmup.patch"
          printf '%s  %s\n' df3aece2d8ed12cbaf2df73ea2c8dea9a8f38e0c421da022def5f66ef4bd1592 "${RUNNER_TEMP}/background-session-skill-warmup.patch" | sha256sum --check

      # Source, local actions, and toolchain pins come from upstream.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: 83086188ae0614bd882818ff1aa23f3194962012
          persist-credentials: false

      - name: Verify clean upstream identity and pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 83086188ae0614bd882818ff1aa23f3194962012
          test -z "$(git status --porcelain)"
          cat .bazelversion codex-rs/rust-toolchain.toml

      - name: Normalize release-tag workspace lock versions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 update --workspace --manifest-path codex-rs/Cargo.toml
          test "$(git diff --name-only)" = codex-rs/Cargo.lock
          expected_lock=$(mktemp "${RUNNER_TEMP}/upstream-release-lock-XXXXXX")
          trap 'rm -f -- "$expected_lock"' EXIT
          git show HEAD:codex-rs/Cargo.lock |
            sed 's/^version = "0.0.0"$/version = "0.163.0"/' > "$expected_lock"
          cmp "$expected_lock" codex-rs/Cargo.lock
          git diff --stat -- codex-rs/Cargo.lock

      - name: Apply only the independently supported skill warmup patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "${RUNNER_TEMP}/background-session-skill-warmup.patch"
          git diff --cached --stat
          git diff --cached --check
          test "$(git diff --name-only)" = codex-rs/Cargo.lock
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Prepare original upstream Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: clean-upstream-native-windows

      - name: Build the isolated skill warmup core unit suite
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = codex-rs/Cargo.lock
          test -z "$(git ls-files --others --exclude-standard)"
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --windows-msvc-host-platform \
            -- \
            build \
            --config=ci-windows-msvc \
            --platforms=//:windows_x86_64_msvc \
            "--build_metadata=COMMIT_SHA=$(git rev-parse HEAD)" \
            --build_metadata=TAG_isolated_skill_warmup=true \
            -- //codex-rs/core:core-unit-tests

      - name: Execute all eight core unit shards with the isolated warmup patch
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ":(exclude)codex-rs/Cargo.lock" ":(exclude)MODULE.bazel.lock"
          test -z "$(git ls-files --others --exclude-standard)"
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            -- \
            test \
            --config=ci-windows-msvc \
            --platforms=//:windows_x86_64_msvc \
            --test_tag_filters=-argument-comment-lint \
            --test_verbose_timeout_warnings \
            --test_output=all \
            --nocache_test_results \
            --test_env=RUST_BACKTRACE=1 \
            --test_env=RUST_LIB_BACKTRACE=0 \
            "--build_metadata=COMMIT_SHA=$(git rev-parse HEAD)" \
            --build_metadata=TAG_isolated_skill_warmup=true \
            -- //codex-rs/core:core-unit-tests

      - name: Upload upstream execution logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: isolated-warmup-windows-core-unit
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Save upstream repository downloads
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
