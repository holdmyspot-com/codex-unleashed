name: Native failure diagnostics

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to .github/upstream-ref."
        required: false
        type: string

env:
  BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: "1"

concurrency:
  group: native-failure-probes-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    # Preserve the native compilation budget and individual test deadlines.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos-') && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    name: Intel macOS failure probes
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          # The local Codex patch stack is based on this upstream revision.
          # Advance it only when the product patches have been rebased.
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Apply temporary native failure diagnostics
        shell: bash
        run: git -C upstream apply --unidiff-zero --check ../.github/diagnostics/native-failures.patch && git -C upstream apply --unidiff-zero ../.github/diagnostics/native-failures.patch

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-test

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run failing Intel macOS suites with diagnostics
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_targets=(
            //codex-rs/memories/write:write-unit-tests
            //codex-rs/tui:tui-all-test
            //codex-rs/cli:cli-worktree-test
            //codex-rs/core:core-all-test
          )
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            --print-failed-test-logs \
            -- \
            test \
            --test_tag_filters=-argument-comment-lint \
            --test_verbose_timeout_warnings \
            --test_output=all \
            --test_env=RUST_BACKTRACE=1 \
            --test_env=RUST_LIB_BACKTRACE=1 \
            --test_env=RUST_TEST_NOCAPTURE=1 \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-test-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Save Bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

  test-windows-native-main:
    # Preserve the native compilation budget and individual test deadlines.
    timeout-minutes: 180
    runs-on: windows-2022
    name: Windows credential export failure probe
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Apply temporary native failure diagnostics
        shell: bash
        run: git -C upstream apply --unidiff-zero --check ../.github/diagnostics/native-failures.patch && git -C upstream apply --unidiff-zero ../.github/diagnostics/native-failures.patch

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the credential export regression with diagnostics
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_targets=(
            //codex-rs/model-provider:model-provider-unit-tests
          )
          bazel_test_args=(
            test
            --config=ci-windows-msvc
            --platforms=//:windows_x86_64_msvc
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
            --test_tag_filters=-argument-comment-lint
            --test_filter=shared_bedrock_auth_refresh_is_reused_only_for_matching_configuration
            --test_verbose_timeout_warnings
            --test_output=all
            --test_env=RUST_BACKTRACE=1
            --test_env=RUST_LIB_BACKTRACE=1
            --test_env=RUST_TEST_NOCAPTURE=1
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}"
            --build_metadata=TAG_native_failure_probe=true
          )
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-probe-windows-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Save Bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
