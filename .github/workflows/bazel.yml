name: Bazel

on:
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to .github/upstream-ref."
        required: false
        type: string

env:
  BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: "1"

concurrency:
  group: bazel-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  prepare-macos-tooling:
    name: Prepare verified tooling for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    uses: ./.github/workflows/prepare-tooling.yml
    with:
      runner: ${{ matrix.os }}

  prepare-windows-tooling:
    name: Prepare verified tooling for Windows
    uses: ./.github/workflows/prepare-tooling.yml
    with:
      runner: windows-2022

  test-linux:
    name: Bazel test on BuildBuddy for Linux x86-64
    uses: ./.github/workflows/buildbuddy-ci.yml
    with:
      task: bazel-test
      upstream_ref: ${{ inputs.upstream_ref }}
    secrets: inherit

  clippy-linux:
    name: Bazel clippy on BuildBuddy for ${{ matrix.target }}
    # Windows GNU builds reuse the V8 snapshot that only a Windows host can generate.
    needs: windows-v8-snapshot
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-gnullvm]
    uses: ./.github/workflows/buildbuddy-ci.yml
    with:
      task: bazel-clippy
      target: ${{ matrix.target }}
      upstream_ref: ${{ inputs.upstream_ref }}
    secrets: inherit

  verify-release-linux:
    name: Verify release build on BuildBuddy for ${{ matrix.target }}
    # Windows GNU builds reuse the V8 snapshot that only a Windows host can generate.
    needs: windows-v8-snapshot
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-gnullvm]
    uses: ./.github/workflows/buildbuddy-ci.yml
    with:
      task: bazel-verify-release
      target: ${{ matrix.target }}
      upstream_ref: ${{ inputs.upstream_ref }}
    secrets: inherit

  test:
    needs: prepare-macos-tooling
    # Cold macOS setup and compilation share this allowance with the full suite.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos-') && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Upstream disabled these ARM Bazel tests after recurring linker
          # failures in the hosted ARM environment. Keep the supported
          # multi-platform matrix aligned with upstream while retaining both
          # macOS targets below.
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    name: Bazel test on ${{ matrix.os }} for ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          # The local Codex patch stack is based on this upstream revision.
          # Advance it only when the product patches have been rebased.
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-test

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GitHub script test dependencies
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: python3 -m pip install --disable-pip-version-check packaging

      - name: Install Linux sandbox build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Check Bazel repository cache save policy
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/test-bazel-cache-save.sh

      - name: Check rusty_v8 MODULE.bazel checksums
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          "$CODEX_UNLEASHED_TOOLING" rusty-v8-bazel . check-module-bazel
          "$CODEX_UNLEASHED_TOOLING" rusty-v8-bazel . check-consumer-selectors
          just test-github-scripts

      - name: Verify cross-platform MSVC runtime analysis
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          cd upstream
          ../.github/scripts/run-bazel-ci.sh -- build --nobuild -- @llvm//runtimes/msvc:msvc_include

      - name: Check MODULE.bazel.lock is up to date
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          ./scripts/check-module-bazel-lock.sh

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_targets=(
            //...
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            --print-failed-test-logs \
            -- \
            test \
            --test_tag_filters=-argument-comment-lint \
            --test_verbose_timeout_warnings \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            -- \
            "${bazel_targets[@]}"

      - name: Verify native linker SDK dependencies
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" -- cquery --output=label -- \
            'deps(//tools/build-warnings/rpaths:all)' > "$RUNNER_TEMP/native-sdk-labels.txt"
          bash tools/build-warnings/rpaths/check-sdk-analysis.sh "$RUNNER_OS" \
            "$RUNNER_TEMP/native-sdk-labels.txt"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-test-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Recheck Bazel repository cache before saving
        id: repository_cache_before_save
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
          lookup-only: true

      - name: Save Bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.repository_cache_before_save.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  windows-v8-snapshot:
    name: Generate Windows GNU V8 snapshot on Windows
    needs: prepare-windows-tooling
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          upstream-ref: ${{ inputs.upstream_ref }}
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-windows-v8-snapshot
      # ci-windows-cross runs V8Mksnapshot locally because the Windows snapshot generator must run on Windows. The
      # Linux-hosted cross builds below can only reuse its result, so generate it here into the shared remote cache.
      - name: Generate V8 snapshot
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" --print-failed-action-summary --windows-cross-compile \
            -- build "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" -- @v8//:icu/generated_snapshot_files

  test-windows-shard:
    name: Cross-compile Windows GNU tests on BuildBuddy
    needs: windows-v8-snapshot
    uses: ./.github/workflows/buildbuddy-ci.yml
    with:
      task: windows-cross
      target: x86_64-pc-windows-gnullvm
      upstream_ref: ${{ inputs.upstream_ref }}
    secrets: inherit

  test-windows-callback:
    name: Execute Windows GNU callback on Windows
    needs: [test-windows-shard, prepare-windows-tooling]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          upstream-ref: ${{ inputs.upstream_ref }}
      - name: Test BuildBuddy Bazel wrapper
        shell: pwsh
        run: python upstream/.github/scripts/test_run_bazel_with_buildbuddy.py
      - name: Download and execute Windows callback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$CODEX_UNLEASHED_TOOLING" download-workflow-artifact \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            buildbuddy-windows-cross-x86_64-pc-windows-gnullvm "$RUNNER_TEMP/windows-cross"
          bash .github/scripts/run-windows-callback.sh "$RUNNER_TEMP/windows-cross"

  test-windows:
    if: always()
    needs: [test-windows-shard, test-windows-callback]
    runs-on: ubuntu-latest
    name: Bazel build on windows-2022 for x86_64-pc-windows-gnullvm
    steps:
      - name: Confirm Windows cross-build and native callback passed
        shell: bash
        run: |
          if [[ "${{ needs.test-windows-shard.result }}" != "success" || "${{ needs.test-windows-callback.result }}" != "success" ]]; then
            echo "Windows cross-build: ${{ needs.test-windows-shard.result }}; native callback: ${{ needs.test-windows-callback.result }}" >&2
            exit 1
          fi

  test-windows-native-main:
    needs: prepare-windows-tooling
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
    # Cold native builds include Java verification and local MSVC compilation
    # before the full test suite; keep individual Bazel test timeouts in force.
    timeout-minutes: 180
    runs-on: windows-2022
    name: Bazel test on windows-2022 for x86_64-pc-windows-msvc (native main)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test-windows-native-main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Windows voice build inputs
        id: restore_voice
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/voice-cygwin-snapshot
          key: voice-cygwin-${{ hashFiles('upstream/.github/scripts/voice-cygwin-snapshot.json') }}

      - name: Install verified Windows voice build tools
        id: voice_tools
        shell: pwsh
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content .github/scripts/voice-cygwin-snapshot.json -Raw | ConvertFrom-Json).archive
          $directory = Join-Path $env:RUNNER_TEMP 'voice-cygwin-snapshot'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Join-Path $directory $pin.name
          if (-not (Test-Path -LiteralPath $archive)) {
            gh release download $pin.tag --repo openai/codex --pattern $pin.name --dir $directory
            if ($LASTEXITCODE -ne 0) { throw 'Downloading the pinned Windows voice archive failed.' }
          }
          & ./.github/scripts/setup-voice-windows.ps1 -Target x86_64-pc-windows-msvc -SnapshotArchive $archive

      - name: Save Windows voice build inputs
        if: always() && !cancelled() && steps.voice_tools.outcome == 'success' && steps.restore_voice.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/voice-cygwin-snapshot
          key: voice-cygwin-${{ hashFiles('upstream/.github/scripts/voice-cygwin-snapshot.json') }}

      - name: Check Windows Bazel PATH stability
        shell: pwsh
        run: ./.github/scripts/test-compute-bazel-windows-path.ps1 -WorkDirectory '${{ runner.temp }}/windows-path-check'

      - name: Verify Windows test launcher selection and batching
        shell: pwsh
        run: ./upstream/tools/build-warnings/windows-launcher/selected_tests.ps1 -TempRoot '${{ runner.temp }}'

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_targets=(
            //...
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )
          bazel_test_args=(
            test
            --config=ci-windows-msvc
            --platforms=//:windows_x86_64_msvc
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}"
            --build_metadata=TAG_windows_native_main=true
          )
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-test-windows-native-x86_64-pc-windows-gnullvm
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Recheck Bazel repository cache before saving
        id: repository_cache_before_save
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
          lookup-only: true

      - name: Save Bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.repository_cache_before_save.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  clippy:
    needs: prepare-macos-tooling
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-clippy

      - name: bazel build --config=clippy lint targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_clippy_args=(
            --config=clippy
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}"
            --build_metadata=TAG_job=clippy
          )
          bazel_wrapper_args=()
          bazel_target_list_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bazel_wrapper_args+=(--windows-cross-compile)
            bazel_target_list_args+=(--windows-cross-compile)
            bazel_clippy_args+=(--skip_incompatible_explicit_targets)
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bazel_target_lines="$(./scripts/list-bazel-clippy-targets.sh --windows-cross-compile)"
          else
            bazel_target_lines="$(./scripts/list-bazel-clippy-targets.sh)"
          fi
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary \
              --windows-cross-compile \
              -- \
              build \
              "${bazel_clippy_args[@]}" \
              -- \
              "${bazel_targets[@]}"
          else
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary \
              -- \
              build \
              "${bazel_clippy_args[@]}" \
              -- \
              "${bazel_targets[@]}"
          fi

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-clippy-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Recheck Bazel repository cache before saving
        id: repository_cache_before_save
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
          lookup-only: true

      - name: Save Bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.repository_cache_before_save.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  verify-release-build:
    needs: prepare-macos-tooling
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    name: Verify release build on ${{ matrix.os }} for ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-verify-release

      - name: Verify release build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          bazel_build_args=(
            --compilation_mode=fastbuild
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}"
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )
          bazel_wrapper_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bazel_wrapper_args+=(--windows-cross-compile)
          fi
          bazel_target_lines="$(bash ./scripts/list-bazel-release-targets.sh)"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary \
              --windows-cross-compile \
              -- \
              build \
              "${bazel_build_args[@]}" \
              -- \
              "${bazel_targets[@]}"
          else
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              --print-failed-action-summary \
              -- \
              build \
              "${bazel_build_args[@]}" \
              -- \
              "${bazel_targets[@]}"
          fi

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-verify-release-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Recheck Bazel repository cache before saving
        id: repository_cache_before_save
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
          lookup-only: true

      - name: Save Bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && steps.repository_cache_before_save.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
