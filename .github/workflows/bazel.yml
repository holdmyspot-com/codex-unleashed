name: Bazel

on:
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to .github/upstream-ref."
        required: false
        type: string

env:
  BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: "1"

concurrency:
  group: bazel-bridge-probe-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  voice-probe:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream

      - name: Add native Meson function detection regression
        shell: bash
        run: |
          set -euo pipefail
          cp -R .github/diagnostics/native-meson upstream/third_party/voice/function-probe
          python3 - <<'PY'
          from pathlib import Path
          root = Path('upstream/third_party/voice')
          build = root / 'BUILD.bazel'
          text = build.read_text()
          needle = '    name = "native_recipe",\n    srcs = [\n'
          assert text.count(needle) == 1
          files = ''.join(f'        "function-probe/{name}",\n' for name in ('meson.build', 'main.cc', 'probe.c', 'probe.h'))
          build.write_text(text.replace(needle, needle + files))
          recipe = root / 'build_native.py'
          text = recipe.read_text()
          needle = '        self.cmake(\n            "zlib",'
          assert text.count(needle) == 1
          probe = '        self.prefix.joinpath("lib").mkdir(parents=True, exist_ok=True)\n        self.prefix.joinpath("include").mkdir(parents=True, exist_ok=True)\n        self.sources["function-probe"] = Path(__file__).resolve().parent / "function-probe"\n        self.meson("function-probe", [])\n'
          recipe.write_text(text.replace(needle, probe + needle))
          PY

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-apple-darwin
          cache-scope: bazel-clippy

      - name: Reproduce native Meson function detection failure
        id: regression
        continue-on-error: true
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            -- \
            build \
            --jobs=2 \
            --config=clippy \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            --build_metadata=TAG_job=clippy \
            -- \
            //third_party/voice:native_prefix_macos_aarch64

      - name: Require the intended regression before correcting linker selection
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert os.environ['REGRESSION_OUTCOME'] == 'failure', 'The baseline must reproduce the function-detection failure'
          logs = Path(os.environ['BAZEL_OUTPUT_BASE']).joinpath('execroot/_main/bazel-out/_tmp/actions')
          matched = False
          for path in logs.glob('stderr-*'):
              text = path.read_text(errors='replace')
              if "ld64.lld: error: Option `-no_weak_imports' is not yet implemented." in text and 'ERROR: Assert failed: Standard C function detection must succeed' in text:
                  print(f'Confirmed intended regression in {path.name}')
                  matched = True
          assert matched, 'An unrelated setup or compiler failure does not establish the regression'
          recipe = Path('upstream/third_party/voice/build_native.py')
          text = recipe.read_text()
          needle = '        meson_flags = {name: list(flags) for name, flags in self.flags.items()}\n'
          assert text.count(needle) == 1
          correction = '        if self.args.target.endswith("apple-darwin"):\n            meson_flags["LDFLAGS"].append("-fuse-ld=/usr/bin/ld")\n'
          recipe.write_text(text.replace(needle, needle + correction))
          PY

      - name: Verify function detection and complete native prefix
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --print-failed-action-summary \
            -- \
            build \
            --jobs=2 \
            --config=clippy \
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}" \
            --build_metadata=TAG_job=clippy \
            -- \
            //third_party/voice:native_prefix_macos_aarch64

      - name: Preserve native action output
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          destination="$RUNNER_TEMP/bazel-execution-logs/action-output"
          mkdir -p "$destination"
          for log in "$BAZEL_OUTPUT_BASE"/execroot/_main/bazel-out/_tmp/actions/{stdout,stderr}-*; do
            if [[ -s "$log" ]]; then
              cp "$log" "$destination/"
            fi
          done

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bazel-execution-logs-native-voice-probe
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

