name: Clean upstream SQLite regression

on:
  workflow_dispatch:

env:
  BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: "1"

concurrency:
  group: clean-upstream-baseline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-baseline:
    if: github.ref_name == 'ci/sqlite-clean-regression'
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: corrupt-file-release
            target: //codex-rs/state:state-unit-tests
            test: sqlite::tests::open_read_write_pool_releases_corrupt_file_before_returning
    name: Clean upstream Windows (${{ matrix.label }})
    steps:
      # Only the regression test is transferred to original upstream sources.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Retain the test-only fixture before upstream checkout
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/sqlite-file-release-test-only.patch "$RUNNER_TEMP/sqlite-file-release-test-only.patch"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: 83086188ae0614bd882818ff1aa23f3194962012
          persist-credentials: false

      - name: Verify clean upstream identity and pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 83086188ae0614bd882818ff1aa23f3194962012
          test -z "$(git status --porcelain)"
          cat .bazelversion codex-rs/rust-toolchain.toml

      - name: Apply only the corruption-release regression test
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/sqlite-file-release-test-only.patch"
          test "$(git diff --cached --name-only)" = codex-rs/state/src/sqlite_tests.rs
          git diff --exit-code HEAD -- codex-rs/state/src/sqlite.rs
          git diff --cached --stat

      - name: Normalize release-tag workspace lock versions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 update --workspace --manifest-path codex-rs/Cargo.toml
          test "$(git diff --name-only)" = codex-rs/Cargo.lock
          expected_lock=$(mktemp "${RUNNER_TEMP}/upstream-release-lock-XXXXXX")
          trap 'rm -f -- "$expected_lock"' EXIT
          git show HEAD:codex-rs/Cargo.lock |
            sed 's/^version = "0.0.0"$/version = "0.163.0"/' > "$expected_lock"
          cmp "$expected_lock" codex-rs/Cargo.lock
          git diff --stat -- codex-rs/Cargo.lock

      - name: Prepare original upstream Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: clean-upstream-native-windows

      - name: Build the selected original upstream test binary
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          REGRESSION_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = codex-rs/Cargo.lock
          test -z "$(git ls-files --others --exclude-standard)"
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --windows-msvc-host-platform \
            -- \
            build \
            --config=ci-windows-msvc \
            --platforms=//:windows_x86_64_msvc \
            "--build_metadata=COMMIT_SHA=$(git rev-parse HEAD)" \
            --build_metadata=TAG_clean_upstream_sqlite_regression=true \
            -- "$REGRESSION_TARGET"

      - name: Loop only the selected original upstream regression
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          REGRESSION_TARGET: ${{ matrix.target }}
          REGRESSION_TEST: ${{ matrix.test }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- . ":(exclude)codex-rs/Cargo.lock" ":(exclude)MODULE.bazel.lock" ":(exclude)codex-rs/state/src/sqlite_tests.rs"
          test -z "$(git ls-files --others --exclude-standard)"
          attempt_log=$(mktemp "${RUNNER_TEMP}/clean-upstream-attempt-XXXXXX")
          trap 'rm -f -- "$attempt_log"' EXIT
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "Clean upstream attempt $attempt: $REGRESSION_TEST"
            if ./.github/scripts/run-bazel-ci.sh \
              --print-failed-action-summary \
              --print-failed-test-logs \
              --windows-msvc-host-platform \
              -- \
              test \
              --config=ci-windows-msvc \
              --platforms=//:windows_x86_64_msvc \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_sharding_strategy=disabled \
              --test_output=all \
              --nocache_test_results \
              --test_arg=--exact \
              "--test_arg=$REGRESSION_TEST" \
              --test_arg=--nocapture \
              --test_env=RUST_BACKTRACE=1 \
              --test_env=RUST_LIB_BACKTRACE=0 \
              "--build_metadata=COMMIT_SHA=$(git rev-parse HEAD)" \
              --build_metadata=TAG_clean_upstream_sqlite_regression=true \
              -- "$REGRESSION_TARGET" 2>&1 | tee "$attempt_log"; then
              grep -q 'running 1 test' "$attempt_log"
              grep -Fq "test $REGRESSION_TEST ... ok" "$attempt_log"
              grep -q 'test result: ok\. 1 passed; 0 failed;' "$attempt_log"
              if [[ "$attempt" -eq 1 ]]; then
                echo "::notice title=Clean upstream regression executed::$REGRESSION_TEST passed its first uncached execution."
              fi
            else
              status=$?
              echo "Stopped at clean upstream attempt $attempt with exit $status"
              exit "$status"
            fi
          done

      - name: Upload upstream execution logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: clean-upstream-windows-${{ matrix.label }}
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 1
          if-no-files-found: ignore

      - name: Save upstream repository downloads
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-key != '' && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
