name: blocking-ci

on:
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}::${{ github.ref }}
  cancel-in-progress: true

jobs:
  blob-size-policy:
    name: blob-size-policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    with:
      upstream_ref: 848b3845884e3aaf3359867047751dfff12dc448
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    with:
      upstream_ref: 848b3845884e3aaf3359867047751dfff12dc448
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    with:
      upstream_ref: 848b3845884e3aaf3359867047751dfff12dc448
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    with:
      upstream_ref: 848b3845884e3aaf3359867047751dfff12dc448
    secrets: inherit

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
