name: Scheduler native prerequisites

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect memory state or test native swap controls on disposable Linux/macOS runners
        type: choice
        default: inspect
        options:
          - inspect
          - verify-swap-control
          - verify-macos-mach-control

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - id: matrix
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          matrix="$(jq -c --arg operation "$OPERATION" '
            if $operation == "verify-swap-control" then
              {include: map(select((.runner | startswith("ubuntu")) or (.runner | startswith("macos"))))}
            elif $operation == "verify-macos-mach-control" then
              {include: map(select(.runner | startswith("macos")))}
            elif $operation == "inspect" then {include: .}
            else error("Unsupported diagnostic operation") end
          ' .github/release-matrix.json)"
          printf 'value=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  inspect:
    needs: select
    name: Inspect - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.target }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Create owned diagnostic storage
        run: |
          set -euo pipefail
          evidence="$(mktemp -d "$RUNNER_TEMP/scheduler-prerequisites-XXXXXX")"
          printf 'SCHEDULER_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          {
            printf 'workflow_commit=%s\nrunner_os=%s\nrunner_arch=%s\nrunner_environment=%s\n' \
              "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_ENVIRONMENT"
            printf 'image_os=%s\nimage_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          } | tee "$evidence/identity.txt"
          test "$RUNNER_ENVIRONMENT" = github-hosted

      - name: Inspect Linux memory controls without changing them
        if: inputs.operation == 'inspect' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          {
            uname -a
            id
            sudo -n true
            swapon --show --bytes
            sysctl vm.overcommit_memory vm.overcommit_ratio vm.overcommit_kbytes
            cat /proc/self/cgroup
            findmnt -n -o TARGET,FSTYPE,OPTIONS -T /sys/fs/cgroup
            for control in /sys/fs/cgroup/memory.oom_control /sys/fs/cgroup/memory.high /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.swap.max /sys/fs/cgroup/cgroup.controllers; do
              printf 'control=%s\n' "$control"
              if [[ -r "$control" ]]; then cat "$control"; else printf 'readable=false\n'; fi
              if [[ -w "$control" ]]; then printf 'writable=true\n'; else printf 'writable=false\n'; fi
            done
          } | tee "$SCHEDULER_EVIDENCE/linux.txt"

      - name: Inspect macOS memory controls without changing them
        if: inputs.operation == 'inspect' && runner.os == 'macOS'
        run: |
          set -euo pipefail
          {
            uname -a
            sw_vers
            id
            sudo -n true
            for setting in hw.memsize vm.swapusage vm.swap_enabled vm.compressor_mode kern.bootargs; do
              if sysctl "$setting"; then :; else printf 'unavailable_sysctl=%s\n' "$setting"; fi
            done
            vm_stat
          } | tee "$SCHEDULER_EVIDENCE/macos.txt"

      - name: Inspect Windows memory controls without changing them
        if: inputs.operation == 'inspect' && runner.os == 'Windows'
        shell: pwsh
        run: |
          & {
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
            Get-CimInstance Win32_ComputerSystem | Select-Object AutomaticManagedPagefile, TotalPhysicalMemory | Format-List
            Write-Output 'Active pagefiles (Win32_PageFileUsage):'
            Get-CimInstance Win32_PageFileUsage | Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage | Format-List
            Write-Output 'Startup pagefile settings (Win32_PageFileSetting):'
            Get-CimInstance Win32_PageFileSetting | Select-Object Name, InitialSize, MaximumSize | Format-List
            whoami /priv
          } | Out-String | Tee-Object -FilePath "$env:SCHEDULER_EVIDENCE/windows.txt"

      - name: Disable Linux swap and verify active state
        if: inputs.operation == 'verify-swap-control' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          {
            printf 'Active swap before control:\n'
            swapon --show --bytes
            sudo -n swapoff --all
            printf 'Active swap after control:\n'
            swapon --show --bytes
            if [[ -z "$(swapon --show --noheadings)" ]]; then
              printf 'verified_swap_disabled=true\n'
            else
              printf 'Swap remains active after swapoff.\n' >&2
              exit 1
            fi
          } 2>&1 | tee "$SCHEDULER_EVIDENCE/swap-control.txt"

      - name: Test macOS runtime swap setter and verify effective state
        if: inputs.operation == 'verify-swap-control' && runner.os == 'macOS'
        run: |
          set -euo pipefail
          previous="$(sysctl -n vm.swap_enabled)"
          changed=false
          trap 'if [[ "$changed" == true ]]; then sudo -n sysctl -w "vm.swap_enabled=$previous" > "$SCHEDULER_EVIDENCE/swap-restore.txt" 2>&1; fi' EXIT
          {
            printf 'Initial vm.swap_enabled=%s\n' "$previous"
            sysctl vm.swapusage
            if sudo -n sysctl -w vm.swap_enabled=0; then
              changed=true
            else
              printf 'Runtime swap setter failed; this operation does not disable swap.\n' >&2
              exit 1
            fi
            sysctl vm.swap_enabled vm.swapusage
            test "$(sysctl -n vm.swap_enabled)" = 0
            printf 'verified_swap_disabled=true\n'
          } > "$SCHEDULER_EVIDENCE/swap-control.txt" 2>&1

      - name: Retrieve the native Mach control probe
        if: inputs.operation == 'verify-macos-mach-control'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/probe-macos-swap-control.c
          sparse-checkout-cone-mode: false

      - name: Test native Mach control and restore the original state
        if: inputs.operation == 'verify-macos-mach-control'
        run: |
          set -euo pipefail
          trap 'rm -f -- "$SCHEDULER_EVIDENCE/swap-control-probe"' EXIT
          cc -std=c11 -Wall -Wextra .github/scripts/probe-macos-swap-control.c -o "$SCHEDULER_EVIDENCE/swap-control-probe"
          sudo -n "$SCHEDULER_EVIDENCE/swap-control-probe" 2>&1 | tee "$SCHEDULER_EVIDENCE/mach-control.txt"

      - name: Retain diagnostic evidence for one day
        if: always() && env.SCHEDULER_EVIDENCE != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: scheduler-prerequisites-${{ matrix.target }}
          path: ${{ env.SCHEDULER_EVIDENCE }}
          retention-days: 1
          if-no-files-found: error

      - name: Remove owned diagnostic storage
        if: always() && env.SCHEDULER_EVIDENCE != ''
        run: rm -rf -- "$SCHEDULER_EVIDENCE"
