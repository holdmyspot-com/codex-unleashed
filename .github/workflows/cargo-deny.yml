name: cargo-deny

on:
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to main."
        required: false
        type: string

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref || '848b3845884e3aaf3359867047751dfff12dc448' }}
          fallback-to-default-branch: "true"

      - name: Install upstream dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          pnpm install --frozen-lockfile

      - name: Record reviewed rustls advisory exception
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          deny = Path("upstream/codex-rs/deny.toml")
          text = deny.read_text(encoding="utf-8")
          advisory = "RUSTSEC-2026-0285"
          if advisory not in text:
              marker = "    # Reviewed 2026-07-02. Keep this list in sync with .cargo/audit.toml.\n"
              exception = '    { id = "RUSTSEC-2026-0285", reason = "848b3845884e3aaf3359867047751dfff12dc448 pins rustls 0.23.36; remove this exception when the supported upstream release includes rustls >=0.23.45" },\n'
              if marker not in text:
                  raise SystemExit(f"Could not find advisory exception marker in {deny}")
              deny.write_text(text.replace(marker, marker + exception, 1), encoding="utf-8")
          PY

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246
        with:
          rust-version: stable
          manifest-path: ./upstream/codex-rs/Cargo.toml
