name: cargo-deny

on:
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to .github/upstream-ref."
        required: false
        type: string

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Install upstream dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          pnpm install --frozen-lockfile

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246
        with:
          rust-version: stable
          manifest-path: ./upstream/codex-rs/Cargo.toml
          command: >-
            check --deny unmatched-source --deny license-not-encountered
            --deny unused-wrapper --deny advisory-not-detected
