name: cargo-deny
on:
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Optional upstream ref to test. Defaults to .github/upstream-ref.
        required: false
        type: string
jobs:
  cargo-deny:
    uses: ./.github/workflows/buildbuddy-ci.yml
    with:
      task: cargo-deny
      upstream_ref: ${{ inputs.upstream_ref }}
    secrets: inherit
