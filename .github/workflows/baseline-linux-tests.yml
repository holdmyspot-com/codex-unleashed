name: Stable upstream Linux tests

on:
  workflow_dispatch:
    inputs:
      package:
        description: Optional Cargo package for an unmodified-source comparison
        type: string
        default: ""
      compare_upstream_image:
        description: Compare one unchanged archive across the host and upstream image capabilities
        type: boolean
        default: false
      trace_shell_startup:
        description: Trace the failing remote sandbox shell case after its untraced archive run
        type: boolean
        default: false
      filter:
        description: Optional nextest expression for an unmodified-source comparison
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "8388608"
      RUST_BACKTRACE: "1"
      RUST_LIB_BACKTRACE: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-test-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Validate the focused process-trace request
        if: inputs.trace_shell_startup
        env:
          TRACE_PACKAGE: ${{ inputs.package }}
          TRACE_FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          test "$TRACE_PACKAGE" = codex-exec-server
          test "$TRACE_FILTER" = 'test(shell_snapshot_v2_filters_profile_exports_and_stays_in_memory::remote_sandbox)'

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/baseline-test-evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$RUNNER_TEMP/baseline-test-evidence/pristine-source.diff"

      - name: Prepare upstream's native test host
        uses: ./.github/actions/setup-ci

      - name: Reclaim unused hosted-image toolchains and record capacity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          evidence="$RUNNER_TEMP/baseline-test-evidence"
          df -h / "$RUNNER_TEMP" | tee "$evidence/disk-before.txt"
          for unused in /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup; do
            if [[ -d "$unused" ]]; then
              sudo du -sh "$unused" | tee -a "$evidence/reclaimed-toolchains.txt"
              sudo rm -rf -- "$unused"
            fi
          done
          df -h / "$RUNNER_TEMP" | tee "$evidence/disk-after.txt"

      - name: Install Linux development prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap bison flex strace
          mkdir -p "$RUNNER_TEMP/baseline-test-cargo-home"
          printf 'CARGO_HOME=%s\n' "$RUNNER_TEMP/baseline-test-cargo-home" >> "$GITHUB_ENV"

      - name: Set up upstream's Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install upstream's nextest version
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103

      - name: Verify and configure upstream V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Supply the native voice prerequisites using upstream's recipe
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/baseline-test-native"
          mkdir -p "$native/archives" "$native/tools"
          curl --fail --location --retry 3 --output "$native/cmake.tar.gz" https://github.com/Kitware/CMake/releases/download/v3.31.8/cmake-3.31.8-linux-x86_64.tar.gz
          printf '%s  %s\n' 630615d8e98ac33eba7fbe472626dff5c899c85af3c024585ae109166a6909d0 "$native/cmake.tar.gz" | sha256sum -c -
          tar -xzf "$native/cmake.tar.gz" -C "$native/tools" --strip-components=1
          jq -r '.sources[] | [.url, .archive, .sha256] | @tsv' third_party/voice/sources.json > "$native/sources.tsv"
          while IFS=$'\t' read -r url archive digest; do
            curl --fail --location --retry 3 --output "$native/archives/$archive" "$url"
            printf '%s  %s\n' "$digest" "$native/archives/$archive" | sha256sum -c -
          done < "$native/sources.tsv"
          python3 third_party/voice/build_native.py \
            --archives "$native/archives" \
            --output "$native/build" \
            --cc /usr/bin/gcc --cxx /usr/bin/g++ \
            --cmake "$native/tools/bin/cmake" --make /usr/bin/make \
            --pkg-config /usr/bin/pkg-config --shell /bin/bash \
            --target x86_64-unknown-linux-gnu \
            2>&1 | tee "$RUNNER_TEMP/baseline-test-evidence/native-build.log"
          cp "$native/build/built.json" "$RUNNER_TEMP/baseline-test-evidence/native-built.json"
          {
            printf 'PKG_CONFIG_PATH=%s\n' "$native/build/prefix/lib/pkgconfig:$native/build/prefix/share/pkgconfig"
            printf 'LD_LIBRARY_PATH=%s\n' "$native/build/prefix/lib"
            printf 'CODEX_TEST_VOICE_RUNTIME=%s\n' "$native/build/prefix"
          } >> "$GITHUB_ENV"

      - name: Build the maintained Linux test helper and bundled executable
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --target x86_64-unknown-linux-gnu --profile ci-test \
            -p codex-linux-sandbox -p codex-bwrap --bin codex-linux-sandbox --bin bwrap \
            2>&1 | tee "$RUNNER_TEMP/baseline-test-evidence/test-helper-build.log"

      - name: Build one unchanged archive for the environment comparison
        id: archive
        if: inputs.compare_upstream_image || inputs.trace_shell_startup
        working-directory: codex-rs
        env:
          BASELINE_TEST_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          archive_args=(archive --target x86_64-unknown-linux-gnu --cargo-profile ci-test --archive-file "$RUNNER_TEMP/baseline-test-archive.tar.zst")
          if [[ -n "$BASELINE_TEST_PACKAGE" ]]; then
            archive_args+=(-p "$BASELINE_TEST_PACKAGE")
          fi
          cargo-nextest nextest "${archive_args[@]}" 2>&1 | tee "$RUNNER_TEMP/baseline-test-evidence/archive.log"
          sha256sum "$RUNNER_TEMP/baseline-test-archive.tar.zst" > "$RUNNER_TEMP/baseline-test-evidence/archive.sha256"

      - name: Run the maintained nextest suite or focused comparison
        id: native_tests
        env:
          BASELINE_TEST_PACKAGE: ${{ inputs.package }}
          BASELINE_TEST_FILTER: ${{ inputs.filter }}
          BASELINE_ARCHIVE_COMPARE: ${{ inputs.compare_upstream_image || inputs.trace_shell_startup }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          (
            while true; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              df -k "$CARGO_TARGET_DIR" "$RUNNER_TEMP"
              if du -sk -- "$CARGO_HOME" "$RUNNER_TEMP/baseline-test-native"; then
                :
              else
                printf 'directory_sample_exit=%s\n' "$?"
              fi
              if du -k --max-depth=3 -- "$CARGO_TARGET_DIR" | sort -nr | sed -n '1,30p'; then
                :
              else
                printf 'directory_sample_exit=%s\n' "$?"
              fi
              sleep 60
            done
          ) >> "$RUNNER_TEMP/baseline-test-evidence/test-disk-usage.log" 2>&1 &
          disk_monitor=$!
          trap 'kill "$disk_monitor" 2>/dev/null || true; wait "$disk_monitor" || true' EXIT
          cargo-nextest --version | tee "$RUNNER_TEMP/baseline-test-evidence/nextest-version.txt"
          helper="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/ci-test/codex-linux-sandbox"
          if [[ "$BASELINE_ARCHIVE_COMPARE" == true ]]; then
            nextest_args=(run --archive-file "$RUNNER_TEMP/baseline-test-archive.tar.zst" --workspace-remap "$GITHUB_WORKSPACE/codex-rs" --no-fail-fast --success-output immediate)
          else
            nextest_args=(run --target x86_64-unknown-linux-gnu --cargo-profile ci-test --no-fail-fast --timings)
            if [[ -n "$BASELINE_TEST_PACKAGE" ]]; then
              nextest_args+=(-p "$BASELINE_TEST_PACKAGE")
            fi
          fi
          if [[ -n "$BASELINE_TEST_FILTER" ]]; then
            nextest_args+=(-E "$BASELINE_TEST_FILTER")
          fi
          printf '%s\n' "${nextest_args[@]}" > "$RUNNER_TEMP/baseline-test-evidence/nextest-arguments.txt"
          env "CARGO_BIN_EXE_codex-linux-sandbox=$helper" "CARGO_BIN_EXE_codex_linux_sandbox=$helper" \
            cargo-nextest nextest "${nextest_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/baseline-test-evidence/nextest.log"

      - name: Trace the same unmodified remote sandbox shell case
        if: ${{ !cancelled() && inputs.trace_shell_startup && steps.archive.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-test-evidence"
          helper="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/ci-test/codex-linux-sandbox"
          strace --version > "$evidence/strace-version.txt"
          set +e
          env "CARGO_BIN_EXE_codex-linux-sandbox=$helper" "CARGO_BIN_EXE_codex_linux_sandbox=$helper" \
            strace -f -yy -s 256 \
              -e trace=execve,openat,close,dup,dup2,dup3,fcntl,readlink,readlinkat,connect,socketpair,newfstatat \
              -o "$evidence/shell-startup.trace" \
              cargo-nextest nextest run --archive-file "$RUNNER_TEMP/baseline-test-archive.tar.zst" \
                --workspace-remap "$GITHUB_WORKSPACE/codex-rs" --no-fail-fast --success-output immediate \
                -E 'test(shell_snapshot_v2_filters_profile_exports_and_stays_in_memory::remote_sandbox)' \
            2>&1 | tee "$evidence/traced-nextest.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" > "$evidence/traced-nextest.receipt"
          sha256sum --check "$evidence/archive.sha256"
          exit "$result"

      - name: Run the same archive in upstream's pinned Linux image
        if: ${{ !cancelled() && inputs.compare_upstream_image && steps.archive.outcome == 'success' }}
        env:
          BASELINE_TEST_FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-test-evidence"
          image_digest=0a8e56bfaa3b2e5279db0d3bb2d62b44ba5e5d63a37d97eb8790f49da570af70
          grep -F "image_sha = \"$image_digest\"" rbe.bzl > /dev/null
          image="docker.io/mbolin491/codex-bazel@sha256:$image_digest"
          docker pull "$image" 2>&1 | tee "$evidence/upstream-image-pull.log"
          docker image inspect "$image" > "$evidence/upstream-image.json"
          helper="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/ci-test/codex-linux-sandbox"
          nextest_binary="$(command -v cargo-nextest)"
          nextest_args=(nextest run --archive-file "$RUNNER_TEMP/baseline-test-archive.tar.zst" --workspace-remap "$GITHUB_WORKSPACE/codex-rs" --no-fail-fast --success-output immediate)
          if [[ -n "$BASELINE_TEST_FILTER" ]]; then
            nextest_args+=(-E "$BASELINE_TEST_FILTER")
          fi
          printf '%s\n' "${nextest_args[@]}" > "$evidence/image-nextest-arguments.txt"
          docker_common=(
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE,readonly"
            --mount "type=bind,source=$RUNNER_TEMP,target=$RUNNER_TEMP,readonly"
            --mount "type=bind,source=$CARGO_TARGET_DIR,target=$CARGO_TARGET_DIR,readonly"
            --mount "type=bind,source=$nextest_binary,target=/usr/local/bin/cargo-nextest,readonly"
            --tmpfs "$GITHUB_WORKSPACE/codex-rs/target/nextest:rw,uid=1000,gid=1000,mode=0700"
            --workdir "$GITHUB_WORKSPACE/codex-rs"
            --env RUST_MIN_STACK --env RUST_BACKTRACE --env RUST_LIB_BACKTRACE
            --env LD_LIBRARY_PATH --env CODEX_TEST_VOICE_RUNTIME
            --env "CARGO_BIN_EXE_codex-linux-sandbox=$helper"
            --env "CARGO_BIN_EXE_codex_linux_sandbox=$helper"
          )
          bundled_bwrap="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/ci-test/bwrap"
          test -x "$bundled_bwrap"
          comparison_result=0
          for variant in upstream-image upstream-image-bwrap upstream-image-bwrap-namespaces upstream-image-bwrap-mounts; do
            variant_args=()
            case "$variant" in
              upstream-image-bwrap)
                variant_args+=(--mount "type=bind,source=$bundled_bwrap,target=/usr/local/bin/bwrap,readonly")
                ;;
              upstream-image-bwrap-namespaces)
                variant_args+=(--mount "type=bind,source=$bundled_bwrap,target=/usr/local/bin/bwrap,readonly" --security-opt seccomp=unconfined)
                ;;
              upstream-image-bwrap-mounts)
                variant_args+=(--mount "type=bind,source=$bundled_bwrap,target=/usr/local/bin/bwrap,readonly" --security-opt seccomp=unconfined --security-opt apparmor=unconfined)
                ;;
            esac
            printf '%s\n' "${variant_args[@]}" > "$evidence/$variant-docker-arguments.txt"
            set +e
            docker run --rm "${docker_common[@]}" "${variant_args[@]}" "$image" \
              /bin/sh -c 'id; cat /proc/self/attr/current; grep -E "^(Seccomp|NoNewPrivs):" /proc/self/status; command -v bwrap; bwrap --unshare-user --unshare-net --ro-bind / / /bin/true' \
              2>&1 | tee "$evidence/$variant-capability.log"
            capability_result=${PIPESTATUS[0]}
            printf 'exit_code=%s\n' "$capability_result" > "$evidence/$variant-capability.receipt"
            docker run --rm "${docker_common[@]}" "${variant_args[@]}" \
              "$image" /usr/local/bin/cargo-nextest "${nextest_args[@]}" \
              2>&1 | tee "$evidence/$variant-nextest.log"
            result=${PIPESTATUS[0]}
            set -e
            printf 'exit_code=%s\n' "$result" > "$evidence/$variant-nextest.receipt"
            sha256sum --check "$evidence/archive.sha256"
            if [[ "$result" != 0 ]]; then
              comparison_result="$result"
            fi
          done
          exit "$comparison_result"

      - name: Verify upstream source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.inputs.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Retain test evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-linux-tests
          path: |
            ${{ runner.temp }}/baseline-test-evidence
            ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings
            ${{ env.CARGO_TARGET_DIR }}/nextest/**/junit.xml
            codex-rs/target/nextest/**/junit.xml
          retention-days: 1
          if-no-files-found: warn
