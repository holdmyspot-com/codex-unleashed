name: sdk

on:
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
        default: e2209ccd7e7fbdcbe0755478b5418318a5d220b6
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to the pinned Bazel-compatible baseline."
        required: false
        type: string

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref || 'e2209ccd7e7fbdcbe0755478b5418318a5d220b6' }}
          fallback-to-default-branch: "true"

      - name: Test Python SDK
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/codex-python-sdk-home \
            -e UV_LINK_MODE=copy \
            -e CODEX_UPSTREAM_DIR="${GITHUB_WORKSPACE}/upstream" \
            -v "${GITHUB_WORKSPACE}/upstream:${GITHUB_WORKSPACE}/upstream" \
            -w "${GITHUB_WORKSPACE}/upstream/sdk/python" \
            python:3.12-slim \
            sh -euxc '
              python -m venv /tmp/uv
              /tmp/uv/bin/python -m pip install uv==0.11.3
              export PATH="/tmp/uv/bin:${PATH}"
              uv sync --group dev --frozen
              uv run --frozen --no-sync ruff check --output-format=github .
              uv run --frozen --no-sync ruff format --check .
              # The upstream formatter implementation uses cargo fmt, but its
              # matching assertion still expects the removed direct-rustfmt
              # implementation. Keep the rest of the upstream SDK tests
              # active until upstream updates that assertion.
              uv run --frozen --no-sync pytest \
                --deselect tests/test_artifact_workflow_and_binaries.py::test_root_format_driver_covers_all_formatter_groups
            '

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  sdks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_sdk_tests: true
          - os: macos-15
            target: aarch64-apple-darwin
            run_sdk_tests: false
          - os: windows-latest
            target: x86_64-pc-windows-gnullvm
            windows_cross_compile: true
            binary_extension: .exe
            run_sdk_tests: false
    runs-on: ${{ matrix.os }}
    name: SDK binaries on ${{ matrix.os }} for ${{ matrix.target }}
    # A cold Bazel build on GitHub-hosted runners can exceed the upstream
    # workflow's cached-runner timeout.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref || 'e2209ccd7e7fbdcbe0755478b5418318a5d220b6' }}
          fallback-to-default-branch: "true"

      - name: Setup pnpm
        if: ${{ matrix.run_sdk_tests }}
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        if: ${{ matrix.run_sdk_tests }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Prepare Bazel CI
        id: setup_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: sdk

      - name: Build patched Codex binaries for SDK tests
        id: build_bazel
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          # The SDK tests spawn the CLI directly, so download the top-level
          # Bazel outputs even when the build uses remote execution.
          bazel_wrapper_args=(--remote-download-toplevel)
          if [[ "${{ matrix.windows_cross_compile }}" == "true" ]]; then
            bazel_wrapper_args+=(--windows-cross-compile)
          fi
          ./.github/scripts/run-bazel-ci.sh "${bazel_wrapper_args[@]}" \
            -- \
            build \
            --build_metadata="COMMIT_SHA=${GITHUB_SHA}" \
            --build_metadata="TAG_job=sdk" \
            -- \
            //codex-rs/cli:codex \
            //codex-rs/code-mode-host:codex-code-mode-host

          cquery_output="$(
            ./.github/scripts/run-bazel-ci.sh "${bazel_wrapper_args[@]}" \
              -- \
              cquery \
              --output=files \
              -- \
              'set(//codex-rs/cli:codex //codex-rs/code-mode-host:codex-code-mode-host)' \
              | grep -E '^(/|bazel-out/)'
          )"
          # macOS still ships Bash 3.2, which lacks `mapfile`.
          bazel_output_paths=()
          while IFS= read -r bazel_output_path; do
            bazel_output_paths+=("${bazel_output_path}")
          done <<< "${cquery_output}"
          if [[ ${#bazel_output_paths[@]} -ne 2 ]]; then
            echo "Expected both Bazel-built binaries, found ${#bazel_output_paths[@]}." >&2
            exit 1
          fi

          # Stage only the two binaries the SDK tests need. Keeping them
          # together lets the CLI find its sibling code-mode host.
          install_dir="${RUNNER_TEMP}/codex-sdk-ci"
          mkdir -p "${install_dir}"
          install -m 755 "${bazel_output_paths[@]}" "${install_dir}"
          echo "CODEX_EXEC_PATH=${install_dir}/codex${{ matrix.binary_extension }}" >> "${GITHUB_ENV}"

      - name: Warm up Bazel-built codex
        if: ${{ matrix.run_sdk_tests }}
        run: "${CODEX_EXEC_PATH} --version"

      - name: Install workspace dependencies
        if: ${{ matrix.run_sdk_tests }}
        run: pnpm --dir upstream install --frozen-lockfile

      - name: Build TypeScript SDK packages
        if: ${{ matrix.run_sdk_tests }}
        shell: bash
        env:
          CODEX_EXEC_PATH: ${{ runner.temp }}/codex-sdk-ci/codex
        run: |
          set -euo pipefail
          pnpm --dir upstream/sdk/typescript run build

      - name: Lint TypeScript SDK packages
        if: ${{ matrix.run_sdk_tests }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir upstream/sdk/typescript run lint

      - name: Test TypeScript SDK packages
        if: ${{ matrix.run_sdk_tests }}
        shell: bash
        env:
          CODEX_EXEC_PATH: ${{ runner.temp }}/codex-sdk-ci/codex
        run: |
          set -euo pipefail
          # The first SDK test starts a freshly compiled binary and can exceed
          # Jest's five-second per-test default on a cold GitHub runner.
          pnpm --dir upstream/sdk/typescript exec jest --testTimeout=30000

      - name: Save Bazel repository cache
        if: always() && !cancelled() && steps.build_bazel.outcome == 'success' && steps.setup_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.setup_bazel.outputs.repository-cache-path }}
          key: ${{ steps.setup_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
