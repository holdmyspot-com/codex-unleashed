name: Stable upstream macOS Bazel tests

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order; empty tests pristine upstream
        type: string
        default: ""
  workflow_call:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      upstream_commit:
        description: Optional upstream commit to test instead of .github/upstream-commit
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        platform:
          - runner: macos-15
            target: aarch64-apple-darwin
            bazel_arch: arm64
            bazel_sha256: dd466352a3e4d3581b8898740ee1ff208866ccbe25f8d367c5dcb950219587e6
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bazel_arch: x86_64
            bazel_sha256: 14c9bcb01303b38192e0e2895051c1bcf19bf89d7e416f5aeeeb48b6b624cfbf
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      # Reads and writes the compiled C++ action cache in GHCR.
      packages: write
    env:
      TARGET: ${{ matrix.platform.target }}
      BAZEL_ARCH: ${{ matrix.platform.bazel_arch }}
      BAZEL_SHA256: ${{ matrix.platform.bazel_sha256 }}
      BAZEL_TEST_SHARD: ${{ matrix.shard }}
      BAZEL_TEST_SHARD_COUNT: '2'
      CC_CACHE_LANE: bazel-test-${{ matrix.platform.target }}-${{ matrix.shard }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        env:
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          if [[ -n "$UPSTREAM_COMMIT" ]]; then
            printf '%s\n' "$UPSTREAM_COMMIT" > "$evidence/upstream-commit"
          fi
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          cp restart-metadata/.github/scripts/reclaim-baseline-macos-xcodes.py "$RUNNER_TEMP/reclaim-baseline-macos-xcodes.py"
          cp restart-metadata/.github/scripts/compare-test-baseline.py "$RUNNER_TEMP/compare-test-baseline.py"
          mkdir -p "$RUNNER_TEMP/test-baselines"
          if [[ -d restart-metadata/docs/test-baselines ]]; then cp -R restart-metadata/docs/test-baselines/. "$RUNNER_TEMP/test-baselines/"; fi
          cp restart-metadata/.github/scripts/ghcr-cargo-target-cache.sh restart-metadata/.github/scripts/bazel-cc-disk-cache.sh "$RUNNER_TEMP/"
          cp restart-metadata/.github/cargo-cache-package "$evidence/cargo-cache-package"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          # Upstream's CI tests main, whose workspace version is 0.0.0; a stable tag's release commit changes only that
          # version. Test the same source, so version strings in snapshots and fixtures match what upstream tested.
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' codex-rs/Cargo.toml
          if ! git diff --quiet -- codex-rs/Cargo.toml; then
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          # macOS runs /bin/bash 3.2, where an empty array is unbound under set -u.
          for patch in ${patch_paths[@]+"${patch_paths[@]}"}; do
            printf '%s  %s\n' "$(shasum -a 256 < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare upstream's native test host
        uses: ./.github/actions/setup-ci

      - name: Reclaim inactive Xcode versions and verify selected native tools
        run: |
          python3 "$RUNNER_TEMP/reclaim-baseline-macos-xcodes.py" \
            --evidence-directory "$RUNNER_TEMP/baseline-macos-bazel-evidence"

      - name: Record the native host and capacity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = "$BAZEL_ARCH"
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          {
            uname -a
            sw_vers
            sysctl -n hw.memsize hw.logicalcpu
            df -k "$CI_BUILD_ROOT" "$RUNNER_TEMP"
          } | tee "$evidence/host.txt"

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up upstream's Rust toolchain for workspace metadata
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.platform.target }}

      - name: Synchronize release workspace versions without dependency upgrades
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          cargo metadata --format-version 1 --filter-platform "$TARGET" \
            --manifest-path codex-rs/Cargo.toml > "$RUNNER_TEMP/baseline-cargo-metadata.json"
          python3 - <<'PYTHON'
          import subprocess
          import tomllib
          from pathlib import Path

          before = tomllib.loads(subprocess.check_output(["git", "show", "HEAD:codex-rs/Cargo.lock"], text=True))
          after = tomllib.loads(Path("codex-rs/Cargo.lock").read_text())
          before_header = {key: value for key, value in before.items() if key != "package"}
          after_header = {key: value for key, value in after.items() if key != "package"}
          assert before_header == after_header, "Cargo changed lockfile metadata beyond workspace versions"
          before_external = [package for package in before["package"] if "source" in package]
          after_external = [package for package in after["package"] if "source" in package]
          assert before_external == after_external, "Cargo changed external dependency records"
          version = tomllib.loads(Path("codex-rs/Cargo.toml").read_text())["workspace"]["package"]["version"]
          expected_workspace = [dict(package, version=version) for package in before["package"] if "source" not in package]
          actual_workspace = [package for package in after["package"] if "source" not in package]
          assert expected_workspace == actual_workspace, "Cargo changed workspace records beyond their release version"
          print(f"Verified {len(actual_workspace)} workspace versions; external dependencies unchanged")
          PYTHON
          git diff --check
          git diff -- codex-rs/Cargo.lock > "$evidence/workspace-version-lock.diff"
          git diff --binary > "$evidence/source-before.diff"

      - name: Install the pinned upstream Bazel version
        run: |
          set -euo pipefail
          test "$(cat .bazelversion)" = 9.2.0
          tools="$RUNNER_TEMP/baseline-bazel-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 --retry-all-errors --output "$tools/bazel" "https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-darwin-$BAZEL_ARCH"
          printf '%s  %s\n' "$BAZEL_SHA256" "$tools/bazel" | shasum -a 256 -c -
          chmod +x "$tools/bazel"
          "$tools/bazel" --version | tee "$RUNNER_TEMP/baseline-macos-bazel-evidence/bazel-version.txt"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Partition the complete package selection across free runners
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          .github/scripts/run-bazel-query-ci.sh --output=label -- '//...' > "$evidence/candidate-targets.txt"
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "baseline-macos-bazel-evidence"
          labels = (evidence / "candidate-targets.txt").read_text().splitlines()
          packages = sorted({label.rsplit(":", 1)[0] for label in labels})
          shard_count = int(os.environ["BAZEL_TEST_SHARD_COUNT"])
          shard = int(os.environ["BAZEL_TEST_SHARD"])
          assignments = {
              package: int.from_bytes(hashlib.sha256(package.encode()).digest(), "big") % shard_count + 1
              for package in packages
          }
          selected = [f"{package}:all" for package in packages if assignments[package] == shard]
          assert selected, f"No packages selected for shard {shard}"
          (evidence / "selected-targets.txt").write_text("\n".join(selected) + "\n")
          (evidence / "package-shards.json").write_text(json.dumps(assignments, indent=2) + "\n")
          expression = "set(" + " ".join(f"{package}:all" for package in packages) + ")"
          (evidence / "all-package-patterns.query").write_text(expression + "\n")
          print(f"Selected {len(selected)} of {len(packages)} packages for shard {shard}/{shard_count}")
          PYTHON
          .github/scripts/run-bazel-query-ci.sh --output=label -- "$(cat "$evidence/all-package-patterns.query")" \
            | LC_ALL=C sort > "$evidence/expanded-package-targets.txt"
          LC_ALL=C sort "$evidence/candidate-targets.txt" > "$evidence/expected-targets.txt"
          cmp "$evidence/expected-targets.txt" "$evidence/expanded-package-targets.txt"

      - name: Retain prepared host evidence before compilation
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-macos-bazel-host-${{ matrix.platform.target }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/baseline-macos-bazel-evidence
          retention-days: 3
          if-no-files-found: error

      - name: Set up the GHCR cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      # Upstream hides the cost of compiling V8 from source behind its BuildBuddy cache; without one, each shard spent
      # about three of its six hours compiling V8, and an Intel shard reached the job limit. A cache fault never fails
      # the tests: the build then runs cold.
      - name: Restore the compiled C++ actions
        id: cc_cache
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          # macOS runs /bin/bash 3.2, which lacks the ${name,,} lowercase expansion.
          owner=$(printf '%s' "$GH_OWNER" | tr '[:upper:]' '[:lower:]')
          bash "$RUNNER_TEMP/bazel-cc-disk-cache.sh" restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bazel-cc-cache" \
            "ghcr.io/$owner/$(cat "$evidence/cargo-cache-package")" "$(cat "$evidence/upstream-ref")" "$CC_CACHE_LANE" \
            2>&1 | tee "$evidence/cc-cache-restore.log"

      - name: Run the maintained Bazel package shard
        id: bazel_tests
        # A cold build that would reach the job's six-hour limit stops here instead, so the steps below still save the
        # C++ actions it compiled and the next run starts warm.
        timeout-minutes: 290
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          export CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR="$evidence/execution-logs"
          mkdir -p "$CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR"
          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done < "$evidence/selected-targets.txt"
          (
            while true; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              df -k "$CI_BUILD_ROOT" "$RUNNER_TEMP"
              vm_stat
              if du -k -d 3 "$CI_BUILD_ROOT" | sort -nr | sed -n '1,30p'; then
                :
              else
                printf 'directory_sample_exit=%s\n' "$?"
              fi
              sleep 60
            done
          ) >> "$evidence/disk-usage.log" 2>&1 &
          disk_monitor=$!
          trap 'kill "$disk_monitor" 2>/dev/null || true; wait "$disk_monitor" || true' EXIT
          cache_args=(--disk_cache=)
          if [[ -f "$RUNNER_TEMP/bazel-cc-cache.restored" ]]; then
            # Only C++ compiles, archives and links (chiefly V8, built for both the target and the exec configuration)
            # reach the disk cache; every other action is marked no-cache, which keeps it out of the disk cache only.
            cache_args=(
              "--disk_cache=$RUNNER_TEMP/bazel-cc-cache"
              '--modify_execution_info=^(?!(CppCompile|CppArchive|CppLink|ObjcCompile)$).*$=+no-cache'
            )
          fi
          set +e
          .github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs -- \
            test "${cache_args[@]}" --test_tag_filters=-argument-comment-lint \
            --test_verbose_timeout_warnings --build_metadata="COMMIT_SHA=$(cat "$evidence/upstream-commit")" -- \
            "${targets[@]}" -//third_party/v8:all -//codex-rs/v8-poc:v8-poc-unit-tests \
            2>&1 | tee "$evidence/bazel-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" > "$evidence/bazel-tests.receipt"
          git diff --binary > "$evidence/source-after.diff"
          cmp "$evidence/source-before.diff" "$evidence/source-after.diff"
          # Bazel exits 3 when tests failed and everything else built. The comparison with the unpatched baseline below
          # judges those failures (an unpatched run records that baseline), so they alone do not fail this step.
          # Any other failure, such as a build error, does.
          if [[ "$result" == 3 ]]; then
            printf 'Bazel reported failing tests; the baseline comparison decides the outcome.\n'
            exit 0
          fi
          exit "$result"

      - name: Save the compiled C++ actions
        if: ${{ !cancelled() && steps.cc_cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          owner=$(printf '%s' "$GH_OWNER" | tr '[:upper:]' '[:lower:]')
          bash "$RUNNER_TEMP/bazel-cc-disk-cache.sh" save "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bazel-cc-cache" \
            "ghcr.io/$owner/$(cat "$evidence/cargo-cache-package")" "$(cat "$evidence/upstream-ref")" "$CC_CACHE_LANE" \
            2>&1 | tee "$evidence/cc-cache-save.log"

      - name: Record or compare this shard's failures
        # An unpatched run is pristine upstream, so its failures are the baseline that patched runs are compared with;
        # the evidence artifact carries the file for committing under docs/test-baselines. Shards are assigned by
        # package name, so a test never moves between shards and each shard is compared with its own baseline only.
        if: ${{ !cancelled() && steps.bazel_tests.outcome == 'success' }}
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          platform="macos-bazel-${BAZEL_ARCH}-shard-${BAZEL_TEST_SHARD}"
          common=(--runner bazel --platform "$platform" --upstream-commit "$(cat "$evidence/upstream-commit")")
          if [[ -z "${PATCHES// /}" ]]; then
            python3 "$RUNNER_TEMP/compare-test-baseline.py" "${common[@]}" --write-baseline \
              --output "$evidence/$platform.json" "$(realpath bazel-testlogs)"
          else
            python3 "$RUNNER_TEMP/compare-test-baseline.py" "${common[@]}" \
              --baseline-dir "$RUNNER_TEMP/test-baselines" "$(realpath bazel-testlogs)" 2>&1 \
              | tee "$evidence/baseline-comparison.log"
            exit "${PIPESTATUS[0]}"
          fi

      - name: Verify the tested source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Retain test evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-macos-bazel-tests-${{ matrix.platform.target }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/baseline-macos-bazel-evidence
          retention-days: 3
          if-no-files-found: warn
