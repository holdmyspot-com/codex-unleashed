name: Stable upstream macOS Bazel tests

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order; empty tests pristine upstream
        type: string
        default: ""
      targets:
        description: Space-separated Bazel test labels to run on one runner per platform instead of partitioning every package
        type: string
        default: ""
      stress_count:
        description: Optional repeat count; each selected test runs this many times under CPU load, with no retries, to measure flakiness
        type: string
        default: ""
      platforms:
        description: Platforms to test
        type: string
        default: both
  workflow_call:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      upstream_commit:
        description: Optional upstream commit to test instead of .github/upstream-commit
        type: string
        default: ""
      targets:
        description: Space-separated Bazel test labels to run on one runner per platform instead of partitioning every package
        type: string
        default: ""
      stress_count:
        description: Optional repeat count; each selected test runs this many times under CPU load, with no retries, to measure flakiness
        type: string
        default: ""
      platforms:
        description: Platforms to test
        type: string
        default: both
    secrets:
      BUILDBUDDY_API_KEY:
        description: BuildBuddy key for the remote cache; callers pass it only on trusted runs, and jobs run without it when it is absent
        required: false

permissions:
  contents: read

jobs:
  plan:
    # Each platform's shard count is defined here once; the shard matrix and the coverage job derive from it.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expect: ${{ steps.plan.outputs.expect }}
    steps:
      - name: Define the shards
        id: plan
        env:
          SINGLE_SHARD: ${{ inputs.targets != '' }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          # The 4-CPU Intel runner ran 25 tests at once, so tests missed their 10-second startup deadlines, and
          # shard 2 of 2 hit the 290-minute limit (run 45573260043). Upstream tests x86_64 on macos-15-xlarge.
          platforms='[
            {"runner":"macos-15","target":"aarch64-apple-darwin","bazel_arch":"arm64","bazel_sha256":"dd466352a3e4d3581b8898740ee1ff208866ccbe25f8d367c5dcb950219587e6","shard_count":2,"test_jobs":""},
            {"runner":"macos-15-intel","target":"x86_64-apple-darwin","bazel_arch":"x86_64","bazel_sha256":"14c9bcb01303b38192e0e2895051c1bcf19bf89d7e416f5aeeeb48b6b624cfbf","shard_count":4,"test_jobs":"4"}
          ]'
          case "$PLATFORMS" in
            both) ;;
            aarch64|x86_64) platforms=$(jq -c --arg arch "$PLATFORMS" '[.[] | select(.target | startswith($arch + "-"))]' <<< "$platforms") ;;
            *) printf 'Unknown platforms input: %s\n' "$PLATFORMS" >&2; exit 1 ;;
          esac
          if [[ "$SINGLE_SHARD" == true ]]; then
            # Named targets run on one runner per platform.
            platforms=$(jq -c '[.[] | .shard_count = 1]' <<< "$platforms")
          fi
          printf 'matrix=%s\n' "$(jq -c '{include: [.[] | . as $platform | range(1; $platform.shard_count + 1) | {shard: ., platform: $platform}]}' <<< "$platforms")" >> "$GITHUB_OUTPUT"
          printf 'expect=%s\n' "$(jq -r '[.[] | "--expect \(.target)=\(.shard_count)"] | join(" ")' <<< "$platforms")" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      # Reads and writes the compiled C++ action cache in GHCR.
      packages: write
    env:
      TARGET: ${{ matrix.platform.target }}
      BAZEL_ARCH: ${{ matrix.platform.bazel_arch }}
      BAZEL_SHA256: ${{ matrix.platform.bazel_sha256 }}
      BAZEL_TEST_SHARD: ${{ matrix.shard }}
      BAZEL_TEST_SHARD_COUNT: ${{ matrix.platform.shard_count }}
      BAZEL_LOCAL_TEST_JOBS: ${{ matrix.platform.test_jobs }}
      CC_CACHE_LANE: bazel-test-${{ matrix.platform.target }}-${{ matrix.shard }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Select the maintained tooling JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build the tooling runtime
        shell: bash
        env:
          TOOLING_ROOT: restart-metadata
        run: bash restart-metadata/.github/scripts/setup-tooling.sh

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        env:
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          if [[ -n "$UPSTREAM_COMMIT" ]]; then
            printf '%s\n' "$UPSTREAM_COMMIT" > "$evidence/upstream-commit"
          fi
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          cp restart-metadata/.github/scripts/buildbuddy-cache.sh "$RUNNER_TEMP/"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          mkdir -p "$RUNNER_TEMP/test-baselines"
          if [[ -d restart-metadata/docs/test-baselines ]]; then cp -R restart-metadata/docs/test-baselines/. "$RUNNER_TEMP/test-baselines/"; fi
          cp restart-metadata/.github/scripts/ghcr-cargo-target-cache.sh restart-metadata/.github/scripts/bazel-cc-disk-cache.sh "$RUNNER_TEMP/"
          cp restart-metadata/.github/cargo-cache-package "$evidence/cargo-cache-package"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          # Upstream's CI tests main, whose workspace version is 0.0.0; a stable tag's release commit changes only that
          # version. Test the same source, so version strings in snapshots and fixtures match what upstream tested.
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' codex-rs/Cargo.toml
          if ! git diff --quiet -- codex-rs/Cargo.toml; then
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          # macOS runs /bin/bash 3.2, where an empty array is unbound under set -u.
          for patch in ${patch_paths[@]+"${patch_paths[@]}"}; do
            printf '%s  %s\n' "$(shasum -a 256 < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare upstream's native test host
        uses: ./.github/actions/setup-ci

      - name: Reclaim inactive Xcode versions and verify selected native tools
        run: |
          bash "$CODEX_TOOLING" reclaim-baseline-macos-xcodes \
            --evidence-directory "$RUNNER_TEMP/baseline-macos-bazel-evidence"

      - name: Record the native host and capacity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = "$BAZEL_ARCH"
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          {
            uname -a
            sw_vers
            sysctl -n hw.memsize hw.logicalcpu
            df -k "$CI_BUILD_ROOT" "$RUNNER_TEMP"
          } | tee "$evidence/host.txt"

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up upstream's Rust toolchain for workspace metadata
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.platform.target }}

      - name: Synchronize release workspace versions without dependency upgrades
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          cargo metadata --format-version 1 --filter-platform "$TARGET" \
            --manifest-path codex-rs/Cargo.toml > "$RUNNER_TEMP/baseline-cargo-metadata.json"
          bash "$CODEX_TOOLING" verify-workspace-lock-versions "$GITHUB_WORKSPACE"
          git diff --check
          git diff -- codex-rs/Cargo.lock > "$evidence/workspace-version-lock.diff"
          git diff --binary > "$evidence/source-before.diff"

      - name: Install the pinned upstream Bazel version
        run: |
          set -euo pipefail
          test "$(cat .bazelversion)" = 9.2.0
          tools="$RUNNER_TEMP/baseline-bazel-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 --retry-all-errors --output "$tools/bazel" "https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-darwin-$BAZEL_ARCH"
          printf '%s  %s\n' "$BAZEL_SHA256" "$tools/bazel" | shasum -a 256 -c -
          chmod +x "$tools/bazel"
          "$tools/bazel" --version | tee "$RUNNER_TEMP/baseline-macos-bazel-evidence/bazel-version.txt"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Select the requested test targets
        if: ${{ inputs.targets != '' }}
        env:
          BASELINE_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          read -r -a requested <<< "$BASELINE_TARGETS"
          printf '%s\n' "${requested[@]}" > "$RUNNER_TEMP/baseline-macos-bazel-evidence/selected-targets.txt"

      - name: Partition the complete package selection across free runners
        if: ${{ inputs.targets == '' }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          .github/scripts/run-bazel-query-ci.sh --output=label -- '//...' > "$evidence/candidate-targets.txt"
          bash "$CODEX_TOOLING" select-bazel-packages \
            --candidates "$evidence/candidate-targets.txt" \
            --output-directory "$evidence" \
            --shard "$BAZEL_TEST_SHARD" --shard-count "$BAZEL_TEST_SHARD_COUNT"
          .github/scripts/run-bazel-query-ci.sh --output=label -- "$(cat "$evidence/all-package-patterns.query")" \
            | LC_ALL=C sort > "$evidence/expanded-package-targets.txt"
          LC_ALL=C sort "$evidence/candidate-targets.txt" > "$evidence/expected-targets.txt"
          cmp "$evidence/expected-targets.txt" "$evidence/expanded-package-targets.txt"


      - name: Record the shard's candidate and selected test targets
        if: ${{ inputs.targets == '' }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          out="$RUNNER_TEMP/shard-coverage-out"
          mkdir -p "$out"
          # The candidates are every test target of the workspace after the exclusions the shards apply; the selected
          # targets are the tests inside this shard's packages, under the same exclusions.
          exclusions='except tests(//third_party/v8:all) except attr(tags, "manual", tests(//...)) except //codex-rs/v8-poc:v8-poc-unit-tests'
          .github/scripts/run-bazel-query-ci.sh --output=label -- "tests(//...) $exclusions" \
            | LC_ALL=C sort > "$out/candidates.txt"
          .github/scripts/run-bazel-query-ci.sh --output=label -- "tests(set($(tr '\n' ' ' < "$evidence/selected-targets.txt"))) $exclusions" \
            | LC_ALL=C sort > "$out/selected.txt"
          printf '%s\n' "$TARGET" > "$out/group.txt"
          printf '%s\n' "$BAZEL_TEST_SHARD" > "$out/shard.txt"
          printf '%s\n' "$BAZEL_TEST_SHARD_COUNT" > "$out/shard-count.txt"

      - name: Retain prepared host evidence before compilation
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-macos-bazel-host-${{ matrix.platform.target }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/baseline-macos-bazel-evidence
          retention-days: 3
          if-no-files-found: error

      - name: Set up the GHCR cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      # Remote cache only, and only for a trusted run (see buildbuddy-cache.sh). The key reaches this step and the finish
      # step, never the Bazel wrapper; without it Bazel keeps using the GHCR disk caches.
      - name: Configure the BuildBuddy remote cache
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash "$RUNNER_TEMP/buildbuddy-cache.sh" configure "$GITHUB_WORKSPACE"

      # Upstream hides the cost of compiling V8 from source behind its BuildBuddy cache. This repository's own BuildBuddy
      # remote cache serves trusted runs that hold its key; without it, each shard spent about three of its six hours compiling V8, and an Intel shard reached the job limit. A cache fault never fails
      # the tests: the build then runs cold.
      - name: Restore the compiled C++ actions
        id: cc_cache
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          # macOS runs /bin/bash 3.2, which lacks the ${name,,} lowercase expansion.
          owner=$(printf '%s' "$GH_OWNER" | tr '[:upper:]' '[:lower:]')
          bash "$RUNNER_TEMP/bazel-cc-disk-cache.sh" restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bazel-cc-cache" \
            "ghcr.io/$owner/$(cat "$evidence/cargo-cache-package")" "$(cat "$evidence/upstream-ref")" "$CC_CACHE_LANE" \
            2>&1 | tee "$evidence/cc-cache-restore.log"

      - name: Run the maintained Bazel package shard
        id: bazel_tests
        # A cold build that would reach the job's six-hour limit stops here instead, so the steps below still save the
        # C++ actions it compiled and the next run starts warm.
        timeout-minutes: 290
        env:
          STRESS_COUNT: ${{ inputs.stress_count }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          export CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR="$evidence/execution-logs"
          mkdir -p "$CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR"
          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done < "$evidence/selected-targets.txt"
          execution_targets=("${targets[@]}" -//third_party/v8:all -//codex-rs/v8-poc:v8-poc-unit-tests)
          printf '%s\n' "${execution_targets[@]}" > "$evidence/execution-targets.txt"
          bep="$evidence/bazel-tests.bep.json"
          rm -f -- "$bep"
          (
            while true; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              df -k "$CI_BUILD_ROOT" "$RUNNER_TEMP"
              vm_stat
              if du -k -d 3 "$CI_BUILD_ROOT" | sort -nr | sed -n '1,30p'; then
                :
              else
                printf 'directory_sample_exit=%s\n' "$?"
              fi
              sleep 60
            done
          ) >> "$evidence/disk-usage.log" 2>&1 &
          disk_monitor=$!
          trap 'kill "$disk_monitor" 2>/dev/null || true; wait "$disk_monitor" || true' EXIT
          cache_args=(--disk_cache=)
          if [[ -f "$RUNNER_TEMP/bazel-cc-cache.restored" ]]; then
            # Only C++ compiles, archives and links (chiefly V8, built for both the target and the exec configuration)
            # reach the disk cache; every other action is marked no-cache, which keeps it out of the disk cache only.
            cache_args=(
              "--disk_cache=$RUNNER_TEMP/bazel-cc-cache"
              '--modify_execution_info=^(?!(CppCompile|CppArchive|CppLink|ObjcCompile)$).*$=+no-cache'
            )
          fi
          if [[ -n "$BAZEL_LOCAL_TEST_JOBS" ]]; then
            # Native Intel only. Its contention failures differ every run (runs 45729006472 and 45788476235), so retry a
            # failed test once, as upstream's nextest profile does with retries = 1.
            cache_args+=("--local_test_jobs=$BAZEL_LOCAL_TEST_JOBS" --flaky_test_attempts=2)
          fi
          if [[ -n "$STRESS_COUNT" ]]; then
            # Repeat each test without retries while every core is busy, to measure flakiness. Bazel keeps the last
            # --flaky_test_attempts. The load runs at the lowest priority so it cannot starve the runner agent.
            cache_args+=(--runs_per_test="$STRESS_COUNT" --flaky_test_attempts=1)
            for _ in $(seq "$(sysctl -n hw.ncpu)"); do nice -n 19 yes > /dev/null & done
          fi
          set +e
          .github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs -- \
            test "${cache_args[@]}" --test_tag_filters=-argument-comment-lint \
            --build_event_json_file="$bep" --test_verbose_timeout_warnings --build_metadata="COMMIT_SHA=$(cat "$evidence/upstream-commit")" -- \
            "${targets[@]}" -//third_party/v8:all -//codex-rs/v8-poc:v8-poc-unit-tests \
            2>&1 | tee "$evidence/bazel-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" > "$evidence/bazel-tests.receipt"
          bash "$CODEX_TOOLING" validate-bazel-test-evidence \
            --bep "$bep" --expected-patterns "$evidence/execution-targets.txt" --bazel-exit-code "$result" \
            > "$evidence/bazel-test-evidence.json"
          git diff --binary > "$evidence/source-after.diff"
          cmp "$evidence/source-before.diff" "$evidence/source-after.diff"
          printf 'bep-complete=true\n' >> "$GITHUB_OUTPUT"
          # Bazel exits 3 when tests failed and everything else built. The comparison with the unpatched baseline below
          # judges those failures (an unpatched run records that baseline), so they alone do not fail this step.
          # Any other failure, such as a build error, does.
          if [[ "$result" == 3 ]]; then
            printf 'Bazel reported failing tests; the baseline comparison decides the outcome.\n'
            exit 0
          fi
          exit "$result"

      - name: Save the compiled C++ actions
        if: ${{ !cancelled() && steps.cc_cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          owner=$(printf '%s' "$GH_OWNER" | tr '[:upper:]' '[:lower:]')
          bash "$RUNNER_TEMP/bazel-cc-disk-cache.sh" save "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bazel-cc-cache" \
            "ghcr.io/$owner/$(cat "$evidence/cargo-cache-package")" "$(cat "$evidence/upstream-ref")" "$CC_CACHE_LANE" \
            2>&1 | tee "$evidence/cc-cache-save.log"

      - name: Record this shard's results
        # An unpatched run is pristine upstream, so its failures are the baseline that patched runs are compared with;
        # the evidence artifact carries the file for committing under docs/test-baselines.
        if: ${{ !cancelled() && steps.bazel_tests.outcome == 'success' && steps.bazel_tests.outputs['bep-complete'] == 'true' }}
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          platform="macos-bazel-${BAZEL_ARCH}-shard-${BAZEL_TEST_SHARD}"
          common=(--runner bazel --platform "$platform" --upstream-commit "$(cat "$evidence/upstream-commit")")
          if [[ -z "${PATCHES// /}" ]]; then
            bash "$CODEX_TOOLING" compare-test-baseline "${common[@]}" --write-baseline \
              --bep "$evidence/bazel-tests.bep.json" --output "$evidence/$platform.json" "$(realpath bazel-testlogs)"
          else
            # The merged comparison runs once per platform group in the coverage job.
            mkdir -p "$RUNNER_TEMP/shard-coverage-out"
            bash "$CODEX_TOOLING" compare-test-baseline --runner bazel \
              --bep "$evidence/bazel-tests.bep.json" --write-results "$RUNNER_TEMP/shard-coverage-out/results.json" "$(realpath bazel-testlogs)"
          fi

      - name: Verify the tested source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Keep the BuildBuddy key out of the retained evidence
        id: scrub-evidence
        if: always()
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash "$RUNNER_TEMP/buildbuddy-cache.sh" finish "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-macos-bazel-evidence"

      - name: Record the executed and skipped test targets and upload the shard's coverage lists
        if: always() && steps.bazel_tests.outcome != 'skipped' && inputs.targets == ''
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-bazel-evidence"
          out="$RUNNER_TEMP/shard-coverage-out"
          mkdir -p "$out"
          cp "$evidence/upstream-commit" "$out/upstream-commit"
          if [[ -s "$evidence/bazel-tests.bep.json" ]]; then
            bash "$CODEX_TOOLING" bazel-shard-coverage record --bep "$evidence/bazel-tests.bep.json" \
              --executed "$out/executed.txt" --skipped "$out/skipped.txt"
          fi

      - name: Upload this shard's coverage lists
        if: always() && steps.bazel_tests.outcome != 'skipped' && inputs.targets == ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bazel-shard-coverage-macos-${{ matrix.platform.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-coverage-out
          retention-days: 3
          if-no-files-found: error

      - name: Retain test evidence for one day
        if: always() && steps.scrub-evidence.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-macos-bazel-tests-${{ matrix.platform.target }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/baseline-macos-bazel-evidence
          retention-days: 3
          if-no-files-found: warn

      - name: Remove the job-owned tooling runtime
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/codex-tooling"

  coverage:
    # Fails unless every shard uploaded, all saw the same candidate list, the selections partition it exactly, and every
    # incompatible skip is allowlisted.
    needs: [plan, test]
    if: ${{ always() && inputs.targets == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve the tooling source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Select the maintained tooling JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build the tooling runtime
        shell: bash
        env:
          TOOLING_ROOT: .
        run: bash .github/scripts/setup-tooling.sh

      - name: Download every shard's coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bazel-shard-coverage-macos-*
          path: ${{ runner.temp }}/shard-coverage

      - name: Check shard coverage
        env:
          EXPECT: ${{ needs.plan.outputs.expect }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shard-coverage"
          read -r -a expect <<< "$EXPECT"
          bash "$CODEX_TOOLING" bazel-shard-coverage check --directory "$RUNNER_TEMP/shard-coverage" \
            "${expect[@]}" \
            --allowlist .github/bazel-skipped-targets-allowlist.txt

      - name: Compare the merged results with the unpatched baseline
        # Shard assignment can change between runs, so no shard is compared on its own: this job merges every shard's
        # results per group and compares each group once with the union of that group's shard baselines.
        if: ${{ !cancelled() }}
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          if [[ -z "${PATCHES// /}" ]]; then
            printf 'An unpatched run records baselines instead of comparing.\n'
            exit 0
          fi
          cov="$RUNNER_TEMP/shard-coverage"
          merged="$RUNNER_TEMP/merged-results"
          rm -rf "$merged"
          mkdir -p "$merged"
          for dir in "$cov"/*/; do
            [[ -f "${dir}results.json" ]] || continue
            group="$(cat "${dir}group.txt")"
            mkdir -p "$merged/$group"
            cp -R "${dir%/}" "$merged/$group/"
          done
          commit="$(cat "$cov"/*/upstream-commit | sort -u)"
          if [[ -z "$commit" || "$commit" == *$'\n'* ]]; then
            printf 'The shards did not report exactly one upstream commit.\n' >&2
            exit 1
          fi
          found=0
          status=0
          for group_dir in "$merged"/*/; do
            found=1
            group="$(basename "$group_dir")"
            case "$group" in
              aarch64-apple-darwin) prefix=macos-bazel-arm64-shard- ;;
              *) prefix=macos-bazel-x86_64-shard- ;;
            esac
            if ! bash "$CODEX_TOOLING" compare-test-baseline --runner bazel --upstream-commit "$commit" \
              --baseline-dir docs/test-baselines --baseline-prefix "$prefix" --merge-results "$group_dir" 2>&1 \
              | tee -a "$RUNNER_TEMP/baseline-comparison.log"; then
              status=1
            fi
          done
          if ((found == 0)); then
            printf 'No shard results were uploaded to compare.\n' >&2
            exit 1
          fi
          exit "$status"
