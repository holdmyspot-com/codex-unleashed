name: Diagnose native Windows CMake paths

on:
  workflow_dispatch:

concurrency:
  group: diagnose-windows-cmake-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: "1"

jobs:
  windows-cmake:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare pinned native CMake regression tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'windows-cmake-probe-tools'
          python -m venv $tools
          if ($LASTEXITCODE -ne 0) { throw 'Creating the diagnostic tool environment failed.' }
          & "$tools/Scripts/python.exe" -m pip install --disable-pip-version-check cmake==4.4.4 ninja==1.13.2
          if ($LASTEXITCODE -ne 0) { throw 'Installing the pinned diagnostic tools failed.' }
          "$tools/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          "TMPDIR=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append
          Copy-Item .github/diagnostics/windows-cmake/test_build_native.py upstream/third_party/voice/test_build_native.py

      - name: Reproduce native Windows install path failure
        shell: pwsh
        working-directory: upstream/third_party/voice
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Get-Command cmake,ninja -ErrorAction Stop
          cmake --version
          ninja --version
          $log = Join-Path $env:RUNNER_TEMP 'windows-cmake-red.log'
          python -m unittest test_build_native.NativeBuildTests.test_cmake_windows_install_preserves_prefix_path *> $log
          $status = $LASTEXITCODE
          Get-Content $log
          if ($status -eq 0) { throw 'The baseline must reproduce the native installation failure.' }
          if (-not (Select-String -Path $log -SimpleMatch 'Invalid character escape')) {
            throw 'An unrelated failure does not establish the CMake path regression.'
          }

      - name: Verify normalized installation prefix
        shell: pwsh
        working-directory: upstream/third_party/voice
        run: |
          $ErrorActionPreference = 'Stop'
          python -c 'from pathlib import Path; p=Path("build_native.py"); s=p.read_text(); old="\"CMAKE_INSTALL_PREFIX\": str(prefix),"; new="\"CMAKE_INSTALL_PREFIX\": prefix.as_posix(),"; assert s.count(old)==1; p.write_text(s.replace(old,new))'
          if ($LASTEXITCODE -ne 0) { throw 'Applying the diagnostic path correction failed.' }
          $log = Join-Path $env:RUNNER_TEMP 'windows-cmake-green.log'
          python -m unittest test_build_native.NativeBuildTests.test_cmake_windows_install_preserves_prefix_path *> $log
          $status = $LASTEXITCODE
          Get-Content $log
          if ($status -ne 0) { throw 'The corrected native installation regression failed.' }

      - name: Preserve native path diagnostic evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: windows-cmake-path-diagnostic
          path: ${{ runner.temp }}/windows-cmake-*.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
