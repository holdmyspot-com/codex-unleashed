name: rust-ci-full nextest platform

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Native GitHub runner matching the target architecture.
        required: true
        type: string
        default: ubuntu-latest
      target:
        description: Native Rust target triple.
        required: true
        type: string
        default: x86_64-unknown-linux-gnu
      profile:
        description: Cargo profile used to build the test archive.
        required: true
        type: string
        default: ci-test
      artifact_id:
        description: Platform identifier for this run's test artifacts.
        required: true
        type: string
        default: linux-x64
      upstream_ref:
        description: Optional upstream ref; defaults to the repository release pin.
        required: false
        type: string
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      profile:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      upstream_ref:
        required: false
        type: string

env:
  CARGO_NEXTEST_VERSION: "0.9.149"

jobs:
  archive:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_CI_TEST_DEBUG: "0"
      NEXTEST_ARCHIVE_FILE: nextest-${{ inputs.artifact_id }}.tar.zst
      TEST_HELPERS_ARTIFACT: nextest-test-helpers-${{ inputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcap-dev libasound2-dev libclang-dev bubblewrap

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Install target for the workspace Rust toolchain
        working-directory: upstream/codex-rs
        shell: bash
        run: rustup target add "${{ inputs.target }}"

      - name: Configure MSVC linker environment
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ inputs.target }}

      - name: Configure rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ inputs.target }}

      - name: Cache Cargo dependency downloads
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            upstream/codex-rs -> target
          shared-key: nextest-downloads-${{ runner.os }}-${{ runner.arch }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: true
          cache-on-failure: true

      - name: Build native test dependencies
        uses: ./.github/actions/build-nextest-native-sdk
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        with:
          target: ${{ inputs.target }}

      - uses: ./.github/actions/configure-nextest-native-sdk

      - name: Check native SDK version probes
        shell: bash
        run: |
          set -euo pipefail
          pkg_config="${PKG_CONFIG:-pkg-config}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            pkg_config="$(cygpath -u "$pkg_config")"
          fi
          for module in glib-2.0 gobject-2.0 gio-2.0 gmodule-no-export-2.0 \
            gstreamer-1.0 gstreamer-base-1.0 gstreamer-app-1.0 gstreamer-audio-1.0 \
            gstreamer-tag-1.0 libffi libpcre2-8 zlib; do
            test -f "$PKG_CONFIG_PATH/$module.pc"
          done
          "$pkg_config" --atleast-version=2.56 glib-2.0
          "$pkg_config" --atleast-version=1.28 gstreamer-1.0
          "$pkg_config" --modversion glib-2.0 gstreamer-1.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Build nextest archive
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="${RUNNER_TEMP}/nextest-archive"
          mkdir -p "${archive_dir}"
          bash "${GITHUB_WORKSPACE}/.github/scripts/run-memory-scheduled-build.sh" cargo nextest archive \
            --target "${{ inputs.target }}" \
            --cargo-profile "${{ inputs.profile }}" \
            --features codex-v8-poc/sandbox \
            --timings \
            --archive-file "${archive_dir}/${NEXTEST_ARCHIVE_FILE}"

      - name: Build runtime test helpers
        if: ${{ runner.os == 'Linux' || runner.os == 'Windows' }}
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          helper_dir="${RUNNER_TEMP}/${TEST_HELPERS_ARTIFACT}"
          mkdir -p "${helper_dir}"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            bash "${GITHUB_WORKSPACE}/.github/scripts/run-memory-scheduled-build.sh" cargo build \
              --target "${{ inputs.target }}" \
              --profile "${{ inputs.profile }}" \
              -p codex-linux-sandbox \
              --bin codex-linux-sandbox
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex-linux-sandbox" "${helper_dir}/"
          else
            bash "${GITHUB_WORKSPACE}/.github/scripts/run-memory-scheduled-build.sh" cargo build \
              --target "${{ inputs.target }}" \
              --profile "${{ inputs.profile }}" \
              -p codex-windows-sandbox \
              --bin codex-windows-sandbox-setup \
              --bin codex-command-runner
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex-windows-sandbox-setup.exe" "${helper_dir}/"
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex-command-runner.exe" "${helper_dir}/"
          fi

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cargo-timings-rust-ci-nextest-${{ inputs.artifact_id }}
          path: ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          retention-days: 1
          if-no-files-found: warn

      - name: Upload nextest archive
        uses: actions/upload-artifact@v6
        with:
          name: nextest-archive-${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/nextest-archive/${{ env.NEXTEST_ARCHIVE_FILE }}
          if-no-files-found: error
          retention-days: 1

      - name: Package native test dependencies
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          tar -C nextest-native -czf nextest-native.tar.gz sdk runtime

      - name: Upload native test dependencies
        uses: actions/upload-artifact@v6
        with:
          name: nextest-native-${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/nextest-native.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload runtime test helpers
        if: ${{ runner.os == 'Linux' || runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TEST_HELPERS_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove staged native test dependencies
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/nextest-native" "$RUNNER_TEMP/nextest-native.tar.gz" \
            "$RUNNER_TEMP/nextest-voice-cygwin" "$RUNNER_TEMP/voice-windows-build-tools"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  shard:
    name: Tests shard ${{ matrix.shard }}/4
    needs: archive
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      NEXTEST_ARCHIVE_FILE: nextest-${{ inputs.artifact_id }}.tar.zst
      TEST_HELPERS_ARTIFACT: nextest-test-helpers-${{ inputs.artifact_id }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref }}

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcap-dev libasound2-dev libclang-dev bubblewrap

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Install target for the workspace Rust toolchain
        working-directory: upstream/codex-rs
        shell: bash
        run: rustup target add "${{ inputs.target }}"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Download nextest archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: nextest-archive-${{ inputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          "$CODEX_UNLEASHED_TOOLING" download-workflow-artifact \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$ARTIFACT_NAME" "$RUNNER_TEMP/nextest-archive"

      - name: Download runtime test helpers
        if: ${{ runner.os == 'Linux' || runner.os == 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$CODEX_UNLEASHED_TOOLING" download-workflow-artifact \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TEST_HELPERS_ARTIFACT" \
            "$RUNNER_TEMP/$TEST_HELPERS_ARTIFACT"

      - name: Download native test dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: nextest-native-${{ inputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          "$CODEX_UNLEASHED_TOOLING" download-workflow-artifact \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$ARTIFACT_NAME" "$RUNNER_TEMP/nextest-native-download"
          mkdir "$RUNNER_TEMP/nextest-native"
          tar -C "$RUNNER_TEMP/nextest-native" -xzf "$RUNNER_TEMP/nextest-native-download/nextest-native.tar.gz"

      - uses: ./.github/actions/configure-nextest-native-sdk

      - name: Run nextest shard
        id: test
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          archive_file="${RUNNER_TEMP}/nextest-archive/${NEXTEST_ARCHIVE_FILE}"
          workspace_root="$(pwd)"
          helper_target_dir="${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}"

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            archive_file="$(cygpath -w "${archive_file}")"
            workspace_root="$(cygpath -w "${workspace_root}")"
          fi

          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            helper_dir="${RUNNER_TEMP}/${TEST_HELPERS_ARTIFACT}"
            mkdir -p "${helper_target_dir}"
            cp "${helper_dir}/codex-linux-sandbox" "${helper_target_dir}/"
            chmod +x "${helper_target_dir}/codex-linux-sandbox"
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            helper_dir="${RUNNER_TEMP}/${TEST_HELPERS_ARTIFACT}"
            mkdir -p "${helper_target_dir}"
            cp "${helper_dir}/codex-windows-sandbox-setup.exe" "${helper_target_dir}/"
            cp "${helper_dir}/codex-command-runner.exe" "${helper_target_dir}/"
          fi

          nextest_args=(
            run
            --no-fail-fast
            --archive-file "${archive_file}"
            --workspace-remap "${workspace_root}"
            --partition "hash:${{ matrix.shard }}/4"
          )

          test_command=(cargo nextest "${nextest_args[@]}")
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sandbox_helper="${helper_target_dir}/codex-linux-sandbox"
            test_command=(
              env
              "CARGO_BIN_EXE_codex-linux-sandbox=${sandbox_helper}"
              "CARGO_BIN_EXE_codex_linux_sandbox=${sandbox_helper}"
              cargo nextest "${nextest_args[@]}"
            )
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            setup_helper="$(cygpath -w "${helper_target_dir}/codex-windows-sandbox-setup.exe")"
            command_runner="$(cygpath -w "${helper_target_dir}/codex-command-runner.exe")"
            test_command=(
              env
              "CARGO_BIN_EXE_codex_windows_sandbox_setup=${setup_helper}"
              "CARGO_BIN_EXE_codex_command_runner=${command_runner}"
              cargo nextest "${nextest_args[@]}"
            )
          fi

          "${test_command[@]}"
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 0
          RUST_MIN_STACK: "8388608"
          NEXTEST_STATUS_LEVEL: leak

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nextest-junit-rust-ci-${{ inputs.artifact_id }}-shard-${{ matrix.shard }}
          path: ${{ env.CARGO_TARGET_DIR }}/nextest/default/junit.xml
          retention-days: 1
          if-no-files-found: warn

      - name: Remove staged native test dependencies
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/nextest-native" "$RUNNER_TEMP/nextest-native-download"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  result:
    name: Platform result
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm test shards passed
        shell: bash
        run: |
          if [[ "${{ needs.shard.result }}" != "success" ]]; then
            echo "Nextest shards finished with result: ${{ needs.shard.result }}" >&2
            exit 1
          fi
