name: Inventory private cache retention inputs

on:
  workflow_dispatch:
  push:
    branches: [main.new]
    paths: [.github/workflows/cache-retention-inventory.yml]

permissions:
  contents: read
  packages: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Collect release and private package metadata without deleting versions
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/cache-retention-inventory"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/restart-commit"
          cp .github/upstream-ref "$evidence/protected-upstream-ref"
          gh api --paginate 'repos/openai/codex/releases?per_page=20' \
            --jq '.[] | {tag_name, draft, prerelease}' > "$evidence/upstream-releases.jsonl"
          gh api --paginate "orgs/$PACKAGE_OWNER/packages/container/cargo-cache/versions?per_page=100" \
            --jq '.[] | {id, name, created_at, updated_at, metadata}' > "$evidence/package-versions.jsonl"
          jq -s '{release_records: length}' "$evidence/upstream-releases.jsonl"
          jq -s '{package_versions: length, untagged_versions: ([.[] | select(.metadata.container.tags == [])] | length)}' \
            "$evidence/package-versions.jsonl"

      - name: Set up the helper's native JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Set up the helper regression fixture's Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: 1.99.1

      - name: Build and verify the read-only preview helper
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retention-helper-temp"
          mvn -B -ntp -f tooling/cli/pom.xml -Pruntime \
            "-Dtooling.build.directory=$RUNNER_TEMP/retention-helper" \
            "-Dmaven.repo.local=$RUNNER_TEMP/retention-helper-maven" \
            "-Djava.io.tmpdir=$RUNNER_TEMP/retention-helper-temp" verify \
            2>&1 | tee "$RUNNER_TEMP/cache-retention-inventory/helper-verify.log"

      - name: Preview retention of the captured private inventory
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/cache-retention-inventory"
          jq -n \
            --slurpfile releases "$evidence/upstream-releases.jsonl" \
            --slurpfile versions "$evidence/package-versions.jsonl" \
            --rawfile pinned "$evidence/protected-upstream-ref" \
            '{releases: $releases, package_versions: $versions,
              protected_upstream_refs: [$pinned | rtrimstr("\n")]}' \
            | TMPDIR="$RUNNER_TEMP/retention-helper-temp" \
              "$RUNNER_TEMP/retention-helper/runtime/bin/codex-tooling" preview-ghcr-retention \
              > "$evidence/retention-preview.json"
          jq '{retained_releases, dry_run,
            retained_versions: (.retained_version_ids | length),
            obsolete_candidates: (.obsolete_version_ids | length),
            unmanaged_versions: (.unmanaged_version_ids | length)}' "$evidence/retention-preview.json"

      - name: Retain read-only inventory for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: cache-retention-inventory
          path: ${{ runner.temp }}/cache-retention-inventory
          retention-days: 1
          if-no-files-found: warn
