name: Compare selected Windows Bazel cases

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order; empty tests pristine upstream
        type: string
        default: ""
      public_key:
        description: SSH public key for the client that connects before Bazel starts
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnullvm
            shard: 3
            shard_count: 4
          - target: x86_64-pc-windows-gnullvm
            shard: 4
            shard_count: 4
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      TARGET: ${{ matrix.target }}
      BAZEL_TEST_SHARD: ${{ matrix.shard }}
      BAZEL_TEST_SHARD_COUNT: ${{ matrix.shard_count }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Select the maintained tooling JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build the tooling runtime
        shell: bash
        env:
          TOOLING_ROOT: restart-metadata
        run: bash restart-metadata/.github/scripts/setup-tooling.sh

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/scripts/setup-baseline-windows-voice.ps1 "$RUNNER_TEMP/setup-baseline-windows-voice.ps1"
          cp restart-metadata/.github/scripts/add-windows-page-file.ps1 "$RUNNER_TEMP/add-windows-page-file.ps1"
          mkdir -p "$RUNNER_TEMP/test-baselines"
          if [[ -d restart-metadata/docs/test-baselines ]]; then cp -R restart-metadata/docs/test-baselines/. "$RUNNER_TEMP/test-baselines/"; fi
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Stage the retained runner helper
        if: inputs.public_key != ''
        run: |
          set -euo pipefail
          cp restart-metadata/.github/scripts/release-debug-session.sh "$RUNNER_TEMP/"
          cp -R restart-metadata/.github/actions/debug-failed-runner "$RUNNER_TEMP/windows-bazel-debug-action"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          # Upstream's CI tests main, whose workspace version is 0.0.0; a stable tag's release commit changes only that
          # version. Test the same source, so version strings in snapshots and fixtures match what upstream tested.
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' codex-rs/Cargo.toml
          if ! git diff --quiet -- codex-rs/Cargo.toml; then
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          for patch in "${patch_paths[@]}"; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare retained Windows Bazel worker
        if: inputs.public_key != ''
        run: |
          bash "$RUNNER_TEMP/release-debug-session.sh" prepare \
            "$RUNNER_TEMP/windows-bazel-debug-action" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-windows-bazel-evidence"

      - name: Open authenticated Windows Bazel worker
        id: bazel-debug
        if: inputs.public_key != ''
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.public_key }}
          idle-timeout-minutes: '10'
          artifact-suffix: -${{ matrix.target }}-${{ matrix.shard }}

      - name: Wait for connected Windows Bazel client
        if: steps.bazel-debug.outcome == 'success'
        run: bash "$RUNNER_TEMP/release-debug-session.sh" wait-for-client "$RUNNER_TEMP/baseline-windows-bazel-evidence"

      - name: Set up Python for the maintained Windows checks and metadata
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Check upstream's Windows wrapper
        if: matrix.target == 'x86_64-pc-windows-gnullvm' && matrix.shard == 1
        shell: pwsh
        run: |
          python .github/scripts/test_run_bazel_with_buildbuddy.py
          exit $LASTEXITCODE

      - name: Add a page file
        id: bazel-page-file
        # Four native MSVC test targets failed with "The paging file is too small" (os error 1455): rustc commits several
        # times the memory it touches, and the runner's commit limit is its 16 GB of memory plus a 3 GB page file.
        # bazel-clippy-job.yml adds the same page file for the same failure. On D: the page file took the space the Dev
        # Drive needed (a 94 GB Dev Drive filled with os error 112), so it goes on C: when C: has room for it. The page
        # file step runs before the Dev Drive is sized. The sizing also reserves space for page file growth.
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $systemDrive = Get-PSDrive -Name C
          $secondaryDrive = Get-PSDrive -Name D -ErrorAction SilentlyContinue
          $freeC = [math]::Floor($systemDrive.Free / 1GB)
          $minimumMiB = 32768
          $maximumMiB = 49152
          $drive = if ($freeC -ge 64 -or $null -eq $secondaryDrive) { $systemDrive } else { $secondaryDrive }
          $freeGb = [math]::Floor($drive.Free / 1GB)
          $driveName = $drive.Name
          Write-Output "The page file goes on ${driveName}: with $freeGb GB free."
          & "$env:RUNNER_TEMP/add-windows-page-file.ps1" `
            -Path "${driveName}:\pagefile-bazel.sys" -MinimumMiB $minimumMiB -MaximumMiB $maximumMiB
          "drive=$driveName" >> $env:GITHUB_OUTPUT
          "growth-gib=$(($maximumMiB - $minimumMiB) / 1024)" >> $env:GITHUB_OUTPUT

      - name: Size the Dev Drive for the Bazel output
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BAZEL_PAGE_FILE_DRIVE: ${{ steps.bazel-page-file.outputs.drive }}
          BAZEL_PAGE_FILE_GROWTH_GIB: ${{ steps.bazel-page-file.outputs.growth-gib }}
        run: |
          # Upstream's setup-dev-drive.ps1 provisions a fixed 64 GB Dev Drive when D: is not one. The native MSVC job's
          # 523 targets filled it ("LLVM ERROR: no space on device"), and gnullvm shard 3 did too. Upstream runs this
          # job on a larger runner whose D: is already a Dev Drive. The VHD is dynamic and lives on the runner-temp
          # drive (D:, about 150 GB free on windows-2025), so size it from that drive's free space instead.
          $tempDrive = (Get-Item -LiteralPath $env:RUNNER_TEMP).PSDrive
          $freeGb = [math]::Floor($tempDrive.Free / 1GB)
          $pageFileGrowthGb = if ($tempDrive.Name -eq $env:BAZEL_PAGE_FILE_DRIVE) {
            [int]$env:BAZEL_PAGE_FILE_GROWTH_GIB
          } else { 0 }
          $availableGb = $freeGb - 20 - $pageFileGrowthGb
          $sizeGb = [math]::Min($availableGb, 240)
          Write-Output "The runner-temp drive has $freeGb GB free with $pageFileGrowthGb GB reserved for page file growth."
          if ($sizeGb -lt 1) { throw 'Insufficient runner-temp space to provision a Dev Drive.' }
          Write-Output "A provisioned Dev Drive will be $sizeGb GB."
          $script = Join-Path $PWD '.github/scripts/setup-dev-drive.ps1'
          $text = [System.IO.File]::ReadAllText($script)
          if ($text -notmatch '\$SizeBytes = 64GB') { throw 'upstream setup-dev-drive.ps1 no longer sets a 64GB size' }
          # On this Windows runner fsutil returns zero even for a regular volume.
          $oldProbe = '(?m)^    & fsutil devdrv query \$Drive \*> \$null\r?\n    return \$LASTEXITCODE -eq 0\r?$'
          $oldProbeCount = [regex]::Matches($text, $oldProbe).Count
          if ($oldProbeCount -eq 1) {
              $newProbe = @'
          $state = & fsutil devdrv query $Drive 2>$null
          return ($LASTEXITCODE -eq 0) -and [bool]($state -match '^(?:This is a trusted developer volume|The volume is formatted as a developer volume but is not trusted on this machine)\.$')
          '@
              $text = [regex]::Replace($text, $oldProbe, [System.Text.RegularExpressions.MatchEvaluator]{
                param($match)
                ($newProbe -split '\r?\n' | ForEach-Object { '    ' + $_ }) -join "`n"
              })
          } elseif ($oldProbeCount -ne 0 -or
              !$text.Contains('$volumeFlags = $script:DevDriveVolumeStateType::QueryVolumeFlags($Drive)') -or
              !$text.Contains('$isDevVolume = ($volumeFlags -band $devVolumeMask) -gt 0')) {
              throw 'setup-dev-drive.ps1 has neither the pinned upstream probe nor the downstream volume-state probe'
          }
          [System.IO.File]::WriteAllText($script, ($text -replace '\$SizeBytes = 64GB', "`$SizeBytes = ${sizeGb}GB"))

      - name: Prepare upstream's Bazel host and toolchain
        uses: ./.github/actions/prepare-bazel-ci
        with:
          cache-scope: baseline-windows-tests-${{ matrix.shard }}
          target: ${{ matrix.target }}

      - name: Prepare upstream's native Windows voice tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/setup-baseline-windows-voice.ps1" -EvidenceDirectory "$env:RUNNER_TEMP/baseline-windows-bazel-evidence/voice-tools"

      - name: Record the native host and capacity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          {
            uname -a
            printf 'runner_os=%s\ntarget=%s\n' "$RUNNER_OS" "$TARGET"
            df -k "$CI_BUILD_ROOT/" "$RUNNER_TEMP"
            bazel --version
          } | tee "$evidence/host.txt"
          test "$(cat .bazelversion)" = 9.2.0

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up upstream's Rust toolchain for workspace metadata
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Synchronize release workspace versions without dependency upgrades
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          cargo metadata --format-version 1 --filter-platform "$TARGET" \
            --manifest-path codex-rs/Cargo.toml > "$RUNNER_TEMP/baseline-cargo-metadata.json"
          bash "$CODEX_TOOLING" verify-workspace-lock-versions "$GITHUB_WORKSPACE"
          git diff --check
          git diff -- codex-rs/Cargo.lock > "$evidence/workspace-version-lock.diff"
          git diff --binary > "$evidence/source-before.diff"

      - name: Run the selected ordinary Rust cases
        id: bazel_tests
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          export CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR="$evidence/execution-logs"
          mkdir -p "$CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR"
          test_args=(test --config=ci-windows --workspace_status_command=./scripts/workspace-status.cmd --disk_cache= --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 --test_tag_filters=-argument-comment-lint --test_verbose_timeout_warnings "--test_timeout=-1,900,-1,-1")
          wrapper_args+=(--windows-cross-compile --remote-download-toplevel)
          test_args+=(--skip_incompatible_explicit_targets --build_metadata="TAG_windows_test_shard=$BAZEL_TEST_SHARD")
          # Without a BuildBuddy key the wrapper cannot apply upstream's --config=ci-windows-cross,
          # which needs remote execution, and falls back to --config=ci-windows with an MSVC host
          # platform. These shards then build and test MSVC-target binaries on this runner's 4 vCPUs,
          # compiling locally while tests run (--keep_going). Upstream's ci-windows-cross also sets
          # --local_test_jobs=8 and --test_env=RUST_TEST_THREADS=1, but it sets them for gnullvm
          # binaries built remotely, where the runner carries only the tests. Upstream's own ci-windows
          # jobs, the config this fallback uses, set neither, so Bazel sizes local test concurrency from
          # the detected cores and libtest from available_parallelism. Copying the two cross-only limits
          # here ran 8 test jobs on 4 cores and serialised each test binary, the probable cause of the
          # thread-store, daemon_startup and worktree timeouts that upstream's runners do not show (not
          # yet measured). Pass only the skip list that replaces the Windows one: it adds the PowerShell
          # parser tests, which hang in cross-built gnullvm binaries and are covered by the native MSVC
          # job.
          test_args+=(
            "--test_env=CODEX_BAZEL_TEST_SKIP_FILTERS=command_safety::powershell_parser::tests::,suite::code_mode::code_mode_can_call_hidden_dynamic_tools,tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child"
          )
          {
            printf 'image_os=%s\nimage_version=%s\ntarget=%s\nshard=%s\n' "${ImageOS:-}" "${ImageVersion:-}" "$TARGET" "$BAZEL_TEST_SHARD"
            git --version
            rustc --version --verbose
            sha256sum .bazelversion .bazelrc .github/scripts/run-bazel-ci.sh
          } > "$evidence/focused-environment.txt"

          case "$BAZEL_TEST_SHARD" in
            3)
              labels=(//codex-rs/core:core-unit-tests)
              cases=(tools::parallel::tests::cancellation_before_dispatch_admission_logs_dispatch_only_timing::test_case_3_dynamic_capture_disabled)
              ;;
            4)
              labels=(//codex-rs/app-server:app-server-prompt_prefix-test //codex-rs/core:core-all-test)
              cases=(prompt_prefix_matches_release suite::mcp_tool_cache::cached_mcp_startup_is_eager_for_root_and_lazy_for_subagents)
              ;;
          esac
          upstream_commit=$(cat "$evidence/upstream-commit")
          failed=0
          for index in "${!labels[@]}"; do
            label=${labels[index]}
            test_case=${cases[index]}
            report="$evidence/case-$((index + 1))"
            mkdir "$report"
            printf '%s\n' "$label" > "$report/target.txt"
            printf '%s\n' "$test_case" > "$report/case.txt"

            set +e
            .github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs "${wrapper_args[@]}" -- \
              "${test_args[@]}" --build_metadata="COMMIT_SHA=$upstream_commit" \
              --test_arg=--exact --test_arg="$test_case" --test_output=all \
              --nocache_test_results --build_event_json_file="$report/events.json" -- "$label" \
              2>&1 | tee "$report/bazel.log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            result=${pipeline_status[0]}
            printf '%s\n' "$result" > "$report/exit-code.txt"

            if [[ "${pipeline_status[1]}" != 0 ]]; then
              echo "Could not preserve the Bazel log for $label."
              failed=1
              continue
            fi
            if [[ "$result" != 0 && "$result" != 3 ]]; then
              echo "Bazel stopped before producing an ordinary test result for $label."
              failed=1
              continue
            fi
            if bash "$CODEX_TOOLING" validate-bazel-test-evidence \
              --bep "$report/events.json" --expected-patterns "$report/target.txt" --bazel-exit-code "$result" \
              > "$report/bazel-test-evidence.json" 2> "$report/validator.stderr"; then
              :
            else
              echo "Bazel evidence did not establish target coverage for $label."
              failed=1
            fi
            log_path=${label#//}
            log_path=${log_path/:/\/}
            if [[ -d "bazel-testlogs/$log_path" ]] && cp -R "$(realpath "bazel-testlogs/$log_path")" "$report/testlogs"; then
              :
            else
              echo "Could not preserve test logs for $label."
              failed=1
              continue
            fi
            find "$report/testlogs" -name '*.log' -type f \
              -exec grep -hF "test $test_case ... " {} \; \
              | tr -d '\r' > "$report/case-results.txt"
            if grep -Fxq "test $test_case ... FAILED" "$report/case-results.txt"; then
              failed=1
            elif ! grep -Fxq "test $test_case ... ok" "$report/case-results.txt"; then
              echo "Bazel did not report a terminal result for the exact Rust case $test_case."
              failed=1
            fi
            if [[ "$result" == 3 ]]; then
              failed=1
            fi
          done
          git diff --binary > "$evidence/source-after.diff"
          cmp "$evidence/source-before.diff" "$evidence/source-after.diff"
          exit "$failed"

      - name: Record native Opus install links and CMake inputs
        if: always() && env.BAZEL_OUTPUT_BASE != ''
        shell: pwsh
        run: |
          $base = (Resolve-Path -LiteralPath $env:BAZEL_OUTPUT_BASE).ProviderPath
          $evidence = Join-Path $env:RUNNER_TEMP 'baseline-windows-bazel-evidence/opus-install'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $records = [System.Collections.Generic.List[object]]::new()
          $pattern = Join-Path $base 'execroot/_main/bazel-out/*/bin/external/*opusic-sys*/_bs.out_dir'
          foreach ($output in @(Get-Item -Path $pattern -Force -ErrorAction SilentlyContinue | Sort-Object FullName)) {
            $includeDirectory = Join-Path $output.FullName 'include/opus'
            if (Test-Path -LiteralPath $includeDirectory) {
              foreach ($header in @(Get-ChildItem -LiteralPath $includeDirectory -Filter '*.h' -Force | Sort-Object Name)) {
                $target = $null
                if ($header.LinkType -eq 'SymbolicLink') { $target = @($header.Target)[0] }
                $records.Add([ordered]@{
                  path = [System.IO.Path]::GetRelativePath($base, $header.FullName).Replace('\', '/')
                  exists = Test-Path -LiteralPath $header.FullName
                  symlink = $header.LinkType -eq 'SymbolicLink'
                  link_target = $target
                  file_attributes = [int]$header.Attributes
                  link_type = $header.LinkType
                })
              }
            }
            foreach ($name in 'CMakeCache.txt', 'cmake_install.cmake', 'install_manifest.txt') {
              foreach ($source in @(Get-ChildItem -LiteralPath $output.FullName -Recurse -Force -File -Filter $name | Sort-Object FullName)) {
                $destination = Join-Path $evidence ([System.IO.Path]::GetRelativePath($base, $source.FullName))
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
                Copy-Item -LiteralPath $source.FullName -Destination $destination
              }
            }
          }
          $json = [ordered]@{ path_base = 'BAZEL_OUTPUT_BASE'; headers = @($records) } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $evidence 'headers.json'), $json + "`n", [System.Text.UTF8Encoding]::new($false))
          Write-Output "Recorded $($records.Count) installed Opus headers"

      - name: Fail on skips caused by missing test setup
        if: ${{ !cancelled() && steps.bazel_tests.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          bash "$CODEX_TOOLING" check-test-skips --platform windows --runner bazel "$(realpath bazel-testlogs)" \
            2>&1 | tee "$RUNNER_TEMP/baseline-windows-bazel-evidence/skip-check.log"

      - name: Verify upstream source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          # The Dev Drive sizing step edits setup-dev-drive.ps1 in place; no other tracked file may differ.
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock' ':(exclude).github/scripts/setup-dev-drive.ps1'

      - name: Retain test evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: focused-windows-bazel-cases-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/baseline-windows-bazel-evidence
          retention-days: 3
          if-no-files-found: warn
