name: Stable upstream Windows Bazel tests

# EXPERIMENT variant: runs only //codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests on one MSVC and one
# gnullvm job, to find why legacy_workspace_write_delete_is_limited_to_writable_roots and
# profile_cleanup_preserves_account_until_profile_can_be_deleted fail on our runners.
on:
  workflow_dispatch:
    inputs:
      patches:
        description: Unused in this experiment variant; always pristine upstream
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnullvm
          - target: x86_64-pc-windows-msvc
    runs-on: windows-2025
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/sandbox-acl-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/scripts/setup-baseline-windows-voice.ps1 "$RUNNER_TEMP/setup-baseline-windows-voice.ps1"
          cp restart-metadata/.github/scripts/sandbox-acl-probe.ps1 "$RUNNER_TEMP/sandbox-acl-probe.ps1"
          printf 'commit=%s\n' "$(cat restart-metadata/.github/upstream-commit)" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Set up Python for upstream's Bazel wrapper
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Size the Dev Drive for the Bazel output
        shell: pwsh
        run: |
          $freeGb = [math]::Floor((Get-Item -LiteralPath $env:RUNNER_TEMP).PSDrive.Free / 1GB)
          $sizeGb = [math]::Min([math]::Max($freeGb - 20, 64), 240)
          Write-Output "The runner-temp drive has $freeGb GB free; a provisioned Dev Drive will be $sizeGb GB."
          $script = Join-Path $PWD '.github/scripts/setup-dev-drive.ps1'
          $text = [System.IO.File]::ReadAllText($script)
          if ($text -notmatch '\$SizeBytes = 64GB') { throw 'upstream setup-dev-drive.ps1 no longer sets a 64GB size' }
          [System.IO.File]::WriteAllText($script, ($text -replace '\$SizeBytes = 64GB', "`$SizeBytes = ${sizeGb}GB"))

      - name: Prepare upstream's Bazel host and toolchain
        uses: ./.github/actions/prepare-bazel-ci
        with:
          cache-scope: sandbox-acl-experiment
          target: ${{ matrix.target }}

      - name: Prepare upstream's native Windows voice tools
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/setup-baseline-windows-voice.ps1" -EvidenceDirectory "$env:RUNNER_TEMP/sandbox-acl-evidence/voice-tools"

      - name: Dump identity, volumes and ACLs
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/sandbox-acl-probe.ps1" -Mode Dump -Evidence "$env:RUNNER_TEMP/sandbox-acl-evidence" -Checkout $env:GITHUB_WORKSPACE *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/sandbox-acl-evidence/acl-dump.txt"

      - name: Define the Bazel invocation
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/bz.sh" <<'BZ'
          evidence="$RUNNER_TEMP/sandbox-acl-evidence"
          wrapper_args=()
          test_args=(test --config=ci-windows --workspace_status_command=./scripts/workspace-status.cmd --disk_cache= --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 --test_tag_filters=-argument-comment-lint --test_verbose_timeout_warnings "--test_timeout=-1,900,-1,-1")
          targets=(//codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests)
          if [[ "$TARGET" == x86_64-pc-windows-gnullvm ]]; then
            wrapper_args+=(--windows-cross-compile --remote-download-toplevel)
            test_args+=(--skip_incompatible_explicit_targets "--test_env=CODEX_BAZEL_TEST_SKIP_FILTERS=command_safety::powershell_parser::tests::,suite::code_mode::code_mode_can_call_hidden_dynamic_tools,tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child")
          else
            wrapper_args+=(--windows-msvc-host-platform)
            test_args+=(--config=ci-windows-msvc --platforms=//:windows_x86_64_msvc --build_metadata=TAG_windows_native_main=true)
          fi
          test_args+=(
            "--extra_toolchains=@local_config_cc//:cc-toolchain-x64_windows,@local_config_cc//:cc-toolchain-arm64_windows,//third_party/voice:windows_pkg_config_toolchain,//third_party/voice:windows_cmake_toolchain"
            --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0
            --repo_env=BAZEL_WIN32_WINNT=/D_WIN32_WINNT=0x0A00
            --inject_repository="voice_windows_tools=$VOICE_WINDOWS_BAZEL_REPOSITORY"
            --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools
            --action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT"
            --host_action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT"
            --action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH"
            --host_action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH"
          )
          # bz NAME [extra bazel test args...]: runs the unit-test target and keeps its logs.
          bz() {
            local name=$1; shift
            set +e
            .github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs "${wrapper_args[@]}" -- \
              "${test_args[@]}" "$@" -- "${targets[@]}" 2>&1 | tee "$evidence/bazel-$name.log"
            local result=${PIPESTATUS[0]}
            set -e
            printf 'BAZEL_RESULT name=%s exit=%s\n' "$name" "$result"
            mkdir -p "$evidence/testlogs-$name"
            cp -R "$(realpath bazel-testlogs)/codex-rs/windows-sandbox-rs/windows-sandbox-rs-unit-tests/." "$evidence/testlogs-$name/" || true
            return 0
          }
          BZ

      - name: Arm 0 - the test target as the baseline workflow runs it
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/bz.sh"
          bz ci-as-is --cache_test_results=no

      - name: Locate the built test binary
        id: bin
        run: |
          set -euo pipefail
          exe=$(ls -t "$(realpath bazel-out)"/*/bin/codex-rs/windows-sandbox-rs/windows-sandbox-rs-unit-tests-bin.exe | head -n 1)
          printf 'Test binary: %s\n' "$exe"
          printf 'exe=%s\n' "$(cygpath -w "$exe")" >> "$GITHUB_OUTPUT"

      - name: Arms D - the failing test run directly on differently placed and ACLed roots
        if: always() && steps.bin.outputs.exe != ''
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/sandbox-acl-probe.ps1" -Mode Arms -Evidence "$env:RUNNER_TEMP/sandbox-acl-evidence" -Checkout $env:GITHUB_WORKSPACE -TestExe '${{ steps.bin.outputs.exe }}' *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/sandbox-acl-evidence/arms-direct.txt"

      - name: Arm F1 - Bazel test with the Everyone ACE removed from the checkout
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'codex-rs'
          icacls $root /inheritance:d
          icacls $root /remove:g '*S-1-1-0'
          icacls $root
          & bash -c 'set -euo pipefail; source "$RUNNER_TEMP/bz.sh"; bz fix-no-everyone --cache_test_results=no --test_filter=legacy_workspace_write_delete_is_limited_to_writable_roots'

      - name: Arm F2 - Bazel test with every inherited ACE removed from the checkout
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'codex-rs'
          icacls $root /inheritance:r
          icacls $root /grant:r '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-18:(OI)(CI)F'
          icacls $root
          & bash -c 'set -euo pipefail; source "$RUNNER_TEMP/bz.sh"; bz fix-stripped --cache_test_results=no --test_filter=legacy_workspace_write_delete_is_limited_to_writable_roots'

      - name: Profile cleanup, isolated - 20 runs of the one test, one at a time
        if: always()
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/bz.sh"
          bz profile-isolated --cache_test_results=no --runs_per_test=20 --local_test_jobs=1 \
            --test_filter=profile_cleanup_preserves_account_until_profile_can_be_deleted

      - name: Profile cleanup, whole target with libtest's default threads - 6 runs
        if: always()
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/bz.sh"
          bz profile-whole-default --cache_test_results=no --runs_per_test=6 --local_test_jobs=1

      - name: Profile cleanup, whole target with RUST_TEST_THREADS=1 - 6 runs
        if: always()
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/bz.sh"
          bz profile-whole-serial --cache_test_results=no --runs_per_test=6 --local_test_jobs=1 --test_env=RUST_TEST_THREADS=1

      - name: Summarize the case results
        if: always()
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/sandbox-acl-evidence"
          for dir in testlogs-*; do
            printf '== %s\n' "$dir"
            find "$dir" -name test.log | sort | while read -r log; do
              printf '%s: ' "$log"
              grep -E "^test (uninstall_windows::principals::tests::profile_cleanup|unified_exec::tests::legacy_workspace_write_delete)" "$log" | tr '\n' ' '
              printf '\n'
            done
          done | tee case-summary.txt

      - name: Retain experiment evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: sandbox-acl-${{ matrix.target }}
          path: ${{ runner.temp }}/sandbox-acl-evidence
          retention-days: 3
          if-no-files-found: warn
