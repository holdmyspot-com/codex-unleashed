name: Stable upstream Windows Bazel tests

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order; empty tests pristine upstream and records its failures as the baseline
        type: string
        default: ""
      targets:
        description: Space-separated Bazel test labels to run on one runner per selected toolchain instead of partitioning every target; skips the coverage and baseline comparison
        type: string
        default: ""
      stress_count:
        description: Optional repeat count; each selected test runs this many times under CPU load, with no retries, to measure flakiness; skips the baseline comparison
        type: string
        default: ""
      toolchains:
        description: Which Windows toolchains to run
        type: choice
        options: [both, gnullvm, msvc]
        default: both
      public_key:
        description: Optional SSH public key; connect to each Windows worker before starting its Bazel checks
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    # Each target's shard count is defined here once; the shard matrix and the coverage job derive from it.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expect: ${{ steps.plan.outputs.expect }}
    steps:
      - name: Define the shards
        id: plan
        env:
          TOOLCHAINS: ${{ inputs.toolchains }}
          FOCUSED_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          # One msvc shard built 100 GB of outputs for //... and filled a 133 GB Dev Drive (run 45949570933); halving the
          # selection keeps each shard near the 60-75 GB that the gnullvm shards use.
          targets='[{"target":"x86_64-pc-windows-gnullvm","shard_count":4},{"target":"x86_64-pc-windows-msvc","shard_count":2}]'
          # A focused run (explicit targets) uses one shard per selected toolchain, and the toolchains input narrows the groups.
          targets="$(jq -c --arg toolchains "$TOOLCHAINS" --arg focused "${FOCUSED_TARGETS// /}" '
            [.[] | select($toolchains == "both" or ($toolchains == "gnullvm" and (.target | endswith("gnullvm"))) or ($toolchains == "msvc" and (.target | endswith("msvc"))))
              | if $focused != "" then .shard_count = 1 else . end]' <<< "$targets")"
          test "$targets" != '[]'
          printf 'matrix=%s\n' "$(jq -c '{include: [.[] | . as $entry | range(1; $entry.shard_count + 1) | {target: $entry.target, shard: ., shard_count: $entry.shard_count}]}' <<< "$targets")" >> "$GITHUB_OUTPUT"
          printf 'expect=%s\n' "$(jq -r '[.[] | "--expect \(.target)=\(.shard_count)"] | join(" ")' <<< "$targets")" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      TARGET: ${{ matrix.target }}
      BAZEL_TEST_SHARD: ${{ matrix.shard }}
      BAZEL_TEST_SHARD_COUNT: ${{ matrix.shard_count }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Select the maintained tooling JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build the tooling runtime
        shell: bash
        env:
          TOOLING_ROOT: restart-metadata
        run: bash restart-metadata/.github/scripts/setup-tooling.sh

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/scripts/setup-baseline-windows-voice.ps1 "$RUNNER_TEMP/setup-baseline-windows-voice.ps1"
          cp restart-metadata/.github/scripts/add-windows-page-file.ps1 restart-metadata/.github/scripts/add-windows-bazel-page-file.ps1 \
            restart-metadata/.github/scripts/size-windows-dev-drive.ps1 "$RUNNER_TEMP/"
          mkdir -p "$RUNNER_TEMP/test-baselines"
          if [[ -d restart-metadata/docs/test-baselines ]]; then cp -R restart-metadata/docs/test-baselines/. "$RUNNER_TEMP/test-baselines/"; fi
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          cp restart-metadata/.github/scripts/buildbuddy-cache.sh "$RUNNER_TEMP/"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Stage the retained runner helper
        if: inputs.public_key != ''
        run: |
          set -euo pipefail
          cp restart-metadata/.github/scripts/release-debug-session.sh "$RUNNER_TEMP/"
          cp -R restart-metadata/.github/actions/debug-failed-runner "$RUNNER_TEMP/windows-bazel-debug-action"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          # Upstream's CI tests main, whose workspace version is 0.0.0; a stable tag's release commit changes only that
          # version. Test the same source, so version strings in snapshots and fixtures match what upstream tested.
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' codex-rs/Cargo.toml
          if ! git diff --quiet -- codex-rs/Cargo.toml; then
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          for patch in ${patch_paths[@]+"${patch_paths[@]}"}; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare retained Windows Bazel worker
        if: inputs.public_key != ''
        run: |
          bash "$RUNNER_TEMP/release-debug-session.sh" prepare \
            "$RUNNER_TEMP/windows-bazel-debug-action" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-windows-bazel-evidence"

      - name: Open authenticated Windows Bazel worker
        id: bazel-debug
        if: inputs.public_key != ''
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.public_key }}
          idle-timeout-minutes: '10'
          artifact-suffix: -${{ matrix.target }}-${{ matrix.shard }}

      - name: Wait for connected Windows Bazel client
        if: steps.bazel-debug.outcome == 'success'
        run: bash "$RUNNER_TEMP/release-debug-session.sh" wait-for-client "$RUNNER_TEMP/baseline-windows-bazel-evidence"

      - name: Set up Python for the maintained Windows checks and metadata
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Check upstream's Windows wrapper
        # Upstream replaced run_bazel_with_buildbuddy.py and its test with run_bazel.py and test_run_bazel.py, which its
        # bazel.yml runs at this point of the Windows shard 1 job.
        if: matrix.target == 'x86_64-pc-windows-gnullvm' && matrix.shard == 1
        shell: pwsh
        run: |
          python .github/scripts/test_run_bazel.py
          exit $LASTEXITCODE

      - name: Add a page file
        id: bazel-page-file
        # Native MSVC test targets failed with "The paging file is too small" (os error 1455). In run 45320758830 gnullvm
        # shard 3 failed with that error, "memory allocation failed" and "failed to mmap file" for the sysroot's libtest,
        # and shard 2 with a bare "can't find crate for `codex_exec`", which rustc reports when a declared rlib briefly
        # stops passing its exists check. The script says why the page file is split between C: and D:; it runs before
        # the Dev Drive is sized.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/add-windows-bazel-page-file.ps1"

      - name: Size the Dev Drive for the Bazel output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/size-windows-dev-drive.ps1" -SetupScript (Join-Path $PWD '.github/scripts/setup-dev-drive.ps1')

      - name: Prepare upstream's Bazel host and toolchain
        uses: ./.github/actions/prepare-bazel-ci
        with:
          cache-scope: baseline-windows-tests-${{ matrix.shard }}
          target: ${{ matrix.target }}

      - name: Prepare upstream's native Windows voice tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/setup-baseline-windows-voice.ps1" -EvidenceDirectory "$env:RUNNER_TEMP/baseline-windows-bazel-evidence/voice-tools"

      - name: Record the native host and capacity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          {
            uname -a
            printf 'runner_os=%s\ntarget=%s\n' "$RUNNER_OS" "$TARGET"
            df -k "$CI_BUILD_ROOT/" "$RUNNER_TEMP"
            bazel --version
          } | tee "$evidence/host.txt"
          test "$(cat .bazelversion)" = 9.2.0

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up upstream's Rust toolchain for workspace metadata
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Synchronize release workspace versions without dependency upgrades
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          cargo metadata --format-version 1 --filter-platform "$TARGET" \
            --manifest-path codex-rs/Cargo.toml > "$RUNNER_TEMP/baseline-cargo-metadata.json"
          bash "$CODEX_TOOLING" verify-workspace-lock-versions "$GITHUB_WORKSPACE"
          git diff --check
          git diff -- codex-rs/Cargo.lock > "$evidence/workspace-version-lock.diff"
          git diff --binary > "$evidence/source-before.diff"

      # Remote cache only, and only for a trusted run (see buildbuddy-cache.sh). The key reaches this step and the finish
      # step, never the Bazel wrapper; without it Bazel keeps using the GHCR disk caches.
      - name: Configure the BuildBuddy remote cache
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash "$RUNNER_TEMP/buildbuddy-cache.sh" configure "$GITHUB_WORKSPACE"

      - name: Run the maintained Windows Bazel test selection
        id: bazel_tests
        env:
          FOCUSED_TARGETS: ${{ inputs.targets }}
          STRESS_COUNT: ${{ inputs.stress_count }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          export CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR="$evidence/execution-logs"
          mkdir -p "$CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR"
          wrapper_args=()
          # tui-unit-tests exceeds Bazel's 300 s "moderate" timeout on a 4-vCPU runner (24/24 attempts at
          # 302 s) and did the same in upstream's native main job on its larger runner (run 41103447384, 304
          # s). Bazel has no per-target command-line timeout, and the workflow may not edit upstream's BUILD
          # files, so raise the whole "moderate" category to 900 s; -1 keeps the short, long and eternal
          # defaults. Every target without an explicit timeout is "moderate", so a hung test now holds a job
          # for 900 s per attempt instead of 300 s.
          test_args=(test --config=ci-windows --workspace_status_command=./scripts/workspace-status.cmd --disk_cache= --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 --test_tag_filters=-argument-comment-lint --test_verbose_timeout_warnings "--test_timeout=-1,900,-1,-1")
          targets=()
          if [[ "$TARGET" == x86_64-pc-windows-gnullvm ]]; then
            wrapper_args+=(--windows-cross-compile --remote-download-toplevel)
            test_args+=(--skip_incompatible_explicit_targets --build_metadata="TAG_windows_test_shard=$BAZEL_TEST_SHARD")
            # The wrapper is deliberately not given a BuildBuddy key (buildbuddy-cache.sh configures remote
            # caching only), so it cannot apply upstream's --config=ci-windows-cross, which needs remote
            # execution, and falls back to --config=ci-windows with an MSVC host
            # platform. These shards then build and test MSVC-target binaries on this runner's 4 vCPUs,
            # compiling locally while tests run (--keep_going). Upstream's ci-windows-cross also sets
            # --local_test_jobs=8 and --test_env=RUST_TEST_THREADS=1, but it sets them for gnullvm
            # binaries built remotely, where the runner carries only the tests. Upstream's own ci-windows
            # jobs, the config this fallback uses, set neither, so Bazel sizes local test concurrency from
            # the detected cores and libtest from available_parallelism. Copying the two cross-only limits
            # here ran 8 test jobs on 4 cores and serialised each test binary, the probable cause of the
            # thread-store, daemon_startup and worktree timeouts that upstream's runners do not show (not
            # yet measured). Pass only the skip list that replaces the Windows one: it adds the PowerShell
            # parser tests, which hang in cross-built gnullvm binaries and are covered by the native MSVC
            # job.
            test_args+=(
              "--test_env=CODEX_BAZEL_TEST_SKIP_FILTERS=command_safety::powershell_parser::tests::,suite::code_mode::code_mode_can_call_hidden_dynamic_tools,tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child"
            )
          else
            wrapper_args+=(--windows-msvc-host-platform)
            test_args+=(--config=ci-windows-msvc --platforms=//:windows_x86_64_msvc --build_metadata=TAG_windows_native_main=true)
            test_args+=(--skip_incompatible_explicit_targets)
          fi
          if [[ -n "${FOCUSED_TARGETS// /}" ]]; then
            read -r -a requested <<< "$FOCUSED_TARGETS"
            printf '%s\n' "${requested[@]}" > "$evidence/selected-targets.txt"
          else
            query='tests(//...) except tests(//third_party/v8:all) except attr(tags, "manual", tests(//...))'
            if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
              query+=' except //codex-rs/v8-poc:v8-poc-unit-tests'
            fi
            .github/scripts/run-bazel-query-ci.sh --output=label -- "$query" \
              | LC_ALL=C sort > "$evidence/candidate-targets.txt"
            bash "$CODEX_TOOLING" select-windows-bazel-targets \
              --shard "$BAZEL_TEST_SHARD" --shard-count "$BAZEL_TEST_SHARD_COUNT" \
              --durations "$GITHUB_WORKSPACE/.github/scripts/windows_bazel_test_durations.tsv" \
              < "$evidence/candidate-targets.txt" > "$evidence/selected-targets.txt"
          fi
          test -s "$evidence/selected-targets.txt"
          while IFS= read -r target; do
            targets+=("$target")
          done < "$evidence/selected-targets.txt"
          if [[ -n "$STRESS_COUNT" ]]; then
            # Repeat each test without retries while every core is busy, to measure flakiness.
            test_args+=(--runs_per_test="$STRESS_COUNT" --flaky_test_attempts=1)
            for _ in $(seq "$(nproc)"); do yes > /dev/null & done
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            test_args+=(
              "--extra_toolchains=//third_party/voice:windows_pkg_config_toolchain,//third_party/voice:windows_cmake_toolchain"
              # Bazel's local Windows C++ toolchain defaults _WIN32_WINNT to 0x0601 (Windows 7) while V8's build defines
              # 0x0A00 (Windows 10), so every V8 compile warned that the macro was redefined. Rust's MSVC targets need
              # Windows 10, and the release packages are built with Cargo, so this changes only the Bazel jobs.
              # rules_cc passes the value to cl.exe as the whole flag, so it must include /D_WIN32_WINNT=.
              --repo_env=BAZEL_WIN32_WINNT=/D_WIN32_WINNT=0x0A00
              --inject_repository="voice_windows_tools=$VOICE_WINDOWS_BAZEL_REPOSITORY"
              --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools
              --action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT"
              --host_action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT"
              --action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH"
              --host_action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH"
            )
          fi
          printf '%s\n' "${targets[@]}" > "$evidence/execution-targets.txt"
          bep="$evidence/bazel-tests.bep.json"
          rm -f -- "$bep"
          test_args+=("--build_event_json_file=$bep")
          printf 'shard=%s\nshard_count=%s\n' "$BAZEL_TEST_SHARD" "$BAZEL_TEST_SHARD_COUNT" > "$evidence/shard.txt"
          # Depth 3 stops at execroot/_main, which held 67.5 GB of a full Dev Drive; depth 8 reaches its configurations
          # and the packages inside them, such as bazel-out/<configuration>/bin/codex-rs/core.
          (
            while true; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              df -k "$CI_BUILD_ROOT/" "$RUNNER_TEMP"
              if du -k -d 8 "$CI_BUILD_ROOT/" | sort -nr | sed -n '1,50p'; then
                :
              else
                printf 'directory_sample_exit=%s\n' "$?"
              fi
              sleep 60
            done
          ) >> "$evidence/disk-usage.log" 2>&1 &
          disk_monitor=$!
          trap 'kill "$disk_monitor" 2>/dev/null || true; wait "$disk_monitor" || true' EXIT
          set +e
          .github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs "${wrapper_args[@]}" -- \
            "${test_args[@]}" --build_metadata="COMMIT_SHA=$(cat "$evidence/upstream-commit")" -- \
            "${targets[@]}" 2>&1 | tee "$evidence/bazel-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" > "$evidence/bazel-tests.receipt"
          bash "$CODEX_TOOLING" validate-bazel-test-evidence \
            --bep "$bep" --expected-patterns "$evidence/execution-targets.txt" --bazel-exit-code "$result" \
            > "$evidence/bazel-test-evidence.json"
          git diff --binary > "$evidence/source-after.diff"
          cmp "$evidence/source-before.diff" "$evidence/source-after.diff"
          printf 'bep-complete=true\n' >> "$GITHUB_OUTPUT"
          # Bazel exits 3 when tests failed and everything else built. The comparison with the unpatched baseline below
          # judges those failures (an unpatched run records that baseline), so they alone do not fail this step.
          # Any other failure, such as a build error, does.
          if [[ "$result" == 3 ]]; then
            printf 'Bazel reported failing tests; the baseline comparison decides the outcome.\n'
            exit 0
          fi
          exit "$result"

      - name: Report each focused target's per-attempt status
        if: ${{ always() && steps.bazel_tests.outcome != 'skipped' && (inputs.targets != '' || inputs.stress_count != '') }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          {
            printf '### Per-attempt test status (%s)\n\n```\n' "$TARGET"
            jq -r 'select(.id.testResult != null) | "\(.id.testResult.label) run=\(.id.testResult.run) shard=\(.id.testResult.shard) attempt=\(.id.testResult.attempt) \(.testResult.status)"' \
              "$evidence/bazel-tests.bep.json" | LC_ALL=C sort
            jq -r 'select(.id.testSummary != null) | "\(.id.testSummary.label) overall=\(.testSummary.overallStatus) runs=\(.testSummary.totalRunCount)"' \
              "$evidence/bazel-tests.bep.json" | LC_ALL=C sort
            jq -r 'select(.aborted.reason == "SKIPPED") | "\(.id.targetCompleted.label // "?") SKIPPED as incompatible"' \
              "$evidence/bazel-tests.bep.json" | LC_ALL=C sort
            printf '```\n'
          } | tee "$evidence/per-attempt-status.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the shard's candidate, selected, executed and skipped lists
        if: always() && steps.bazel_tests.outcome != 'skipped' && inputs.targets == '' && inputs.stress_count == ''
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          out="$RUNNER_TEMP/shard-coverage-out"
          mkdir -p "$out"
          cp "$evidence/candidate-targets.txt" "$out/candidates.txt"
          cp "$evidence/selected-targets.txt" "$out/selected.txt"
          printf '%s\n' "$TARGET" > "$out/group.txt"
          printf '%s\n' "$BAZEL_TEST_SHARD" > "$out/shard.txt"
          printf '%s\n' "$BAZEL_TEST_SHARD_COUNT" > "$out/shard-count.txt"
          cp "$evidence/upstream-commit" "$out/upstream-commit"
          if [[ -s "$evidence/bazel-tests.bep.json" ]]; then
            bash "$CODEX_TOOLING" bazel-shard-coverage record --bep "$evidence/bazel-tests.bep.json" \
              --executed "$out/executed.txt" --skipped "$out/skipped.txt"
          fi

      - name: Record the page file use
        # The Dev Drive sizing keeps nothing back for page file growth, so record whether a page file grew past its
        # minimum and how much of it was used.
        if: always() && steps.bazel-page-file.outcome == 'success'
        shell: pwsh
        run: |
          Get-CimInstance Win32_PageFileUsage | ForEach-Object {
            'page_file name={0} allocated_mib={1} current_usage_mib={2} peak_usage_mib={3}' -f `
              $_.Name, $_.AllocatedBaseSize, $_.CurrentUsage, $_.PeakUsage
          } | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'baseline-windows-bazel-evidence/page-file-usage.txt')

      - name: Record native Opus install links and CMake inputs
        if: always() && env.BAZEL_OUTPUT_BASE != ''
        shell: pwsh
        run: |
          $base = (Resolve-Path -LiteralPath $env:BAZEL_OUTPUT_BASE).ProviderPath
          $evidence = Join-Path $env:RUNNER_TEMP 'baseline-windows-bazel-evidence/opus-install'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $records = [System.Collections.Generic.List[object]]::new()
          $pattern = Join-Path $base 'execroot/_main/bazel-out/*/bin/external/*opusic-sys*/_bs.out_dir'
          foreach ($output in @(Get-Item -Path $pattern -Force -ErrorAction SilentlyContinue | Sort-Object FullName)) {
            $includeDirectory = Join-Path $output.FullName 'include/opus'
            if (Test-Path -LiteralPath $includeDirectory) {
              foreach ($header in @(Get-ChildItem -LiteralPath $includeDirectory -Filter '*.h' -Force | Sort-Object Name)) {
                $target = $null
                if ($header.LinkType -eq 'SymbolicLink') { $target = @($header.Target)[0] }
                $records.Add([ordered]@{
                  path = [System.IO.Path]::GetRelativePath($base, $header.FullName).Replace('\', '/')
                  exists = Test-Path -LiteralPath $header.FullName
                  symlink = $header.LinkType -eq 'SymbolicLink'
                  link_target = $target
                  file_attributes = [int]$header.Attributes
                  link_type = $header.LinkType
                })
              }
            }
            foreach ($name in 'CMakeCache.txt', 'cmake_install.cmake', 'install_manifest.txt') {
              foreach ($source in @(Get-ChildItem -LiteralPath $output.FullName -Recurse -Force -File -Filter $name | Sort-Object FullName)) {
                $destination = Join-Path $evidence ([System.IO.Path]::GetRelativePath($base, $source.FullName))
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
                Copy-Item -LiteralPath $source.FullName -Destination $destination
              }
            }
          }
          $json = [ordered]@{ path_base = 'BAZEL_OUTPUT_BASE'; headers = @($records) } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $evidence 'headers.json'), $json + "`n", [System.Text.UTF8Encoding]::new($false))
          Write-Output "Recorded $($records.Count) installed Opus headers"

      - name: Fail on skips caused by missing test setup
        if: ${{ !cancelled() && steps.bazel_tests.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          bash "$CODEX_TOOLING" check-test-skips --platform windows --runner bazel "$(realpath bazel-testlogs)" \
            2>&1 | tee "$RUNNER_TEMP/baseline-windows-bazel-evidence/skip-check.log"

      - name: Record this shard's results
        # An unpatched run is pristine upstream, so its failures are the baseline that patched runs are compared with;
        # the evidence artifact carries the file for committing under docs/test-baselines.
        if: ${{ !cancelled() && steps.bazel_tests.outcome == 'success' && steps.bazel_tests.outputs['bep-complete'] == 'true' && inputs.targets == '' && inputs.stress_count == '' }}
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-bazel-evidence"
          commit="${{ steps.inputs.outputs.commit }}"
          platform="windows-bazel-${TARGET##*-}-shard-${BAZEL_TEST_SHARD}"
          common=(--runner bazel --platform "$platform" --upstream-commit "$commit")
          if [[ -z "${PATCHES// /}" ]]; then
            bash "$CODEX_TOOLING" compare-test-baseline "${common[@]}" --write-baseline \
              --output "$evidence/$platform.json" "$(realpath bazel-testlogs)"
          else
            # The merged comparison runs once per platform group in the coverage job.
            mkdir -p "$RUNNER_TEMP/shard-coverage-out"
            bash "$CODEX_TOOLING" compare-test-baseline --runner bazel \
              --write-results "$RUNNER_TEMP/shard-coverage-out/results.json" "$(realpath bazel-testlogs)"
          fi

      - name: Upload this shard's coverage lists
        if: always() && steps.bazel_tests.outcome != 'skipped' && inputs.targets == '' && inputs.stress_count == ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bazel-shard-coverage-windows-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-coverage-out
          retention-days: 3
          if-no-files-found: error

      - name: Verify upstream source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          # The Dev Drive sizing step edits setup-dev-drive.ps1 in place; no other tracked file may differ.
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock' ':(exclude).github/scripts/setup-dev-drive.ps1'

      - name: Keep the BuildBuddy key out of the retained evidence
        if: always()
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash "$RUNNER_TEMP/buildbuddy-cache.sh" finish "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-windows-bazel-evidence"

      - name: Retain test evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-windows-bazel-tests-${{ matrix.target }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/baseline-windows-bazel-evidence
          retention-days: 3
          if-no-files-found: warn

      - name: Remove the job-owned tooling runtime
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/codex-tooling"

  coverage:
    # Fails unless every shard uploaded, all saw the same candidate list, the selections partition it exactly, and every
    # incompatible skip is allowlisted.
    needs: [plan, test]
    if: ${{ always() && inputs.targets == '' && inputs.stress_count == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve the tooling source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Select the maintained tooling JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Build the tooling runtime
        shell: bash
        env:
          TOOLING_ROOT: .
        run: bash .github/scripts/setup-tooling.sh

      - name: Download every shard's coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bazel-shard-coverage-windows-*
          path: ${{ runner.temp }}/shard-coverage

      - name: Check shard coverage
        env:
          EXPECT: ${{ needs.plan.outputs.expect }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shard-coverage"
          read -r -a expect <<< "$EXPECT"
          bash "$CODEX_TOOLING" bazel-shard-coverage check --directory "$RUNNER_TEMP/shard-coverage" \
            "${expect[@]}" \
            --allowlist .github/bazel-skipped-targets-allowlist.txt

      - name: Compare the merged results with the unpatched baseline
        # Shard assignment can change between runs, so no shard is compared on its own: this job merges every shard's
        # results per group and compares each group once with the union of that group's shard baselines.
        if: ${{ !cancelled() }}
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          if [[ -z "${PATCHES// /}" ]]; then
            printf 'An unpatched run records baselines instead of comparing.\n'
            exit 0
          fi
          cov="$RUNNER_TEMP/shard-coverage"
          merged="$RUNNER_TEMP/merged-results"
          rm -rf "$merged"
          mkdir -p "$merged"
          for dir in "$cov"/*/; do
            [[ -f "${dir}results.json" ]] || continue
            group="$(cat "${dir}group.txt")"
            mkdir -p "$merged/$group"
            cp -R "${dir%/}" "$merged/$group/"
          done
          commit="$(cat "$cov"/*/upstream-commit | tr -d '\r' | sort -u)"
          if [[ -z "$commit" || "$commit" == *$'\n'* ]]; then
            printf 'The shards did not report exactly one upstream commit.\n' >&2
            exit 1
          fi
          found=0
          status=0
          for group_dir in "$merged"/*/; do
            found=1
            group="$(basename "$group_dir")"
            prefix="windows-bazel-${group##*-}-shard-"
            if ! bash "$CODEX_TOOLING" compare-test-baseline --runner bazel --upstream-commit "$commit" \
              --baseline-dir docs/test-baselines --baseline-prefix "$prefix" --merge-results "$group_dir" 2>&1 \
              | tee -a "$RUNNER_TEMP/baseline-comparison.log"; then
              status=1
            fi
          done
          if ((found == 0)); then
            printf 'No shard results were uploaded to compare.\n' >&2
            exit 1
          fi
          exit "$status"
