name: Diagnose archived native tests

on:
  workflow_call:
    inputs:
      source-run:
        type: string
        required: true
      arm-launch-controls:
        description: Authenticate retained ARM inputs and collect independent PowerShell startup controls.
        type: boolean
        default: false
      original-source-policy:
        description: Restore the original Intel diagnostic driver and its default nextest policy.
        type: boolean
        default: false
      preserve-archive-policy:
        description: Restore the current archive's exact driver and default nextest policy without rebuilding.
        type: boolean
        default: false
      macos-startup-controls:
        description: Time archived codex-exec help startup before the original three release timeout tests.
        type: boolean
        default: false
      contention-controls:
        description: Sandwich current release shard 1 or 2 between same-host serial controls.
        type: boolean
        default: false
      archive-shard:
        description: Restore original Intel hash shard 1 or 4 of 4 with default concurrency and resource evidence.
        type: string
        default: ''
      upstream-ref:
        type: string
        default: 83086188ae0614bd882818ff1aa23f3194962012
      runner:
        type: string
        required: true
      artifact-id:
        type: string
        required: true
      test-filter:
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  archived-tests:
    name: Diagnose existing binaries without compiling Codex
    runs-on: ${{ inputs.runner }}
    # Original full shard test stages take 28m03s and 21m04s; allow acquisition plus controls.
    timeout-minutes: ${{ inputs.contention-controls && 75 || 60 }}
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_SOURCE_POLICY: ${{ inputs.original-source-policy }}
      ARM_LAUNCH_CONTROLS: ${{ inputs.arm-launch-controls }}
      PRESERVE_ARCHIVE_POLICY: ${{ inputs.preserve-archive-policy }}
      ARCHIVE_SHARD: ${{ inputs.archive-shard }}
      CONTENTION_CONTROLS: ${{ inputs.contention-controls }}
      ORIGINAL_TOOLING_CACHE_KEY: tooling-runtime-v1-macOS-X64-zulu-27.0.0+35-3f38d98a4ac1b2d5e8f00b207e26c2be764a2b7f2667de7a67ebdc8c69eb5e6b
      SOURCE_RUN: ${{ inputs.source-run }}
      ARTIFACT_ID: ${{ inputs.artifact-id }}
      TEST_FILTER: ${{ inputs.test-filter }}
      RUST_BACKTRACE: "1"
      RUST_LIB_BACKTRACE: "0"
      RUST_MIN_STACK: "8388608"
    steps:
      - name: Validate archived macOS startup controls
        if: inputs.macos-startup-controls
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" == 40093103558 && "$ARTIFACT_ID" == macos-x64 ]]
          [[ "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == X64 ]]
          [[ "$PRESERVE_ARCHIVE_POLICY" == true && "$ORIGINAL_SOURCE_POLICY" == false ]]
          [[ "$ARM_LAUNCH_CONTROLS" == false && "$CONTENTION_CONTROLS" == false ]]
          [[ -z "$ARCHIVE_SHARD" ]]

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: inputs.macos-startup-controls
        with:
          persist-credentials: false

      - name: Stage startup controls before restoring the archive driver
        if: inputs.macos-startup-controls
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          mkdir -p "$diagnostic_root"
          cp .github/scripts/diagnose-macos-exec-startup.sh "$diagnostic_root/startup-controls.sh"
          shasum -a 256 "$diagnostic_root/startup-controls.sh" > "$diagnostic_root/startup-controls.sha256"

      - name: Validate the original shard workload mode
        if: inputs.archive-shard != '' && !inputs.contention-controls
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRESERVE_ARCHIVE_POLICY" == true && "$ORIGINAL_SOURCE_POLICY" == false && "$ARM_LAUNCH_CONTROLS" == false ]]
          [[ "$ARCHIVE_SHARD" == 1 || "$ARCHIVE_SHARD" == 4 ]]
          [[ "$TEST_FILTER" == 'all()' ]]

      - name: Validate current release contention mode
        if: inputs.contention-controls
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" == 40093103558 && "$ARTIFACT_ID" == macos-x64 ]]
          [[ "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == X64 ]]
          [[ "$PRESERVE_ARCHIVE_POLICY" == true && "$ORIGINAL_SOURCE_POLICY" == false && "$ARM_LAUNCH_CONTROLS" == false ]]
          [[ "$ARCHIVE_SHARD" == 1 || "$ARCHIVE_SHARD" == 2 ]]
          [[ "$TEST_FILTER" == 'all()' ]]

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: inputs.contention-controls
        with:
          persist-credentials: false

      - name: Stage current release contention driver
        if: inputs.contention-controls
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          mkdir -p "$diagnostic_root"
          cp .github/scripts/diagnose-intel-contention.sh "$diagnostic_root/contention.sh"
          shasum -a 256 "$diagnostic_root/contention.sh" > "$diagnostic_root/contention-driver.sha256"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: inputs.arm-launch-controls
        with:
          persist-credentials: false

      - name: Stage reviewed ARM controls before restoring the archive driver
        if: inputs.arm-launch-controls
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          mkdir -p "$diagnostic_root"
          cp .github/scripts/diagnose-windows-arm-launch-inputs.ps1 "$diagnostic_root/controls.ps1"
          if command -v shasum >/dev/null 2>&1; then
            sha256=(shasum -a 256)
          else
            sha256=(sha256sum)
          fi
          "${sha256[@]}" "$diagnostic_root/controls.ps1" > "$diagnostic_root/controls.sha256"

      - name: Authenticate retained ARM launch inputs
        if: inputs.arm-launch-controls
        id: arm_identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRESERVE_ARCHIVE_POLICY" == true ]]
          [[ "$SOURCE_RUN" == 40038389605 && "$ARTIFACT_ID" == windows-arm64 ]]
          [[ "$RUNNER_OS" == Windows && "$RUNNER_ARCH" == ARM64 && "$ORIGINAL_SOURCE_POLICY" == false ]]
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          mkdir -p "$diagnostic_root"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$diagnostic_root/source-run.json"
          jq -e ' .id == 40038389605 and .status == "completed" and .head_sha == "72118e7a449834add11bbcb8fef63642430ea200" ' "$diagnostic_root/source-run.json"
          printf 'head-sha=72118e7a449834add11bbcb8fef63642430ea200\n' >> "$GITHUB_OUTPUT"
          for artifact in 12542125686 12541583459 12541438951; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$diagnostic_root/artifact-$artifact.json"
          done
          jq -es '
            sort_by(.id) | map([.id, .name, .digest, .expired, .workflow_run.id, .workflow_run.head_sha]) == [
              [12541438951, "nextest-test-helpers-windows-arm64", "sha256:3f2a62413f8b98f84f567091e5fee84f7a763615b33735e3683d43d87965d3be", false, 40038389605, "72118e7a449834add11bbcb8fef63642430ea200"],
              [12541583459, "nextest-native-windows-arm64", "sha256:ca628818f5d79daff4528ce7b1055431ada52e884d6648e347491d7b647343f5", false, 40038389605, "72118e7a449834add11bbcb8fef63642430ea200"],
              [12542125686, "nextest-archive-windows-arm64", "sha256:01fcc2c4f2e6b34dea300f902d8280f5372747de45b86fc869d9a8caf399ab43", false, 40038389605, "72118e7a449834add11bbcb8fef63642430ea200"]
            ]' "$diagnostic_root"/artifact-*.json

      - name: Authenticate the current archive source and artifact identities
        if: inputs.preserve-archive-policy && !inputs.arm-launch-controls
        id: archive_identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_SOURCE_POLICY" == false ]]
          [[ "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == X64 && "$ARTIFACT_ID" == macos-x64 ]]
          if [[ "$SOURCE_RUN" == 40093103558 ]]; then
            [[ "$PRESERVE_ARCHIVE_POLICY" == true && "$ARM_LAUNCH_CONTROLS" == false ]]
            if [[ "${CONTENTION_CONTROLS:-false}" == true ]]; then
              [[ "$ARCHIVE_SHARD" == 1 || "$ARCHIVE_SHARD" == 2 ]]
            else
              [[ -z "$ARCHIVE_SHARD" ]]
            fi
            diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
            mkdir -p "$diagnostic_root"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$diagnostic_root/source-run.json"
            source_sha=84ba3d0eafea32eb6c2da055891263c70e5abd9e
            jq -e --arg sha "$source_sha" '.id == 40093103558 and .status == "completed" and
              .head_sha == $sha and .path == ".github/workflows/rust-ci-full.yml" and
              .repository.full_name == "holdmyspot-com/codex-unleashed" and
              .head_repository.full_name == "holdmyspot-com/codex-unleashed"' "$diagnostic_root/source-run.json"
            for artifact in 12563197007 12563476183; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$diagnostic_root/artifact-$artifact.json"
            done
            jq -es --arg sha "$source_sha" '
              sort_by(.id) | map([.id, .name, .digest, .expired, .workflow_run.id, .workflow_run.head_sha]) == [
                [12563197007, "nextest-archive-macos-x64", "sha256:ad342d508886a363f215e3367d5136e6c0beaed52306f75c559d2806db41133f", false, 40093103558, $sha],
                [12563476183, "nextest-native-macos-x64", "sha256:1d8939c44f0416019b16ba24908092da6d00e3774a26637580edf4088f06b3b7", false, 40093103558, $sha]
              ]' "$diagnostic_root/artifact-12563197007.json" "$diagnostic_root/artifact-12563476183.json"
            printf 'head-sha=%s\narchive-id=12563197007\nnative-id=12563476183\n' "$source_sha" >> "$GITHUB_OUTPUT"
          else
            [[ "${CONTENTION_CONTROLS:-false}" == false ]]
            [[ "$SOURCE_RUN" == 40038389605 ]]
            diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
            mkdir -p "$diagnostic_root"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$diagnostic_root/source-run.json"
            source_sha="$(jq -er '.head_sha' "$diagnostic_root/source-run.json")"
            [[ "$source_sha" == 72118e7a449834add11bbcb8fef63642430ea200 ]]
            jq -e '.id == 40038389605 and .status == "completed"' "$diagnostic_root/source-run.json"
            printf 'head-sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
            for artifact in 12541876650 12541762119; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$diagnostic_root/artifact-$artifact.json"
            done
            jq -e --arg sha "$source_sha" '.id == 12541876650 and .name == "nextest-archive-macos-x64" and
              .expired == false and .workflow_run.id == 40038389605 and .workflow_run.head_sha == $sha and
              .digest == "sha256:236d917b0c71b77aad333c4ea95c2b08759434c425d4aae509572762d8807230"' \
              "$diagnostic_root/artifact-12541876650.json"
            jq -e --arg sha "$source_sha" '.id == 12541762119 and .name == "nextest-native-macos-x64" and
              .expired == false and .workflow_run.id == 40038389605 and .workflow_run.head_sha == $sha and
              .digest == "sha256:c5839312e781b23659ebd6dbc98ec6741dbe51d9bdb4ca379b5b2d18367c9962"' \
              "$diagnostic_root/artifact-12541762119.json"
            printf 'archive-id=12541876650\nnative-id=12541762119\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate the original driver and archive identities
        if: inputs.original-source-policy
        id: source_identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN" == 39995637785 ]]
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          mkdir -p "$diagnostic_root"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$diagnostic_root/source-run.json"
          original_sha="$(jq -er '.head_sha' "$diagnostic_root/source-run.json")"
          [[ "$original_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$original_sha" == c5ec3807915d9e86ab945f30c9dc7e650e4e2e42 ]]
          printf 'head-sha=%s\n' "$original_sha" >> "$GITHUB_OUTPUT"
          for artifact in 12526481642 12526217273; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$diagnostic_root/artifact-$artifact.json"
          done
          jq -e '.id == 12526481642 and .name == "nextest-archive-macos-x64" and .expired == false and
            .workflow_run.id == 39995637785 and .workflow_run.head_sha == "c5ec3807915d9e86ab945f30c9dc7e650e4e2e42" and
            .digest == "sha256:ceaf9200abaef9576fb33085b867ded410821d4b63d0420ff6fd7bb3c8e512b3"' \
            "$diagnostic_root/artifact-12526481642.json"
          jq -e '.id == 12526217273 and .name == "nextest-native-macos-x64" and .expired == false and
            .workflow_run.id == 39995637785 and .workflow_run.head_sha == "c5ec3807915d9e86ab945f30c9dc7e650e4e2e42" and
            .digest == "sha256:c7e4611c21d8f8edd2b5b19c06fb66cd2421d3338e7231fff3d61174cbc8dfba"' \
            "$diagnostic_root/artifact-12526217273.json"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.arm-launch-controls && steps.arm_identity.outputs.head-sha || inputs.preserve-archive-policy && steps.archive_identity.outputs.head-sha || inputs.original-source-policy && steps.source_identity.outputs.head-sha || github.sha }}
          persist-credentials: false

      - name: Check out the archived workspace source
        if: ${{ !inputs.original-source-policy && !inputs.preserve-archive-policy }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: openai/codex
          ref: ${{ inputs.upstream-ref }}
          path: upstream
          persist-credentials: false

      - name: Restore the original verified bundled tooling runtime
        if: inputs.original-source-policy
        id: original_tooling
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ github.workspace }}/.cat/work/temp/build-caches/maven/target/tooling-distribution/runtime
          key: ${{ env.ORIGINAL_TOOLING_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Probe the original bundled runtime without rebuilding it
        if: inputs.original-source-policy
        shell: bash
        env:
          TOOLING_RUNTIME_CACHE_HIT: ${{ steps.original_tooling.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_RUNTIME_CACHE_HIT" == true ]]
          runtime="$GITHUB_WORKSPACE/.cat/work/temp/build-caches/maven/target/tooling-distribution/runtime"
          test -f "$runtime/.complete"
          test -x "$runtime/bin/codex-tooling"
          GITHUB_ACTION_PATH="$GITHUB_WORKSPACE/.github/actions/setup-tooling" \
            bash .github/actions/setup-tooling/setup.sh
          printf '%s\n' "$ORIGINAL_TOOLING_CACHE_KEY" > "$RUNNER_TEMP/archived-test-diagnostic/original-tooling-cache-key.txt"

      - name: Restore the original patched workspace and nextest configuration
        if: inputs.original-source-policy
        shell: bash
        env:
          UPSTREAM_REF: ${{ inputs.upstream-ref }}
          EXPECTED_UPSTREAM_COMMIT: ${{ inputs.upstream-ref }}
          UPSTREAM_REPO: openai/codex
          CHECKOUT_PATH: upstream
          FALLBACK_TO_DEFAULT_BRANCH: 'false'
        run: |
          set -euo pipefail
          bash .github/actions/prepare-patched-upstream/clone.sh
          bash scripts/apply-patches.sh "$GITHUB_WORKSPACE/upstream"

      - name: Restore the current archive's exact patched workspace from cached tooling
        if: inputs.preserve-archive-policy && !inputs.arm-launch-controls && inputs.source-run != '40093103558'
        uses: ./.github/actions/prepare-patched-upstream
        with:
          require-tooling-cache: 'true'
          expected-upstream-commit: ${{ inputs.upstream-ref }}

      - name: Restore the pinned release tooling runtime without rebuilding
        if: inputs.preserve-archive-policy && inputs.source-run == '40093103558'
        id: release_tooling
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.cat/work/temp/build-caches/maven/target/tooling-distribution/runtime
          key: tooling-runtime-v2-macOS-X64-jdk-X64-zulu-27.0.1+9-753cdc3af5bce3449875766ba0b8c771b7c2627437c120fbebdf9428763243ad
          fail-on-cache-miss: true

      - name: Probe the pinned release runtime without rebuilding
        if: inputs.preserve-archive-policy && inputs.source-run == '40093103558'
        shell: bash
        env:
          TOOLING_RUNTIME_CACHE_HIT: ${{ steps.release_tooling.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$TOOLING_RUNTIME_CACHE_HIT" != true ]]; then
            echo 'Pinned release tooling cache unavailable; source reconstruction cannot proceed without rebuilding.' >&2
            exit 1
          fi
          runtime="$GITHUB_WORKSPACE/.cat/work/temp/build-caches/maven/target/tooling-distribution/runtime"
          if [[ ! -f "$runtime/.complete" || ! -x "$runtime/bin/codex-tooling" ]]; then
            echo "Pinned release tooling runtime is incomplete at $runtime; refusing to build." >&2
            exit 1
          fi
          GITHUB_ACTION_PATH="$GITHUB_WORKSPACE/.github/actions/setup-tooling" \
            bash .github/actions/setup-tooling/setup.sh
          printf '%s\n' 'tooling-runtime-v2-macOS-X64-jdk-X64-zulu-27.0.1+9-753cdc3af5bce3449875766ba0b8c771b7c2627437c120fbebdf9428763243ad' \
            > "$RUNNER_TEMP/archived-test-diagnostic/original-tooling-cache-key.txt"

      - name: Restore the pinned release patched workspace
        if: inputs.preserve-archive-policy && inputs.source-run == '40093103558'
        shell: bash
        env:
          UPSTREAM_REF: ${{ inputs.upstream-ref }}
          EXPECTED_UPSTREAM_COMMIT: 83086188ae0614bd882818ff1aa23f3194962012
          UPSTREAM_REPO: openai/codex
          CHECKOUT_PATH: upstream
          FALLBACK_TO_DEFAULT_BRANCH: 'false'
        run: |
          set -euo pipefail
          bash .github/actions/prepare-patched-upstream/clone.sh
          bash scripts/apply-patches.sh "$GITHUB_WORKSPACE/upstream"

      - uses: ./.github/actions/setup-ci
        if: inputs.arm-launch-controls

      - name: Select the archived native ARM tooling JDK
        if: inputs.arm-launch-controls
        id: arm_jdk
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '27.0.1+11'
          architecture: aarch64

      - name: Locate the archived ARM tooling cache path
        if: inputs.arm-launch-controls
        id: arm_tooling_path
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/.cat/work/temp/build-caches/maven/target/tooling-distribution/runtime"
          runtime="$(cygpath --windows "$runtime")"
          printf 'runtime=%s\n' "$runtime" >> "$GITHUB_OUTPUT"

      - name: Restore the exact archived ARM tooling runtime
        if: inputs.arm-launch-controls
        id: arm_tooling
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.arm_tooling_path.outputs.runtime }}
          key: tooling-runtime-v1-Windows-ARM64-jdk-aarch64-liberica-27.0.1+11-64ac20488e11c8d568f4e8d133da7daf288645003cfe90c4a12eb7f855bc0d9b
          fail-on-cache-miss: true

      - name: Require the archived ARM launcher without a build fallback
        if: inputs.arm-launch-controls
        shell: bash
        env:
          TOOLING_RUNTIME_CACHE_HIT: ${{ steps.arm_tooling.outputs.cache-hit }}
          TOOLING_RUNTIME_CACHE_KEY: ${{ steps.arm_tooling.outputs.cache-primary-key }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_RUNTIME_CACHE_HIT" == true ]]
          runtime="$GITHUB_WORKSPACE/.cat/work/temp/build-caches/maven/target/tooling-distribution/runtime"
          test -f "$runtime/.complete"
          test -x "$runtime/bin/codex-tooling"
          [[ "$("$runtime/bin/codex-tooling" next-release-build-number rust-v0.0.0 </dev/null)" == 1 ]]
          printf 'CODEX_UNLEASHED_TOOLING=%s\n' "$runtime/bin/codex-tooling" >> "$GITHUB_ENV"
          printf '%s\n' "$TOOLING_RUNTIME_CACHE_KEY" > "$RUNNER_TEMP/archived-test-diagnostic/original-tooling-cache-key.txt"

      - name: Restore the exact patched ARM archive source
        if: inputs.arm-launch-controls
        shell: bash
        env:
          UPSTREAM_REF: ${{ inputs.upstream-ref }}
          EXPECTED_UPSTREAM_COMMIT: ${{ inputs.upstream-ref }}
          UPSTREAM_REPO: openai/codex
          CHECKOUT_PATH: upstream
          FALLBACK_TO_DEFAULT_BRANCH: 'false'
        run: |
          set -euo pipefail
          bash .github/actions/prepare-patched-upstream/clone.sh
          bash scripts/apply-patches.sh "$GITHUB_WORKSPACE/upstream"

      - name: Collect independent ARM PowerShell startup controls
        if: inputs.arm-launch-controls
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/archived-test-diagnostic/controls.ps1" -OutputDirectory "$env:RUNNER_TEMP/archived-test-diagnostic"'

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      - name: Install process tracing
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends strace

      - name: Download the original test binaries and native runtime
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          ARCHIVE_ZIP_ID: ${{ steps.archive_identity.outputs.archive-id }}
          NATIVE_ZIP_ID: ${{ steps.archive_identity.outputs.native-id }}
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          mkdir -p "$diagnostic_root"
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --json headSha,url --jq '[.headSha,.url] | @tsv'
          if [[ "$PRESERVE_ARCHIVE_POLICY" == true ]]; then
            # Verify the actual downloaded ZIP bytes against the authenticated run metadata.
            entries=("$ARCHIVE_ZIP_ID archive" "$NATIVE_ZIP_ID native")
            if [[ "$ARM_LAUNCH_CONTROLS" == true ]]; then
              entries=('12542125686 archive' '12541583459 native' '12541438951 helpers')
            fi
            for entry in "${entries[@]}"; do
              read -r artifact directory <<< "$entry"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$diagnostic_root/$directory.zip"
              digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$")) | sub("^sha256:"; "")' \
                "$diagnostic_root/artifact-$artifact.json")"
              if command -v shasum >/dev/null 2>&1; then
                sha256=(shasum -a 256)
              else
                sha256=(sha256sum)
              fi
              printf '%s  %s\n' "$digest" "$diagnostic_root/$directory.zip" | "${sha256[@]}" -c
              mkdir "$diagnostic_root/$directory"
              unzip -q "$diagnostic_root/$directory.zip" -d "$diagnostic_root/$directory"
            done
          else
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "nextest-archive-$ARTIFACT_ID" --dir "$diagnostic_root/archive"
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "nextest-native-$ARTIFACT_ID" --dir "$diagnostic_root/native"
          fi
          mkdir "$RUNNER_TEMP/nextest-native"
          (
            cd "$RUNNER_TEMP"
            tar -C nextest-native -xzf - \
              < archived-test-diagnostic/native/nextest-native.tar.gz
          )

      - name: Restore retained ARM sandbox helpers
        if: inputs.arm-launch-controls
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          helper_target_dir="$CARGO_TARGET_DIR/aarch64-pc-windows-msvc/ci-test"
          mkdir -p "$helper_target_dir"
          cp "$diagnostic_root/helpers/codex-windows-sandbox-setup.exe" "$helper_target_dir/"
          cp "$diagnostic_root/helpers/codex-command-runner.exe" "$helper_target_dir/"
          setup_helper="$(cygpath -w "$helper_target_dir/codex-windows-sandbox-setup.exe")"
          command_runner="$(cygpath -w "$helper_target_dir/codex-command-runner.exe")"
          printf 'CARGO_BIN_EXE_codex_windows_sandbox_setup=%s\nCARGO_BIN_EXE_codex_command_runner=%s\n' \
            "$setup_helper" "$command_runner" >> "$GITHUB_ENV"

      - uses: ./.github/actions/configure-nextest-native-sdk

      - name: Verify the current default policy and archived test selection
        if: inputs.preserve-archive-policy && !inputs.contention-controls
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          expected_driver=72118e7a449834add11bbcb8fef63642430ea200
          if [[ "$SOURCE_RUN" == 40093103558 ]]; then
            expected_driver=84ba3d0eafea32eb6c2da055891263c70e5abd9e
          fi
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "$expected_driver" ]]
          cd "$GITHUB_WORKSPACE/upstream/codex-rs"
          test -f .config/nextest.toml
          cp .config/nextest.toml "$diagnostic_root/original-nextest.toml"
          if command -v shasum >/dev/null 2>&1; then
            sha256=(shasum -a 256)
          else
            sha256=(sha256sum)
          fi
          "${sha256[@]}" "$diagnostic_root/original-nextest.toml" > "$diagnostic_root/original-nextest.sha256"
          if [[ "$SOURCE_RUN" == 40093103558 ]]; then
            printf '%s  %s\n' f411d7e8ea0a8b60a3cdd9a1e47223ad964e2d2fd5f80d0abe4d877b41851817 \
              "$diagnostic_root/original-nextest.toml" | "${sha256[@]}" -c
          fi
          selection_args=(-E "$TEST_FILTER")
          effective_filter="$TEST_FILTER"
          test_threads=1
          if [[ -n "$ARCHIVE_SHARD" ]]; then
            selection_args=(--partition "hash:$ARCHIVE_SHARD/4")
            effective_filter='<none>'
            test_threads=default
          fi
          printf 'diagnostic-sha=%s\narchive-driver-sha=%s\nupstream-sha=%s\nsource-run=%s\nprofile=default\ntest-threads=%s\nretries=0\nfilter=%s\npartition=%s\n' \
            "$GITHUB_SHA" "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" "$(git rev-parse HEAD)" \
            "$SOURCE_RUN" "$test_threads" "$effective_filter" "${ARCHIVE_SHARD:+hash:$ARCHIVE_SHARD/4}" > "$diagnostic_root/provenance.txt"
          mkdir "$diagnostic_root/extracted"
          cargo nextest list \
            --archive-file "$diagnostic_root/archive/nextest-$ARTIFACT_ID.tar.zst" \
            --extract-to "$diagnostic_root/extracted" \
            --workspace-remap "$GITHUB_WORKSPACE/upstream/codex-rs" \
            --config-file "$GITHUB_WORKSPACE/upstream/codex-rs/.config/nextest.toml" --profile default \
            "${selection_args[@]}" --message-format json > "$diagnostic_root/selected-tests.json"
          if [[ "$ARM_LAUNCH_CONTROLS" == true ]]; then
            jq -e '
              [."rust-suites"[] | ."package-name" as $package |
                .testcases | to_entries[] |
                select(.value."filter-match".status == "matches" and .value.ignored == false) |
                [$package, .key]] | sort == ([
                  ["codex-exec-server", "remote_windows_sandbox_process_accepts_process_write::test_case_2_mxc_pipe"],
                  ["codex-core", "suite::unified_exec::exec_command_uses_installed_environment_shell_policy_with_explicit_overrides"]
                ] | sort)' "$diagnostic_root/selected-tests.json"
            printf 'Verified exactly two selected archived tests with the unchanged default policy.\n'
          elif [[ -n "$ARCHIVE_SHARD" ]]; then
            expected_count=5493
            expected_package=codex-core
            expected_test=client::tool_metadata::tests::message_budget_removes_residual_values_and_markers_when_ordinary_input_fits
            if [[ "$ARCHIVE_SHARD" == 4 ]]; then
              expected_count=5607
              expected_package=codex-tui
              expected_test=bottom_pane::async_questions::tests::question_wrapped_options_and_other_share_the_text_indent
            fi
            jq -e --argjson count "$expected_count" --arg package "$expected_package" --arg test "$expected_test" '
              [."rust-suites"[] | ."package-name" as $package |
                .testcases | to_entries[] |
                select(.value."filter-match".status == "matches" and .value.ignored == false) |
                [$package, .key]] as $matches |
              ($matches | length) == $count and ($matches | any(. == [$package, $test]))
              ' "$diagnostic_root/selected-tests.json"
            printf 'Verified original hash shard %s/4: %s selected tests, including its terminal timeout test.\n' \
              "$ARCHIVE_SHARD" "$expected_count"
          elif [[ "$SOURCE_RUN" == 40093103558 ]]; then
            jq -e '
              [."rust-suites"[] | ."package-name" as $package |
                .testcases | to_entries[] |
                select(.value."filter-match".status == "matches" and .value.ignored == false) |
                [$package, .key]] | sort == ([
                  ["codex-core", "client::tool_metadata::tests::message_budget_removes_residual_values_and_markers_when_ordinary_input_fits"],
                  ["codex-exec", "suite::daybreak::exec_resumes_and_forks_the_saved_daybreak_choice"],
                  ["codex-feedback", "tests::feedback_upload_delivers_large_files_intact"]
                ] | sort)' "$diagnostic_root/selected-tests.json"
            printf 'Verified exactly three pinned release timeout tests with the unchanged default policy.\n'
          else
            jq -e '
              [."rust-suites"[] | ."package-name" as $package |
                .testcases | to_entries[] |
                select(.value."filter-match".status == "matches" and .value.ignored == false) |
                [$package, .key]] | sort == ([
                  ["codex-core", "client::tool_metadata::tests::message_budget_removes_residual_values_and_markers_when_ordinary_input_fits"],
                  ["codex-tui", "bottom_pane::async_questions::tests::question_wrapped_options_and_other_share_the_text_indent"]
                ] | sort)
              ' "$diagnostic_root/selected-tests.json"
            printf 'Verified exactly two selected archived tests with the unchanged default policy.\n'
          fi

      - name: Time archived macOS executable startup without recompiling
        if: inputs.macos-startup-controls
        id: startup_controls
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          shasum -a 256 -c "$diagnostic_root/startup-controls.sha256"
          find "$diagnostic_root/extracted" -type f -name codex-exec > "$diagnostic_root/startup-executable-paths.txt"
          [[ "$(wc -l < "$diagnostic_root/startup-executable-paths.txt" | tr -d ' ')" == 1 ]]
          IFS= read -r executable < "$diagnostic_root/startup-executable-paths.txt"
          shasum -a 256 "$executable" > "$diagnostic_root/startup-executable.sha256"
          bash "$diagnostic_root/startup-controls.sh" "$executable" "$diagnostic_root/startup-controls" true

      - name: Run same-host current release contention controls
        if: inputs.contention-controls
        timeout-minutes: 50
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          shasum -a 256 -c "$diagnostic_root/contention-driver.sha256"
          cp "$GITHUB_WORKSPACE/upstream/codex-rs/.config/nextest.toml" "$diagnostic_root/original-nextest.toml"
          bash "$diagnostic_root/contention.sh"

      - name: Run the selected archived tests
        if: ${{ !inputs.contention-controls }}
        id: original_tests
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          if [[ "$PRESERVE_ARCHIVE_POLICY" != true ]]; then
            mkdir "$diagnostic_root/extracted"
          fi
          config_args=(--config-file "$diagnostic_root/nextest.toml" --profile archived-diagnostic)
          archive_args=(--archive-file "$diagnostic_root/archive/nextest-$ARTIFACT_ID.tar.zst"
            --extract-to "$diagnostic_root/extracted"
            --workspace-remap "$GITHUB_WORKSPACE/upstream/codex-rs")
          if [[ "$PRESERVE_ARCHIVE_POLICY" == true ]]; then
            cd "$GITHUB_WORKSPACE/upstream/codex-rs"
            # Selection already extracted the archive and authenticated its source policy.
            cmp .config/nextest.toml "$diagnostic_root/original-nextest.toml"
            config_args=(--config-file "$GITHUB_WORKSPACE/upstream/codex-rs/.config/nextest.toml" --profile default)
            archive_args+=(--extract-overwrite)
            if [[ "$ARM_LAUNCH_CONTROLS" == true ]]; then
              config_args+=(--success-output immediate-final)
            fi
          elif [[ "$ORIGINAL_SOURCE_POLICY" == true ]]; then
            cd "$GITHUB_WORKSPACE/upstream/codex-rs"
            test -f .config/nextest.toml
            cp .config/nextest.toml "$diagnostic_root/original-nextest.toml"
            if command -v shasum >/dev/null 2>&1; then
              sha256=(shasum -a 256)
            else
              sha256=(sha256sum)
            fi
            "${sha256[@]}" "$diagnostic_root/original-nextest.toml" > "$diagnostic_root/original-nextest.sha256"
            config_args=(--config-file "$GITHUB_WORKSPACE/upstream/codex-rs/.config/nextest.toml" --profile default)
            printf 'diagnostic-sha=%s\noriginal-driver-sha=%s\nupstream-sha=%s\nsource-run=%s\nprofile=default\ntest-threads=1\nretries=0\nfilter=%s\n' \
              "$GITHUB_SHA" "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" "$(git rev-parse HEAD)" \
              "$SOURCE_RUN" "$TEST_FILTER" > "$diagnostic_root/provenance.txt"
            cargo nextest list "${archive_args[@]}" "${config_args[@]}" \
              --message-format json -E "$TEST_FILTER" > "$diagnostic_root/selected-tests.json"
            jq -e '
              [."rust-suites"[] | ."package-name" as $package |
                .testcases | to_entries[] |
                select(.value."filter-match".status == "matches" and .value.ignored == false) |
                [$package, .key]] | sort == ([
                  ["codex-core", "client::tool_metadata::tests::message_budget_removes_residual_values_and_markers_when_ordinary_input_fits"],
                  ["codex-core", "shell_snapshot::tests::snapshot_discovers_and_restores_inherited_credential_aliases"],
                  ["codex-tui", "bottom_pane::async_questions::tests::question_wrapped_options_and_other_share_the_text_indent"]
                ] | sort)
              ' "$diagnostic_root/selected-tests.json"
            printf 'Verified exactly three selected archived tests.\n'
            # Listing already extracted this archive; overwrite only those owned files for the run.
            archive_args+=(--extract-overwrite)
          else
            cat > "$diagnostic_root/nextest.toml" <<'CONFIG'
          [profile.archived-diagnostic]
          slow-timeout = { period = "60s", terminate-after = 10 }
          CONFIG
          fi

          trace_command=(env)
          if [[ "$RUNNER_OS" == Linux ]]; then
            trace_command=(strace -f -tt -T -e 'trace=execve,clone,clone3,wait4,waitid,kill,exit_group' -o "$diagnostic_root/processes.log")
          fi
          execution_args=(--test-threads 1 -E "$TEST_FILTER")
          monitor_pid=
          stop_monitor() {
            if [[ -n "$monitor_pid" ]]; then
              kill "$monitor_pid" 2>/dev/null || true
              wait "$monitor_pid" 2>/dev/null || true
              monitor_pid=
            fi
          }
          trap stop_monitor EXIT
          if [[ -n "$ARCHIVE_SHARD" ]]; then
            # Match the original shard invocation: default concurrency and no filter expression.
            execution_args=(--partition "hash:$ARCHIVE_SHARD/4")
            (
              set +e
              date -u
              uname -a
              sysctl hw.model hw.logicalcpu hw.physicalcpu hw.memsize vm.swapusage
              top -l 1 -n 0
              printf 'Host resource snapshot complete.\n'
            ) > "$diagnostic_root/host-resources.log" 2>&1
            (
              set +e
              trap 'exit 0' TERM
              while :; do
                date -u
                top -l 1 -n 0
                vm_stat
                sysctl vm.swapusage
                ps -axo pid,ppid,pgid,pcpu,pmem,rss,vsz,etime,state,command
                sleep 10
              done
            ) > "$diagnostic_root/process-resources.log" 2>&1 &
            monitor_pid=$!
          fi
          set +e
          "${trace_command[@]}" cargo nextest run \
            "${archive_args[@]}" "${config_args[@]}" \
            "${execution_args[@]}" --retries 0 --no-fail-fast \
            --failure-output immediate-final \
            --no-tests fail \
            2>&1 | tee "$diagnostic_root/tests.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          stop_monitor
          printf 'nextest=%s\ntee=%s\n' "${pipeline_status[0]}" "${pipeline_status[1]}" > "$diagnostic_root/nextest-status.txt"
          if [[ "${pipeline_status[0]}" != 0 ]]; then
            exit "${pipeline_status[0]}"
          fi
          exit "${pipeline_status[1]}"

      - name: Require successful startup controls after retaining the original test outcome
        if: always() && inputs.macos-startup-controls && steps.startup_controls.outcome == 'failure'
        shell: bash
        run: |
          printf 'Archived executable startup controls failed; inspect the retained startup evidence.\n' >&2
          exit 1

      - name: Compare Windows tests with fixtures inside their writable workspace
        if: failure() && runner.os == 'Windows' && steps.original_tests.outcome == 'failure' && !inputs.arm-launch-controls
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/archived-test-diagnostic"
          fixture_root="$GITHUB_WORKSPACE/upstream/codex-rs/.diagnostic-temp"
          mkdir -p "$fixture_root" "$diagnostic_root/writable-fixture-extracted"
          TEMP="$(cygpath -w "$fixture_root")"
          export TEMP
          export TMP="$TEMP"
          export TMPDIR="$fixture_root"

          config_args=(--config-file "$diagnostic_root/nextest.toml" --profile archived-diagnostic)
          cargo nextest run \
            --archive-file "$diagnostic_root/archive/nextest-$ARTIFACT_ID.tar.zst" \
            --extract-to "$diagnostic_root/writable-fixture-extracted" \
            --workspace-remap "$GITHUB_WORKSPACE/upstream/codex-rs" \
            "${config_args[@]}" --test-threads 1 --retries 0 --no-fail-fast \
            --failure-output immediate-final \
            --no-tests fail \
            -E "$TEST_FILTER" 2>&1 | tee "$diagnostic_root/writable-fixtures.log"

      - name: Retain test and process timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archived-tests-${{ inputs.artifact-id }}${{ inputs.archive-shard != '' && format('-shard-{0}', inputs.archive-shard) || '' }}
          path: |
            ${{ runner.temp }}/archived-test-diagnostic/tests.log
            ${{ runner.temp }}/archived-test-diagnostic/serial-*.log
            ${{ runner.temp }}/archived-test-diagnostic/original-workload.log
            ${{ runner.temp }}/archived-test-diagnostic/*.status
            ${{ runner.temp }}/archived-test-diagnostic/phase-status.txt
            ${{ runner.temp }}/archived-test-diagnostic/resource-samples.log
            ${{ runner.temp }}/archived-test-diagnostic/*-selection.json
            ${{ runner.temp }}/archived-test-diagnostic/contention-provenance.txt
            ${{ runner.temp }}/archived-test-diagnostic/contention-driver.sha256
            ${{ runner.temp }}/archived-test-diagnostic/arm-launch-controls.json
            ${{ runner.temp }}/archived-test-diagnostic/controls.sha256
            ${{ runner.temp }}/archived-test-diagnostic/writable-fixtures.log
            ${{ runner.temp }}/archived-test-diagnostic/processes.log
            ${{ runner.temp }}/archived-test-diagnostic/host-resources.log
            ${{ runner.temp }}/archived-test-diagnostic/process-resources.log
            ${{ runner.temp }}/archived-test-diagnostic/nextest-status.txt
            ${{ runner.temp }}/archived-test-diagnostic/source-run.json
            ${{ runner.temp }}/archived-test-diagnostic/artifact-*.json
            ${{ runner.temp }}/archived-test-diagnostic/original-nextest.toml
            ${{ runner.temp }}/archived-test-diagnostic/original-nextest.sha256
            ${{ runner.temp }}/archived-test-diagnostic/provenance.txt
            ${{ runner.temp }}/archived-test-diagnostic/selected-tests.json
            ${{ runner.temp }}/archived-test-diagnostic/original-tooling-cache-key.txt
            ${{ runner.temp }}/archived-test-diagnostic/startup-controls
            ${{ runner.temp }}/archived-test-diagnostic/startup-controls.sha256
            ${{ runner.temp }}/archived-test-diagnostic/startup-executable-paths.txt
            ${{ runner.temp }}/archived-test-diagnostic/startup-executable.sha256
          if-no-files-found: warn
          retention-days: 1

      - name: Remove downloaded and extracted test inputs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/archived-test-diagnostic" "$RUNNER_TEMP/nextest-native" "$GITHUB_WORKSPACE/upstream"
          if [[ "$ARM_LAUNCH_CONTROLS" == true && -n "${CARGO_TARGET_DIR:-}" ]]; then
            rm -f -- "$CARGO_TARGET_DIR/aarch64-pc-windows-msvc/ci-test/codex-windows-sandbox-setup.exe" \
              "$CARGO_TARGET_DIR/aarch64-pc-windows-msvc/ci-test/codex-command-runner.exe"
          fi
