name: Stable upstream nested sandbox fixture probe

on:
  push:
    branches: [main.new]
    paths:
      - .github/workflows/baseline-sandbox-fixture.yml
      - .github/scripts/probe-nested-bwrap.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve source identity and the diagnostic probe
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/sandbox-fixture-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          cp restart-metadata/.github/scripts/probe-nested-bwrap.py "$RUNNER_TEMP/probe-nested-bwrap.py"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/sandbox-fixture-evidence/upstream-commit")"
          test -z "$(git status --porcelain)"

      - name: Prepare the upstream native test host
        uses: ./.github/actions/setup-ci

      - name: Install Linux build and namespace prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev bubblewrap

      - name: Set up the upstream Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build the helper and upstream bundled bubblewrap
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --target x86_64-unknown-linux-gnu --profile ci-test \
            -p codex-linux-sandbox -p codex-bwrap --bin codex-linux-sandbox --bin bwrap \
            2>&1 | tee "$RUNNER_TEMP/sandbox-fixture-evidence/build.log"

      - name: Compare the two nested sandbox fixtures
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/probe-nested-bwrap.py" \
            --helper "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/ci-test/codex-linux-sandbox" \
            --bundled-bwrap "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/ci-test/bwrap" \
            --temporary-parent "$RUNNER_TEMP" \
            --evidence "$RUNNER_TEMP/sandbox-fixture-evidence"

      - name: Retain diagnostic evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-nested-sandbox-fixture
          path: ${{ runner.temp }}/sandbox-fixture-evidence
          retention-days: 1
          if-no-files-found: warn
