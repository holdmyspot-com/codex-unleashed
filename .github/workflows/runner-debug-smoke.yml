name: Runner failure debugging smoke test
run-name: ${{ inputs.session_id && format('Runner debugging - {0} - {1}', inputs.target, inputs.session_id) || 'Runner failure debugging smoke test' }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Unique client identifier to match this dispatch in the run list
        type: string
        default: ''
      public_key:
        description: Public SSH key for the debugging client
        type: string
        required: true
      idle_timeout_minutes:
        description: Positive whole minutes before an unjoined or idle shell ends
        type: string
        default: '10'
      target:
        description: Native target to verify; all exercises the release matrix
        type: choice
        default: x86_64-unknown-linux-musl
        options: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, remaining, all]

permissions:
  contents: read

jobs:
  select:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: matrix
        env:
          PROBE_TARGET: ${{ inputs.target }}
        run: |
          printf 'value=%s\n' "$(jq --arg target "$PROBE_TARGET" -c '{include: [.[] | select(($target == "all") or (.target == $target) or (($target == "remaining") and (.target != "x86_64-unknown-linux-musl")))]}' .github/release-matrix.json)" >> "$GITHUB_OUTPUT"

  probe:
    needs: select
    name: Debug - ${{ matrix.target }}
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Create retained T9 evidence directory
        env:
          T9_EVIDENCE: ${{ runner.temp }}/t9-native-behavior
        run: |
          set -euo pipefail
          mkdir -p "$T9_EVIDENCE"
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            uname -a
            df -h "$RUNNER_TEMP"
          } > "$T9_EVIDENCE/worker-source-and-platform.txt"

      - name: Prepare maintained Linux CI environment
        uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        env:
          T9_EVIDENCE: ${{ runner.temp }}/t9-native-behavior
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap bison flex strace
          docker info > "$T9_EVIDENCE/docker-info.txt"

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up maintained Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: '1.99.1'
          targets: x86_64-unknown-linux-gnu

      - name: Set up V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install maintained nextest version
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.103

      - name: Create owned partial build state
        uses: ./.github/actions/runner-debug-smoke

      - name: Record the deliberate build failure
        id: failure
        run: exit 17

      - name: Debug the original failed workspace
        if: failure() && steps.failure.outcome == 'failure'
        uses: ./.github/actions/debug-failed-runner
        with:
          public-key: ${{ inputs.public_key }}
          idle-timeout-minutes: ${{ inputs.idle_timeout_minutes }}

      - name: Wait for authenticated test client
        if: always()
        env:
          T9_EVIDENCE: ${{ runner.temp }}/t9-native-behavior
        run: |
          set -euo pipefail
          deadline=$((SECONDS+540))
          until [[ -f "$T9_EVIDENCE/client-ready" ]]; do
            if (( SECONDS >= deadline )); then printf 'T9 client did not connect within nine minutes.\n' >&2; exit 124; fi
            sleep 2
          done

      - name: Wait for behavior evidence to be ready for export
        if: always()
        env:
          T9_EVIDENCE: ${{ runner.temp }}/t9-native-behavior
        run: |
          set -euo pipefail
          deadline=$((SECONDS+20400))
          until [[ -f "$T9_EVIDENCE/controller-ready-for-export" ]]; do
            if (( SECONDS >= deadline )); then printf 'T9 controller did not finish before the export margin.\n' >&2; exit 124; fi
            sleep 10
          done

      - name: Export full T9 behavior evidence
        id: t9-evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: t9-native-docker-behavior-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t9-native-behavior
          retention-days: 1
          if-no-files-found: error

      - name: Publish artifact completion to the retained client
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.t9-evidence.outcome }}
          T9_EVIDENCE: ${{ runner.temp }}/t9-native-behavior
        run: |
          set -euo pipefail
          mkdir -p "$T9_EVIDENCE"
          printf '%s\n' "${UPLOAD_OUTCOME:-unknown}" > "$T9_EVIDENCE/artifact-upload-outcome.txt"
          touch "$T9_EVIDENCE/export-complete"
