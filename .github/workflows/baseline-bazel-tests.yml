name: Stable upstream native Bazel tests

on:
  workflow_dispatch:
    inputs:
      exec_server_shells:
        description: Compare unchanged exec-server shell tests using upstream's serial Bazel invocation
        type: boolean
        default: false
      exec_server_filter:
        description: 'Libtest name filter for exec-server integration; use * for every case; requires exec_server_shells=true'
        type: string
        default: shell_snapshot
      trace_empty_workspace_roots:
        description: Trace the isolated empty-workspace-roots failure using the same compiled Bazel outputs
        type: boolean
        default: false
      bundle_empty_workspace_bwrap:
        description: Stage matching bwrap beside the exec-server test binary; with tracing, stage only for the empty-root diagnostic comparison
        type: boolean
        default: false
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      targets:
        description: Space-separated Bazel test labels to run on one runner instead of partitioning every package
        type: string
        default: ""
      write_baseline:
        description: Record this unpatched run's failures as the baseline for its upstream commit (evidence artifact), instead of comparing
        type: boolean
        default: false
      stress_count:
        description: Optional repeat count; each selected test runs this many times under CPU load, with no retries, to measure flakiness
        type: string
        default: ""

permissions:
  contents: read
  packages: write # Bazel disk cache in GHCR

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(((inputs.exec_server_shells || inputs.targets != '') && '[1]') || '[1,2]') }}
    runs-on: ubuntu-24.04
    env:
      BAZEL_TEST_SHARD: ${{ matrix.shard }}
      BAZEL_TEST_SHARD_COUNT: '2'
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          cp restart-metadata/.github/upstream-compat-releases.json "$evidence/compat-releases.json"
          cp restart-metadata/.github/scripts/check-test-skips.py "$RUNNER_TEMP/check-test-skips.py"
          cp restart-metadata/.github/scripts/compare-test-baseline.py "$RUNNER_TEMP/compare-test-baseline.py"
          cp restart-metadata/.github/scripts/ghcr-cargo-target-cache.sh "$RUNNER_TEMP/ghcr-cargo-target-cache.sh"
          cp restart-metadata/.github/cargo-cache-package "$evidence/cargo-cache-package"
          mkdir -p "$RUNNER_TEMP/test-baselines"
          if [[ -d restart-metadata/docs/test-baselines ]]; then cp -R restart-metadata/docs/test-baselines/. "$RUNNER_TEMP/test-baselines/"; fi
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Validate the focused trace selection
        if: inputs.trace_empty_workspace_roots
        env:
          FOCUSED_COMPARISON: ${{ inputs.exec_server_shells }}
          TEST_NAME_FILTER: ${{ inputs.exec_server_filter }}
        run: |
          set -euo pipefail
          test "$FOCUSED_COMPARISON" = true
          test "$TEST_NAME_FILTER" = remote_process_preserves_empty_workspace_roots

      - name: Validate the bundled-helper comparison
        if: inputs.bundle_empty_workspace_bwrap
        env:
          FOCUSED_COMPARISON: ${{ inputs.exec_server_shells }}
        run: |
          set -euo pipefail
          test "$FOCUSED_COMPARISON" = true

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          for patch in "${patch_paths[@]}"; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare upstream's native test host
        uses: ./.github/actions/setup-ci

      - name: Reclaim unused hosted-image toolchains and record capacity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          df -h / "$RUNNER_TEMP" | tee "$evidence/disk-before.txt"
          for unused in /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup; do
            if [[ -d "$unused" ]]; then
              sudo du -sh "$unused" | tee -a "$evidence/reclaimed-toolchains.txt"
              sudo rm -rf -- "$unused"
            fi
          done
          df -h / "$RUNNER_TEMP" | tee "$evidence/disk-after.txt"

      - name: Install Linux development prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap bison flex zsh ripgrep
          # Tests skip themselves when a shell or interpreter is missing, so assert each one here.
          zsh --version
          /bin/zsh --version
          python3 --version
          bwrap --version

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up upstream's Rust toolchain for workspace metadata
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: x86_64-unknown-linux-gnu

      - name: Install the requested syscall tracer
        if: inputs.trace_empty_workspace_roots
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends strace

      - name: Synchronize release workspace versions without dependency upgrades
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          cargo metadata --format-version 1 --filter-platform x86_64-unknown-linux-gnu \
            --manifest-path codex-rs/Cargo.toml > "$RUNNER_TEMP/baseline-cargo-metadata.json"
          python3 - <<'PYTHON'
          import subprocess
          import tomllib
          from pathlib import Path

          before = tomllib.loads(subprocess.check_output(["git", "show", "HEAD:codex-rs/Cargo.lock"], text=True))
          after = tomllib.loads(Path("codex-rs/Cargo.lock").read_text())
          before_header = {key: value for key, value in before.items() if key != "package"}
          after_header = {key: value for key, value in after.items() if key != "package"}
          assert before_header == after_header, "Cargo changed lockfile metadata beyond workspace versions"
          before_external = [package for package in before["package"] if "source" in package]
          after_external = [package for package in after["package"] if "source" in package]
          assert before_external == after_external, "Cargo changed external dependency records"
          version = tomllib.loads(Path("codex-rs/Cargo.toml").read_text())["workspace"]["package"]["version"]
          expected_workspace = [dict(package, version=version) for package in before["package"] if "source" not in package]
          actual_workspace = [package for package in after["package"] if "source" not in package]
          assert expected_workspace == actual_workspace, "Cargo changed workspace records beyond their release version"
          print(f"Verified {len(actual_workspace)} workspace versions; external dependencies unchanged")
          PYTHON
          git diff --check
          git diff -- codex-rs/Cargo.lock > "$evidence/workspace-version-lock.diff"
          git diff --binary > "$evidence/source-before.diff"

      - name: Install the pinned upstream Bazel version
        run: |
          set -euo pipefail
          test "$(cat .bazelversion)" = 9.2.0
          tools="$RUNNER_TEMP/baseline-bazel-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 --output "$tools/bazel" https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-linux-x86_64
          printf '%s  %s\n' 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694 "$tools/bazel" | sha256sum -c -
          chmod +x "$tools/bazel"
          "$tools/bazel" --version | tee "$RUNNER_TEMP/baseline-bazel-evidence/bazel-version.txt"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      # Upstream's `--config=ci-linux` (.bazelrc) is applied only with a BuildBuddy key, which this repository lacks.
      # These are the flags that configuration and its `ci` parents add, except the ones that need a remote cache or
      # executor (`--remote_download_minimal`, `--strategy=remote`, `--platforms=//:rbe`). The last one fails toolchain
      # resolution on this host ("No matching toolchains found") because //:rbe is a target platform meant to be paired
      # with the remote execution platform. RUST_TEST_NOCAPTURE keeps passing tests' output in test.log so the skip
      # check can read it.
      - name: Record the Bazel flags that upstream's CI configuration adds without remote execution
        run: |
          set -euo pipefail
          printf '%s\n' \
            --keep_going \
            --verbose_failures \
            --build_metadata=REPO_URL=https://github.com/openai/codex.git \
            --build_metadata=ROLE=CI \
            --build_metadata=VISIBILITY=PUBLIC \
            --build_metadata=TAG_workflow=bazel \
            --build_metadata=TAG_os=linux \
            --test_env=RUST_TEST_NOCAPTURE=1 \
            > "$RUNNER_TEMP/baseline-bazel-evidence/ci-flags.txt"

      - name: Select the maintained exec-server integration target for the focused comparison
        if: inputs.exec_server_shells
        run: |
          set -euo pipefail
          printf '%s\n' \
            //codex-rs/exec-server:exec-server-exec_process-test \
            > "$RUNNER_TEMP/baseline-bazel-evidence/selected-targets.txt"

      - name: Select the requested Bazel test labels
        if: ${{ !inputs.exec_server_shells && inputs.targets != '' }}
        env:
          BASELINE_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          read -r -a requested <<< "$BASELINE_TARGETS"
          printf '%s\n' "${requested[@]}" | tee "$evidence/selected-targets.txt"

      - name: Partition the complete package selection across free runners
        if: ${{ !inputs.exec_server_shells && inputs.targets == '' }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          .github/scripts/run-bazel-query-ci.sh --output=label -- '//...' > "$evidence/candidate-targets.txt"
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "baseline-bazel-evidence"
          labels = (evidence / "candidate-targets.txt").read_text().splitlines()
          packages = sorted({label.rsplit(":", 1)[0] for label in labels})
          shard_count = int(os.environ["BAZEL_TEST_SHARD_COUNT"])
          shard = int(os.environ["BAZEL_TEST_SHARD"])
          assignments = {
              package: int.from_bytes(hashlib.sha256(package.encode()).digest(), "big") % shard_count + 1
              for package in packages
          }
          selected = [f"{package}:all" for package in packages if assignments[package] == shard]
          assert selected, f"No packages selected for shard {shard}"
          (evidence / "selected-targets.txt").write_text("\n".join(selected) + "\n")
          (evidence / "package-shards.json").write_text(json.dumps(assignments, indent=2) + "\n")
          expression = "set(" + " ".join(f"{package}:all" for package in packages) + ")"
          (evidence / "all-package-patterns.query").write_text(expression + "\n")
          print(f"Selected {len(selected)} of {len(packages)} packages for shard {shard}/{shard_count}")
          PYTHON
          .github/scripts/run-bazel-query-ci.sh --output=label -- "$(cat "$evidence/all-package-patterns.query")" \
            | LC_ALL=C sort > "$evidence/expanded-package-targets.txt"
          LC_ALL=C sort "$evidence/candidate-targets.txt" > "$evidence/expected-targets.txt"
          cmp "$evidence/expected-targets.txt" "$evidence/expanded-package-targets.txt"

      # Bazel's content-addressed disk cache is kept in GHCR (the Actions cache is nearly full), keyed on the Bazel and
      # module lock files, the upstream commit, the applied patches, the shard and the target selection. A hit replays
      # the same actions' outputs; the tests still execute.
      - name: Set up the GHCR cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Restore the Bazel disk cache
        id: disk-cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
          SELECTED_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GH_OWNER,,}/$(cat "$evidence/cargo-cache-package")"
          digest="$(
            {
              cat .bazelversion
              printf 'shard=%s/%s targets=%s\n' "$BAZEL_TEST_SHARD" "$BAZEL_TEST_SHARD_COUNT" "$SELECTED_TARGETS"
              printf '%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}"
              cat "$evidence/upstream-commit"
              sha256sum MODULE.bazel MODULE.bazel.lock .bazelrc codex-rs/Cargo.lock 2>/dev/null || true
              cat "$evidence/applied-patches.txt" 2>/dev/null || true
              cat "$evidence/ci-flags.txt"
            } | sha256sum | cut -d' ' -f1
          )"
          tag="cargo-v3-bazel-linux-$digest"
          {
            printf 'repository=%s\n' "$repository"
            printf 'tag=%s\n' "$tag"
            printf 'directory=%s\n' "$RUNNER_TEMP/bazel-disk-cache"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/bazel-disk-cache"
          set +e
          bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" pull "$repository" "$tag" "$RUNNER_TEMP/bazel-disk-cache" "$(cat "$evidence/upstream-ref")" 2>&1 | tee "$evidence/disk-cache-restore.log"
          status=${PIPESTATUS[0]}
          set -e
          case "$status" in
            0) printf 'hit=true\n' >> "$GITHUB_OUTPUT" ;;
            3) printf 'hit=false\n' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
          du -sh "$RUNNER_TEMP/bazel-disk-cache" | tee -a "$evidence/disk-cache-restore.log"

      - name: Run the maintained Bazel package shard with the GHCR-backed disk cache
        id: bazel_tests
        env:
          BASELINE_EXEC_SERVER_SHELLS: ${{ inputs.exec_server_shells }}
          BASELINE_EXEC_SERVER_FILTER: ${{ inputs.exec_server_filter }}
          BUNDLE_BWRAP: ${{ inputs.bundle_empty_workspace_bwrap }}
          TRACE_SELECTED: ${{ inputs.trace_empty_workspace_roots }}
          STRESS_COUNT: ${{ inputs.stress_count }}
          GATED: ${{ inputs.stress_count == '' && !inputs.exec_server_shells && !inputs.trace_empty_workspace_roots && !inputs.bundle_empty_workspace_bwrap }}
          WRITE_BASELINE: ${{ inputs.write_baseline }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          export CODEX_COMPAT_RELEASES
          CODEX_COMPAT_RELEASES="$(cat "$evidence/compat-releases.json")"
          export CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR="$evidence/execution-logs"
          mkdir -p "$CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR"
          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done < "$evidence/selected-targets.txt"
          (
            while true; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              df -k "$CI_BUILD_ROOT" "$RUNNER_TEMP"
              if du -k --max-depth=3 -- "$CI_BUILD_ROOT" | sort -nr | sed -n '1,30p'; then
                :
              else
                printf 'directory_sample_exit=%s\n' "$?"
              fi
              sleep 60
            done
          ) >> "$evidence/disk-usage.log" 2>&1 &
          disk_monitor=$!
          trap 'kill "$disk_monitor" $(jobs -p) 2>/dev/null || true; wait "$disk_monitor" || true' EXIT
          mapfile -t ci_args < "$evidence/ci-flags.txt"
          comparison_args=()
          if [[ -n "$STRESS_COUNT" ]]; then
            comparison_args+=(--runs_per_test="$STRESS_COUNT" --flaky_test_attempts=1)
            for _ in $(seq "$(nproc)"); do yes > /dev/null & done
          fi
          if [[ "$BASELINE_EXEC_SERVER_SHELLS" == true ]]; then
            case "$BASELINE_EXEC_SERVER_FILTER" in
              '*') ;;
              *) comparison_args+=(--test_arg="$BASELINE_EXEC_SERVER_FILTER") ;;
            esac
            comparison_args+=(--test_arg=--nocapture --test_output=all)
          fi

          if [[ "$BUNDLE_BWRAP" == true ]]; then
            if [[ "$TRACE_SELECTED" == false ]]; then
              .github/scripts/run-bazel-ci.sh --print-failed-action-summary -- \
                build --disk_cache="$RUNNER_TEMP/bazel-disk-cache" "${ci_args[@]}" --build_metadata="COMMIT_SHA=$(cat "$evidence/upstream-commit")" -- \
                //codex-rs/exec-server:exec-server-exec_process-test //codex-rs/bwrap:bwrap
              ln -s "$(realpath bazel-bin/codex-rs/bwrap/bwrap)" bazel-bin/codex-rs/exec-server/bwrap
              sha256sum bazel-bin/codex-rs/bwrap/bwrap \
                bazel-bin/codex-rs/exec-server/exec-server-exec_process-test \
                > "$evidence/bundled-helper-comparison.sha256"
            fi
          fi

          printf '%s\n' "${comparison_args[@]}" > "$evidence/comparison-arguments.txt"
          set +e
          .github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs -- \
            test --disk_cache="$RUNNER_TEMP/bazel-disk-cache" --test_tag_filters=-argument-comment-lint "${ci_args[@]}" \
            "${comparison_args[@]}" --test_verbose_timeout_warnings --build_metadata="COMMIT_SHA=$(cat "$evidence/upstream-commit")" -- \
            "${targets[@]}" -//third_party/v8:all -//codex-rs/v8-poc:v8-poc-unit-tests \
            2>&1 | tee "$evidence/bazel-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" > "$evidence/bazel-tests.receipt"
          git diff --binary > "$evidence/source-after.diff"
          cmp "$evidence/source-before.diff" "$evidence/source-after.diff"
          # With a committed baseline (or when recording one) the comparison step decides pass or fail from the test
          # logs; otherwise any failing target fails the run.
          commit="$(cat "$evidence/upstream-commit")"
          if [[ "$GATED" == true && ( "$WRITE_BASELINE" == true || -f "$RUNNER_TEMP/test-baselines/$commit/linux-bazel-shard$BAZEL_TEST_SHARD.json" ) ]]; then
            exit 0
          fi
          exit "$result"

      - name: Trace the failed case incrementally on the same runner
        if: ${{ !cancelled() && inputs.trace_empty_workspace_roots && steps.bazel_tests.outcome == 'failure' }}
        env:
          BUNDLE_BWRAP: ${{ inputs.bundle_empty_workspace_bwrap }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          cmp "$evidence/source-before.diff" "$evidence/source-after.diff"
          grep -Fq 'test result: FAILED. 0 passed; 1 failed;' "$evidence/bazel-tests.log"
          export CODEX_COMPAT_RELEASES
          CODEX_COMPAT_RELEASES="$(cat "$evidence/compat-releases.json")"
          export CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR="$evidence/traced-execution-logs"
          mkdir -p "$CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR"

          if [[ "$BUNDLE_BWRAP" == true ]]; then
            ln -s "$(realpath bazel-bin/codex-rs/bwrap/bwrap)" bazel-bin/codex-rs/exec-server/bwrap
            sha256sum bazel-bin/codex-rs/bwrap/bwrap \
              bazel-bin/codex-rs/exec-server/exec-server-exec_process-test \
              > "$evidence/bundled-helper-comparison.sha256"
          fi

          mapfile -t ci_args < "$evidence/ci-flags.txt"
          printf '#!/usr/bin/env bash\nshift\nexec strace -f -yy -s 256 -o %q %q "$@"\n' \
            "$evidence/empty-workspace-roots.strace" \
            "$(realpath bazel-bin/codex-rs/exec-server/exec-server-exec_process-test)" \
            > "$evidence/trace-test.sh"

          set +e
          .github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs -- \
            test --disk_cache="$RUNNER_TEMP/bazel-disk-cache" --test_tag_filters=-argument-comment-lint "${ci_args[@]}" \
            --test_arg=remote_process_preserves_empty_workspace_roots --test_arg=--nocapture \
            --test_env=RUST_BACKTRACE=1 --test_output=all --nocache_test_results \
            --run_under="/bin/bash $evidence/trace-test.sh" \
            --build_metadata="COMMIT_SHA=$(cat "$evidence/upstream-commit")" -- \
            //codex-rs/exec-server:exec-server-exec_process-test \
            2>&1 | tee "$evidence/empty-workspace-roots-traced.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" > "$evidence/empty-workspace-roots-traced.receipt"
          git diff --binary > "$evidence/source-after-trace.diff"
          cmp "$evidence/source-before.diff" "$evidence/source-after-trace.diff"
          exit "$result"

      - name: Fail on skips caused by missing test setup
        if: ${{ !cancelled() && steps.bazel_tests.outcome != 'skipped' && !inputs.exec_server_shells }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/check-test-skips.py" --platform linux --runner bazel "$(realpath bazel-testlogs)" \
            2>&1 | tee "$RUNNER_TEMP/baseline-bazel-evidence/skip-check.log"

      - name: Save the Bazel disk cache
        if: ${{ !cancelled() && steps.disk-cache.outputs.hit == 'false' && steps.bazel_tests.outcome != 'skipped' }}
        continue-on-error: true
        env:
          CACHE_REPOSITORY: ${{ steps.disk-cache.outputs.repository }}
          CACHE_TAG: ${{ steps.disk-cache.outputs.tag }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          du -sh "$RUNNER_TEMP/bazel-disk-cache" | tee "$evidence/disk-cache-save.log"
          bash "$RUNNER_TEMP/ghcr-cargo-target-cache.sh" push "$CACHE_REPOSITORY" "$CACHE_TAG" "$RUNNER_TEMP/bazel-disk-cache" "$(cat "$evidence/upstream-ref")" 2>&1 | tee -a "$evidence/disk-cache-save.log"

      - name: Compare failures with the unpatched baseline
        if: ${{ !cancelled() && steps.bazel_tests.outcome == 'success' && !inputs.exec_server_shells && !inputs.trace_empty_workspace_roots && !inputs.bundle_empty_workspace_bwrap && inputs.stress_count == '' }}
        env:
          WRITE_BASELINE: ${{ inputs.write_baseline }}
          PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-evidence"
          commit="$(cat "$evidence/upstream-commit")"
          platform="linux-bazel-shard$BAZEL_TEST_SHARD"
          common=(--platform "$platform" --runner bazel --upstream-commit "$commit" --baseline-dir "$RUNNER_TEMP/test-baselines")
          if [[ "$WRITE_BASELINE" == true ]]; then
            if [[ -n "${PATCHES// /}" ]]; then
              printf 'A baseline must come from an unpatched run.\n' >&2
              exit 1
            fi
            python3 "$RUNNER_TEMP/compare-test-baseline.py" "${common[@]}" --write-baseline \
              --output "$evidence/test-baselines/$commit/$platform.json" "$(realpath bazel-testlogs)"
            exit 0
          fi
          if [[ ! -f "$RUNNER_TEMP/test-baselines/$commit/$platform.json" ]]; then
            exit 0 # the test step already failed the run on its own status when there is no baseline
          fi
          python3 "$RUNNER_TEMP/compare-test-baseline.py" "${common[@]}" "$(realpath bazel-testlogs)" \
            2>&1 | tee "$evidence/baseline-comparison.log"

      - name: Verify upstream source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Retain test evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-native-bazel-tests-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/baseline-bazel-evidence
          retention-days: 3
          if-no-files-found: warn
