name: BuildBuddy Linux remote execution pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ccf9be8cc458bd6b8336fe84d68d8893f2691a5e
          path: upstream
          persist-credentials: false
      - name: Read the pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^channel = / {print $2}' upstream/codex-rs/rust-toolchain.toml)"
          test -n "$channel"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: x86_64-unknown-linux-gnu
      - name: Synchronize the release workspace lockfile
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --filter-platform x86_64-unknown-linux-gnu \
            --manifest-path codex-rs/Cargo.toml > "$RUNNER_TEMP/buildbuddy-cargo-metadata.json"
          git diff --check
          git diff --exit-code -- . ':(exclude)codex-rs/Cargo.lock'
      - name: Install the pinned Linux Bazel binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat upstream/.bazelversion)" = 9.2.0
          curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/bazel" \
            https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-linux-x86_64
          printf '%s  %s\n' 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694 "$RUNNER_TEMP/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bazel"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Resolve upstream's compatibility releases
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/resolve_exec_server_releases.py > "$RUNNER_TEMP/compat-releases.json"
      - name: Run the maintained Linux Clippy selection on BuildBuddy
        working-directory: upstream
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUILDBUDDY_API_KEY"
          test "$(git rev-parse HEAD)" = ccf9be8cc458bd6b8336fe84d68d8893f2691a5e
          cache_helper="$GITHUB_WORKSPACE/.github/scripts/buildbuddy-cache.sh"
          trap 'bash "$cache_helper" finish "$PWD"' EXIT
          bash "$cache_helper" configure "$PWD"
          env -u BUILDBUDDY_API_KEY scripts/list-bazel-clippy-targets.sh > "$RUNNER_TEMP/clippy-targets.txt"
          test -s "$RUNNER_TEMP/clippy-targets.txt"
          mapfile -t targets < "$RUNNER_TEMP/clippy-targets.txt"
          CODEX_COMPAT_RELEASES="$(cat "$RUNNER_TEMP/compat-releases.json")"
          export CODEX_COMPAT_RELEASES
          printf 'Selected %s upstream Clippy target patterns.\n' "${#targets[@]}"
          env -u BUILDBUDDY_API_KEY .github/scripts/run-bazel-ci.sh --print-failed-action-summary -- \
            build --config=clippy --config=ci-linux --config=remote \
            --remote_executor=grpcs://remote.buildbuddy.io --remote_local_fallback=false \
            --remote_download_minimal --jobs=24 --color=no --curses=no \
            -- "${targets[@]}" 2>&1 | tee "$RUNNER_TEMP/buildbuddy-pilot.log"
          grep -E 'processes:.*[1-9][0-9]* remote([,.]|$)' "$RUNNER_TEMP/buildbuddy-pilot.log"
