name: BuildBuddy Linux remote execution pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ccf9be8cc458bd6b8336fe84d68d8893f2691a5e
          path: upstream
          persist-credentials: false
      - name: Install the pinned Linux Bazel binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat upstream/.bazelversion)" = 9.2.0
          curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/bazel" \
            https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-linux-x86_64
          printf '%s  %s\n' 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694 "$RUNNER_TEMP/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bazel"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build an upstream Rust library using remote execution
        working-directory: upstream
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUILDBUDDY_API_KEY"
          test "$(git rev-parse HEAD)" = ccf9be8cc458bd6b8336fe84d68d8893f2691a5e
          cache_helper="$GITHUB_WORKSPACE/.github/scripts/buildbuddy-cache.sh"
          trap 'bash "$cache_helper" finish "$PWD"' EXIT
          bash "$cache_helper" configure "$PWD"
          env -u BUILDBUDDY_API_KEY bazel build --config=ci-linux --config=remote \
            --remote_executor=grpcs://remote.buildbuddy.io --remote_local_fallback=false \
            --noremote_accept_cached --noremote_upload_local_results --jobs=8 --color=no --curses=no \
            //codex-rs/agent-identity:agent-identity 2>&1 | tee "$RUNNER_TEMP/buildbuddy-pilot.log"
          rg 'processes:.*[1-9][0-9]* remote([,.]|$)' "$RUNNER_TEMP/buildbuddy-pilot.log"
