name: Stable upstream macOS lints

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
  workflow_call:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      upstream_commit:
        description: Optional upstream commit to test instead of .github/upstream-commit
        type: string
        default: ""

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        env:
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          cargo_home="$RUNNER_TEMP/baseline-cargo-home"
          cargo_target_dir="$RUNNER_TEMP/baseline-target"
          mkdir -p "$evidence" "$cargo_home" "$cargo_target_dir"
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\n' "$cargo_home" "$cargo_target_dir" >> "$GITHUB_ENV"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          if [[ -n "$UPSTREAM_COMMIT" ]]; then
            printf '%s\n' "$UPSTREAM_COMMIT" > "$evidence/upstream-commit"
          fi
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Preserve the compiled-cache tooling
        run: bash restart-metadata/.github/scripts/lint-compiled-cache.sh preserve restart-metadata .github/workflows/baseline-macos-lints.yml

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          # Upstream's CI tests main, whose workspace version is 0.0.0; a stable tag's release commit changes only that
          # version. Test the same source, so version strings in snapshots and fixtures match what upstream tested.
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' codex-rs/Cargo.toml
          if ! git diff --quiet -- codex-rs/Cargo.toml; then
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          for patch in "${patch_paths[@]}"; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up the upstream Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.target }}
          components: clippy

      # Upstream's setup scripts call curl without -q, so they read this configuration through CURL_HOME. curl retries
      # timeouts and HTTP 408, 429, 500, 502, 503 and 504 responses, such as the 504s that GitHub release downloads and
      # the kernel.org mirror return at times, with growing delays. curl on Windows also looks for _curlrc.
      - name: Retry transient download failures
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/curl-configuration"
          mkdir -p "$directory"
          printf '%s\n' 'retry = 8' 'retry-connrefused' 'retry-max-time = 900' > "$directory/.curlrc"
          cp "$directory/.curlrc" "$directory/_curlrc"
          printf 'CURL_HOME=%s\n' "$directory" >> "$GITHUB_ENV"

      - name: Verify and configure upstream V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Supply upstream's native voice development libraries
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Build the pinned native voice prerequisites
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/baseline-native"
          mkdir -p "$native/archives" "$native/tools"
          if ! command -v pkg-config; then
            brew install pkgconf
          fi
          curl --fail --location --retry 3 --retry-all-errors --output "$native/cmake.tar.gz" https://github.com/Kitware/CMake/releases/download/v3.31.8/cmake-3.31.8-macos-universal.tar.gz
          printf '%s  %s\n' d1449f969c54d5c00886d5b643340d493dfb3c81cb39ee29b35453395c11ebf7 "$native/cmake.tar.gz" | shasum -a 256 -c -
          tar -xzf "$native/cmake.tar.gz" -C "$native/tools" --strip-components=1
          jq -r '.sources[] | [.url, .archive, .sha256] | @tsv' third_party/voice/sources.json > "$native/sources.tsv"
          while IFS=$'\t' read -r url archive digest; do
            curl --fail --location --retry 3 --retry-all-errors --output "$native/archives/$archive" "$url"
            printf '%s  %s\n' "$digest" "$native/archives/$archive" | shasum -a 256 -c -
          done < "$native/sources.tsv"
          compiler="$(xcrun --find clang)"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'int main(void) { return 0; }\n' > "$native/compiler-probe.c"
          if env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin MACOSX_DEPLOYMENT_TARGET=14.0 \
            "$compiler" -fuse-ld=/usr/bin/ld "$native/compiler-probe.c" -o "$native/compiler-probe" \
            > "$RUNNER_TEMP/baseline-evidence/compiler-without-sdk.log" 2>&1; then
            echo 'The SDK-free probe succeeds on this host; explicit SDK verification follows.'
          else
            grep -F "library 'System' not found" "$RUNNER_TEMP/baseline-evidence/compiler-without-sdk.log"
          fi
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin MACOSX_DEPLOYMENT_TARGET=14.0 \
            "$compiler" -fuse-ld=/usr/bin/ld -isysroot "$sdk" "$native/compiler-probe.c" -o "$native/compiler-probe" \
            > "$RUNNER_TEMP/baseline-evidence/compiler-with-sdk.log" 2>&1
          "$native/compiler-probe"
          python third_party/voice/build_native.py \
            --archives "$native/archives" --output "$native/build" \
            --cc "$(xcrun --find clang)" --cxx "$(xcrun --find clang++)" \
            --cmake "$native/tools/CMake.app/Contents/bin/cmake" \
            --make /usr/bin/make --pkg-config "$(command -v pkg-config)" \
            --shell /bin/bash --target "$TARGET" --deployment-target 14.0 \
            --c-flag=-isysroot --c-flag="$sdk" \
            --cxx-flag=-isysroot --cxx-flag="$sdk" \
            --link-flag=-isysroot --link-flag="$sdk" \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/native-build.log"
          cp "$native/build/built.json" "$RUNNER_TEMP/baseline-evidence/native-built.json"
          printf '#!/bin/sh\nexec "%s" --define-prefix "$@"\n' "$(command -v pkg-config)" > "$native/pkg-config"
          chmod +x "$native/pkg-config"
          export PKG_CONFIG="$native/pkg-config"
          export PKG_CONFIG_LIBDIR="$native/build/prefix/lib/pkgconfig:$native/build/prefix/share/pkgconfig"
          unset PKG_CONFIG_PATH
          "$PKG_CONFIG" --modversion gstreamer-1.0 glib-2.0
          printf 'PKG_CONFIG=%s\nPKG_CONFIG_LIBDIR=%s\nPKG_CONFIG_PATH=\n' "$PKG_CONFIG" "$PKG_CONFIG_LIBDIR" >> "$GITHUB_ENV"

      - name: Select the cache helper's native JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Set up the GHCR cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Restore compiled dependencies from GHCR
        id: lint_cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf 'LINT_CACHE_NAME=%s-lint\nLINT_CACHE_TARGET_DIR=%s\n' "$TARGET" "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          bash "$RUNNER_TEMP/lint-cache/lint-compiled-cache.sh" restore "$RUNNER_TEMP/baseline-evidence" "$TARGET-lint" "$CARGO_TARGET_DIR" \
            'cargo clippy --keep-going --tests --profile dev -- -D warnings'

      - name: Check all default workspace test targets with fatal warnings
        working-directory: codex-rs
        run: |
          set -euo pipefail
          rustc -vV > "$RUNNER_TEMP/baseline-evidence/rust-toolchain.txt"
          cargo --version >> "$RUNNER_TEMP/baseline-evidence/rust-toolchain.txt"
          cargo clippy --keep-going --target "$TARGET" --tests --profile dev --timings -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/clippy.log"

      - name: Save compiled dependencies to GHCR
        if: always() && steps.lint_cache.conclusion == 'success'
        env:
          LINT_OUTCOME: ${{ job.status }}
        run: bash "$RUNNER_TEMP/lint-cache/lint-compiled-cache.sh" save "$RUNNER_TEMP/baseline-evidence" "$LINT_CACHE_NAME" "$LINT_CACHE_TARGET_DIR"

      - name: Verify the patched source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Retain lint evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-clippy-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/baseline-evidence
            ${{ runner.temp }}/baseline-target/**/cargo-timings
            ${{ runner.temp }}/baseline-native/build/*.log
            ${{ runner.temp }}/baseline-native/build/build-state.json
            ${{ runner.temp }}/baseline-native/build/**/config.log
          retention-days: 3
          if-no-files-found: warn
