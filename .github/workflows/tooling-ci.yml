name: tooling-ci

on:
  push:
    paths:
      - tooling/**
      - scripts/**
      - .github/actions/setup-tooling/**
      - .github/actions/setup-pnpm/**
      - .github/workflows/tooling-ci.yml
  pull_request:
    paths:
      - tooling/**
      - scripts/**
      - .github/actions/setup-tooling/**
      - .github/actions/setup-pnpm/**
      - .github/workflows/tooling-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        if: runner.os != 'Linux' || github.event_name == 'pull_request'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux' || github.event_name == 'pull_request'
      - uses: ./.github/actions/setup-tooling
        if: runner.os != 'Linux' || github.event_name == 'pull_request'
      - uses: ./.github/actions/run-buildbuddy
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        with:
          task: tooling
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
