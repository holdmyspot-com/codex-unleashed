name: tooling-ci

on:
  push:
    paths:
      - tooling/**
      - scripts/**
      - .github/actions/setup-tooling/**
      - .github/actions/setup-pnpm/**
      - .github/workflows/tooling-ci.yml
  pull_request:
    paths:
      - tooling/**
      - scripts/**
      - .github/actions/setup-tooling/**
      - .github/actions/setup-pnpm/**
      - .github/workflows/tooling-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Record native process availability before Maven
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
          Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 8 Name, Id, Handles, WorkingSet64
          git --version
          rustc -Vv
      - uses: ./.github/actions/setup-tooling
      - name: Record native process availability after Maven
        if: always()
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
          Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 8 Name, Id, Handles, WorkingSet64
          git --version
          rustc -Vv
