name: tooling-ci

on:
  push:
    paths:
      - tooling/cli/**
      - .github/actions/setup-tooling/**
      - .github/scripts/test-tooling-consumers.py
      - .github/workflows/tooling-ci.yml
  pull_request:
    paths:
      - tooling/cli/**
      - .github/actions/setup-tooling/**
      - .github/scripts/test-tooling-consumers.py
      - .github/workflows/tooling-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Build the tooling runtime
        uses: ./.github/actions/setup-tooling

      - name: Select the native Cargo fixture toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582

      - name: Prepare isolated temporary state
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tooling-temp"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' \
            "$RUNNER_TEMP/tooling-temp" "$RUNNER_TEMP/tooling-temp" "$RUNNER_TEMP/tooling-temp" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo 'GIT_REDIRECT_STDIN=NUL' >> "$GITHUB_ENV"
          fi

      - name: Verify tooling tests
        run: |
          tooling_root="$CODEX_TOOLING_ROOT"
          if [[ "$RUNNER_OS" == Windows ]]; then
            tooling_root="$(cygpath -u "$tooling_root")"
          fi
          export TMPDIR="$tooling_root/tmp" TMP="$tooling_root/tmp" TEMP="$tooling_root/tmp"
          test_context="$tooling_root/verification/test_context.json"
          context_working_directory="$GITHUB_WORKSPACE"
          context_temporary_directory="$tooling_root/tmp"
          if [[ "$RUNNER_OS" == Windows ]]; then
            context_working_directory="$(cygpath -w "$context_working_directory")"
            context_temporary_directory="$(cygpath -w "$context_temporary_directory")"
          fi
          mkdir -p "$tooling_root/verification/build"
          jq -n --arg working_directory "$context_working_directory" \
            --arg temporary_directory "$context_temporary_directory" \
            '{format_version: 1, working_directory: $working_directory,
              temporary_directory: $temporary_directory, environment: env}' > "$test_context"
          bash .github/scripts/maven-retry.sh "$tooling_root/maven" -q -f tooling/cli/pom.xml -Pruntime \
            "-Dtooling.build.directory=$tooling_root/verification/build" \
            "-Djava.io.tmpdir=$tooling_root/tmp" \
            "-Dquiet.build.test.context=$test_context" verify

      - name: Probe assembled tooling consumers
        run: python -I .github/scripts/test-tooling-consumers.py

      - name: Remove job-owned tooling state
        if: always()
        run: |
          tooling_root="$RUNNER_TEMP/codex-tooling"
          if [[ "$RUNNER_OS" == Windows ]]; then
            tooling_root="$(cygpath -u "$tooling_root")"
          fi
          rm -rf -- "$tooling_root"
