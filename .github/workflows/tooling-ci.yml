name: tooling-ci

on:
  push:
    paths:
      - tooling/**
      - scripts/**
      - .github/actions/setup-tooling/**
      - .github/actions/setup-pnpm/**
      - .github/workflows/tooling-ci.yml
  pull_request:
    paths:
      - tooling/**
      - scripts/**
      - .github/actions/setup-tooling/**
      - .github/actions/setup-pnpm/**
      - .github/workflows/tooling-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref != 'refs/heads/ci/windows-startup-probe'
    name: Maven verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-tooling

  native-startup-probe:
    if: github.ref == 'refs/heads/ci/windows-startup-probe'
    name: Native Windows launcher and ACL diagnostics
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Measure launcher lookup and inspect ambient ACLs
        shell: pwsh
        run: ./.github/diagnostics/windows-startup-probe.ps1
