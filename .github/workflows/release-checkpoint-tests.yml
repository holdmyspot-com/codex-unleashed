name: Release build checkpoint tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-checkpoint-tests.yml
      - .github/scripts/build-upstream-release.sh
      - .github/scripts/checkpoint-upstream-release.sh
      - tooling/cli/pom.xml
      - tooling/cli/src/main/**
      - tooling/cli/src/build/**
      - tooling/cli/src/test/**
      - .github/scripts/ghcr-cargo-target-cache.sh
      - .github/scripts/test-build-upstream-release.py
      - .github/scripts/fail-on-cargo-warnings.sh
      - .github/scripts/test-fail-on-cargo-warnings.py
      - .github/scripts/test-ghcr-cargo-target-cache.sh
      - .github/scripts/watch-quiet-build.py
      - .github/scripts/test-watch-quiet-build.py
      - .github/scripts/release-debug-session.sh
      - .github/scripts/test-release-debug-session.py
      - .github/workflows/baseline-release-builds.yml
      - .github/release-matrix.json
  workflow_dispatch:
    inputs:
      target:
        description: Release target to verify, or all for the native matrix
        type: string
        default: all

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: matrix
        env:
          SELECTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          value="$(jq -ce --arg target "$SELECTED_TARGET" '
            (if $target == "all" then . else map(select(.target == $target)) end)
            | if length == 0 then error("Unknown release target") else {include: .} end
          ' .github/release-matrix.json)"
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

  verify:
    needs: select
    name: Checkpoints - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_CACHE_PARTS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1
          url: ${{ runner.os == 'Windows' && 'https://github.com/oras-project/oras/releases/download/v1.3.1/oras_1.3.1_windows_amd64.zip' || '' }}
          checksum: ${{ runner.os == 'Windows' && '8cf69e46f966e592ad36261c05b8f59c02125743b7261c03f6badc3919b40cb0' || '' }}
      - name: Set up the helper build JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1
      - name: Build and verify the bundled cache helper
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint-tests/temp" "$RUNNER_TEMP/checkpoint-evidence"
          export TMPDIR="$RUNNER_TEMP/checkpoint-tests/temp"
          mvn -B -ntp -e -f tooling/cli/pom.xml -Pruntime \
            "-Dtooling.build.directory=$RUNNER_TEMP/checkpoint-tests/build" \
            "-Dmaven.repo.local=$RUNNER_TEMP/checkpoint-tests/maven" \
            "-Djava.io.tmpdir=$TMPDIR" verify \
            2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/helper-build.log"
          printf 'CODEX_SOURCE_CACHE_TOOL=%s\n' "$RUNNER_TEMP/checkpoint-tests/build/runtime/bin/codex-tooling" >> "$GITHUB_ENV"
      - name: Verify archive parts and incremental release stages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint-tests" "$RUNNER_TEMP/checkpoint-evidence"
          export TMPDIR="$RUNNER_TEMP/checkpoint-tests"
          if [[ "$RUNNER_OS" == Windows ]]; then
            export GIT_REDIRECT_STDIN=NUL
          fi
          CODEX_TEST_ORAS="$(command -v oras)" bash .github/scripts/test-ghcr-cargo-target-cache.sh \
            2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/transport.log"
          python3 .github/scripts/test-build-upstream-release.py \
            2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/stages.log"
          python3 .github/scripts/test-fail-on-cargo-warnings.py \
            2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/warning-gate.log"
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 .github/scripts/test-watch-quiet-build.py \
              2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/quiet-build-watch.log"
            python3 .github/scripts/test-release-debug-session.py \
              2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/debug-session.log"
          fi
      - name: Preserve checkpoint verification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: checkpoint-tests-${{ matrix.target }}
          # Per-test surefire reports give each test's time and captured output, which the Maven log does not.
          path: |
            ${{ runner.temp }}/checkpoint-evidence
            ${{ runner.temp }}/checkpoint-tests/build/surefire-reports/TEST-com.holdmyspot.codexunleashed.tooling.*.xml
            ${{ runner.temp }}/checkpoint-tests/build/surefire-reports/TEST-com.holdmyspot.codexunleashed.distribution.*.xml
          retention-days: 1
          if-no-files-found: warn
      - name: Remove owned test scratch directory
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/checkpoint-tests"
