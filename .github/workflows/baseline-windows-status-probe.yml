name: Stable upstream Windows workspace status probe

on:
  push:
    branches: [main.new]
    paths:
      - .github/workflows/baseline-windows-status-probe.yml
      - .github/scripts/probe-baseline-windows-status.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve probe and source identity
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-windows-status-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/scripts/probe-baseline-windows-status.py "$RUNNER_TEMP/probe-baseline-windows-status.py"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Prepare upstream's Bazel host and toolchain
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm

      - name: Compare direct and Bazel workspace status
        run: |
          set -euo pipefail
          export BASELINE_STATUS_EVIDENCE="$RUNNER_TEMP/baseline-windows-status-evidence"
          BASELINE_BASH="$(cygpath -w "$(command -v bash.exe)")"
          export BASELINE_BASH
          python "$RUNNER_TEMP/probe-baseline-windows-status.py"

      - name: Retain status evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-windows-workspace-status
          path: ${{ runner.temp }}/baseline-windows-status-evidence
          retention-days: 1
          if-no-files-found: error
