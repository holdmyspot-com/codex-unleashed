name: Rehearse dry-run release installs
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Finished package dry run to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    uses: ./.github/workflows/verify-dry-run-install.yml
    with:
      run_id: ${{ inputs.run_id }}
