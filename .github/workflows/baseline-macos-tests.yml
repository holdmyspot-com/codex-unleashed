name: Stable upstream macOS tests

# Runs upstream's Cargo nextest suite on native macOS (aarch64 and x86_64) against the pinned upstream with downstream
# patches applied, the way upstream's macOS nextest job does. One job per architecture: hosted macOS runner capacity is
# capped, so the suite is not sharded. A red phase can first restore production files to their state before the patches
# under test and require the same selection to fail, so the patched pass proves the patches fix it.

on:
  workflow_dispatch:
    inputs:
      archive_run_id:
        description: Optional earlier run whose test archives to reuse instead of building them; its patches and upstream commit must match
        type: string
        default: ""
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order; empty tests pristine upstream
        type: string
        default: ""
      package:
        description: Space-separated Cargo packages to test with nextest, or --workspace (the default when empty) for every package
        type: string
        default: ""
      filter:
        description: Optional nextest expression
        type: string
        default: ""
      red_restore:
        description: Space-separated upstream paths to withhold for a red phase that must fail before the patched run
        type: string
        default: ""
      red_patch_count:
        description: Number of trailing patches under test; the red phase restores red_restore paths to their state before them
        type: string
        default: "1"
  workflow_call:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      upstream_commit:
        description: Optional upstream commit to test instead of .github/upstream-commit
        type: string
        default: ""
      package:
        description: Space-separated Cargo packages to test with nextest, or --workspace (the default when empty) for every package
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: nextest - ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
      CARGO_CACHE_PARTS: '1'
      TEST_PACKAGE: ${{ inputs.package }}
      TEST_FILTER: ${{ inputs.filter }}
      RED_RESTORE: ${{ inputs.red_restore }}
      RED_PATCH_COUNT: ${{ inputs.red_patch_count }}
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_MIN_STACK: '8388608'
      NEXTEST_STATUS_LEVEL: leak
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Validate the selection and preserve restart inputs outside the source checkout
        id: inputs
        env:
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          if ! [[ "${RED_PATCH_COUNT:-1}" =~ ^[1-9][0-9]*$ ]]; then
            printf 'red_patch_count must be a positive integer, not %s.\n' "$RED_PATCH_COUNT" >&2
            exit 1
          fi
          if [[ "$TEST_PACKAGE" == *--workspace* && "$TEST_PACKAGE" != --workspace ]]; then
            printf 'Use --workspace alone, not with other packages.\n' >&2
            exit 1
          fi
          evidence="$RUNNER_TEMP/baseline-macos-nextest-evidence"
          mkdir -p "$evidence"
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          cp restart-metadata/.github/scripts/check-test-skips.py "$RUNNER_TEMP/check-test-skips.py"
          cp restart-metadata/.github/scripts/compare-test-baseline.py "$RUNNER_TEMP/compare-test-baseline.py"
          if [[ -d restart-metadata/docs/test-baselines ]]; then
            cp -R restart-metadata/docs/test-baselines "$RUNNER_TEMP/test-baselines"
          fi
          cp restart-metadata/.github/scripts/reclaim-baseline-macos-xcodes.py "$RUNNER_TEMP/reclaim-baseline-macos-xcodes.py"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          commit="${UPSTREAM_COMMIT:-$(cat restart-metadata/.github/upstream-commit)}"
          printf '%s\n' "$commit" > "$evidence/upstream-commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      # The upstream checkout cleaned the workspace; check the restart repository out again beside it for its local
      # actions, scripts and helper sources, and keep it out of the source's untracked files.
      - name: Retrieve restart inputs beside the upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          printf '/restart-metadata/\n' >> .git/info/exclude
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/baseline-macos-nextest-evidence/upstream-commit")"
          test -z "$(git status --porcelain)"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-macos-nextest-evidence"
          : > "$evidence/applied-patches.txt"
          patch_paths=()
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          if [[ -n "$RED_RESTORE" ]] && (( ${#patch_paths[@]} < ${RED_PATCH_COUNT:-1} )); then
            printf 'red_patch_count %s exceeds the %s applied patches.\n' "${RED_PATCH_COUNT:-1}" "${#patch_paths[@]}" >&2
            exit 1
          fi
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          for patch in ${patch_paths[@]+"${patch_paths[@]}"}; do
            printf '%s  %s\n' "$(shasum -a 256 < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare upstream's native test host
        uses: ./.github/actions/setup-ci

      - name: Own the cache evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-focused-runtime/evidence"
          printf 'FOCUSED_RUNTIME=%s\n' "$RUNNER_TEMP/codex-focused-runtime" >> "$GITHUB_ENV"

      - name: Prepare verified V8 and bundled freshness tooling
        uses: ./restart-metadata/.github/actions/focused-runtime-cache-setup
        with:
          tooling-root: ${{ github.workspace }}/restart-metadata

      # voice-host links GStreamer through pkg-config, which the hosted macOS image does not provide.
      - name: Install the GStreamer development libraries that voice-host links
        run: |
          set -euo pipefail
          brew install pkgconf gstreamer gst-plugins-base
          pkg-config --modversion gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0
          printf 'PKG_CONFIG_PATH=%s\n' "$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig" >> "$GITHUB_ENV"

      # macOS ships no setsid binary; codex-utils-pty's pipe_terminate_aborts_detached_readers skips itself without
      # one. This stand-in detaches the command into its own session like `setsid -f`, so the test runs.
      - name: Provide a setsid command for the detached-reader test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/setsid-bin"
          cat > "$RUNNER_TEMP/setsid-bin/setsid" <<'SHIM'
          #!/usr/bin/env python3
          import os
          import sys

          if len(sys.argv) < 2:
              sys.exit(1)
          if os.fork() != 0:
              sys.exit(0)
          os.setsid()
          os.execvp(sys.argv[1], sys.argv[1:])
          SHIM
          chmod +x "$RUNNER_TEMP/setsid-bin/setsid"
          printf '%s\n' "$RUNNER_TEMP/setsid-bin" >> "$GITHUB_PATH"

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up matching Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install upstream's nextest version
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103

      # The full-workspace test build fills the hosted runner's disk (ld: write() failed, errno=28), where upstream's
      # larger macos-15-xlarge runner does not, so free the inactive Xcode versions and, as upstream does, drop debug information.
      - name: Reclaim inactive Xcode versions
        run: |
          python3 "$RUNNER_TEMP/reclaim-baseline-macos-xcodes.py" \
            --evidence-directory "$RUNNER_TEMP/baseline-macos-nextest-evidence"
          printf 'CARGO_PROFILE_CI_TEST_DEBUG=0\n' >> "$GITHUB_ENV"

      - name: Record the native host and capacity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          {
            uname -a
            sw_vers
            sysctl -n hw.memsize hw.logicalcpu
            df -k "$CI_BUILD_ROOT" "$RUNNER_TEMP"
          } | tee "$RUNNER_TEMP/baseline-macos-nextest-evidence/host.txt"

      - name: Set up the compiled-state cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Authenticate private GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
          printf 'CARGO_CACHE_REPOSITORY=ghcr.io/%s/%s\n' "$owner" "$(cat restart-metadata/.github/cargo-cache-package)" >> "$GITHUB_ENV"

      - name: Restore compiled dependencies and test outputs
        id: cache
        uses: ./restart-metadata/.github/actions/test-compiled-cache-restore
        with:
          restart-root: ${{ github.workspace }}/restart-metadata
          patches: ${{ inputs.patches }}
          workflow: .github/workflows/baseline-macos-tests.yml
          command-line: cargo nextest archive --target ${{ matrix.target }} --cargo-profile ci-test ${{ inputs.package }}

      - name: Download the earlier test archive
        if: inputs.archive_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nextest-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/nextest-archive
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ github.token }}

      - name: Write the selected test command
        run: |
          set -euo pipefail
          # Keep passing tests' output in the JUnit report, where the skip check reads it.
          printf '%s\n' '[profile.default.junit]' 'store-success-output = true' 'store-failure-output = true' \
            > "$RUNNER_TEMP/nextest-keep-output.toml"
          build_args=(cargo nextest archive --target "$TARGET" --cargo-profile ci-test)
          run_args=(cargo nextest run --archive-file ARCHIVE --workspace-remap "$GITHUB_WORKSPACE/codex-rs" --no-fail-fast
            --tool-config-file "keep-output:$RUNNER_TEMP/nextest-keep-output.toml")
          if [[ -z "$TEST_PACKAGE" || "$TEST_PACKAGE" == --workspace ]]; then
            build_args+=(--workspace)
          else
            read -r -a packages <<< "$TEST_PACKAGE"
            for package in "${packages[@]}"; do build_args+=(-p "$package"); done
          fi
          if [[ -n "$TEST_FILTER" ]]; then run_args+=(-E "$TEST_FILTER"); fi
          {
            printf '#!/usr/bin/env bash\nset -euo pipefail\n'
            printf 'cd "%s/codex-rs"\narchive=${1:?archive path}\n' "$GITHUB_WORKSPACE"
            # Build the tests once into an archive; a rerun that supplies the archive skips the build.
            printf 'if [[ ! -f "$archive" ]]; then\n  mkdir -p "$(dirname "$archive")"\n  '
            printf '%q ' "${build_args[@]}"
            printf -- '--archive-file "$archive"\n'
            # The archive carries every test executable, and extracting it for the run needs that space again. Free
            # the executables the build left in the target directory (library outputs stay for the compiled-state
            # cache); the aarch64 runner otherwise ran out of disk extracting the archive.
            printf '  find %q/%s/ci-test -maxdepth 2 -type f -perm -u+x ! -name "*.*" -delete\n' \
              "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/codex-rs/target}" "$TARGET"
            printf 'fi\n'
            printf '%q ' "${run_args[@]}" | sed 's/ARCHIVE/"$archive"/'
            printf '\n'
          } > "$RUNNER_TEMP/selected-test.sh"
          cat "$RUNNER_TEMP/selected-test.sh"

      - name: Require the selection to fail without the production changes
        if: inputs.red_restore != ''
        run: |
          set -euo pipefail
          read -r -a red_paths <<< "$RED_RESTORE"
          git checkout "HEAD~$RED_PATCH_COUNT" -- "${red_paths[@]}"
          set +e
          # The red phase compiles different sources, so it builds its own archive.
          bash "$RUNNER_TEMP/selected-test.sh" "$RUNNER_TEMP/red-archive/tests.tar.zst"
          result=$?
          set -e
          git checkout HEAD -- "${red_paths[@]}"
          rm -rf "$RUNNER_TEMP/red-archive"
          if (( result == 0 )); then
            printf 'The selection passed with the production changes withheld, so it does not prove the patches.\n' >&2
            exit 1
          fi
          printf 'The selection failed with exit %s without the production changes.\n' "$result"

      - name: Run the selection
        id: tests
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'
          set +e
          bash "$RUNNER_TEMP/selected-test.sh" "$RUNNER_TEMP/nextest-archive/tests.tar.zst" 2>&1 | tee "$RUNNER_TEMP/baseline-macos-nextest-evidence/nextest.log"
          status=${PIPESTATUS[0]}
          set -e
          # Nextest exits 100 when tests failed. A whole-workspace run is judged by the comparison with the unpatched
          # baseline below (an unpatched run records that baseline), so those failures alone do not fail this step.
          # Any other failure, such as a full disk or a build error, does.
          if [[ "$status" == 100 && ( -z "$TEST_PACKAGE" || "$TEST_PACKAGE" == --workspace ) && -z "$TEST_FILTER" ]]; then
            printf 'Nextest reported failing tests; the baseline comparison decides the outcome.\n'
            exit 0
          fi
          exit "$status"

      - name: Keep the test archive for reruns
        if: ${{ !cancelled() && inputs.archive_run_id == '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: nextest-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/nextest-archive
          retention-days: 3
          if-no-files-found: ignore

      - name: Save compiled dependencies and test outputs
        if: ${{ always() && inputs.archive_run_id == '' && steps.cache.outcome == 'success' }}
        uses: ./restart-metadata/.github/actions/test-compiled-cache-save
        with:
          restart-root: ${{ github.workspace }}/restart-metadata
          tag: ${{ steps.cache.outputs.tag }}
          seed-tag: ${{ steps.cache.outputs.seed-tag }}
          build-succeeded: ${{ hashFiles(format('{0}/nextest-archive/tests.tar.zst', runner.temp)) != '' }}

      - name: Fail on tests that skipped themselves for missing setup
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          reports=()
          # An archive run stores its reports under the extraction directory, wherever nextest placed it.
          while IFS= read -r report; do reports+=("$report"); done < <(
            find "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/codex-rs/target}" "$GITHUB_WORKSPACE/codex-rs/target" "$RUNNER_TEMP" \
              -path '*/nextest/*' -name junit.xml 2>/dev/null | sort -u)
          if (( ${#reports[@]} == 0 )); then printf 'No nextest reports to check.\n'; exit 0; fi
          python3 "$RUNNER_TEMP/check-test-skips.py" --platform macos "${reports[@]}" \
            2>&1 | tee "$RUNNER_TEMP/baseline-macos-nextest-evidence/skip-check.log"

      - name: Compare the failures with the committed unpatched baseline
        if: ${{ !cancelled() && (inputs.package == '' || inputs.package == '--workspace') && inputs.filter == '' }}
        env:
          UPSTREAM_COMMIT: ${{ steps.inputs.outputs.commit }}
          PATCHES: ${{ inputs.patches }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          platform="macos-${TARGET%%-*}"
          reports=()
          # An archive run stores its reports under the extraction directory, wherever nextest placed it.
          while IFS= read -r report; do reports+=("$report"); done < <(
            find "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/codex-rs/target}" "$GITHUB_WORKSPACE/codex-rs/target" "$RUNNER_TEMP" \
              -path '*/nextest/*' -name junit.xml 2>/dev/null | sort -u)
          if (( ${#reports[@]} == 0 )); then
            # A run that failed before nextest wrote a report leaves nothing to compare; a passing test step with no
            # report would be a vacuous check.
            if [[ "$TESTS_OUTCOME" == success ]]; then printf '::error::The tests passed but wrote no nextest report.\n'; exit 1; fi
            printf 'The test step ended %s before any report was written; nothing to compare.\n' "$TESTS_OUTCOME"
            exit 0
          fi
          if [[ -z "${PATCHES// }" ]]; then
            # An unpatched run is the source of a baseline; the evidence artifact carries it for committing under
            # docs/test-baselines.
            python3 "$RUNNER_TEMP/compare-test-baseline.py" --platform "$platform" --upstream-commit "$UPSTREAM_COMMIT" \
              --write-baseline --output "$RUNNER_TEMP/baseline-macos-nextest-evidence/$platform.json" "${reports[@]}"
          else
            python3 "$RUNNER_TEMP/compare-test-baseline.py" --platform "$platform" --upstream-commit "$UPSTREAM_COMMIT" \
              --baseline-dir "$RUNNER_TEMP/test-baselines" "${reports[@]}" \
              2>&1 | tee "$RUNNER_TEMP/baseline-macos-nextest-evidence/baseline-comparison.log"
            exit "${PIPESTATUS[0]}"
          fi

      - name: Retain test evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-macos-nextest-${{ matrix.target }}
          path: ${{ runner.temp }}/baseline-macos-nextest-evidence
          retention-days: 3
          if-no-files-found: warn
