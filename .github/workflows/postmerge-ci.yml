name: postmerge-ci

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  full-ci:
    name: Full scheduled checks
    uses: ./.github/workflows/rust-ci-full.yml
    secrets: inherit

  results:
    name: Postmerge CI results
    needs: full-ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java tooling
        uses: ./.github/actions/setup-tooling

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: '"$CODEX_UNLEASHED_TOOLING" check-ci-results "$NEEDS"'
