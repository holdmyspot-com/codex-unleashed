name: Stable upstream platform lints

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      generators:
        description: "Instead of linting, run these upstream generators in order and return their changes as a patch: app-server-schema config-schema hooks-schema bazel-lock"
        type: string
        default: ""
  workflow_call:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      upstream_commit:
        description: Optional upstream commit to test instead of .github/upstream-commit
        type: string
        default: ""

permissions:
  contents: read

jobs:
  clippy:
    name: ${{ matrix.check }} - ${{ matrix.target }}
    if: inputs.generators == ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            check: clippy
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            check: clippy
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            check: rustdoc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            check: dependency-lints
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        env:
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          cargo_home="$RUNNER_TEMP/baseline-cargo-home"
          cargo_target_dir="$RUNNER_TEMP/baseline-target"
          mkdir -p "$evidence" "$cargo_home" "$cargo_target_dir"
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\n' "$cargo_home" "$cargo_target_dir" >> "$GITHUB_ENV"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          if [[ -n "$UPSTREAM_COMMIT" ]]; then
            printf '%s\n' "$UPSTREAM_COMMIT" > "$evidence/upstream-commit"
          fi
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          cp restart-metadata/.github/scripts/direct-dependency-lints.py "$RUNNER_TEMP/direct-dependency-lints.py"
          cp restart-metadata/.github/scripts/fail-on-cargo-warnings.sh "$RUNNER_TEMP/fail-on-cargo-warnings.sh"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Preserve the compiled-cache tooling
        run: bash restart-metadata/.github/scripts/lint-compiled-cache.sh preserve restart-metadata .github/workflows/baseline-platform-lints.yml .github/scripts/direct-dependency-lints.py .github/scripts/fail-on-cargo-warnings.sh

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          for patch in "${patch_paths[@]}"; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install upstream Linux Clippy prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential binutils pkg-config libcap-dev libasound2-dev

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up the upstream Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install upstream's Zig prerequisite
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: false

      # Upstream's setup scripts call curl without -q, so they read this configuration through CURL_HOME. curl retries
      # timeouts and HTTP 408, 429, 500, 502, 503 and 504 responses, such as the 504s that GitHub release downloads and
      # the kernel.org mirror return at times, with growing delays. curl on Windows also looks for _curlrc.
      - name: Retry transient download failures
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/curl-configuration"
          mkdir -p "$directory"
          printf '%s\n' 'retry = 8' 'retry-connrefused' 'retry-max-time = 900' > "$directory/.curlrc"
          cp "$directory/.curlrc" "$directory/_curlrc"
          printf 'CURL_HOME=%s\n' "$directory" >> "$GITHUB_ENV"

      - name: Install upstream's musl build inputs
        run: bash .github/scripts/install-musl-build-tools.sh

      - name: Verify and configure upstream V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Record the Rust toolchain
        run: |
          set -euo pipefail
          rustc -vV > "$RUNNER_TEMP/baseline-evidence/rust-toolchain.txt"
          cargo --version >> "$RUNNER_TEMP/baseline-evidence/rust-toolchain.txt"

      - name: Select the cache helper's native JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: 27.0.1

      - name: Set up the GHCR cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      # Only the clippy leg is cached. The dependency-lints leg exists to surface warnings from dependencies, which
      # Cargo does not replay for fresh units, and the rustdoc leg documents only workspace crates (--no-deps), so
      # cached dependency outputs saved it no time.
      - name: Restore compiled dependencies from GHCR
        id: lint_cache
        if: matrix.check == 'clippy'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf 'LINT_CACHE_NAME=%s-lint\nLINT_CACHE_TARGET_DIR=%s\n' "$TARGET" "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          bash "$RUNNER_TEMP/lint-cache/lint-compiled-cache.sh" restore "$RUNNER_TEMP/baseline-evidence" "$TARGET-lint" \
            "$CARGO_TARGET_DIR" 'cargo clippy --keep-going --tests --profile dev -- -D warnings'

      - name: Check all default workspace test targets with fatal warnings
        if: matrix.check == 'clippy'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --keep-going --target "$TARGET" --tests --profile dev --timings -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/clippy.log"

      - name: Document every workspace crate with fatal rustdoc warnings
        if: matrix.check == 'rustdoc'
        working-directory: codex-rs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cargo doc --keep-going --target "$TARGET" --workspace --no-deps --profile dev --timings \
            2>&1 | tee "$RUNNER_TEMP/baseline-evidence/rustdoc.log"

      - name: Check direct dependencies with their own lint levels
        # Cargo caps every non-workspace package's lints. This leg lifts the cap for direct dependencies only, in its own
        # target directory; the release build keeps Cargo's cap. A dependency that fails to compile at its own lint
        # levels fails the leg. Its warnings and its build scripts' cargo:warning lines are third-party code, so the leg
        # reports them in the job summary and its evidence without failing (owner decision 2026-11-09).
        if: matrix.check == 'dependency-lints'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-evidence"
          cargo metadata --format-version 1 --locked --filter-platform "$TARGET" \
            | python3 -I "$RUNNER_TEMP/direct-dependency-lints.py" list > "$evidence/direct-dependencies.txt"
          wc -l < "$evidence/direct-dependencies.txt"
          export CODEX_DIRECT_DEPENDENCIES="$evidence/direct-dependencies.txt"
          export RUSTC_WRAPPER="$RUNNER_TEMP/direct-dependency-lints.py"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/dependency-lints-target"
          chmod +x "$RUSTC_WRAPPER"
          cargo check --keep-going --target "$TARGET" --tests --profile dev --timings \
            2>&1 | tee "$evidence/dependency-lints.log"
          bash "$RUNNER_TEMP/fail-on-cargo-warnings.sh" "$evidence/dependency-lints.log" \
            > "$evidence/dependency-warnings.txt" 2>&1 || (( $? == 1 ))
          python3 -I "$RUNNER_TEMP/direct-dependency-lints.py" build-warnings "$CODEX_DIRECT_DEPENDENCIES" "$CARGO_TARGET_DIR" \
            > "$evidence/dependency-build-script-warnings.txt" || (( $? == 1 ))
          # Exit status 1 from either check only means that it found warnings.
          {
            printf '### Direct dependency warnings (reported, not fatal)\n\n'
            grep -E '^warning: `[^`]+` \(' "$evidence/dependency-lints.log" | grep -v duplicate \
              | sed -E 's/^warning: `([^`]+)` \(([^)]+)\) generated ([0-9]+) warnings?.*/- `\1` (\2): \3/' || true
            printf '\nBuild-script warnings:\n\n```\n'
            cat "$evidence/dependency-build-script-warnings.txt"
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save compiled dependencies to GHCR
        if: always() && steps.lint_cache.conclusion == 'success'
        env:
          LINT_OUTCOME: ${{ job.status }}
        run: bash "$RUNNER_TEMP/lint-cache/lint-compiled-cache.sh" save "$RUNNER_TEMP/baseline-evidence" "$LINT_CACHE_NAME" "$LINT_CACHE_TARGET_DIR"

      - name: Verify the patched source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Retain lint evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-${{ matrix.check }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/baseline-evidence
            ${{ runner.temp }}/baseline-target/**/cargo-timings
          retention-days: 3
          if-no-files-found: warn

  regenerate:
    # Generated files that need cargo or Bazel are completed here, since native builds run only remotely.
    name: Regenerate
    if: inputs.generators != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        env:
          GENERATORS: ${{ inputs.generators }}
        run: |
          set -euo pipefail
          read -r -a generators <<< "$GENERATORS"
          for generator in "${generators[@]}"; do
            case "$generator" in
              app-server-schema | config-schema | hooks-schema | bazel-lock) ;;
              *)
                printf 'Unknown generator: %s\n' "$generator" >&2
                exit 2
                ;;
            esac
          done
          evidence="$RUNNER_TEMP/regenerate-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/regenerate-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          for patch in "${patch_paths[@]}"; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install upstream Linux build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential binutils pkg-config libcap-dev libasound2-dev

      - name: Read upstream's pinned Rust toolchain
        id: upstream-rust-2
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up the upstream Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust-2.outputs.channel }}

      - name: Set up uv for the Python SDK generator
        if: contains(inputs.generators, 'app-server-schema')
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install the pinned upstream Bazel version
        if: contains(inputs.generators, 'bazel-lock')
        run: |
          set -euo pipefail
          test "$(cat .bazelversion)" = 9.2.0
          tools="$RUNNER_TEMP/regenerate-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 --retry-all-errors --output "$tools/bazel" https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-linux-x86_64
          printf '%s  %s\n' 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694 "$tools/bazel" | sha256sum -c -
          chmod +x "$tools/bazel"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Run the selected generators
        env:
          GENERATORS: ${{ inputs.generators }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/regenerate-evidence"
          read -r -a generators <<< "$GENERATORS"
          for generator in "${generators[@]}"; do
            printf '::group::%s\n' "$generator"
            case "$generator" in
              # The experimental precomputed exports are a separate bundle that only --experimental rewrites.
              app-server-schema) (cd codex-rs && python3 app-server-protocol/scripts/write_schema_fixtures.py && python3 app-server-protocol/scripts/write_schema_fixtures.py --experimental) ;;
              config-schema) (cd codex-rs && cargo run -p codex-config-schema --bin codex-write-config-schema) ;;
              hooks-schema) cargo run --manifest-path codex-rs/Cargo.toml -p codex-hooks --bin write_hooks_schema_fixtures ;;
              bazel-lock) bazel mod deps --lockfile_mode=update ;;
            esac 2>&1 | tee "$evidence/$generator.log"
            printf '::endgroup::\n'
          done

      - name: Record the generated changes as a patch
        # A failing generator usually fails after writing its outputs; recording them shows what it produced.
        if: always() && steps.patched.outcome == 'success'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/regenerate-evidence"
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          git add -A
          git diff --cached --binary > "$evidence/regenerated.diff"
          git diff --cached --stat | tee "$evidence/regenerated.stat"

      - name: Retain the generated changes for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regenerated
          path: ${{ runner.temp }}/regenerate-evidence
          retention-days: 3
          if-no-files-found: warn
