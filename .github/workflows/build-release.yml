name: Incremental release probe
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
jobs:
  unix:
    name: ${{ matrix.target }} incremental=${{ matrix.incremental }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-latest
          target: x86_64-unknown-linux-musl
          incremental: '0'
          binaries: codex codex-code-mode-host codex-responses-api-proxy bwrap
          helper_binaries: codex-windows-sandbox-setup codex-command-runner
          bundle: primary
        - runner: ubuntu-latest
          target: x86_64-unknown-linux-musl
          incremental: '1'
          binaries: codex codex-code-mode-host codex-responses-api-proxy bwrap
          helper_binaries: codex-windows-sandbox-setup codex-command-runner
          bundle: primary
        - runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-musl
          incremental: '0'
          binaries: codex codex-code-mode-host codex-responses-api-proxy bwrap
          helper_binaries: codex-windows-sandbox-setup codex-command-runner
          bundle: primary
        - runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-musl
          incremental: '1'
          binaries: codex codex-code-mode-host codex-responses-api-proxy bwrap
          helper_binaries: codex-windows-sandbox-setup codex-command-runner
          bundle: primary
    env:
      CODEX_UNLEASHED_BUILD_NUMBER: '39'
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: 'off'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: ${{ matrix.incremental }}
      REPRODUCIBILITY_MODE: 'off'
      ALLOW_STALE_CODE_MODE_FEATURE_EXCEPTION: '1'
      SOURCE_DATE_EPOCH: '1790874817'
      UPSTREAM_TARGET: ${{ matrix.target }}
      UPSTREAM_BINARIES: ${{ matrix.binaries }}
      PATCHES_ALREADY_APPLIED: '1'
      SKIP_UPSTREAM_TESTS: '1'
      SKIP_ARTIFACT_COLLECTION: '1'
    steps:
    - name: Record job start
      id: timing_start
      shell: bash
      run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Checkout patch repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - uses: ./.github/actions/setup-ci
      with:
        cargo-target-dir: ${{ runner.os == 'Linux' && '/home/runner/work/codex/codex/codex-rs/target' || '' }}
    - name: Setup pnpm
      uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
      with:
        version: 10
        run_install: false
    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: 22
    - name: Determine pnpm store path
      id: pnpm_store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Print runner specs (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: 'set -euo pipefail

        cpu_model="$(lscpu | awk -F: ''/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}'')"

        total_ram="$(awk ''/MemTotal/ {printf "%.1f GiB\n", $2 / 1024 / 1024}'' /proc/meminfo)"

        echo "Runner: ${RUNNER_NAME:-unknown}"

        echo "OS: $(uname -a)"

        echo "CPU model: ${cpu_model}"

        echo "Logical CPUs: $(nproc)"

        echo "Total RAM: ${total_ram}"

        echo "Disk usage:"

        df -h .

        '
    - name: Set up Zig
      if: ${{ contains(matrix.target, 'linux-musl') }}
      uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c
      with:
        version: 0.14.0
        use-cache: false
    - name: Prepare Linux APT cache directories
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /var/cache/apt/archives /var/lib/apt/lists

        sudo chown -R "$USER:$USER" /var/cache/apt /var/lib/apt/lists

        '
    - name: Restore APT cache
      if: ${{ runner.os == 'Linux' }}
      id: apt_cache
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: /var/cache/apt
        key: apt-${{ runner.os }}-${{ matrix.target }}-v1
    - name: Install Linux build dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update -y

        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

        '
    - uses: ./.github/actions/prepare-patched-upstream
      with:
        upstream-ref: rust-v0.160.0
        expected-upstream-commit: a956835d020762cb2b570053af06f643a11c0ecc
        apply-patches: true
    - name: Normalize patched source timestamps
      shell: bash
      env:
        SOURCE_DATE_EPOCH: '1790874817'
      run: 'set -euo pipefail

        python3 .github/scripts/normalize-source-timestamps.py upstream "$SOURCE_DATE_EPOCH"

        '
    - name: Align upstream checkout with release path
      shell: bash
      run: "set -euo pipefail\n# Cargo embeds build-script output paths in release binaries. The\n# upstream release\
        \ is built from this canonical GitHub runner path;\n# use the same physical path instead of compensating\
        \ with RUSTFLAGS,\n# which changes Cargo fingerprints.\nrelease_checkout=\"${GITHUB_WORKSPACE%/*/*}/codex/codex\"\
        \nif [[ \"${release_checkout}\" != \"${GITHUB_WORKSPACE}/upstream\" ]]; then\n  # setup-ci and the GHCR\
        \ restore may already have populated this\n  # target directory. Preserve it while replacing the checkout;\n\
        \  # removing release_checkout wholesale would otherwise discard the\n  # restored Cargo fingerprints before\
        \ Cargo can use them.\n  preserved_target=\"${RUNNER_TEMP}/codex-release-target\"\n  if [[ -d \"${release_checkout}/codex-rs/target\"\
        \ ]]; then\n    rm -rf \"${preserved_target}\"\n    mv \"${release_checkout}/codex-rs/target\" \"${preserved_target}\"\
        \n  fi\n  rm -rf \"${release_checkout}\"\n  mkdir -p \"$(dirname \"${release_checkout}\")\"\n  mv \"${GITHUB_WORKSPACE}/upstream\"\
        \ \"${release_checkout}\"\n  ln -s \"${release_checkout}\" \"${GITHUB_WORKSPACE}/upstream\"\n  if [[ -d\
        \ \"${preserved_target}\" ]]; then\n    mkdir -p \"${release_checkout}/codex-rs\"\n    mv \"${preserved_target}\"\
        \ \"${release_checkout}/codex-rs/target\"\n  fi\nfi\nmkdir -p \"${release_checkout}/codex-rs/target\"\n\
        # Upstream's release workflow exposes the physical source checkout\n# through CODEX_REPO_ROOT. Set it after\
        \ moving the checkout so build\n# scripts embed the same canonical path as the official release.\necho \"\
        CODEX_REPO_ROOT=${release_checkout}\" >> \"$GITHUB_ENV\"\necho \"CARGO_TARGET_DIR=${release_checkout}/codex-rs/target\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Use upstream-compatible Cargo home (Linux musl)
      if: ${{ contains(matrix.target, 'linux-musl') }}
      shell: bash
      run: 'set -euo pipefail

        cargo_home="/home/runner/work/codex/codex/.cargo-home"

        mkdir -p "${cargo_home}/bin"

        echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"

        echo "${cargo_home}/bin" >> "$GITHUB_PATH"

        : > "${cargo_home}/config.toml"

        '
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        targets: ${{ matrix.target }}
    - name: Record Rust compiler cache input
      id: rust_compiler
      shell: bash
      run: "set -euo pipefail\nif command -v sha256sum >/dev/null 2>&1; then\n  fingerprint=\"$(rustc -Vv | sha256sum\
        \ | awk '{print $1}')\"\nelse\n  fingerprint=\"$(rustc -Vv | shasum -a 256 | awk '{print $1}')\"\nfi\necho\
        \ \"fingerprint=${fingerprint}\" >> \"$GITHUB_OUTPUT\"\nv8_version=\"$(python3 .github/scripts/rusty_v8_bazel.py\
        \ resolved-v8-crate-version)\"\npython3 .github/scripts/release-cache-keys.py \\\n  --target \"${{ matrix.target\
        \ }}\" \\\n  --compiler-fingerprint \"$fingerprint\" \\\n  --v8-version \"$v8_version\" \\\n  --mode \"\
        off\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Cache pnpm store
      id: pnpm_cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ steps.pnpm_store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('upstream/pnpm-lock.yaml') }}
        restore-keys: 'pnpm-${{ runner.os }}-

          '
    - name: Cache Cargo dependencies
      id: cargo_cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: 'upstream/codex-rs -> target

          '
        cache-targets: false
        add-rust-environment-hash-key: false
        shared-key: ${{ steps.rust_compiler.outputs.cargo_download_key }}
        cache-workspace-crates: false
        cache-bin: false
        cache-all-crates: false
        save-if: false
        cache-on-failure: true
    - name: Set up ORAS for GHCR Cargo cache
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
    - name: Log in to GHCR Cargo cache
      shell: bash
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
    - name: Restore GHCR Cargo target cache
      id: ghcr_cargo_cache
      continue-on-error: false
      shell: bash
      env:
        GHCR_CACHE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/cargo-cache
        GHCR_CACHE_TAG: ${{ steps.rust_compiler.outputs.cargo_target_tag }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        bash .github/scripts/ghcr-cargo-target-cache.sh pull "$GHCR_CACHE_REPOSITORY" "$GHCR_CACHE_TAG" "$CARGO_TARGET_DIR"
        rust-v0.160.0

        '
    - name: Rebuild release binaries from cached dependencies
      shell: bash
      run: "python3 .github/scripts/clean-cached-release-binaries.py \\\n  upstream/codex-rs \\\n  \"${{ matrix.target\
        \ }}\" \\\n  ${{ matrix.binaries }}\n"
    - name: Cache rusty_v8 artifacts
      id: rusty_v8_cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: .cache/rusty_v8
        key: ${{ steps.rust_compiler.outputs.rusty_v8_key }}
    - name: Configure rusty_v8 artifact overrides and verify checksums
      uses: ./.github/actions/setup-rusty-v8
      with:
        target: ${{ matrix.target }}
    - name: Install upstream dependencies
      shell: bash
      run: 'set -euo pipefail

        cd upstream

        pnpm install --frozen-lockfile

        '
    - name: Configure Linux musl toolchain
      if: ${{ contains(matrix.target, 'linux-musl') }}
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: 'set -euo pipefail

        bash upstream/.github/scripts/install-musl-build-tools.sh

        '
    - name: Disable aws-lc jitter entropy (musl)
      if: ${{ contains(matrix.target, 'linux-musl') }}
      shell: bash
      run: 'set -euo pipefail

        echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"

        target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"

        target_no_jitter="${target_no_jitter//-/_}"

        echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

        '
    - name: Measure build-number change
      shell: bash
      run: bash .github/scripts/probe-incremental-release.sh
      env:
        CARGO_CACHE_TAG: ${{ steps.rust_compiler.outputs.cargo_target_tag }}
    - name: Upload diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: incremental-${{ matrix.target }}-${{ matrix.incremental }}
        path: ${{ runner.temp }}/incremental-evidence
        if-no-files-found: error
  windows:
    name: ${{ matrix.target }} incremental=${{ matrix.incremental }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: windows-latest
          target: x86_64-pc-windows-msvc
          incremental: '0'
          binaries: codex codex-code-mode-host codex-responses-api-proxy
          helper_binaries: codex-windows-sandbox-setup codex-command-runner
          bundle: primary
        - runner: windows-latest
          target: x86_64-pc-windows-msvc
          incremental: '1'
          binaries: codex codex-code-mode-host codex-responses-api-proxy
          helper_binaries: codex-windows-sandbox-setup codex-command-runner
          bundle: primary
        - runner: windows-latest
          target: aarch64-pc-windows-msvc
          incremental: '0'
          binaries: codex codex-code-mode-host codex-responses-api-proxy
          helper_binaries: codex-windows-sandbox-setup codex-command-runner
          bundle: primary
        - runner: windows-latest
          target: aarch64-pc-windows-msvc
          incremental: '1'
          binaries: codex codex-code-mode-host codex-responses-api-proxy
          helper_binaries: codex-windows-sandbox-setup codex-command-runner
          bundle: primary
    env:
      CODEX_UNLEASHED_BUILD_NUMBER: '39'
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: 'off'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: ${{ matrix.incremental }}
      REPRODUCIBILITY_MODE: 'off'
      ALLOW_STALE_CODE_MODE_FEATURE_EXCEPTION: '1'
      SOURCE_DATE_EPOCH: '1790874817'
      UPSTREAM_TARGET: ${{ matrix.target }}
      UPSTREAM_BINARIES: ${{ matrix.binaries }}
      PATCHES_ALREADY_APPLIED: '1'
      SKIP_UPSTREAM_TESTS: '1'
      SKIP_ARTIFACT_COLLECTION: '1'
    steps:
    - name: Checkout patch repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - uses: ./.github/actions/setup-ci
    - uses: ./.github/actions/prepare-patched-upstream
      with:
        upstream-ref: rust-v0.160.0
        expected-upstream-commit: a956835d020762cb2b570053af06f643a11c0ecc
    - name: Normalize patched source timestamps
      shell: bash
      env:
        SOURCE_DATE_EPOCH: '1790874817'
      run: 'set -euo pipefail

        python3 .github/scripts/normalize-source-timestamps.py upstream "$SOURCE_DATE_EPOCH"

        '
    - name: Print runner specs (Windows)
      shell: powershell
      run: '$computer = Get-CimInstance Win32_ComputerSystem

        $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1

        $ramGiB = [math]::Round($computer.TotalPhysicalMemory / 1GB, 1)

        Write-Host "Runner: $env:RUNNER_NAME"

        Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"

        Write-Host "CPU: $($cpu.Name)"

        Write-Host "Logical CPUs: $($computer.NumberOfLogicalProcessors)"

        Write-Host "Physical CPUs: $($computer.NumberOfProcessors)"

        Write-Host "Total RAM: $ramGiB GiB"

        Write-Host "Disk usage:"

        Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize Name, @{Name=''Size(GB)'';Expression={[math]::Round(($_.Used
        + $_.Free) / 1GB, 1)}}, @{Name=''Free(GB)'';Expression={[math]::Round($_.Free / 1GB, 1)}}

        '
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        targets: ${{ matrix.target }}
    - name: Record Rust compiler cache input
      id: rust_compiler
      shell: bash
      run: "set -euo pipefail\nif command -v sha256sum >/dev/null 2>&1; then\n  fingerprint=\"$(rustc -Vv | sha256sum\
        \ | awk '{print $1}')\"\nelse\n  fingerprint=\"$(rustc -Vv | shasum -a 256 | awk '{print $1}')\"\nfi\necho\
        \ \"fingerprint=${fingerprint}\" >> \"$GITHUB_OUTPUT\"\nv8_version=\"$(python3 .github/scripts/rusty_v8_bazel.py\
        \ resolved-v8-crate-version)\"\npython3 .github/scripts/release-cache-keys.py \\\n  --target \"${{ matrix.target\
        \ }}\" \\\n  --compiler-fingerprint \"$fingerprint\" \\\n  --v8-version \"$v8_version\" \\\n  --mode \"\
        off\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Configure LLVM linker
      uses: ./.github/actions/setup-msvc-env
      with:
        target: ${{ matrix.target }}
    - name: Ensure requested Rust target is installed
      shell: bash
      run: 'set -euo pipefail

        rustup target add "${{ matrix.target }}"

        rustup target list --installed

        '
    - name: Cache rusty_v8 artifacts
      id: rusty_v8_cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: .cache/rusty_v8
        key: ${{ steps.rust_compiler.outputs.rusty_v8_key }}
    - name: Configure rusty_v8 artifact overrides and verify checksums
      uses: ./.github/actions/setup-rusty-v8
      with:
        target: ${{ matrix.target }}
    - name: Cache Cargo dependencies
      id: cargo_cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: 'upstream/codex-rs -> target

          '
        add-rust-environment-hash-key: false
        cache-targets: false
        shared-key: ${{ steps.rust_compiler.outputs.cargo_download_key }}
        cache-workspace-crates: false
        cache-bin: false
        cache-all-crates: false
        save-if: false
        cache-on-failure: true
    - name: Set up ORAS for GHCR Cargo cache
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
    - name: Log in to GHCR Cargo cache
      shell: bash
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
    - name: Restore GHCR Cargo target cache
      id: ghcr_cargo_cache
      continue-on-error: false
      shell: bash
      env:
        GHCR_CACHE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/cargo-cache
        GHCR_CACHE_TAG: ${{ steps.rust_compiler.outputs.cargo_target_tag }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        bash .github/scripts/ghcr-cargo-target-cache.sh pull "$GHCR_CACHE_REPOSITORY" "$GHCR_CACHE_TAG" "$CARGO_TARGET_DIR"
        rust-v0.160.0

        '
    - name: Rebuild release binaries from cached dependencies
      shell: bash
      run: "python3 .github/scripts/clean-cached-release-binaries.py \\\n  upstream/codex-rs \\\n  \"${{ matrix.target\
        \ }}\" \\\n  ${{ matrix.binaries }} ${{ matrix.helper_binaries }}\n"
    - name: Configure Windows Cargo build environment
      if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
      shell: bash
      run: echo "LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC" >> "$GITHUB_ENV"
    - name: Measure build-number change
      shell: bash
      run: bash .github/scripts/probe-incremental-release.sh
      env:
        CARGO_CACHE_TAG: ${{ steps.rust_compiler.outputs.cargo_target_tag }}
    - name: Upload diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: incremental-${{ matrix.target }}-${{ matrix.incremental }}
        path: ${{ runner.temp }}/incremental-evidence
        if-no-files-found: error
