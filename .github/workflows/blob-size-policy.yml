name: blob-size-policy

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      base:
        description: Excluded commit revision (defaults to the selected commit's parent)
        type: string
        default: HEAD^

permissions:
  contents: read

jobs:
  check:
    name: Blob size policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify policy fixtures
        run: python3 .github/scripts/test-check-blob-size.py

      - name: Check newly reachable blobs
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base || 'HEAD^' }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/check-blob-size.py --base "$BASE_REVISION" --head "$HEAD_REVISION"
