name: blob-size-policy

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      base:
        description: Excluded commit revision (defaults to the selected commit's parent)
        type: string
        default: HEAD^

permissions:
  contents: read

jobs:
  check:
    name: Blob size policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-tooling

      - name: Check newly reachable blobs
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base || 'HEAD^' }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A new branch's push has an all-zero base; check only what it adds to the default branch.
          # A force-push's base may no longer exist on the remote; fall back to the default branch as well.
          if [[ "$BASE_REVISION" =~ ^0+$ ]]; then
            BASE_REVISION="$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")"
            echo "New branch: checking commits not on $DEFAULT_BRANCH ($BASE_REVISION)"
          elif ! git rev-parse --verify --quiet "$BASE_REVISION^{commit}" > /dev/null; then
            BASE_REVISION="$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")"
            echo "Force-push base is unreachable: checking commits not on $DEFAULT_BRANCH ($BASE_REVISION)"
          fi
          "$CODEX_TOOLING_BASH" "$CODEX_TOOLING" check-blob-size --base "$BASE_REVISION" --head "$HEAD_REVISION"
