name: Stable upstream Bazel Clippy job

# One job of the Bazel Clippy workflow (baseline-bazel-lints.yml). Role lint runs upstream's maintained Clippy selection,
# or one package shard of it, with fatal warnings. Role shared-v8 compiles V8 once for the lint shards of its platform:
# it builds //codex-rs/code-mode-runtime/..., whose V8 dependency covers both the target and the exec configuration that
# the lint compiles, under the lint's Bazel configuration, and saves the C++ actions to its own cache lane. The lint
# shards of that platform start after it and read that lane besides their own. It skips its build when the lane already
# holds the actions for this source.
on:
  workflow_call:
    inputs:
      patches:
        description: Space-separated repository paths of downstream patches to apply with git am, in order
        type: string
        default: ""
      role:
        description: lint, or shared-v8 to compile V8 for the lint shards of this platform
        type: string
        required: true
      runner:
        description: GitHub-hosted runner label
        type: string
        required: true
      target:
        description: Rust target triple that Clippy checks
        type: string
        required: true
      shard:
        description: Package shard number of a lint job, or empty for the whole selection
        type: string
        default: ""

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # Reads and writes the compiled C++ action cache in GHCR.
      packages: write
    env:
      TARGET: ${{ inputs.target }}
      CLIPPY_ROLE: ${{ inputs.role }}
      BAZEL_CLIPPY_SHARD: ${{ inputs.shard }}
      CC_CACHE_LANE: clippy-${{ inputs.target }}-${{ (inputs.role == 'shared-v8' && 'v8') || inputs.shard || 'all' }}
      # The lint shards of a platform also read the actions that its shared-v8 job saved.
      CC_SHARED_LANE: ${{ (inputs.role == 'lint' && inputs.shard && format('clippy-{0}-v8', inputs.target)) || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve restart inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: restart-metadata
          persist-credentials: false

      - name: Preserve restart inputs outside the source checkout
        id: inputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          mkdir -p "$evidence"
          cp restart-metadata/.github/scripts/setup-baseline-windows-voice.ps1 "$RUNNER_TEMP/setup-baseline-windows-voice.ps1"
          cp restart-metadata/.github/scripts/reclaim-baseline-macos-xcodes.py "$RUNNER_TEMP/reclaim-baseline-macos-xcodes.py"
          cp restart-metadata/.github/scripts/apt-install-with-fallback.py "$RUNNER_TEMP/apt-install-with-fallback.py"
          cp restart-metadata/.github/upstream-commit "$evidence/upstream-commit"
          cp restart-metadata/.github/upstream-ref "$evidence/upstream-ref"
          cp restart-metadata/.github/cargo-cache-package "$evidence/cargo-cache-package"
          cp restart-metadata/.github/scripts/ghcr-cargo-target-cache.sh restart-metadata/.github/scripts/bazel-cc-disk-cache.sh "$RUNNER_TEMP/"
          # The upstream checkout below cleans the workspace, removing restart-metadata.
          cp -R restart-metadata/patches "$RUNNER_TEMP/downstream-patches"
          git -C restart-metadata rev-parse HEAD > "$evidence/restart-commit"
          printf 'commit=%s\n' "$(cat "$evidence/upstream-commit")" >> "$GITHUB_OUTPUT"

      - name: Retrieve the exact stable upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: ${{ steps.inputs.outputs.commit }}
          persist-credentials: false

      - name: Verify pristine upstream source identity
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/upstream-commit")"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --binary > "$evidence/pristine-source.diff"

      - name: Apply the selected downstream patches
        id: patched
        env:
          DOWNSTREAM_PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          : > "$evidence/applied-patches.txt"
          read -r -d '' -a patch_paths <<< "$DOWNSTREAM_PATCHES" || true
          # Snapshot files and nested patch files contain intended trailing spaces; tell git am they are not whitespace errors.
          printf '%s\n' '*.snap -whitespace' '*.patch -whitespace' >> "$(git rev-parse --git-path info/attributes)"
          # Upstream's CI tests main, whose workspace version is 0.0.0; a stable tag's release commit changes only that
          # version. Test the same source, so version strings in snapshots and fixtures match what upstream tested.
          perl -pi -e '$w = /^\[workspace\.package\]\r?$/ ? 1 : /^\[/ ? 0 : $w;' \
            -e 's/^version = "[^"]+"(\r?)$/version = "0.0.0"$1/ if $w' codex-rs/Cargo.toml
          if ! git diff --quiet -- codex-rs/Cargo.toml; then
            git -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              commit -q -m "Test with upstream's development version 0.0.0" -- codex-rs/Cargo.toml
          fi
          for patch in "${patch_paths[@]}"; do
            printf '%s  %s\n' "$(sha256sum < "$RUNNER_TEMP/downstream-$patch" | cut -d' ' -f1)" "$patch" | tee -a "$evidence/applied-patches.txt"
            git -c core.longpaths=true -c user.name='Gili Tzabari' -c user.email='cowwoc2020@gmail.com' \
              am --committer-date-is-author-date "$RUNNER_TEMP/downstream-$patch"
          done
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up the GHCR cache transport
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      # A shared-v8 job whose lane already holds the actions for this source skips every later step that builds.
      - name: Check whether the shared V8 actions are already cached
        id: shared
        if: inputs.role == 'shared-v8'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          bash "$RUNNER_TEMP/bazel-cc-disk-cache.sh" exists "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bazel-cc-cache" \
            "ghcr.io/${GH_OWNER,,}/$(cat "$evidence/cargo-cache-package")" "$(cat "$evidence/upstream-ref")" "$CC_CACHE_LANE" \
            2>&1 | tee "$evidence/cc-cache-exists.log"

      - name: Prepare upstream's Bazel host and toolchain
        if: steps.shared.outputs.exists != 'true'
        uses: ./.github/actions/prepare-bazel-ci
        with:
          cache-scope: baseline-clippy-${{ (inputs.role == 'shared-v8' && 'shared-v8') || inputs.shard || 'native' }}
          target: ${{ inputs.target }}

      - name: Reclaim inactive Xcode versions and verify selected native tools
        if: runner.os == 'macOS' && steps.shared.outputs.exists != 'true'
        run: |
          python3 "$RUNNER_TEMP/reclaim-baseline-macos-xcodes.py" \
            --evidence-directory "$RUNNER_TEMP/baseline-bazel-lint-evidence"

      - name: Set up Python for upstream's Windows voice prerequisites
        if: runner.os == 'Windows' && steps.shared.outputs.exists != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Prepare upstream's native Windows voice tools
        if: runner.os == 'Windows' && steps.shared.outputs.exists != 'true'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/setup-baseline-windows-voice.ps1" -EvidenceDirectory "$env:RUNNER_TEMP/baseline-bazel-lint-evidence/voice-tools"

      - name: Record the native host and capacity
        if: steps.shared.outputs.exists != 'true'
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          {
            uname -a
            printf 'runner_os=%s\ntarget=%s\n' "$RUNNER_OS" "$TARGET"
            df -k "$CI_BUILD_ROOT/" "$RUNNER_TEMP"
            bazel --version
          } | tee "$evidence/host.txt"
          test "$(cat .bazelversion)" = 9.2.0

      - name: Reclaim unused hosted-image toolchains on Linux
        if: runner.os == 'Linux' && steps.shared.outputs.exists != 'true'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          df -k / "$RUNNER_TEMP" > "$evidence/disk-before.txt"
          for unused in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; do
            if [[ -d "$unused" ]]; then
              sudo du -sk "$unused" | tee -a "$evidence/reclaimed-toolchains.txt"
              sudo rm -rf -- "$unused"
            fi
          done
          df -k / "$RUNNER_TEMP" > "$evidence/disk-after.txt"
          # Retries from a mirror outside ubuntu.com when the image's Ubuntu servers fail.
          sudo python3 -I "$RUNNER_TEMP/apt-install-with-fallback.py" build-essential pkg-config libcap-dev libasound2-dev bubblewrap bison flex

      - name: Resolve upstream's compatibility releases on Linux
        if: runner.os == 'Linux' && steps.shared.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_exec_server_releases.py > "$RUNNER_TEMP/baseline-bazel-lint-evidence/compat-releases.json"

      - name: Read upstream's pinned Rust toolchain
        if: steps.shared.outputs.exists != 'true'
        id: upstream-rust
        shell: bash
        run: printf 'channel=%s\n' "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up upstream's Rust toolchain for workspace metadata
        if: steps.shared.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.upstream-rust.outputs.channel }}
          targets: ${{ inputs.target }}

      - name: Synchronize release workspace versions without dependency upgrades
        if: steps.shared.outputs.exists != 'true'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          cargo metadata --format-version 1 --filter-platform "$TARGET" \
            --manifest-path codex-rs/Cargo.toml > "$RUNNER_TEMP/baseline-cargo-metadata.json"
          python3 - <<'PYTHON'
          import subprocess
          import tomllib
          from pathlib import Path

          before = tomllib.loads(subprocess.check_output(["git", "show", "HEAD:codex-rs/Cargo.lock"], text=True))
          after = tomllib.loads(Path("codex-rs/Cargo.lock").read_text())
          before_header = {key: value for key, value in before.items() if key != "package"}
          after_header = {key: value for key, value in after.items() if key != "package"}
          assert before_header == after_header, "Cargo changed lockfile metadata beyond workspace versions"
          before_external = [package for package in before["package"] if "source" in package]
          after_external = [package for package in after["package"] if "source" in package]
          assert before_external == after_external, "Cargo changed external dependency records"
          version = tomllib.loads(Path("codex-rs/Cargo.toml").read_text())["workspace"]["package"]["version"]
          expected_workspace = [dict(package, version=version) for package in before["package"] if "source" not in package]
          actual_workspace = [package for package in after["package"] if "source" not in package]
          assert expected_workspace == actual_workspace, "Cargo changed workspace records beyond their release version"
          print(f"Verified {len(actual_workspace)} workspace versions; external dependencies unchanged")
          PYTHON
          git diff --check
          git diff -- codex-rs/Cargo.lock > "$evidence/workspace-version-lock.diff"
          git diff --binary > "$evidence/source-before.diff"

      - name: Retain prepared macOS host evidence before compilation
        if: runner.os == 'macOS' && steps.shared.outputs.exists != 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-bazel-lint-host-${{ inputs.target }}-${{ inputs.role }}${{ (inputs.shard && format('-shard-{0}', inputs.shard)) || '' }}
          path: ${{ runner.temp }}/baseline-bazel-lint-evidence
          retention-days: 3
          if-no-files-found: error

      # A cache fault never fails the lint: the build then runs cold.
      - name: Restore the compiled C++ actions
        if: steps.shared.outputs.exists != 'true'
        id: cc_cache
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          bash "$RUNNER_TEMP/bazel-cc-disk-cache.sh" restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bazel-cc-cache" \
            "ghcr.io/${GH_OWNER,,}/$(cat "$evidence/cargo-cache-package")" "$(cat "$evidence/upstream-ref")" "$CC_CACHE_LANE" \
            ${CC_SHARED_LANE:+"$CC_SHARED_LANE"} 2>&1 | tee "$evidence/cc-cache-restore.log"

      - name: Run the maintained Bazel Clippy selection with fatal warnings
        if: steps.shared.outputs.exists != 'true'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          export CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR="$evidence/execution-logs"
          mkdir -p "$CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR"
          if [[ "$RUNNER_OS" == Linux ]]; then
            export CODEX_COMPAT_RELEASES
            CODEX_COMPAT_RELEASES="$(cat "$evidence/compat-releases.json")"
          fi
          wrapper_args=(--print-failed-action-summary)
          clippy_args=(--config=clippy --disk_cache=)
          if [[ -f "$RUNNER_TEMP/bazel-cc-cache.restored" ]]; then
            cc_cache="$RUNNER_TEMP/bazel-cc-cache"
            if [[ "$RUNNER_OS" == Windows ]]; then
              cc_cache="$(cygpath -m "$cc_cache")"
            fi
            # Only C++ compiles, archives and links (chiefly V8, built for both the target and the exec configuration)
            # reach the disk cache; every other action is marked no-cache, which keeps it out of the disk cache only.
            # The whole cache of a lint job would be 34-110 GB.
            clippy_args=(
              --config=clippy "--disk_cache=$cc_cache"
              '--modify_execution_info=^(?!(CppCompile|CppArchive|CppLink|ObjcCompile)$).*$=+no-cache'
            )
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            wrapper_args+=(--windows-cross-compile)
            clippy_args+=(--workspace_status_command=./scripts/workspace-status.cmd --skip_incompatible_explicit_targets --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1)
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            clippy_args+=(
              "--extra_toolchains=@local_config_cc//:cc-toolchain-x64_windows,@local_config_cc//:cc-toolchain-arm64_windows,//third_party/voice:windows_pkg_config_toolchain,//third_party/voice:windows_cmake_toolchain"
              --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0
              # Bazel's local Windows C++ toolchain defaults _WIN32_WINNT to 0x0601 (Windows 7) while V8's build defines
              # 0x0A00 (Windows 10), so every V8 compile warned that the macro was redefined. Rust's MSVC targets need
              # Windows 10, and the release packages are built with Cargo, so this changes only the Bazel jobs.
              # rules_cc passes the value to cl.exe as the whole flag, so it must include /D_WIN32_WINNT=.
              --repo_env=BAZEL_WIN32_WINNT=/D_WIN32_WINNT=0x0A00
              --inject_repository="voice_windows_tools=$VOICE_WINDOWS_BAZEL_REPOSITORY"
              --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools
              --action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT"
              --host_action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT"
              --action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH"
              --host_action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH"
            )
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            scripts/list-bazel-clippy-targets.sh --windows-cross-compile > "$evidence/clippy-targets.txt"
          else
            scripts/list-bazel-clippy-targets.sh > "$evidence/clippy-targets.txt"
          fi
          test -s "$evidence/clippy-targets.txt"
          cp "$evidence/clippy-targets.txt" "$evidence/selected-targets.txt"
          if [[ -n "$BAZEL_CLIPPY_SHARD" ]]; then
            .github/scripts/run-bazel-query-ci.sh --output=label -- '//codex-rs/...' > "$evidence/candidate-targets.txt"
            python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "baseline-bazel-lint-evidence"
          patterns = (evidence / "clippy-targets.txt").read_text().splitlines()
          assert patterns[:2] == ["//codex-rs/...", "-//codex-rs/v8-poc:all"], "Maintained Clippy scope changed"
          explicit = patterns[2:]
          assert all(pattern.startswith("//") and ":" in pattern for pattern in explicit), "Unexpected manual Clippy pattern"
          labels = (evidence / "candidate-targets.txt").read_text().splitlines()
          packages = sorted({label.rsplit(":", 1)[0] for label in labels})
          shard_count = 2
          assignments = {
              package: (int.from_bytes(hashlib.sha256(package.encode()).digest(), "big") % shard_count) + 1
              for package in packages
          }
          assert all(label.rsplit(":", 1)[0] in assignments for label in explicit), "Manual Clippy target outside package selection"
          shard = int(os.environ["BAZEL_CLIPPY_SHARD"])
          selected = [f"{package}:all" for package in packages if assignments[package] == shard]
          assert selected, f"No Clippy packages selected for shard {shard}"
          selected += [label for label in explicit if assignments[label.rsplit(":", 1)[0]] == shard]
          selected.append(patterns[1])
          (evidence / "selected-targets.txt").write_text("\n".join(selected) + "\n")
          (evidence / "package-shards.json").write_text(json.dumps(assignments, indent=2) + "\n")
          expression = "set(" + " ".join(f"{package}:all" for package in packages) + ")"
          (evidence / "all-package-patterns.query").write_text(expression + "\n")
          print(f"Selected {len(selected)} Clippy patterns for package shard {shard}/{shard_count}")
          PYTHON
            .github/scripts/run-bazel-query-ci.sh --output=label -- "$(cat "$evidence/all-package-patterns.query")" \
              | LC_ALL=C sort > "$evidence/expanded-package-targets.txt"
            LC_ALL=C sort "$evidence/candidate-targets.txt" > "$evidence/expected-targets.txt"
            cmp "$evidence/expected-targets.txt" "$evidence/expanded-package-targets.txt"
          fi
          if [[ "$CLIPPY_ROLE" == shared-v8 ]]; then
            # Compile V8 for the lint shards: this package's V8 dependency covers both the target and the exec
            # configuration that the lint compiles. Keep going past a lint failure so that every V8 action still runs.
            printf '%s\n' '//codex-rs/code-mode-runtime/...' > "$evidence/selected-targets.txt"
            clippy_args+=(--keep_going)
          fi
          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done < "$evidence/selected-targets.txt"
          (
            while true; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              df -k "$CI_BUILD_ROOT/" "$RUNNER_TEMP"
              if du -k -d 3 "$CI_BUILD_ROOT/" | sort -nr | sed -n '1,30p'; then
                :
              else
                printf 'directory_sample_exit=%s\n' "$?"
              fi
              sleep 60
            done
          ) >> "$evidence/disk-usage.log" 2>&1 &
          disk_monitor=$!
          trap 'kill "$disk_monitor" 2>/dev/null || true; wait "$disk_monitor" || true' EXIT
          set +e
          .github/scripts/run-bazel-ci.sh "${wrapper_args[@]}" -- \
            build "${clippy_args[@]}" --build_metadata="COMMIT_SHA=$(cat "$evidence/upstream-commit")" -- \
            "${targets[@]}" 2>&1 | tee "$evidence/bazel-clippy.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" > "$evidence/bazel-clippy.receipt"
          git diff --binary > "$evidence/source-after.diff"
          cmp "$evidence/source-before.diff" "$evidence/source-after.diff"
          exit "$result"

      - name: Save the compiled C++ actions
        if: ${{ !cancelled() && steps.cc_cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/baseline-bazel-lint-evidence"
          bash "$RUNNER_TEMP/bazel-cc-disk-cache.sh" save "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bazel-cc-cache" \
            "ghcr.io/${GH_OWNER,,}/$(cat "$evidence/cargo-cache-package")" "$(cat "$evidence/upstream-ref")" "$CC_CACHE_LANE" \
            ${CC_SHARED_LANE:+"$CC_SHARED_LANE"} 2>&1 | tee "$evidence/cc-cache-save.log"

      - name: Verify the patched source and tests remain unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.patched.outputs.commit }}"
          git diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

      - name: Retain lint evidence for one day
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baseline-bazel-lints-${{ inputs.target }}-${{ inputs.role }}${{ (inputs.shard && format('-shard-{0}', inputs.shard)) || '' }}
          path: ${{ runner.temp }}/baseline-bazel-lint-evidence
          retention-days: 3
          if-no-files-found: warn
