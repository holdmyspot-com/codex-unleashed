name: prepare-bazel-ci
description: Prepare a Bazel CI job with shared setup, repository cache restore, and execution logs.
inputs:
  target:
    description: Target triple used for setup and cache namespacing.
    required: true
  cache-scope:
    description: Logical namespace used to keep concurrent Bazel jobs from reserving the same repository cache key.
    required: true
outputs:
  repository-cache-path:
    description: Filesystem path used for the Bazel repository cache.
    value: ${{ steps.setup_bazel.outputs.repository-cache-path }}
  repository-cache-key:
    description: Primary actions/cache key for the Bazel repository cache.
    value: ${{ steps.cache_bazel_repository_key.outputs.repository-cache-key }}
  repository-cache-hit:
    description: Whether the Bazel repository cache restore found an exact key match.
    value: ${{ steps.cache_bazel_repository_restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Bazel CI
      id: setup_bazel
      uses: ./.github/actions/setup-bazel-ci
      with:
        target: ${{ inputs.target }}

    # rules_rs cannot infer the local paths for workspace-inherited crates in
    # rust-v0.155.1. Add the mappings only in this temporary CI checkout;
    # patches/ remains limited to product source changes.
    - name: Add Bazel Cargo path mappings
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import os
        import re
        import tomllib

        manifest = Path("upstream/codex-rs/Cargo.toml")
        text = manifest.read_text(encoding="utf-8")
        marker = "[patch.crates-io]\n"
        root = manifest.parent
        lockfile = root / "Cargo.lock"
        if lockfile.is_file():
            lock_text = lockfile.read_text(encoding="utf-8")
            lock_text = re.sub(
                r'\n\[\[package\]\]\nname = "app_test_support"\n.*?(?=\n\[\[package\]\])',
                "",
                lock_text,
                count=1,
                flags=re.DOTALL,
            )
            lockfile.write_text(lock_text, encoding="utf-8")
        workspace = tomllib.loads(text).get("workspace", {})
        missing_members = [
            member for member in workspace.get("members", [])
            if not (root / member / "Cargo.toml").is_file()
            or re.search(
                r'^\[workspace(?:\.|\])',
                (root / member / "Cargo.toml").read_text(encoding="utf-8"),
                flags=re.MULTILINE,
            ) is not None
        ]
        for member in missing_members:
            text = re.sub(
                rf'^\s*"{re.escape(member)}",\s*\n',
                "",
                text,
                count=1,
                flags=re.MULTILINE,
            )
        if missing_members:
            manifest.write_text(text, encoding="utf-8")
            workspace = tomllib.loads(text).get("workspace", {})
        workspace_package = workspace.get("package", {})
        workspace_dependencies = workspace.get("dependencies", {})

        # The pinned release uses workspace inheritance in support crates that
        # rules_rs parses independently. Expand those entries in the temporary
        # checkout, preserving any package-local features.
        for package_manifest in root.rglob("Cargo.toml"):
            if package_manifest == manifest:
                continue
            package_text = package_manifest.read_text(encoding="utf-8")

            def toml_literal(value):
                if isinstance(value, str):
                    return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'
                if isinstance(value, bool):
                    return "true" if value else "false"
                return repr(value)

            # Package metadata inheritance is represented as a table by
            # Cargo metadata, but rules_rs expects a concrete semver string.
            for metadata_name, metadata_value in workspace_package.items():
                package_text = re.sub(
                    rf'^[ \t]*{re.escape(metadata_name)}\.workspace[ \t]*=[ \t]*true[ \t]*$',
                    f'{metadata_name} = {toml_literal(metadata_value)}',
                    package_text,
                    flags=re.MULTILINE,
                )

            for dependency_name, dependency in workspace_dependencies.items():
                if isinstance(dependency, str):
                    inherited = f'version = "{dependency}"'
                elif isinstance(dependency, dict):
                    fields = []
                    for key in ("path", "version", "git", "rev", "branch", "tag", "registry"):
                        if key in dependency:
                            value = dependency[key]
                            if key == "path":
                                value = os.path.relpath(root / value, package_manifest.parent).replace(os.sep, "/")
                            fields.append(f'{key} = {value!r}')
                    if not fields:
                        continue
                    inherited = ", ".join(fields)
                else:
                    continue
                def expand_inline(match):
                    remaining = re.sub(r'workspace\s*=\s*true\s*,?', '', match.group(2)).strip(' ,')
                    contents = inherited if not remaining else f'{inherited}, {remaining}'
                    return f'{match.group(1)} {contents} }}'

                package_text = re.sub(
                    rf'(^\s*{re.escape(dependency_name)}\s*=\s*\{{)([^}}]*workspace\s*=\s*true[^}}]*)(\}})',
                    expand_inline,
                    package_text,
                    flags=re.MULTILINE | re.DOTALL,
                )
                package_text = re.sub(
                    rf'^{re.escape(dependency_name)}\.workspace\s*=\s*true\s*$',
                    f'{dependency_name} = {{ {inherited} }}',
                    package_text,
                    flags=re.MULTILINE,
                )
            package_manifest.write_text(package_text, encoding="utf-8")

        mappings = [
            'codex-build-info = { path = "build-info" }',
            'codex-bwrap = { path = "bwrap" }',
            'codex-cli = { path = "cli" }',
            'codex-code-mode-host = { path = "code-mode-host" }',
            'codex-config-schema = { path = "config-schema" }',
            'codex-thread-manager-sample = { path = "thread-manager-sample" }',
            'codex-utils-readiness = { path = "utils/readiness" }',
            'codex-v8-poc = { path = "v8-poc" }',
            'codex-voice-host = { path = "voice-host" }',
            'codex-worktree = { path = "worktree" }',
        ]
        for dependency_name, dependency in workspace.get("dependencies", {}).items():
            if isinstance(dependency, dict) and "path" in dependency:
                package_name = dependency.get("package", dependency_name)
                mapping = f'{package_name} = {{ path = "{dependency["path"]}" }}'
                if mapping not in mappings:
                    mappings.append(mapping)
        for member in workspace.get("members", []):
            package_manifest = root / member / "Cargo.toml"
            if package_manifest.is_file():
                package = tomllib.loads(package_manifest.read_text(encoding="utf-8")).get("package", {})
                package_name = package.get("name")
                if package_name:
                    mapping = f'{package_name} = {{ path = "{member}" }}'
                    if mapping not in mappings:
                        mappings.append(mapping)
        if marker not in text:
            raise SystemExit(f"Missing {marker.strip()} in {manifest}")
        start = text.index(marker) + len(marker)
        additions = "".join(f"{mapping}\n" for mapping in mappings if mapping not in text[start:])
        if additions:
            manifest.write_text(text[:start] + additions + text[start:], encoding="utf-8")
        PY

    # The pinned rules_rs resolver assumes every dependency has a target key.
    # Keep this compatibility change in the temporary CI checkout rather than
    # carrying a non-product patch in patches/.
    - name: Repair pinned rules_rs resolver for Bazel CI
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path

        patch = Path("upstream/patches/rules_rs_build_script_deps_annotation.patch")
        text = patch.read_text(encoding="utf-8")
        marker = "diff --git a/rs/private/resolver.bzl b/rs/private/resolver.bzl"
        if marker not in text:
            text += '''
        diff --git a/rs/private/resolver.bzl b/rs/private/resolver.bzl
        --- a/rs/private/resolver.bzl
        +++ b/rs/private/resolver.bzl
        @@ -19 +19 @@
        -    remaining = dep["target"]
        +    remaining = dep.get("target", set())
        diff --git a/rs/private/cargo_workspace_graph.bzl b/rs/private/cargo_workspace_graph.bzl
        --- a/rs/private/cargo_workspace_graph.bzl
        +++ b/rs/private/cargo_workspace_graph.bzl
        @@ -220,1 +220,13 @@
        -        idx = maybe_fq_dep.find(" ")
        +        idx = maybe_fq_dep.find(" ") if type(maybe_fq_dep) == "string" else -1
        +        if type(maybe_fq_dep) == "dict":
        +            dep_name = maybe_fq_dep.get("package") or maybe_fq_dep.get("name")
        +            versions = versions_by_name.get(dep_name, [])
        +            if not versions:
        +                if strict:
        +                    fail("Malformed lockfile?")
        +                continue
        +            req = maybe_fq_dep.get("req")
        +            version = versions[0] if len(versions) == 1 or type(req) != "string" else select_matching_version(req, versions)
        +            if not version:
        +                continue
        +            maybe_fq_dep = dep_name + " " + version
        +        idx = maybe_fq_dep.find(" ")
        diff --git a/rs/private/semver.bzl b/rs/private/semver.bzl
        --- a/rs/private/semver.bzl
        +++ b/rs/private/semver.bzl
        @@ -26,1 +26,3 @@
        -    v = v.strip()
        +    if type(v) != "string":
        +        return None
        +    v = v.strip()
        '''
            patch.write_text(text, encoding="utf-8")
        PY

    - name: Refresh temporary Cargo lockfile for Bazel
      shell: bash
      run: |
        set -euo pipefail
        cd upstream/codex-rs
        python3 - <<'PY'
        from pathlib import Path
        import re
        import subprocess

        lockfile = Path("Cargo.lock")
        original = lockfile.read_text(encoding="utf-8")
        subprocess.run(["cargo", "generate-lockfile"], check=True)
        generated = lockfile.read_text(encoding="utf-8")

        def package_blocks(text):
            blocks = {}
            for match in re.finditer(
                r'\n\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"\n.*?(?=\n\[\[package\]\]|\Z)',
                text,
                flags=re.DOTALL,
            ):
                blocks[(match.group(1), match.group(2))] = match.group(0)
            return blocks

        original_blocks = package_blocks(original)
        generated_blocks = package_blocks(generated)
        generated_by_name = {}
        for (name, _version), block in generated_blocks.items():
            generated_by_name.setdefault(name, []).append(block)

        original_versions = {}
        for name, version in original_blocks:
            original_versions.setdefault(name, version)

        def align_third_party_versions(block):
            for name, version in original_versions.items():
                if name.startswith("codex-"):
                    continue
                block = re.sub(
                    rf'"{re.escape(name)} [^"]+"',
                    f'"{name} {version}"',
                    block,
                )
            return block

        selected_generated_blocks = {}
        for (name, _version), block in generated_blocks.items():
            key = (name, _version)
            if name == "gix" or name.startswith("codex-") or name not in original_versions:
                if name.startswith("codex-"):
                    block = align_third_party_versions(block)
                selected_generated_blocks[key] = block

        # Retain the transitive generated records needed by the selected
        # internal/new packages, even when upstream has the same package name
        # at a different version.
        changed = True
        while changed:
            changed = False
            referenced = set()
            for block in selected_generated_blocks.values():
                referenced.update(
                    re.findall(r'"([^" ]+) ([0-9][^"]*)"', block)
                )
            for key in referenced:
                block = generated_blocks.get(key)
                if (
                    block is not None
                    and key not in selected_generated_blocks
                    and key not in original_blocks
                ):
                    selected_generated_blocks[key] = block
                    changed = True

        # Keep upstream's third-party resolutions intact. Internal Codex
        # packages must come from the generated lockfile because their
        # temporary workspace manifests may add or change internal edges.
        for key, old_block in original_blocks.items():
            if key[0].startswith("codex-"):
                original = original.replace(old_block, "", 1)
        for key, old_block in original_blocks.items():
            if key[0] == "gix":
                replacements = generated_by_name.get(key[0], [])
                if replacements:
                    original = original.replace(old_block, replacements[0], 1)
        for key, block in selected_generated_blocks.items():
            if key[0].startswith("codex-"):
                block = align_third_party_versions(block)
            if key[0] != "gix" or key not in original_blocks:
                original = original.rstrip() + "\n" + block

        lockfile.write_text(original.rstrip() + "\n", encoding="utf-8")
        PY

    - name: Disable stale Windows-only Bazel patch on Linux
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path

        module = Path("upstream/MODULE.bazel")
        text = module.read_text(encoding="utf-8")
        text = text.replace('        "//patches:zstd-sys_windows_msvc_include_dirs.patch",\n', "")
        text = text.replace(
            'crate.from_cargo(\n    cargo_lock = "//codex-rs:Cargo.lock",',
            'crate.from_cargo(\n    validate_lockfile = False,\n    cargo_lock = "//codex-rs:Cargo.lock",',
            1,
        )
        module.write_text(text, encoding="utf-8")
        PY

    - name: Refresh temporary Bazel module lockfile
      shell: bash
      run: |
        set -euo pipefail
        cd upstream
        rm -f MODULE.bazel.lock
        bazel mod deps --lockfile_mode=update

    - name: Compute bazel repository cache key
      id: cache_bazel_repository_key
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        TARGET: ${{ inputs.target }}
        CACHE_HASH: ${{ hashFiles('upstream/MODULE.bazel', 'upstream/MODULE.bazel.lock', 'upstream/codex-rs/Cargo.lock', 'upstream/codex-rs/Cargo.toml', 'patches/**/*.patch') }}
      run: |
        echo "repository-cache-key=bazel-cache-${CACHE_SCOPE}-${TARGET}-${CACHE_HASH}" >> "${GITHUB_OUTPUT}"
        echo "repository-cache-restore-key=bazel-cache-${CACHE_SCOPE}-${TARGET}-" >> "${GITHUB_OUTPUT}"

    # Restore the Bazel repository cache explicitly so external dependencies
    # do not need to be re-downloaded on every CI run. Keep restore failures
    # non-fatal so transient cache-service errors degrade to a cold build
    # instead of failing the job.
    - name: Restore bazel repository cache
      id: cache_bazel_repository_restore
      continue-on-error: true
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.setup_bazel.outputs.repository-cache-path }}
        key: ${{ steps.cache_bazel_repository_key.outputs.repository-cache-key }}
        restore-keys: |
          ${{ steps.cache_bazel_repository_key.outputs.repository-cache-restore-key }}

    - name: Set up Bazel execution logs
      shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}/bazel-execution-logs"
        echo "CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR=${RUNNER_TEMP}/bazel-execution-logs" >> "${GITHUB_ENV}"
