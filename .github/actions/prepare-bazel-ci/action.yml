name: prepare-bazel-ci
description: Prepare a Bazel CI job with shared setup, repository cache restore, and execution logs.
inputs:
  target:
    description: Target triple used for setup and cache namespacing.
    required: true
  cache-scope:
    description: Logical namespace used to keep concurrent Bazel jobs from reserving the same repository cache key.
    required: true
outputs:
  repository-cache-path:
    description: Filesystem path used for the Bazel repository cache.
    value: ${{ steps.setup_bazel.outputs.repository-cache-path }}
  repository-cache-key:
    description: Primary actions/cache key for the Bazel repository cache.
    value: ${{ steps.cache_bazel_repository_key.outputs.repository-cache-key }}
  repository-cache-hit:
    description: Whether the Bazel repository cache restore found an exact key match.
    value: ${{ steps.cache_bazel_repository_restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Bazel CI
      id: setup_bazel
      uses: ./.github/actions/setup-bazel-ci
      with:
        target: ${{ inputs.target }}

    # rust-v0.153.4 has stale lockfile entries for workspace crates. Bazel's
    # rules_rs parser requires explicit Cargo patch mappings for these crates,
    # which upstream added after that release. Keep this CI-only repair close
    # to the Bazel setup so all Bazel jobs use the same compatibility behavior.
    - name: Repair upstream Cargo metadata for Bazel
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import re
        import tomllib

        root = Path("upstream/codex-rs")
        manifest = root / "Cargo.toml"
        text = manifest.read_text(encoding="utf-8")
        lockfile = root / "Cargo.lock"
        if lockfile.is_file():
            lock_text = lockfile.read_text(encoding="utf-8")
            lock_text = re.sub(
                r'\n\[\[package\]\]\nname = "app_test_support"\n.*?(?=\n\[\[package\]\])',
                "",
                lock_text,
                count=1,
                flags=re.DOTALL,
            )
            lockfile.write_text(lock_text, encoding="utf-8")
        workspace = tomllib.loads(text).get("workspace", {})
        workspace_dependencies = workspace.get("dependencies", {})
        inherited_values = {}
        for name, dependency in workspace_dependencies.items():
            if isinstance(dependency, str):
                inherited_values[name] = f'version = "{dependency}"'
            elif isinstance(dependency, dict):
                fields = []
                for key in ("path", "version", "git", "rev", "branch", "tag", "registry"):
                    if key in dependency:
                        fields.append(f'{key} = "{dependency[key]}"')
                if fields:
                    inherited_values[name] = ", ".join(fields)
        for package_manifest in root.rglob("Cargo.toml"):
            if package_manifest == manifest:
                continue
            package_text = package_manifest.read_text(encoding="utf-8")
            for name, inherited_value in inherited_values.items():
                package_text = re.sub(
                    rf'(^{re.escape(name)}\s*=\s*\{{\s*)workspace\s*=\s*true',
                    rf'\g<1>{inherited_value}',
                    package_text,
                    flags=re.MULTILINE,
                )
            package_manifest.write_text(package_text, encoding="utf-8")
        excluded_paths = {"analytics", "app-server/tests/common"}
        mappings = [
            f'{name} = {{ path = "{dependency["path"]}" }}'
            for name, dependency in workspace.get("dependencies", {}).items()
            if isinstance(dependency, dict)
            and "path" in dependency
            and dependency["path"] not in excluded_paths
            and not dependency["path"].startswith("analytics/")
        ]
        mappings.extend([
            'codex-build-info = { path = "build-info" }',
            'codex-bwrap = { path = "bwrap" }',
            'codex-cli = { path = "cli" }',
            'codex-code-mode-host = { path = "code-mode-host" }',
            'codex-config-schema = { path = "config-schema" }',
            'codex-thread-manager-sample = { path = "thread-manager-sample" }',
            'codex-utils-readiness = { path = "utils/readiness" }',
            'codex-v8-poc = { path = "v8-poc" }',
            'codex-voice-host = { path = "voice-host" }',
            'codex-worktree = { path = "worktree" }',
        ])
        mappings = sorted(set(mappings))
        patch_marker = "[patch.crates-io]\n"
        if patch_marker in text:
            patch_start = text.index(patch_marker) + len(patch_marker)
            next_section = text.find("\n[", patch_start)
            patch_section = (
                text[patch_start:]
                if next_section == -1
                else text[patch_start:next_section]
            )
        else:
            patch_start = len(text)
            patch_section = ""
        additions = [mapping for mapping in mappings if mapping not in patch_section]
        if additions:
            additions_text = "\n".join(additions) + "\n"
            if patch_marker in text:
                repaired = text[:patch_start] + additions_text + text[patch_start:]
            else:
                repaired = text.rstrip() + "\n\n" + patch_marker + additions_text
            manifest.write_text(repaired, encoding="utf-8")
        PY

    - name: Compute bazel repository cache key
      id: cache_bazel_repository_key
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        TARGET: ${{ inputs.target }}
        CACHE_HASH: ${{ hashFiles('upstream/MODULE.bazel', 'upstream/MODULE.bazel.lock', 'upstream/codex-rs/Cargo.lock', 'upstream/codex-rs/Cargo.toml', 'patches/openai/codex/**') }}
      run: |
        echo "repository-cache-key=bazel-cache-${CACHE_SCOPE}-${TARGET}-${CACHE_HASH}" >> "${GITHUB_OUTPUT}"
        echo "repository-cache-restore-key=bazel-cache-${CACHE_SCOPE}-${TARGET}-" >> "${GITHUB_OUTPUT}"

    # Restore the Bazel repository cache explicitly so external dependencies
    # do not need to be re-downloaded on every CI run. Keep restore failures
    # non-fatal so transient cache-service errors degrade to a cold build
    # instead of failing the job.
    - name: Restore bazel repository cache
      id: cache_bazel_repository_restore
      continue-on-error: true
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.setup_bazel.outputs.repository-cache-path }}
        key: ${{ steps.cache_bazel_repository_key.outputs.repository-cache-key }}
        restore-keys: |
          ${{ steps.cache_bazel_repository_key.outputs.repository-cache-restore-key }}

    - name: Set up Bazel execution logs
      shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}/bazel-execution-logs"
        echo "CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR=${RUNNER_TEMP}/bazel-execution-logs" >> "${GITHUB_ENV}"
