name: build-codex-packages
description: Build and smoke-test unsigned Codex CLI and app-server release packages.
inputs:
  target:
    description: Rust release target triple to build and test.
    required: true
  package-version:
    description: Semantic version to record in both packages.
    required: true
  build-mode:
    description: Use release optimizations (release) or disable them for faster smoke coverage (debug).
    required: true
  build-system:
    description: Build package binaries with Cargo or Bazel.
    default: cargo
  voice-release-dir:
    description: Sealed voice runtime release directory for the primary package.
  voice-build-commit:
    description: Source commit used to build the voice runtime.
  tooling-launcher:
    description: Assembled tooling launcher used to stage voice runtime resources.

# Resolve package sources relative to the action so it works in both repository layouts.
runs:
  using: composite
  steps:
    - name: Select release binaries
      id: package_setup
      shell: bash
      working-directory: codex-rs
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
        BUILD_SYSTEM: ${{ inputs.build-system }}
        PACKAGE_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        package_source_root="$(cd "${PACKAGE_ACTION_PATH}/../../.." && pwd)"
        needed_binaries="$(bash "${package_source_root}/.github/scripts/codex-package-operations.sh" \
          select-binaries \
          --runner-os "$RUNNER_OS" \
          --build-mode "$BUILD_MODE" \
          --build-system "$BUILD_SYSTEM")"
        echo "source_root=$package_source_root" >> "$GITHUB_OUTPUT"
        echo "NEEDED_BINARIES=$needed_binaries" >> "$GITHUB_ENV"

    - name: Set up Python 3.12
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.5"

    - name: Install Linux build dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      working-directory: codex-rs
      run: |
        set -euo pipefail
        sudo apt-get update -y
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils make pkg-config libcap-dev

    - name: Build Cargo package binaries
      if: inputs.build-system == 'cargo'
      uses: ./.github/actions/build-cargo-package-binaries
      with:
        target: ${{ inputs.target }}
        binaries: ${{ env.NEEDED_BINARIES }}
        build-mode: ${{ inputs.build-mode }}

    - name: Build Bazel package binaries
      if: inputs.build-system == 'bazel'
      uses: ./.github/actions/build-bazel-package-binaries
      with:
        target: ${{ inputs.target }}
        build-mode: ${{ inputs.build-mode }}

    - name: Archive symbols and build packages
      shell: bash
      working-directory: codex-rs
      env:
        TARGET: ${{ inputs.target }}
        RUNNER_OS: ${{ runner.os }}
        BINARIES: ${{ env.NEEDED_BINARIES }}
        CODEX_PACKAGE_VERSION: ${{ inputs.package-version }}
        VOICE_RELEASE_DIR: ${{ inputs.voice-release-dir }}
        VOICE_BUILD_COMMIT: ${{ inputs.voice-build-commit }}
        TOOLING_LAUNCHER: ${{ inputs.tooling-launcher }}
        PACKAGE_SOURCE_ROOT: ${{ steps.package_setup.outputs.source_root }}
      run: |
        set -euo pipefail
        archive_result="${RUNNER_TEMP}/codex-archive-operations-${TARGET}"
        archive_arguments=()
        if [[ -n "$VOICE_RELEASE_DIR" || -n "$VOICE_BUILD_COMMIT" || -n "$TOOLING_LAUNCHER" ]]; then
          archive_arguments+=(
            --voice-release-dir "$VOICE_RELEASE_DIR"
            --voice-build-commit "$VOICE_BUILD_COMMIT"
            --tooling-launcher "$TOOLING_LAUNCHER"
          )
        fi
        bash "${PACKAGE_SOURCE_ROOT}/.github/scripts/codex-package-operations.sh" \
          archive-packages \
          --target "$TARGET" \
          --runner-os "$RUNNER_OS" \
          --binaries "$BINARIES" \
          --target-dir "$CARGO_TARGET_DIR" \
          --source-root "$PACKAGE_SOURCE_ROOT" \
          --workspace "$GITHUB_WORKSPACE" \
          --runner-temp "$RUNNER_TEMP" \
          --package-version "$CODEX_PACKAGE_VERSION" \
          --result-dir "$archive_result" \
          "${archive_arguments[@]}"
        echo "CODEX_PACKAGE_ARCHIVE_RESULT=${archive_result}" >> "$GITHUB_ENV"

    - name: Smoke-test assembled packages
      shell: bash
      working-directory: codex-rs
      env:
        TARGET: ${{ inputs.target }}
        PYTHONPATH: ${{ github.workspace }}/sdk/python/src${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/sdk/python/tests
        PACKAGE_SOURCE_ROOT: ${{ steps.package_setup.outputs.source_root }}
      run: |
        set -euo pipefail
        cd "${PACKAGE_SOURCE_ROOT}/scripts/codex_package/smoke_tests"
        target="${TARGET}"
        archive_dir="${GITHUB_WORKSPACE}/dist/${target}"
        mkdir -p "${GITHUB_WORKSPACE}/codex-rs/target"
        pytest_args=(
          -v
          --package-target "$target"
          --symbols-archive "${GITHUB_WORKSPACE}/symbols-dist/${target}/codex-symbols-${target}.tar.gz"
        )

        # CI must exercise packaged tools; local smoke runs may use host tools.
        if command -v rg || { [[ "$RUNNER_OS" == "Linux" ]] && command -v bwrap; }; then
          echo "Host rg (or bwrap on Linux) is on PATH; CI must use packaged tools." >&2
          exit 1
        fi

        # Windows setup helpers can finish background ACL work after pytest exits.
        # Separate roots keep the next run from deleting their executables.
        uv run --frozen pytest "${pytest_args[@]}" \
          --basetemp "${GITHUB_WORKSPACE}/codex-rs/target/package-smoke-gzip-tmp" \
          --compression gzip \
          --cli-archive "${archive_dir}/codex-package-${target}.tar.gz" \
          --app-server-archive "${archive_dir}/codex-app-server-package-${target}.tar.gz" \
          test_codex_package.py

        uv run --frozen pytest "${pytest_args[@]}" \
          --basetemp "${GITHUB_WORKSPACE}/codex-rs/target/package-smoke-zstd-tmp" \
          --compression zstd \
          --cli-archive "${archive_dir}/codex-package-${target}.tar.zst" \
          --app-server-archive "${archive_dir}/codex-app-server-package-${target}.tar.zst" \
          test_codex_package.py
