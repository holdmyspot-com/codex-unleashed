name: prepare-patched-upstream
description: Clone upstream Codex and apply local patches.

inputs:
  upstream-ref:
    description: Upstream git ref or tag to check out. Defaults to .github/upstream-ref.
    required: false
    default: ''
  expected-upstream-commit:
    description: Optional commit SHA that the resolved ref must produce.
    required: false
    default: ''
  upstream-repo:
    description: Upstream GitHub repository.
    required: false
    default: openai/codex
  checkout-path:
    description: Checkout directory relative to the workspace root.
    required: false
    default: upstream
  fallback-to-default-branch:
    description: Fall back to the upstream default branch if the requested ref cannot be cloned.
    required: false
    default: "false"
  apply-patches:
    description: Apply the patch files after cloning the upstream repository.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Clone upstream repository
      shell: bash
      env:
        UPSTREAM_REF: ${{ inputs.upstream-ref }}
        EXPECTED_UPSTREAM_COMMIT: ${{ inputs.expected-upstream-commit }}
        UPSTREAM_REPO: ${{ inputs.upstream-repo }}
        CHECKOUT_PATH: ${{ inputs.checkout-path }}
        FALLBACK_TO_DEFAULT_BRANCH: ${{ inputs.fallback-to-default-branch }}
      run: |
        set -euo pipefail

        if [[ -z "${UPSTREAM_REF}" ]]; then
          UPSTREAM_REF="$(cat "${GITHUB_WORKSPACE}/.github/upstream-ref")"
          test -n "${UPSTREAM_REF}"
        fi

        repo_url="https://github.com/${UPSTREAM_REPO}.git"
        rm -rf "${CHECKOUT_PATH}"

        if git -c core.autocrlf=false init "${CHECKOUT_PATH}" >/dev/null 2>&1 \
          && git -C "${CHECKOUT_PATH}" remote add origin "${repo_url}" \
          && git -C "${CHECKOUT_PATH}" config core.autocrlf false \
          && git -C "${CHECKOUT_PATH}" -c core.autocrlf=false fetch --depth 1 origin "${UPSTREAM_REF}" \
          && git -C "${CHECKOUT_PATH}" checkout --detach FETCH_HEAD; then
          :
        elif [[ "${FALLBACK_TO_DEFAULT_BRANCH}" == "true" ]]; then
          echo "Falling back to the upstream default branch because ${UPSTREAM_REF} could not be fetched."
          UPSTREAM_REF=unreleased
          rm -rf "${CHECKOUT_PATH}"
          git -c core.autocrlf=false clone --depth 1 "${repo_url}" "${CHECKOUT_PATH}"
        else
          echo "ERROR: failed to clone ${UPSTREAM_REPO} at ${UPSTREAM_REF}" >&2
          exit 1
        fi

        git -C "${CHECKOUT_PATH}" config core.autocrlf false

        actual_commit="$(git -C "${CHECKOUT_PATH}" rev-parse HEAD)"
        if [[ -n "${EXPECTED_UPSTREAM_COMMIT}" && "${actual_commit}" != "${EXPECTED_UPSTREAM_COMMIT}" ]]; then
          echo "ERROR: ${UPSTREAM_REF} resolved to ${actual_commit}, expected ${EXPECTED_UPSTREAM_COMMIT}." >&2
          exit 1
        fi

        cache_prefix="$(python3 "${GITHUB_WORKSPACE}/.github/scripts/cache_retention.py" cache-prefix --upstream-ref "$UPSTREAM_REF")"
        echo "CACHE_UPSTREAM_PREFIX=$cache_prefix" >> "$GITHUB_ENV"

    - name: Apply local patches
      if: ${{ inputs.apply-patches == 'true' }}
      shell: bash
      env:
        CHECKOUT_PATH: ${{ inputs.checkout-path }}
      run: |
        set -euo pipefail
        "${GITHUB_WORKSPACE}/scripts/apply-patches.sh" "${GITHUB_WORKSPACE}/${CHECKOUT_PATH}"
