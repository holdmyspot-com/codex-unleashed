name: prepare-patched-upstream
description: Clone upstream Codex and apply local patches.

inputs:
  upstream-ref:
    description: Upstream git ref or tag to check out. Defaults to .github/upstream-ref.
    required: false
    default: ''
  expected-upstream-commit:
    description: Optional commit SHA that the resolved ref must produce.
    required: false
    default: ''
  upstream-repo:
    description: Upstream GitHub repository.
    required: false
    default: openai/codex
  checkout-path:
    description: Checkout directory relative to the workspace root.
    required: false
    default: upstream
  fallback-to-default-branch:
    description: Fall back to the upstream default branch if the requested ref cannot be cloned.
    required: false
    default: "false"
  apply-patches:
    description: Apply the patch files after cloning the upstream repository.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Java tooling
      uses: ./.github/actions/setup-tooling

    - name: Clone upstream repository
      shell: bash
      env:
        UPSTREAM_REF: ${{ inputs.upstream-ref }}
        EXPECTED_UPSTREAM_COMMIT: ${{ inputs.expected-upstream-commit }}
        UPSTREAM_REPO: ${{ inputs.upstream-repo }}
        CHECKOUT_PATH: ${{ inputs.checkout-path }}
        FALLBACK_TO_DEFAULT_BRANCH: ${{ inputs.fallback-to-default-branch }}
      run: bash "$GITHUB_ACTION_PATH/clone.sh"

    - name: Apply local patches
      if: ${{ inputs.apply-patches == 'true' }}
      shell: bash
      env:
        CHECKOUT_PATH: ${{ inputs.checkout-path }}
      run: |
        set -euo pipefail
        "${GITHUB_WORKSPACE}/scripts/apply-patches.sh" "${GITHUB_WORKSPACE}/${CHECKOUT_PATH}"
