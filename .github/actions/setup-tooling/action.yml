name: setup-tooling
description: Build the Java tooling and make its bundled runtime available to subsequent steps.

inputs:
  require-cache:
    description: Require the exact verified runtime populated by a preceding producer job.
    default: 'false'

outputs:
  launcher:
    description: Absolute path to the project tooling launcher.
    value: ${{ steps.build.outputs.launcher }}

runs:
  using: composite
  steps:
    - name: Set up Node for tooling verification
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: 22

    - name: Set up JDK 27
      id: jdk
      uses: actions/setup-java@v5
      with:
        distribution: ${{ runner.os == 'macOS' && runner.arch == 'X64' && 'zulu' || 'temurin' }}
        java-version: '27'

    - name: Locate tooling checkout
      id: checkout
      shell: bash
      run: |
        set -euo pipefail
        project_root="$(CDPATH='' cd -- "$GITHUB_ACTION_PATH/../../.." && pwd)"
        workspace_root="$(CDPATH='' cd -- "$GITHUB_WORKSPACE" && pwd)"
        case "$project_root" in
          "$workspace_root") relative_root=. ;;
          "$workspace_root"/*) relative_root="./${project_root#"$workspace_root"/}" ;;
          *) echo 'ERROR: tooling checkout must be inside GITHUB_WORKSPACE.' >&2; exit 1 ;;
        esac
        printf 'root=%s\n' "$relative_root" >> "$GITHUB_OUTPUT"
        runtime="$project_root/.cat/work/temp/build-caches/maven/target/tooling-distribution/runtime"
        if [[ "${RUNNER_OS:-}" == Windows ]]; then
          runtime="$(cygpath --windows "$runtime")"
        fi
        printf 'runtime=%s\n' "$runtime" >> "$GITHUB_OUTPUT"

    - name: Restore verified tooling runtime
      id: runtime
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.checkout.outputs.runtime }}
        fail-on-cache-miss: ${{ inputs.require-cache == 'true' }}
        # Verification exercises the workflow and script consumers as well as the Java sources.
        key: tooling-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.os == 'macOS' && runner.arch == 'X64' && 'zulu' || 'temurin' }}-${{ steps.jdk.outputs.version }}-${{ hashFiles(format('{0}/tooling/**', steps.checkout.outputs.root), format('{0}/.github/**', steps.checkout.outputs.root), format('{0}/scripts/**', steps.checkout.outputs.root), format('{0}/patches/**', steps.checkout.outputs.root)) }}

    - name: Restore Maven dependencies and wrapper
      id: dependencies
      if: steps.runtime.outputs.cache-hit != 'true'
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/repository
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/home/wrapper
        key: tooling-maven-${{ runner.os }}-${{ runner.arch }}-jdk27-${{ hashFiles('**/tooling/**/pom.xml', '**/tooling/.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: |
          tooling-maven-${{ runner.os }}-${{ runner.arch }}-jdk27-

    - name: Build tooling runtime
      id: build
      shell: bash
      env:
        TOOLING_RUNTIME_CACHE_HIT: ${{ steps.runtime.outputs.cache-hit }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"

    - name: Recheck verified runtime cache before saving
      id: runtime_before_save
      if: success() && steps.runtime.outputs.cache-hit != 'true'
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.checkout.outputs.runtime }}
        key: ${{ steps.runtime.outputs.cache-primary-key }}
        lookup-only: true

    - name: Save verified tooling runtime
      if: success() && steps.runtime.outputs.cache-hit != 'true' && steps.runtime_before_save.outputs.cache-hit != 'true'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.checkout.outputs.runtime }}
        key: ${{ steps.runtime.outputs.cache-primary-key }}

    - name: Recheck verified runtime cache after saving
      id: runtime_after_save
      if: success() && steps.runtime.outputs.cache-hit != 'true'
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.checkout.outputs.runtime }}
        key: ${{ steps.runtime.outputs.cache-primary-key }}
        lookup-only: true

    # A concurrent writer reserves the key before its completed upload becomes visible.
    - name: Wait for concurrent runtime cache upload (1/3)
      if: success() && steps.runtime.outputs.cache-hit != 'true' && steps.runtime_after_save.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 5

    - name: Recheck concurrent runtime cache upload (1/3)
      id: runtime_upload_1
      if: success() && steps.runtime.outputs.cache-hit != 'true' && steps.runtime_after_save.outputs.cache-hit != 'true'
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.checkout.outputs.runtime }}
        key: ${{ steps.runtime.outputs.cache-primary-key }}
        lookup-only: true

    - name: Wait for concurrent runtime cache upload (2/3)
      if: success() && steps.runtime.outputs.cache-hit != 'true' && steps.runtime_after_save.outputs.cache-hit != 'true' && steps.runtime_upload_1.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 10

    - name: Recheck concurrent runtime cache upload (2/3)
      id: runtime_upload_2
      if: success() && steps.runtime.outputs.cache-hit != 'true' && steps.runtime_after_save.outputs.cache-hit != 'true' && steps.runtime_upload_1.outputs.cache-hit != 'true'
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.checkout.outputs.runtime }}
        key: ${{ steps.runtime.outputs.cache-primary-key }}
        lookup-only: true

    - name: Wait for concurrent runtime cache upload (3/3)
      if: success() && steps.runtime.outputs.cache-hit != 'true' && steps.runtime_after_save.outputs.cache-hit != 'true' && steps.runtime_upload_1.outputs.cache-hit != 'true' && steps.runtime_upload_2.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 20

    - name: Recheck concurrent runtime cache upload (3/3)
      id: runtime_upload_3
      if: success() && steps.runtime.outputs.cache-hit != 'true' && steps.runtime_after_save.outputs.cache-hit != 'true' && steps.runtime_upload_1.outputs.cache-hit != 'true' && steps.runtime_upload_2.outputs.cache-hit != 'true'
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.checkout.outputs.runtime }}
        key: ${{ steps.runtime.outputs.cache-primary-key }}
        lookup-only: true

    - name: Require verified runtime cache creation
      if: success() && steps.runtime.outputs.cache-hit != 'true'
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.checkout.outputs.runtime }}
        key: ${{ steps.runtime.outputs.cache-primary-key }}
        lookup-only: true
        fail-on-cache-miss: true

    - name: Recheck Maven dependency cache before saving
      id: dependencies_before_save
      if: always() && !cancelled() && steps.build.outcome == 'success' && steps.dependencies.outputs.cache-primary-key != '' && steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/repository
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/home/wrapper
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
        lookup-only: true

    - name: Save verified Maven dependencies and wrapper
      if: always() && !cancelled() && steps.build.outcome == 'success' && steps.dependencies.outputs.cache-primary-key != '' && steps.dependencies.outputs.cache-hit != 'true' && steps.dependencies_before_save.outputs.cache-hit != 'true'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/repository
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/home/wrapper
        key: ${{ steps.dependencies.outputs.cache-primary-key }}

    - name: Report Maven dependency cache
      if: always()
      shell: bash
      env:
        CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        RUNTIME_CACHE_HIT: ${{ steps.runtime.outputs.cache-hit }}
      run: |
        printf '\nVerified tooling runtime cache exact match: %s\n' "${RUNTIME_CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
        if [[ "$RUNTIME_CACHE_HIT" != true ]]; then
          printf '\nMaven dependency cache exact match: %s\n' "${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
        fi
