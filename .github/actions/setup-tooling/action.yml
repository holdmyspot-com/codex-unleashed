name: setup-tooling
description: Build the Java tooling and make its bundled runtime available to subsequent steps.

outputs:
  launcher:
    description: Absolute path to the project tooling launcher.
    value: ${{ steps.build.outputs.launcher }}

runs:
  using: composite
  steps:
    - name: Set up Node for tooling verification
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: 22

    - name: Set up JDK 27
      uses: actions/setup-java@v5
      with:
        distribution: ${{ runner.os == 'macOS' && runner.arch == 'X64' && 'zulu' || 'temurin' }}
        java-version: '27'

    - name: Restore Maven dependencies and wrapper
      id: dependencies
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/repository
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/home/wrapper
        key: tooling-maven-${{ runner.os }}-${{ runner.arch }}-jdk27-${{ hashFiles('**/tooling/**/pom.xml', '**/tooling/.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: |
          tooling-maven-${{ runner.os }}-${{ runner.arch }}-jdk27-

    - name: Build tooling runtime
      id: build
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/setup.sh"

    - name: Save verified Maven dependencies and wrapper
      if: always() && !cancelled() && steps.build.outcome == 'success' && steps.dependencies.outputs.cache-primary-key != '' && steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/repository
          ${{ github.workspace }}/.cat/work/temp/build-caches/maven/home/wrapper
        key: ${{ steps.dependencies.outputs.cache-primary-key }}

    - name: Report Maven dependency cache
      if: always()
      shell: bash
      env:
        CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
      run: |
        printf '\nMaven dependency cache exact match: %s\n' "${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
